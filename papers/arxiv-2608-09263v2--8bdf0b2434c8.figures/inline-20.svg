<span id="S1.F1.pic19.1.2" class="ltx_p ltx_align_left"><span id="S1.F1.pic19.1.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#2563EB;">Q1: Does the score track success?
<br class="ltx_break" style="--ltx-break-space:2.0pt;"></span>
The rollout is correct, but the score and centered-advantage totals are negative:
<math id="S1.F1.pic19.m1" class="ltx_Math" alttext="\sum_{t}d_{t}=-2.6" display="inline" intent=":literal"><semantics><mrow><mrow><msub><mo>∑</mo><mi>t</mi></msub><msub><mi>d</mi><mi>t</mi></msub></mrow><mo>=</mo><mrow><mo>−</mo><mn>2.6</mn></mrow></mrow><annotation encoding="application/x-tex">\sum_{t}d_{t}=-2.6</annotation></semantics></math> and <math id="S1.F1.pic19.m2" class="ltx_Math" alttext="\sum_{t}A^{C}_{t}=-0.6" display="inline" intent=":literal"><semantics><mrow><mrow><msub><mo>∑</mo><mi>t</mi></msub><msubsup><mi>A</mi><mi>t</mi><mi>C</mi></msubsup></mrow><mo>=</mo><mrow><mo>−</mo><mn>0.6</mn></mrow></mrow><annotation encoding="application/x-tex">\sum_{t}A^{C}_{t}=-0.6</annotation></semantics></math>.</span>
<span id="S1.F1.pic19.1.3" class="ltx_p ltx_align_left"><span id="S1.F1.pic19.1.3.1" class="ltx_text ltx_font_bold">Measured two-sided score:</span>
AUC <math id="S1.F1.pic19.m3" class="ltx_Math" alttext="=0.505\,[0.483,0.524]" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo>=</mo><mrow><mn>0.505</mn><mo lspace="0.170em" rspace="0em">​</mo><mrow><mo stretchy="false">[</mo><mrow><mn>0.483</mn><mo>,</mo><mn>0.524</mn></mrow><mo stretchy="false">]</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">=0.505\,[0.483,0.524]</annotation></semantics></math>; length-adjusted AUC <math id="S1.F1.pic19.m4" class="ltx_Math" alttext="=0.474" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo>=</mo><mn>0.474</mn></mrow><annotation encoding="application/x-tex">=0.474</annotation></semantics></math>.</span>
</span></span></span></foreignobject></g><g style="--ltx-stroke-color:#D97706;--ltx-fill-color:#FDF7F0;" fill="#FDF7F0" stroke="#D97706"><path d="M 265.48 101.51 L 100.43 101.51 C 98.9 101.51 97.66 100.27 97.66 98.74 L 97.66 -98.74 C 97.66 -100.27 98.9 -101.51 100.43 -101.51 L 265.48 -101.51 C 267.01 -101.51 268.24 -100.27 268.24 -98.74 L 268.24 98.74 C 268.24 100.27 267.01 101.51 265.48 101.51 Z M 97.66 -101.51" /></g><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" transform="matrix(1.0 0.0 0.0 1.0 104.58 84.98)"><foreignobject style="--ltx-fo-width:11.33em;--ltx-fo-height:0.69em;--ltx-fo-depth:12.98em;font-size:10pt;" height="189.18" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="156.78"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
