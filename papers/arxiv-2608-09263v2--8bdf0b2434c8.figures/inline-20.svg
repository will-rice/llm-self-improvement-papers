<span id="S1.F1.pic19.3.2" class="ltx_p ltx_align_left"><span id="S1.F1.pic19.3.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#059669;">Q3: How does the loss transform the score?
<br class="ltx_break" style="--ltx-break-space:2.0pt;"></span>
For this normalized one-sided score, the policy-weighted average is
nonpositive, so centering shifts every raw <math id="S1.F1.pic19.m7" class="ltx_Math" alttext="d_{t}" display="inline" intent=":literal"><semantics><msub><mi>d</mi><mi>t</mi></msub><annotation encoding="application/x-tex">d_{t}</annotation></semantics></math> upward. It can change
a negative score to positive, for example <math id="S1.F1.pic19.m8" class="ltx_Math" alttext="-0.1\to+0.1" display="inline" intent=":literal"><semantics><mrow><mrow><mo>−</mo><mn>0.1</mn></mrow><mo stretchy="false">→</mo><mrow><mo>+</mo><mn>0.1</mn></mrow></mrow><annotation encoding="application/x-tex">-0.1\to+0.1</annotation></semantics></math> on “2.”</span>
</span></span></span></foreignobject></g></g></svg>