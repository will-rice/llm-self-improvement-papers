<span id="S1.F1.pic19.2.2" class="ltx_p ltx_align_left"><span id="S1.F1.pic19.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#D97706;">Q2: Was the hint written from this solution?
<br class="ltx_break" style="--ltx-break-space:2.0pt;"></span>
Here <math id="S1.F1.pic19.m5" class="ltx_Math" alttext="c" display="inline" intent=":literal"><semantics><mi>c</mi><annotation encoding="application/x-tex">c</annotation></semantics></math> summarizes <math id="S1.F1.pic19.m6" class="ltx_Math" alttext="y" display="inline" intent=":literal"><semantics><mi>y</mi><annotation encoding="application/x-tex">y</annotation></semantics></math>, so the solution affects both the tokens being
scored and the hint used to score them.</span>
<span id="S1.F1.pic19.2.3" class="ltx_p ltx_align_left">We also test feedback written from another solution to the same problem.</span>
