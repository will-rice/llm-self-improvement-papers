<span id="A6.p4.pic1.2.14" class="ltx_p" style="width:457.4pt;"><span id="A6.p4.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">(5,6), (5,9)</span></span>
