<span id="A6.p4.pic1.2.29" class="ltx_p" style="width:457.4pt;"><span id="A6.p4.pic1.2.29.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:457.4pt;"></span></span>
<span id="A6.p4.pic1.2.30" class="ltx_p" style="width:457.4pt;"><span id="A6.p4.pic1.2.30.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">So the color assignments are:</span></span>
<span id="A6.p4.pic1.2.31" class="ltx_p" style="width:457.4pt;"><span id="A6.p4.pic1.2.31.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:457.4pt;"></span></span>
<span id="A6.p4.pic1.2.32" class="ltx_p" style="width:457.4pt;"><span id="A6.p4.pic1.2.32.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">0:1, 1:2, 2:1, 3:3, 4:2, 5:1, 6:2, 7:3, 8:4, 9:4.</span></span>
<span id="A6.p4.pic1.2.33" class="ltx_p" style="width:457.4pt;"><span id="A6.p4.pic1.2.33.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:457.4pt;"></span></span>
