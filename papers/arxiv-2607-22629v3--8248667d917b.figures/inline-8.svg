<svg id="A7.p1.pic1" class="ltx_picture" height="503.27" overflow="visible" version="1.1" viewbox="0 0 650 503.27" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,503.27) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#666666;" fill="#666666" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.63 L 0 498.64 C 0 501.19 2.07 503.27 4.63 503.27 L 645.37 503.27 C 647.93 503.27 650 501.19 650 498.64 L 650 4.63 C 650 2.07 647.93 0 645.37 0 L 4.63 0 C 2.07 0 0 2.07 0 4.63 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 4.63 L 0.69 481.82 L 649.31 481.82 L 649.31 4.63 C 649.31 2.45 647.55 0.69 645.37 0.69 L 4.63 0.69 C 2.45 0.69 0.69 2.45 0.69 4.63 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.57 489.14)"><foreignobject style="--ltx-fo-width:39.77em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.18" overflow="visible" transform="matrix(1 0 0 -1 0 9.49)" width="550.3"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.77em;">
<span id="A7.p1.pic1.1.1" class="ltx_p"><span id="A7.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.57 12.03)"><foreignobject style="--ltx-fo-width:43.56em;--ltx-fo-height:33.38em;--ltx-fo-depth:0.25em;font-size:10pt;" height="465.39" overflow="visible" transform="matrix(1 0 0 -1 0 461.93)" width="602.75"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.56em;">
<span id="A7.p1.pic1.2.1" class="ltx_p"><span id="A7.p1.pic1.2.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">System:<span id="A7.p1.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A7.p1.pic1.2.2" class="ltx_p"><span id="A7.p1.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">You are checking whether a model’s generated reasoning trace reads as a coherent,</span></span>
<span id="A7.p1.pic1.2.3" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">self-contained chain of thought, or whether it reads as if it is continuing a thought</span></span>
<span id="A7.p1.pic1.2.4" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">that was never stated e.g. it opens using a connective (&quot;So&quot;, &quot;Then&quot;, &quot;Thus&quot;,</span></span>
<span id="A7.p1.pic1.2.5" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">&quot;Given that&quot;, &quot;Therefore&quot;), a pronoun or definite reference with no antecedent (&quot;it&quot;,</span></span>
<span id="A7.p1.pic1.2.6" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">&quot;this value&quot;, &quot;the result&quot;, &quot;that number&quot;).</span></span>
<span id="A7.p1.pic1.2.7" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:457.4pt;"></span></span>
<span id="A7.p1.pic1.2.8" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">You are judging ONLY internal coherence of the trace as a standalone piece of text.</span></span>
<span id="A7.p1.pic1.2.9" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">Do not judge correctness of the reasoning or the final answer.</span></span>
<span id="A7.p1.pic1.2.10" class="ltx_p"><span id="A7.p1.pic1.2.10.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">User:<span id="A7.p1.pic1.2.10.1.1" class="ltx_text"></span></span></span>
<span id="A7.p1.pic1.2.11" class="ltx_p"><span id="A7.p1.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">Question given to the model: {question}</span></span>
<span id="A7.p1.pic1.2.12" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:457.4pt;"></span></span>
<span id="A7.p1.pic1.2.13" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">Model’s generated trace (this is the ENTIRE generation, starting from token 1):</span></span>
<span id="A7.p1.pic1.2.14" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">{reasoning_trace}</span></span>
<span id="A7.p1.pic1.2.15" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:457.4pt;"></span></span>
<span id="A7.p1.pic1.2.16" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">Answer these:</span></span>
<span id="A7.p1.pic1.2.17" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">1. abrupt_start (true/false): does the trace’s opening sentence read as though</span></span>
<span id="A7.p1.pic1.2.18" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">   picking up mid-reasoning, rather than beginning to address the question?</span></span>
<span id="A7.p1.pic1.2.19" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">2. dangling_references (true/false): does the opening 1-2 sentences</span></span>
<span id="A7.p1.pic1.2.20" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.20.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">   contain a pronoun or definite-reference term (e.g. &quot;it&quot;, &quot;this&quot;,</span></span>
<span id="A7.p1.pic1.2.21" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.21.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">   &quot;that value&quot;, &quot;the remaining number&quot;) with no antecedent stated</span></span>
<span id="A7.p1.pic1.2.22" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.22.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">    earlier in the trace?</span></span>
<span id="A7.p1.pic1.2.23" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.23.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">3. coherence_score (1-5): 1 = reads as a truncated fragment / picks up</span></span>
<span id="A7.p1.pic1.2.24" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.24.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">   mid-thought, 5 = fully self-contained, well-formed opening.</span></span>
<span id="A7.p1.pic1.2.25" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.25.1" class="ltx_text ltx_verbatim ltx_inline-block" style="width:457.4pt;"></span></span>
<span id="A7.p1.pic1.2.26" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.26.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">Output JSON only:</span></span>
<span id="A7.p1.pic1.2.27" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.27.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">{&quot;abrupt_start&quot;: true/false, &quot;dangling_references&quot;: true/false,</span></span>
<span id="A7.p1.pic1.2.28" class="ltx_p" style="width:457.4pt;"><span id="A7.p1.pic1.2.28.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:457.4pt;--ltx-fg-color:#000000;">&quot;coherence_score&quot;: 1-5}</span></span>
</span></span></span></foreignobject></g></g></svg>