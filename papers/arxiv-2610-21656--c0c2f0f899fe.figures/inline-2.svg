<span id="A1.SS3.SSS2.Px1.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.24em;">
<span id="A1.SS3.SSS2.Px1.p3.pic1.1.1" class="ltx_p"><span id="A1.SS3.SSS2.Px1.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#6686A6;">Task Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 14.31 12.93)"><foreignobject style="--ltx-fo-width:45.13em;--ltx-fo-height:12.69em;--ltx-fo-depth:0em;font-size:10pt;" height="175.66" overflow="visible" transform="matrix(1 0 0 -1 0 175.66)" width="624.47"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS3.SSS2.Px1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.13em;">
<span id="A1.SS3.SSS2.Px1.p3.pic1.2.1" class="ltx_p"><span id="A1.SS3.SSS2.Px1.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">I sit on the Public Safety Committee, and every month we get the CAD encounter dump and a one-line “stops are up X%”—and that’s the whole analysis. I want to know what’s really behind the volume and where it’s falling. Is it how many officers we have on the street, the budget, the neighborhoods we police, the time of year? When patrol goes up, do stops go up proportionally, or do they plateau? And the thing I keep getting asked by constituents: are stops and searches falling harder on Black neighborhoods and Black residents, and is that about race or about where we deploy?</span></span>
<span id="A1.SS3.SSS2.Px1.p3.pic1.2.2" class="ltx_p"><span id="A1.SS3.SSS2.Px1.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Pull the encounter records together with the deployment and budget data and give me a clear picture of what predicts encounter volume, where the encounters concentrate and why, and whether the racial pattern holds up once you account for how policing is distributed. I need to take this into a budget hearing, so tell me what’s a real driver, what’s a data artifact, and what looks like a pattern but dissolves on closer look.</span></span>
</span></span></span></foreignobject></g></g></svg>