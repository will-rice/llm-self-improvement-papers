</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 14.31 15.62)"><foreignobject style="--ltx-fo-width:45.13em;--ltx-fo-height:10.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="145.14" overflow="visible" transform="matrix(1 0 0 -1 0 142.45)" width="624.47"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS3.SSS2.Px3.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.13em;">
<span id="A1.SS3.SSS2.Px3.p3.pic1.2.1" class="ltx_p"><span id="A1.SS3.SSS2.Px3.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">I run Gameday Supply ops for the Hillcats, and I owe the front office a season postmortem on our central plant. Twice this year we ran the shop flat-out for days on end—the stretch leading into Opening Day, and again a shorter one in mid-June—and the shift supervisors kept telling me quality goes to hell when we sprint like that. I need to know whether that’s actually in the numbers: does pushing the lines hard cost us yield, how much, and under exactly what conditions? And the part the front office will actually care about: did those quality losses reach the ballpark—did fans end up staring at empty shelves because of how we ran the plant—or did it all get absorbed in the warehouses somewhere? Quantify whatever you can, be straight with me about what the data can and can’t support, and give me something I can defend in the season review.</span></span>
</span></span></span></foreignobject></g></g></svg>