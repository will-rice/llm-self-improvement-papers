</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 14.31 15.62)"><foreignobject style="--ltx-fo-width:45.13em;--ltx-fo-height:9.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="128.53" overflow="visible" transform="matrix(1 0 0 -1 0 125.84)" width="624.47"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS3.SSS2.Px2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.13em;">
<span id="A1.SS3.SSS2.Px2.p3.pic1.2.1" class="ltx_p"><span id="A1.SS3.SSS2.Px2.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Hi—Maya from operations here. We scale class capacity up and down every month and honestly nobody on the team can agree on what’s actually behind it. Marketing is convinced we react to competitor promotions; the scheduling team swears we ramp up ahead of the summer baby boom. On top of that, our three locations never seem to carry the same capacity and I’d like to understand why.</span></span>
<span id="A1.SS3.SSS2.Px2.p3.pic1.2.2" class="ltx_p"><span id="A1.SS3.SSS2.Px2.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Can you dig into the scheduling exports and the market intel file and tell me what’s really driving our scheduled class capacity—both the month-to-month swings and why the sites differ—and whether there’s anything that lets us see the swings coming? I need something we can actually plan against, not just a description of what happened.</span></span>
</span></span></span></foreignobject></g></g></svg>