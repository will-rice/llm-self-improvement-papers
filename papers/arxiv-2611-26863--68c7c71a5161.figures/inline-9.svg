<svg id="A1.F15.p1.pic1" class="ltx_picture" height="476.74" overflow="visible" version="1.1" viewbox="0 0 539 476.74" width="539"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,476.74) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 9.84 L 0 466.89 C 0 472.33 4.41 476.74 9.84 476.74 L 529.16 476.74 C 534.59 476.74 539 472.33 539 466.89 L 539 9.84 C 539 4.41 534.59 0 529.16 0 L 9.84 0 C 4.41 0 0 4.41 0 9.84 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 9.84 L 1.97 446.66 L 537.03 446.66 L 537.03 9.84 C 537.03 5.49 533.5 1.97 529.16 1.97 L 9.84 1.97 C 5.49 1.97 1.97 5.49 1.97 9.84 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 24.63 458.24)"><foreignobject style="--ltx-fo-width:30.77em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="425.77"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F15.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:30.77em;">
<span id="A1.F15.p1.pic1.1.1" class="ltx_p"><span id="A1.F15.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt for detecting backtracked hallucinations with TriviaQA</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 24.63 16.76)"><foreignobject style="--ltx-fo-width:33.71em;--ltx-fo-height:30em;--ltx-fo-depth:0em;font-size:10pt;" height="415.11" overflow="visible" transform="matrix(1 0 0 -1 0 415.11)" width="466.45"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F15.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.71em;">
<span id="A1.F15.p1.pic1.2.1" class="ltx_p"><span id="A1.F15.p1.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:353.9pt;"></span></span></span>
<span id="A1.F15.p1.pic1.2.2" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F15.p1.pic1.2.2.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F15.p1.pic1.2.2.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F15.p1.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.F15.p1.pic1.p2.1" class="ltx_p">An LLM was given the following trivia question. The LLM first reasoned about the question and then answered it. While it answered the question correctly, its reasoning may contain hallucinated facts. A hallucinated fact is a statement that is factually incorrect according to world knowledge, i.e., it contradicts verifiable real-world information.</span>
</span></span></span></span>
<span id="A1.F15.p1.pic1.2.3" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:353.9pt;"></span></span></span>
<span id="A1.F15.p1.pic1.2.4" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F15.p1.pic1.p4" class="ltx_para ltx_noindent">
<span id="A1.F15.p1.pic1.p4.1" class="ltx_p">Question:</span>
</span></span></span></span>
<span id="A1.F15.p1.pic1.2.5" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F15.p1.pic1.p5" class="ltx_para ltx_noindent">
<span id="A1.F15.p1.pic1.p5.1" class="ltx_p">{question}</span>
</span></span></span></span>
<span id="A1.F15.p1.pic1.2.6" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:353.9pt;"></span></span></span>
<span id="A1.F15.p1.pic1.2.7" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F15.p1.pic1.p7" class="ltx_para ltx_noindent">
<span id="A1.F15.p1.pic1.p7.1" class="ltx_p">LLM Reasoning:</span>
</span></span></span></span>
<span id="A1.F15.p1.pic1.2.8" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F15.p1.pic1.p8" class="ltx_para ltx_noindent">
<span id="A1.F15.p1.pic1.p8.1" class="ltx_p">{model_reasoning}</span>
</span></span></span></span>
<span id="A1.F15.p1.pic1.2.9" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:353.9pt;"></span></span></span>
<span id="A1.F15.p1.pic1.2.10" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F15.p1.pic1.p10" class="ltx_para ltx_noindent">
<span id="A1.F15.p1.pic1.p10.1" class="ltx_p">LLM Answer:</span>
</span></span></span></span>
<span id="A1.F15.p1.pic1.2.11" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F15.p1.pic1.p11" class="ltx_para ltx_noindent">
<span id="A1.F15.p1.pic1.p11.1" class="ltx_p">{model_answer}</span>
</span></span></span></span>
<span id="A1.F15.p1.pic1.2.12" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:353.9pt;"></span></span></span>
<span id="A1.F15.p1.pic1.2.13" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.13.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F15.p1.pic1.2.13.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F15.p1.pic1.2.13.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F15.p1.pic1.p13" class="ltx_para ltx_noindent">
<span id="A1.F15.p1.pic1.p13.1" class="ltx_p">Your task: Identify 6 distinct atomic hallucinated facts in the reasoning - facts that are NOT true but were central to how the LLM arrived at its answer or justified its answer. Each fact must be written as a complete, self-contained sentence using proper nouns and names instead of pronouns, so it can be independently verified against the web. If the fact directly answers the question, it is likely not hallucinated since the final answer provided by the model is correct according to world knowledge. Each identified hallucinated fact must be unique.</span>
</span></span></span></span>
<span id="A1.F15.p1.pic1.2.14" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:353.9pt;"></span></span></span>
<span id="A1.F15.p1.pic1.2.15" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.15.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F15.p1.pic1.2.15.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F15.p1.pic1.2.15.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F15.p1.pic1.p15" class="ltx_para ltx_noindent">
<span id="A1.F15.p1.pic1.p15.1" class="ltx_p">The 6 facts should be split into two groups of 3, according to whether the model backtracked on the fact or not.</span>
</span></span></span></span>
<span id="A1.F15.p1.pic1.2.16" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:353.9pt;"></span></span></span>
<span id="A1.F15.p1.pic1.2.17" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.17.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F15.p1.pic1.2.17.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F15.p1.pic1.2.17.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F15.p1.pic1.p17" class="ltx_para ltx_noindent">
<span id="A1.F15.p1.pic1.p17.1" class="ltx_p">BACKTRACKED (3 facts): hallucinations where the model shows some backtracking or retracting behavior, i.e., facts that the model generates but regards as false later on. A backtracked fact is usually associated with alternate candidates where the model changes a proposed fact, in which case I want the first fact, i.e., the backtracked fact, to be chosen. If it says &quot;Mars is the 1st planet in the Solar System. No, wait, it is the Earth.&quot;, I want you to pick &quot;Mars is the 1st planet in the Solar System&quot;.</span>
</span></span></span></span>
<span id="A1.F15.p1.pic1.2.18" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.18.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:353.9pt;"></span></span></span>
<span id="A1.F15.p1.pic1.2.19" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.19.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F15.p1.pic1.2.19.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F15.p1.pic1.2.19.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F15.p1.pic1.p19" class="ltx_para ltx_noindent">
<span id="A1.F15.p1.pic1.p19.1" class="ltx_p">UNBACKTRACKED (3 facts): hallucinations that are NOT associated with any backtracking behavior. The model must state the fact once and leave it standing: at no later point in the trace does it revise, correct, or replace the fact.</span>
</span></span></span></span>
<span id="A1.F15.p1.pic1.2.20" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.20.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.20.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:353.9pt;"></span></span></span>
<span id="A1.F15.p1.pic1.2.21" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.21.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.21.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F15.p1.pic1.2.21.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F15.p1.pic1.2.21.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F15.p1.pic1.p21" class="ltx_para ltx_noindent">
<span id="A1.F15.p1.pic1.p21.1" class="ltx_p">The two groups must not overlap and must contain hallucinated facts.</span>
</span></span></span></span>
<span id="A1.F15.p1.pic1.2.22" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.22.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.22.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:353.9pt;"></span></span></span>
<span id="A1.F15.p1.pic1.2.23" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.23.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.23.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F15.p1.pic1.2.23.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F15.p1.pic1.2.23.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F15.p1.pic1.p23" class="ltx_para ltx_noindent">
<span id="A1.F15.p1.pic1.p23.1" class="ltx_p">Return a JSON object with exactly these keys: &quot;b_f1&quot;, &quot;b_f2&quot;, &quot;b_f3&quot; for the backtracked facts, and &quot;ub_f1&quot;, &quot;ub_f2&quot;, &quot;ub_f3&quot; for the unbacktracked facts.</span>
</span></span></span></span>
<span id="A1.F15.p1.pic1.2.24" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.24.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.24.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:353.9pt;"></span></span></span>
<span id="A1.F15.p1.pic1.2.25" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.25.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.25.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F15.p1.pic1.p25" class="ltx_para ltx_noindent">
<span id="A1.F15.p1.pic1.p25.1" class="ltx_p">---FEW-SHOT EXAMPLES---</span>
</span></span></span></span>
<span id="A1.F15.p1.pic1.2.26" class="ltx_p" style="width:353.9pt;"><span id="A1.F15.p1.pic1.2.26.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F15.p1.pic1.2.26.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:353.9pt;"></span></span></span>
</span></span></span></foreignobject></g></g></svg>