<svg id="A1.F17.p1.pic1" class="ltx_picture" height="302.54" overflow="visible" version="1.1" viewbox="0 0 539 302.54" width="539"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,302.54) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 9.84 L 0 292.7 C 0 298.14 4.41 302.54 9.84 302.54 L 529.16 302.54 C 534.59 302.54 539 298.14 539 292.7 L 539 9.84 C 539 4.41 534.59 0 529.16 0 L 9.84 0 C 4.41 0 0 4.41 0 9.84 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 9.84 L 1.97 272.47 L 537.03 272.47 L 537.03 9.84 C 537.03 5.49 533.5 1.97 529.16 1.97 L 9.84 1.97 C 5.49 1.97 1.97 5.49 1.97 9.84 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 24.63 284.05)"><foreignobject style="--ltx-fo-width:30.77em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="425.77"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F17.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:30.77em;">
<span id="A1.F17.p1.pic1.1.1" class="ltx_p"><span id="A1.F17.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt for generating MCQs from hallucinations for TriviaQA</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 24.63 16.76)"><foreignobject style="--ltx-fo-width:33.71em;--ltx-fo-height:17.41em;--ltx-fo-depth:0em;font-size:10pt;" height="240.92" overflow="visible" transform="matrix(1 0 0 -1 0 240.92)" width="466.45"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F17.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.71em;">
<span id="A1.F17.p1.pic1.2.1" class="ltx_p"><span id="A1.F17.p1.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F17.p1.pic1.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F17.p1.pic1.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F17.p1.pic1.2.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F17.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.F17.p1.pic1.p1.1" class="ltx_p">An LLM generated a hallucinated fact. A hallucinated fact is a fact that contradicts world knowledge and truth. Your task is to create a multiple-choice question that tests this hallucinated fact, i.e., the correct answer to your generated MCQ should be the hallucinated fact.</span>
</span></span></span></span>
<span id="A1.F17.p1.pic1.2.2" class="ltx_p" style="width:353.9pt;"><span id="A1.F17.p1.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F17.p1.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:353.9pt;"></span></span></span>
<span id="A1.F17.p1.pic1.2.3" class="ltx_p" style="width:353.9pt;"><span id="A1.F17.p1.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F17.p1.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F17.p1.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.F17.p1.pic1.p3.1" class="ltx_p">Hallucinated Fact produced by the LLM: {hallucinated_fact}</span>
</span></span></span></span>
<span id="A1.F17.p1.pic1.2.4" class="ltx_p" style="width:353.9pt;"><span id="A1.F17.p1.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F17.p1.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:353.9pt;"></span></span></span>
<span id="A1.F17.p1.pic1.2.5" class="ltx_p" style="width:353.9pt;"><span id="A1.F17.p1.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F17.p1.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F17.p1.pic1.p5" class="ltx_para ltx_noindent">
<span id="A1.F17.p1.pic1.p5.1" class="ltx_p">Instructions:</span>
</span></span></span></span>
<span id="A1.F17.p1.pic1.2.6" class="ltx_p" style="width:353.9pt;"><span id="A1.F17.p1.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F17.p1.pic1.2.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F17.p1.pic1.2.6.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F17.p1.pic1.2.6.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F17.p1.pic1.p6" class="ltx_para ltx_noindent">
<span id="A1.F17.p1.pic1.p6.1" class="ltx_p">- Create one MCQ question that directly tests the given hallucinated (incorrect) fact.</span>
</span></span></span></span>
<span id="A1.F17.p1.pic1.2.7" class="ltx_p" style="width:353.9pt;"><span id="A1.F17.p1.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F17.p1.pic1.2.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F17.p1.pic1.2.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F17.p1.pic1.2.7.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F17.p1.pic1.p7" class="ltx_para ltx_noindent">
<span id="A1.F17.p1.pic1.p7.1" class="ltx_p">- The correct answer to the question you frame should be the hallucinated fact (or a close paraphrase of it).</span>
</span></span></span></span>
<span id="A1.F17.p1.pic1.2.8" class="ltx_p" style="width:353.9pt;"><span id="A1.F17.p1.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F17.p1.pic1.2.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F17.p1.pic1.2.8.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F17.p1.pic1.2.8.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F17.p1.pic1.p8" class="ltx_para ltx_noindent">
<span id="A1.F17.p1.pic1.p8.1" class="ltx_p">- Add 3 plausible but wrong distractor options. None of the options should be &quot;none of the above&quot; or &quot;all of the above&quot;.</span>
</span></span></span></span>
<span id="A1.F17.p1.pic1.2.9" class="ltx_p" style="width:353.9pt;"><span id="A1.F17.p1.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F17.p1.pic1.2.9.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F17.p1.pic1.2.9.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F17.p1.pic1.2.9.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F17.p1.pic1.p9" class="ltx_para ltx_noindent">
<span id="A1.F17.p1.pic1.p9.1" class="ltx_p">- Avoid using negations while phrasing any question or any option, i.e., avoid words or constructions such as ’not’.</span>
</span></span></span></span>
<span id="A1.F17.p1.pic1.2.10" class="ltx_p" style="width:353.9pt;"><span id="A1.F17.p1.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F17.p1.pic1.2.10.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F17.p1.pic1.2.10.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F17.p1.pic1.2.10.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F17.p1.pic1.p10" class="ltx_para ltx_noindent">
<span id="A1.F17.p1.pic1.p10.1" class="ltx_p">- The question should sound like a standalone MCQ question, i.e., it should NOT start with or contain phrases like &quot;According to the LLM’s incorrect fact...&quot;, &quot;According to the hallucinated detail...&quot;, etc.</span>
</span></span></span></span>
<span id="A1.F17.p1.pic1.2.11" class="ltx_p" style="width:353.9pt;"><span id="A1.F17.p1.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F17.p1.pic1.2.11.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F17.p1.pic1.2.11.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F17.p1.pic1.2.11.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F17.p1.pic1.p11" class="ltx_para ltx_noindent">
<span id="A1.F17.p1.pic1.p11.1" class="ltx_p">- Return ONLY a valid Python dictionary with exactly these keys: testing_question, option1, option2, option3, option4, correct_answer.</span>
</span></span></span></span>
<span id="A1.F17.p1.pic1.2.12" class="ltx_p" style="width:353.9pt;"><span id="A1.F17.p1.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F17.p1.pic1.2.12.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F17.p1.pic1.2.12.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F17.p1.pic1.2.12.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F17.p1.pic1.p12" class="ltx_para ltx_noindent">
<span id="A1.F17.p1.pic1.p12.1" class="ltx_p">- correct_answer must be only 1, 2, 3, or 4 (integer), indicating which option is correct.</span>
</span></span></span></span>
<span id="A1.F17.p1.pic1.2.13" class="ltx_p" style="width:353.9pt;"><span id="A1.F17.p1.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F17.p1.pic1.2.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F17.p1.pic1.p13" class="ltx_para ltx_noindent">
<span id="A1.F17.p1.pic1.p13.1" class="ltx_p">- No explanation, no extra text - just the dictionary.</span>
</span></span></span></span>
<span id="A1.F17.p1.pic1.2.14" class="ltx_p" style="width:353.9pt;"><span id="A1.F17.p1.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F17.p1.pic1.2.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F17.p1.pic1.p14" class="ltx_para ltx_noindent">
<span id="A1.F17.p1.pic1.p14.1" class="ltx_p">--- FEW-SHOT EXAMPLES ---</span>
</span></span></span></span>
<span id="A1.F17.p1.pic1.2.15" class="ltx_p" style="width:353.9pt;"><span id="A1.F17.p1.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F17.p1.pic1.2.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:353.9pt;"></span></span></span>
</span></span></span></foreignobject></g></g></svg>