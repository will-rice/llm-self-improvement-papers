<span id="A1.F14.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:30.77em;">
<span id="A1.F14.p1.pic1.1.1" class="ltx_p"><span id="A1.F14.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt for hallucination detection for TriviaQA</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 24.63 20.22)"><foreignobject style="--ltx-fo-width:33.71em;--ltx-fo-height:6.61em;--ltx-fo-depth:0.25em;font-size:10pt;" height="94.94" overflow="visible" transform="matrix(1 0 0 -1 0 91.48)" width="466.45"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.F14.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.71em;">
<span id="A1.F14.p1.pic1.2.1" class="ltx_p"><span id="A1.F14.p1.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F14.p1.pic1.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F14.p1.pic1.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F14.p1.pic1.2.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F14.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.F14.p1.pic1.p1.1" class="ltx_p">You are a fact-checking assistant specializing in identifying hallucinated reasoning in LLM outputs. An LLM was given the following trivia question. The LLM first reasoned about the question and then answered it. Its reasoning may contain hallucinated facts. A hallucinated fact is a statement that is factually incorrect according to world knowledge, i.e., it contradicts verifiable real-world information.</span>
</span></span></span></span>
<span id="A1.F14.p1.pic1.2.2" class="ltx_p" style="width:353.9pt;"><span id="A1.F14.p1.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F14.p1.pic1.2.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F14.p1.pic1.2.2.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F14.p1.pic1.2.2.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F14.p1.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.F14.p1.pic1.p2.1" class="ltx_p">Your task: Identify 3 distinct hallucinated facts in the reasoning - facts that are NOT true but were central to how the LLM arrived at its answer or justified its answer. Each hallucinated fact must be a statement that is factually wrong according to world knowledge. Each fact must be written as a complete, self-contained sentence using proper nouns and names instead of pronouns, so it can be independently verified against the web. Do not add any justification or explanation.</span>
</span></span></span></span>
<span id="A1.F14.p1.pic1.2.3" class="ltx_p" style="width:353.9pt;"><span id="A1.F14.p1.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F14.p1.pic1.2.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F14.p1.pic1.2.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F14.p1.pic1.2.3.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F14.p1.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.F14.p1.pic1.p3.1" class="ltx_p">Each identified hallucinated fact must be unique. Return a JSON object with exactly these keys: &quot;f1&quot;, &quot;f2&quot;, &quot;f3&quot;.</span>
</span></span></span></span>
<span id="A1.F14.p1.pic1.2.4" class="ltx_p" style="width:353.9pt;"><span id="A1.F14.p1.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F14.p1.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F14.p1.pic1.p4" class="ltx_para ltx_noindent">
<span id="A1.F14.p1.pic1.p4.1" class="ltx_p">Question: {question}</span>
</span></span></span></span>
<span id="A1.F14.p1.pic1.2.5" class="ltx_p" style="width:353.9pt;"><span id="A1.F14.p1.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F14.p1.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F14.p1.pic1.p5" class="ltx_para ltx_noindent">
<span id="A1.F14.p1.pic1.p5.1" class="ltx_p">LLM Reasoning: {model_reasoning}</span>
</span></span></span></span>
<span id="A1.F14.p1.pic1.2.6" class="ltx_p" style="width:353.9pt;"><span id="A1.F14.p1.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F14.p1.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F14.p1.pic1.p6" class="ltx_para ltx_noindent">
<span id="A1.F14.p1.pic1.p6.1" class="ltx_p">LLM Answer: {model_answer}</span>
