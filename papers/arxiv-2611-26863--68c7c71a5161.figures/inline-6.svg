<span id="A1.F12.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.71em;">
<span id="A1.F12.p1.pic1.2.1" class="ltx_p"><span id="A1.F12.p1.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F12.p1.pic1.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F12.p1.pic1.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F12.p1.pic1.2.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F12.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.F12.p1.pic1.p1.1" class="ltx_p">You are a fact-checking assistant specializing in identifying hallucinated reasoning in LLM outputs. An LLM was given the following question about an article. The LLM first reasoned about the question and then answered it. Its reasoning may contain hallucinated (incorrect) facts not supported by the article.</span>
</span></span></span></span>
<span id="A1.F12.p1.pic1.2.2" class="ltx_p" style="width:353.9pt;"><span id="A1.F12.p1.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F12.p1.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F12.p1.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.F12.p1.pic1.p2.1" class="ltx_p">Article: {article}</span>
</span></span></span></span>
<span id="A1.F12.p1.pic1.2.3" class="ltx_p" style="width:353.9pt;"><span id="A1.F12.p1.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F12.p1.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F12.p1.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.F12.p1.pic1.p3.1" class="ltx_p">Question: {question}</span>
</span></span></span></span>
<span id="A1.F12.p1.pic1.2.4" class="ltx_p" style="width:353.9pt;"><span id="A1.F12.p1.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F12.p1.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F12.p1.pic1.p4" class="ltx_para ltx_noindent">
<span id="A1.F12.p1.pic1.p4.1" class="ltx_p">LLM Reasoning: {model_reasoning}</span>
</span></span></span></span>
<span id="A1.F12.p1.pic1.2.5" class="ltx_p" style="width:353.9pt;"><span id="A1.F12.p1.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F12.p1.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F12.p1.pic1.p5" class="ltx_para ltx_noindent">
<span id="A1.F12.p1.pic1.p5.1" class="ltx_p">LLM Answer: {model_answer}</span>
</span></span></span></span>
<span id="A1.F12.p1.pic1.2.6" class="ltx_p" style="width:353.9pt;"><span id="A1.F12.p1.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F12.p1.pic1.2.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F12.p1.pic1.2.6.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F12.p1.pic1.2.6.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F12.p1.pic1.p6" class="ltx_para ltx_noindent">
<span id="A1.F12.p1.pic1.p6.1" class="ltx_p">Your task: Identify a fact in the reasoning that is clearly hallucinated - a fact that is NOT supported by the article but was central to how the LLM arrived at its answer.  If the reasoning chain quotes something as explicitly mentioned in the story while it is actually fully hallucinated, give this high weightage. Return only that fact that is totally hallucinated as one complete sentence, written without pronouns (use proper nouns/names instead so the sentence is self-contained). Return nothing else.</span>
</span></span></span></span>
<span id="A1.F12.p1.pic1.2.7" class="ltx_p" style="width:353.9pt;"><span id="A1.F12.p1.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F12.p1.pic1.2.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F12.p1.pic1.2.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F12.p1.pic1.2.7.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F12.p1.pic1.p7" class="ltx_para ltx_noindent">
<span id="A1.F12.p1.pic1.p7.1" class="ltx_p">You must return just the hallucinated fact from the reasoning trace as it is (but as a complete sentence). Do not add justifications as to why it is hallucinated. If no part of the reasoning is hallucinated, return an empty string. The article, question, reasoning, and the LLM’s answer are given below:</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>