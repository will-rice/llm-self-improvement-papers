<span id="A1.F7.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.71em;">
<span id="A1.F7.p1.pic1.2.1" class="ltx_p"><span id="A1.F7.p1.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F7.p1.pic1.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F7.p1.pic1.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F7.p1.pic1.2.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F7.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.F7.p1.pic1.p1.1" class="ltx_p">You will be given a story, a multiple-choice question about it, and the correct answer to the question. Your task is to read the story carefully and explain clearly, in about four sentences, why the provided answer correctly answers the given question based on the story. In other words, you should provide the justification for why the given answer is correct.</span>
</span></span></span></span>
<span id="A1.F7.p1.pic1.2.2" class="ltx_p" style="width:353.9pt;"><span id="A1.F7.p1.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F7.p1.pic1.2.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F7.p1.pic1.2.2.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F7.p1.pic1.2.2.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F7.p1.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.F7.p1.pic1.p2.1" class="ltx_p">Reason strictly based on the story. The explanation you provide should encapsulate the context required to correctly justify why the provided answer correctly answers the question. Do not add any extra text. Just provide the justification.</span>
</span></span></span></span>
<span id="A1.F7.p1.pic1.2.3" class="ltx_p" style="width:353.9pt;"><span id="A1.F7.p1.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F7.p1.pic1.2.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F7.p1.pic1.2.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F7.p1.pic1.2.3.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F7.p1.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.F7.p1.pic1.p3.1" class="ltx_p">Do NOT produce any extra text referring back to the correct option number directly, i.e., do not include phrases like &quot;Hence option 1 is the correct option.&quot;</span>
</span></span></span></span>
