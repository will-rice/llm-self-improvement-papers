<span id="A1.F18.p1.pic1.p5" class="ltx_para ltx_noindent">
<span id="A1.F18.p1.pic1.p5.1" class="ltx_p">LLM Answer: {model_answer}</span>
</span></span></span></span>
<span id="A1.F18.p1.pic1.2.6" class="ltx_p" style="width:353.9pt;"><span id="A1.F18.p1.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F18.p1.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:353.9pt;"></span></span></span>
<span id="A1.F18.p1.pic1.2.7" class="ltx_p" style="width:353.9pt;"><span id="A1.F18.p1.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F18.p1.pic1.2.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F18.p1.pic1.2.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F18.p1.pic1.2.7.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F18.p1.pic1.p7" class="ltx_para ltx_noindent">
<span id="A1.F18.p1.pic1.p7.1" class="ltx_p">Your task: Split the LLM Reasoning into individual sentences. For each sentence, decide whether it is a hallucination (a fact that is NOT supported by the article) or not. Label each sentence with 0 if it is hallucinated, 1 if it is not hallucinated, and 2 if it contains no factual information at all. Return ONLY a valid JSON object where each key is a sentence from the reasoning (verbatim, as a complete sentence) and each value is 0, 1, or 2. Do not add any justifications, explanations, markdown, or other text. Return nothing else.</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>