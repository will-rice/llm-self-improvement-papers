<span id="A1.F18.p1.pic1.2.1" class="ltx_p"><span id="A1.F18.p1.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F18.p1.pic1.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F18.p1.pic1.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.F18.p1.pic1.2.1.1.3" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F18.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.F18.p1.pic1.p1.1" class="ltx_p">You are a fact-checking assistant specializing in identifying hallucinated reasoning in LLM outputs. An LLM was given the following question about an article. The LLM first reasoned about the question and then answered it. Its reasoning may contain hallucinated (incorrect) facts not supported by the article.</span>
</span></span></span></span>
<span id="A1.F18.p1.pic1.2.2" class="ltx_p" style="width:353.9pt;"><span id="A1.F18.p1.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F18.p1.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F18.p1.pic1.p2" class="ltx_para ltx_noindent">
<span id="A1.F18.p1.pic1.p2.1" class="ltx_p">Article: {article}</span>
</span></span></span></span>
<span id="A1.F18.p1.pic1.2.3" class="ltx_p" style="width:353.9pt;"><span id="A1.F18.p1.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F18.p1.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F18.p1.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.F18.p1.pic1.p3.1" class="ltx_p">Question: {question}</span>
</span></span></span></span>
<span id="A1.F18.p1.pic1.2.4" class="ltx_p" style="width:353.9pt;"><span id="A1.F18.p1.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:353.9pt;--ltx-fg-color:#000000;"><span id="A1.F18.p1.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:353.9pt;">
<span id="A1.F18.p1.pic1.p4" class="ltx_para ltx_noindent">
<span id="A1.F18.p1.pic1.p4.1" class="ltx_p">LLM Reasoning: {model_reasoning}</span>
</span></span></span></span>
