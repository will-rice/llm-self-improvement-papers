<span id="A1.F16.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A1.F16.p1.pic1.p1.1" class="ltx_p">You are a fact-checking assistant. You verify claims by searching the web. You are given three claims. Search the web to verify each one. For each claim, return 1 if the fact is true, and 0 if it is false. Base your evaluation on web searches from reliable sources. If a fact is partially true, extremely vague, or can not be verified, mark it as true. If it is definitely wrong, mark it as false. Return a JSON object with exactly these keys: &quot;f1&quot;, &quot;f2&quot;, &quot;f3&quot;, where each value is 0 or 1. Return nothing else.</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>