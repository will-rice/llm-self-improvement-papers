<svg id="A11.p3.pic1" class="ltx_picture" height="1130.21" overflow="visible" version="1.1" viewbox="0 0 477.38 1130.21" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1130.21) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#00B38C;" fill="#00B38C" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 1124.3 C 0 1127.57 2.64 1130.21 5.91 1130.21 L 471.47 1130.21 C 474.73 1130.21 477.38 1127.57 477.38 1124.3 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2FBF9;" fill="#F2FBF9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 1106.1 L 475.41 1106.1 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 1114.7)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A11.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A11.p3.pic1.1.1" class="ltx_p ltx_align_center"><span id="A11.p3.pic1.1.1.1" class="ltx_text ltx_font_sansserif" style="--ltx-fg-color:#FFFFFF;">Prompt used to generate Action</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 14.41)"><foreignobject style="--ltx-fo-width:33.91em;--ltx-fo-height:78.04em;--ltx-fo-depth:0.05em;font-size:10pt;" height="1080.52" overflow="visible" transform="matrix(1 0 0 -1 0 1079.89)" width="469.22"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A11.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.91em;">
<span id="A11.p3.pic1.2.1" class="ltx_p"><span id="A11.p3.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Interact with the <span id="A11.p3.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">&quot;{db_id}&quot;</span> database using PostgreSQL to solve the user issue. You will be given the following information: 
<br class="ltx_break">1. <span id="A11.p3.pic1.2.1.1.2" class="ltx_text ltx_font_bold">Database schema</span>: complete <span id="A11.p3.pic1.2.1.1.3" class="ltx_text ltx_font_typewriter">CREATE TABLE …</span> DDL. 
<br class="ltx_break">2. <span id="A11.p3.pic1.2.1.1.4" class="ltx_text ltx_font_bold">User Issue</span>: a natural language description of the desired outcome or the current bug. 
<br class="ltx_break">3. <span id="A11.p3.pic1.2.1.1.5" class="ltx_text ltx_font_bold">Problematic SQL</span>: the query (or queries) that presently fails to meet the requirement. 
<br class="ltx_break"></span></span>
<span id="A11.p3.pic1.2.2" class="ltx_p"><span id="A11.p3.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Use interleaving Thought, Action, Observation steps. 
<br class="ltx_break"><span id="A11.p3.pic1.2.2.1.1" class="ltx_text ltx_font_bold">Thought</span> can reason about the possible errors or other information you need for debugging about the current situation. For instance, it could be:</span></span>
<span id="A11.I3" class="ltx_itemize">
<span id="A11.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A11.I3.i1.p1" class="ltx_para">
<span id="A11.I3.i1.p1.1" class="ltx_p"><span id="A11.I3.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Diagnosis of the bug you see in the current query.</span></span>
</span></span>
<span id="A11.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A11.I3.i2.p1" class="ltx_para">
<span id="A11.I3.i2.p1.1" class="ltx_p"><span id="A11.I3.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Hypotheses you want to confirm (e.g., Maybe the join is missing a date filter).</span></span>
</span></span>
<span id="A11.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A11.I3.i3.p1" class="ltx_para">
<span id="A11.I3.i3.p1.1" class="ltx_p"><span id="A11.I3.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Reasoning that led you to the next SQL step (checking row counts, inspecting NULLs, etc.).</span></span>
</span></span>
<span id="A11.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A11.I3.i4.p1" class="ltx_para">
<span id="A11.I3.i4.p1.1" class="ltx_p"><span id="A11.I3.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">A brief plan for what you will try next.</span></span>
</span></span>
</span>
<span id="A11.p3.pic1.2.3" class="ltx_p"><span id="A11.p3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Action<span id="A11.p3.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> can only be the executable PostgreSQL SQL according to the corresponding thought. The </span>Observation<span id="A11.p3.pic1.2.3.1.2" class="ltx_text ltx_font_medium"> would be the execution results feedback from the environment. 
<br class="ltx_break"></span></span></span>
<span id="A11.p3.pic1.2.4" class="ltx_p"><span id="A11.p3.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Your task is to generate the action for the current round thought given the react history. Wrap your action in <span id="A11.p3.pic1.2.4.1.1" class="ltx_text ltx_font_typewriter">&lt;action&gt;[Executable SQL]&lt;/action&gt;</span>. If you think the debugging process is done, just output <span id="A11.p3.pic1.2.4.1.2" class="ltx_text ltx_font_typewriter">&lt;action&gt;[DONE]&lt;/action&gt;</span> as the action. 
<br class="ltx_break"></span></span>
<span id="A11.p3.pic1.2.5" class="ltx_p"><span id="A11.p3.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The input for you is as follows: 
<br class="ltx_break"><span id="A11.p3.pic1.2.5.1.1" class="ltx_text ltx_font_bold">Database Schema</span> 
<br class="ltx_break">{SCHEMA} 
<br class="ltx_break"></span></span>
<span id="A11.p3.pic1.2.6" class="ltx_p"><span id="A11.p3.pic1.2.6.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">User Issue<span id="A11.p3.pic1.2.6.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">{USER_ISSUE} 
<br class="ltx_break"></span></span></span>
<span id="A11.p3.pic1.2.7" class="ltx_p"><span id="A11.p3.pic1.2.7.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Problematic SQL<span id="A11.p3.pic1.2.7.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">{ISSUE_SQL} 
<br class="ltx_break"></span></span></span>
<span id="A11.p3.pic1.2.8" class="ltx_p"><span id="A11.p3.pic1.2.8.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Important Rules:<span id="A11.p3.pic1.2.8.1.1" class="ltx_text"></span></span></span>
<span id="A11.I4" class="ltx_itemize">
<span id="A11.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A11.I4.i1.p1" class="ltx_para">
<span id="A11.I4.i1.p1.1" class="ltx_p"><span id="A11.I4.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">MOST IMPORTANT:</span><span id="A11.I4.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Wrap your action in </span><span id="A11.I4.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;action&gt;[Executable SQL]&lt;/action&gt;</span><span id="A11.I4.i1.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A11.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A11.I4.i2.p1" class="ltx_para">
<span id="A11.I4.i2.p1.1" class="ltx_p"><span id="A11.I4.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The action inside the </span><span id="A11.I4.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;action&gt;&lt;/action&gt;</span><span id="A11.I4.i2.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> tags must be pure PostgreSQL statements that can be executed directly, without any comments or needs for additional post-processing.</span></span>
</span></span>
<span id="A11.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A11.I4.i3.p1" class="ltx_para">
<span id="A11.I4.i3.p1.1" class="ltx_p"><span id="A11.I4.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">If you believe the debugging process is finished, output </span><span id="A11.I4.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;action&gt;[DONE]&lt;/action&gt;</span><span id="A11.I4.i3.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> as the action for this turn.</span></span>
</span></span>
</span>
<span id="A11.p3.pic1.2.9" class="ltx_p"><span id="A11.p3.pic1.2.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Now generate the action of this round given the trajectory history and current thought. Generating multiple rounds at once is NOT ALLOWED! You still have {turn} turns left. 
<br class="ltx_break"><span id="A11.p3.pic1.2.9.1.1" class="ltx_text ltx_font_bold">React</span> 
<br class="ltx_break">{history} 
<br class="ltx_break"></span></span>
<span id="A11.p3.pic1.2.10" class="ltx_p"><span id="A11.p3.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">&lt;action&gt;<span id="A11.p3.pic1.2.10.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
</span></span></span></foreignobject></g></g></svg>