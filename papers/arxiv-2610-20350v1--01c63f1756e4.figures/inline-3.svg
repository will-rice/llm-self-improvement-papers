<span id="A6.SS2.p4.pic1.2.1" class="ltx_p"><span id="A6.SS2.p4.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Prompt Summary
<br class="ltx_break"><span id="A6.SS2.p4.pic1.2.1.1.1" class="ltx_text ltx_font_medium">Resolve a constraint puzzle with one correct partial assignment</span></span></span>
<span id="A6.SS2.p4.pic1.2.2" class="ltx_p"><span id="A6.SS2.p4.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">DPO Baseline
<br class="ltx_break"><span id="A6.SS2.p4.pic1.2.2.1.1" class="ltx_text ltx_font_medium">Rewrites the assignment and loses a previously consistent clue. <span id="A6.SS2.p4.pic1.2.2.1.1.1" class="ltx_text ltx_font_italic">Preference optimization over answers risks structural regressions from correct to incorrect.</span></span></span></span>
<span id="A6.SS2.p4.pic1.2.3" class="ltx_p"><span id="A6.SS2.p4.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">LSPO
<br class="ltx_break"><span id="A6.SS2.p4.pic1.2.3.1.1" class="ltx_text ltx_font_medium">Keeps the valid partial assignment and flips only the conflicting slot.</span></span></span>
<span id="A6.SS2.p4.pic1.2.4" class="ltx_p"><span id="A6.SS2.p4.pic1.2.4.1" class="ltx_text ltx_font_bold ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Interpretation.</span><span id="A6.SS2.p4.pic1.2.4.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> <span id="A6.SS2.p4.pic1.2.4.2.1" class="ltx_text ltx_font_italic">Transition shaping preserves already correct local structure.</span></span></span>
