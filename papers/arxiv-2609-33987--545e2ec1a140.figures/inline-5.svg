<span id="S5.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I3.i2.p1" class="ltx_para">
<span id="S5.I3.i2.p1.1" class="ltx_p"><span id="S5.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use self-critique when the policy is competent; use a stronger critic when it struggles; no critic helps a policy that never reaches a viable solution.</span></span>
