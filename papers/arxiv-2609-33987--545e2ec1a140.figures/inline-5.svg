<span id="S5.I3.i1.p1.1" class="ltx_p"><span id="S5.I3.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Opera</span><span id="S5.I3.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> shows consistent improvement when critic model varies.</span></span>
