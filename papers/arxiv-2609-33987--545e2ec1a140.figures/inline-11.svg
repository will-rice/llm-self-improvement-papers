<span id="A4.p7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.58em;">
<span id="A4.p7.pic1.1.1" class="ltx_p"><span id="A4.p7.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#263B53;">(6) Successful correction (submit stage) — <span id="A4.p7.pic1.1.1.1.1" class="ltx_text ltx_font_typewriter">qutebrowser-8cd06741</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 16.58 12.64)"><foreignobject style="--ltx-fo-width:44.58em;--ltx-fo-height:100.98em;--ltx-fo-depth:0em;font-size:10pt;" height="1397.32" overflow="visible" transform="matrix(1 0 0 -1 0 1397.32)" width="616.86"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.p7.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:44.58em;">
<span id="A4.p7.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.p7.pic1.p1.1" class="ltx_p"><span id="A4.p7.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task.</span><span id="A4.p7.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Expose the QtWebEngine 6.6 dark-mode image classifier: </span><span id="A4.p7.pic1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">colors.webpage.darkmode.policy.images</span><span id="A4.p7.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> gains the value </span><span id="A4.p7.pic1.p1.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">smart-simple</span><span id="A4.p7.pic1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">; on Qt 6.6+ </span><span id="A4.p7.pic1.p1.1.7" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">smart</span><span id="A4.p7.pic1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> must emit </span><span id="A4.p7.pic1.p1.1.9" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">ImagePolicy=2, ImageClassifierPolicy=0</span><span id="A4.p7.pic1.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> and </span><span id="A4.p7.pic1.p1.1.11" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">smart-simple</span><span id="A4.p7.pic1.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;"> must emit </span><span id="A4.p7.pic1.p1.1.13" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">ImageClassifierPolicy=1</span><span id="A4.p7.pic1.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;">; older Qt versions must be unaffected.</span></span>
</span>
<span id="A4.p7.pic1.p2" class="ltx_para ltx_noindent">
<span id="A4.p7.pic1.p2.1" class="ltx_p"><span id="A4.p7.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Observation.</span><span id="A4.p7.pic1.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> A completion without the central check: </span><span id="A4.p7.pic1.p2.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#8C5000;">the one direct <span id="A4.p7.pic1.p2.1.3.1" class="ltx_text ltx_font_typewriter">darkmode.settings()</span> call had crashed with <span id="A4.p7.pic1.p2.1.3.2" class="ltx_text ltx_font_typewriter">AttributeError: ’NoneType’ object has no attribute ’get’</span> (no config instance) and was never retried</span><span id="A4.p7.pic1.p2.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">; instead the agent inspected </span><span id="A4.p7.pic1.p2.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">_MultiMappingSetting.tuples()</span><span id="A4.p7.pic1.p2.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> and the internal mapping tables, marked all five task-tracker items done and was about to call </span><span id="A4.p7.pic1.p2.1.7" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">finish</span><span id="A4.p7.pic1.p2.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span>
<span id="A4.p7.pic1.p3" class="ltx_para ltx_noindent">
<span id="A4.p7.pic1.p3.1" class="ltx_p"><span id="A4.p7.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Operator.</span><span id="A4.p7.pic1.p3.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A4.p7.pic1.p3.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">submission_readiness_review</span><span id="A4.p7.pic1.p3.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> for verification that bypasses the interface the task is about.</span></span>
</span>
<span id="A4.p7.pic1.p4" class="ltx_para ltx_noindent">
<span id="A4.p7.pic1.p4.1" class="ltx_p"><span id="A4.p7.pic1.p4.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Resolution criterion.</span><span id="A4.p7.pic1.p4.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> A direct </span><span id="A4.p7.pic1.p4.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">darkmode.settings()</span><span id="A4.p7.pic1.p4.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> call shows Qt 6.5 emitting only </span><span id="A4.p7.pic1.p4.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">ImagePolicy=2</span><span id="A4.p7.pic1.p4.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> for both values and Qt 6.6 additionally emitting </span><span id="A4.p7.pic1.p4.1.7" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">ImageClassifierPolicy</span><span id="A4.p7.pic1.p4.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> 0 or 1.</span></span>
</span>
<span id="A4.p7.pic1.p5" class="ltx_para ltx_noindent">
<span id="A4.p7.pic1.p5.1" class="ltx_p"><span id="A4.p7.pic1.p5.1.1" class="ltx_text ltx_font_bold ltx_align_left ltx_inline-block" style="width:35.0pt;--ltx-fg-color:#000000;">T1</span><span id="A4.p7.pic1.p5.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Agent.</span><span id="A4.p7.pic1.p5.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Turns 102–106: </span><span id="A4.p7.pic1.p5.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#8C5000;">updates the task tracker to five “done” items and prints <span id="A4.p7.pic1.p5.1.4.1" class="ltx_text ltx_font_typewriter">_IMAGE_POLICIES</span> and the classifier mapping as its final check</span><span id="A4.p7.pic1.p5.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">; the failed end-to-end attempt (turn 101) is not retried.</span></span>
</span>
<span id="A4.p7.pic1.p6" class="ltx_para ltx_noindent">
<span id="A4.p7.pic1.p6.1" class="ltx_p"><span id="A4.p7.pic1.p6.1.1" class="ltx_text ltx_font_bold ltx_align_left ltx_inline-block" style="width:35.0pt;--ltx-fg-color:#000000;">T2</span><span id="A4.p7.pic1.p6.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Critic.</span><span id="A4.p7.pic1.p6.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Evidence: every successful check reads internals; none shows configured values flowing through </span><span id="A4.p7.pic1.p6.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">settings()</span><span id="A4.p7.pic1.p6.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> into the emitted switch data. </span><span id="A4.p7.pic1.p6.1.6" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#B02828;">Correction: run one end-to-end script that mocks <span id="A4.p7.pic1.p6.1.6.1" class="ltx_text ltx_font_typewriter">config.instance.get</span> and asserts the four required <span id="A4.p7.pic1.p6.1.6.2" class="ltx_text ltx_font_typewriter">settings()</span> outputs for Qt 6.5 and 6.6; expect <span id="A4.p7.pic1.p6.1.6.3" class="ltx_text ltx_font_typewriter">settings() end-to-end OK</span>.</span><span id="A4.p7.pic1.p6.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> Admission audit: accepted (“bypasses the necessary interface”); note </span><span id="A4.p7.pic1.p6.1.8" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">F-b81e67aa</span><span id="A4.p7.pic1.p6.1.9" class="ltx_text" style="--ltx-fg-color:#000000;"> opened.</span></span>
</span>
<span id="A4.p7.pic1.p7" class="ltx_para ltx_noindent">
<span id="A4.p7.pic1.p7.1" class="ltx_p"><span id="A4.p7.pic1.p7.1.1" class="ltx_text ltx_font_bold ltx_align_left ltx_inline-block" style="width:35.0pt;--ltx-fg-color:#000000;">T3</span><span id="A4.p7.pic1.p7.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Agent.</span><span id="A4.p7.pic1.p7.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Turn 108: runs the script verbatim.</span></span>
</span>
<span id="A4.p7.pic1.p8" class="ltx_para ltx_noindent">
<span id="A4.p7.pic1.p8.1" class="ltx_p"><span id="A4.p7.pic1.p8.1.1" class="ltx_text ltx_font_bold ltx_align_left ltx_inline-block" style="width:35.0pt;--ltx-fg-color:#000000;">T4</span><span id="A4.p7.pic1.p8.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Follow-up.</span><span id="A4.p7.pic1.p8.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A4.p7.pic1.p8.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#146E46;">Output <span id="A4.p7.pic1.p8.1.4.1" class="ltx_text ltx_font_typewriter">settings() end-to-end OK</span></span><span id="A4.p7.pic1.p8.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> — the close audit accepts on that output and the agent finishes on the next action (turn 109). Earlier in the same trial a </span><span id="A4.p7.pic1.p8.1.6" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">requirement_contract_review</span><span id="A4.p7.pic1.p8.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> note (opened turn 43, three updates, closed turn 86) and a </span><span id="A4.p7.pic1.p8.1.8" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">state_transition_review</span><span id="A4.p7.pic1.p8.1.9" class="ltx_text" style="--ltx-fg-color:#000000;"> note (a shallow </span><span id="A4.p7.pic1.p8.1.10" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">copy.copy</span><span id="A4.p7.pic1.p8.1.11" class="ltx_text" style="--ltx-fg-color:#000000;"> in </span><span id="A4.p7.pic1.p8.1.12" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">copy_replace_setting</span><span id="A4.p7.pic1.p8.1.13" class="ltx_text" style="--ltx-fg-color:#000000;"> mutated the shared </span><span id="A4.p7.pic1.p8.1.14" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">_Setting</span><span id="A4.p7.pic1.p8.1.15" class="ltx_text" style="--ltx-fg-color:#000000;"> objects so building the Qt 6.4 definition changed Qt 5.15.3’s keys; closed at turn 101 after </span><span id="A4.p7.pic1.p8.1.16" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#146E46;">Settings are independent!</span><span id="A4.p7.pic1.p8.1.17" class="ltx_text" style="--ltx-fg-color:#000000;">) had been closed.</span></span>
</span>
<span id="A4.p7.pic1.p9" class="ltx_para ltx_noindent">
<span id="A4.p7.pic1.p9.1" class="ltx_p"><span id="A4.p7.pic1.p9.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Outcome.</span><span id="A4.p7.pic1.p9.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A4.p7.pic1.p9.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Note:</span><span id="A4.p7.pic1.p9.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> closed.
</span><span id="A4.p7.pic1.p9.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task:</span><span id="A4.p7.pic1.p9.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> success (0/3 without the critic).</span></span>
</span>
<span id="A4.p7.pic1.p10" class="ltx_para ltx_noindent">
<span id="A4.p7.pic1.p10.1" class="ltx_p"><span id="A4.p7.pic1.p10.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Takeaway.</span><span id="A4.p7.pic1.p10.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> The submit-stage note did not change the patch; it forced the one verification the agent had skipped after an unrelated setup error, and in this trial that verification passed. The same operator is what blocks premature </span><span id="A4.p7.pic1.p10.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">finish</span><span id="A4.p7.pic1.p10.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> calls when it does not.</span></span>
</span></span></span></span></foreignobject></g></g></svg>