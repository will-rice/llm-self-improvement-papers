<span id="A4.p5.pic1.1.1" class="ltx_p"><span id="A4.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#263B53;">(4) Successful correction (test stage) — <span id="A4.p5.pic1.1.1.1.1" class="ltx_text ltx_font_typewriter">qutebrowser-ef5ba1a0</span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 16.58 12.64)"><foreignobject style="--ltx-fo-width:44.58em;--ltx-fo-height:104.07em;--ltx-fo-depth:0em;font-size:10pt;" height="1440.06" overflow="visible" transform="matrix(1 0 0 -1 0 1440.06)" width="616.86"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.p5.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:44.58em;">
<span id="A4.p5.pic1.p1" class="ltx_para ltx_noindent">
<span id="A4.p5.pic1.p1.1" class="ltx_p"><span id="A4.p5.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task.</span><span id="A4.p5.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Locale override for QtWebEngine 5.15.3 on Linux: </span><span id="A4.p5.pic1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">_get_lang_override(webengine_version, locale_name)</span><span id="A4.p5.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> must return no override when the setting is off, the platform/version does not match, or the original </span><span id="A4.p5.pic1.p1.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">.pak</span><span id="A4.p5.pic1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> exists; a mapped fallback locale when its </span><span id="A4.p5.pic1.p1.1.7" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">.pak</span><span id="A4.p5.pic1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> exists; otherwise </span><span id="A4.p5.pic1.p1.1.9" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">en-US</span><span id="A4.p5.pic1.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span>
<span id="A4.p5.pic1.p2" class="ltx_para ltx_noindent">
<span id="A4.p5.pic1.p2.1" class="ltx_p"><span id="A4.p5.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Observation.</span><span id="A4.p5.pic1.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> A green test run that proved nothing about the missing branch: </span><span id="A4.p5.pic1.p2.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#8C5000;">the implementation built <span id="A4.p5.pic1.p2.1.3.1" class="ltx_text ltx_font_typewriter">locales_dir</span> and went straight to the two <span id="A4.p5.pic1.p2.1.3.2" class="ltx_text ltx_font_typewriter">.pak</span> checks, so an unavailable directory falls through to <span id="A4.p5.pic1.p2.1.3.3" class="ltx_text ltx_font_typewriter">return ’en-US’</span> instead of returning <span id="A4.p5.pic1.p2.1.3.4" class="ltx_text ltx_font_typewriter">None</span></span><span id="A4.p5.pic1.p2.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">; the agent then ran </span><span id="A4.p5.pic1.p2.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">tests/unit/config/test_qtargs.py</span><span id="A4.p5.pic1.p2.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">, which does not cover that state, and read the result as confirmation.</span></span>
</span>
<span id="A4.p5.pic1.p3" class="ltx_para ltx_noindent">
<span id="A4.p5.pic1.p3.1" class="ltx_p"><span id="A4.p5.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Operator.</span><span id="A4.p5.pic1.p3.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A4.p5.pic1.p3.1.3" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">state_transition_review</span><span id="A4.p5.pic1.p3.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> for a final-default transition taken where an early no-override return is required.</span></span>
</span>
<span id="A4.p5.pic1.p4" class="ltx_para ltx_noindent">
<span id="A4.p5.pic1.p4.1" class="ltx_p"><span id="A4.p5.pic1.p4.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Resolution criterion.</span><span id="A4.p5.pic1.p4.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> When the resolved </span><span id="A4.p5.pic1.p4.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">qtwebengine_locales</span><span id="A4.p5.pic1.p4.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> directory is unavailable, </span><span id="A4.p5.pic1.p4.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">_get_lang_override</span><span id="A4.p5.pic1.p4.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> returns </span><span id="A4.p5.pic1.p4.1.7" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">None</span><span id="A4.p5.pic1.p4.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">, not </span><span id="A4.p5.pic1.p4.1.9" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">en-US</span><span id="A4.p5.pic1.p4.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span>
<span id="A4.p5.pic1.p5" class="ltx_para ltx_noindent">
<span id="A4.p5.pic1.p5.1" class="ltx_p"><span id="A4.p5.pic1.p5.1.1" class="ltx_text ltx_font_bold ltx_align_left ltx_inline-block" style="width:35.0pt;--ltx-fg-color:#000000;">T1</span><span id="A4.p5.pic1.p5.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Agent.</span><span id="A4.p5.pic1.p5.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Turns 30–31: reads the existing test file and runs it; </span><span id="A4.p5.pic1.p5.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#8C5000;">the unavailable-directory path is neither guarded in the code nor exercised by the tests</span><span id="A4.p5.pic1.p5.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span>
<span id="A4.p5.pic1.p6" class="ltx_para ltx_noindent">
<span id="A4.p5.pic1.p6.1" class="ltx_p"><span id="A4.p5.pic1.p6.1.1" class="ltx_text ltx_font_bold ltx_align_left ltx_inline-block" style="width:35.0pt;--ltx-fg-color:#000000;">T2</span><span id="A4.p5.pic1.p6.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Critic.</span><span id="A4.p5.pic1.p6.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Evidence: lines 377–398 construct the directory, check two </span><span id="A4.p5.pic1.p6.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">.pak</span><span id="A4.p5.pic1.p6.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> files and return </span><span id="A4.p5.pic1.p6.1.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">’en-US’</span><span id="A4.p5.pic1.p6.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">, with no availability guard. </span><span id="A4.p5.pic1.p6.1.8" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#B02828;">Correction: return <span id="A4.p5.pic1.p6.1.8.1" class="ltx_text ltx_font_typewriter">None</span> immediately after resolving <span id="A4.p5.pic1.p6.1.8.2" class="ltx_text ltx_font_typewriter">locales_dir</span> when it is unavailable; verify with a self-contained snippet that points <span id="A4.p5.pic1.p6.1.8.3" class="ltx_text ltx_font_typewriter">QLibraryInfo</span> at an empty temp dir and asserts <span id="A4.p5.pic1.p6.1.8.4" class="ltx_text ltx_font_typewriter">None</span>.</span><span id="A4.p5.pic1.p6.1.9" class="ltx_text" style="--ltx-fg-color:#000000;"> Admission audit: accepted; note </span><span id="A4.p5.pic1.p6.1.10" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">F-feda8c3f</span><span id="A4.p5.pic1.p6.1.11" class="ltx_text" style="--ltx-fg-color:#000000;"> opened.</span></span>
</span>
<span id="A4.p5.pic1.p7" class="ltx_para ltx_noindent">
<span id="A4.p5.pic1.p7.1" class="ltx_p"><span id="A4.p5.pic1.p7.1.1" class="ltx_text ltx_font_bold ltx_align_left ltx_inline-block" style="width:35.0pt;--ltx-fg-color:#000000;">T3</span><span id="A4.p5.pic1.p7.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Agent.</span><span id="A4.p5.pic1.p7.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> Turn 32 (thought) restates the requirement; turn 33: inserts </span><span id="A4.p5.pic1.p7.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">if not locales_dir.exists(): return None</span><span id="A4.p5.pic1.p7.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> before the </span><span id="A4.p5.pic1.p7.1.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">.pak</span><span id="A4.p5.pic1.p7.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> checks; turn 34: runs the critic’s snippet.</span></span>
</span>
<span id="A4.p5.pic1.p8" class="ltx_para ltx_noindent">
<span id="A4.p5.pic1.p8.1" class="ltx_p"><span id="A4.p5.pic1.p8.1.1" class="ltx_text ltx_font_bold ltx_align_left ltx_inline-block" style="width:35.0pt;--ltx-fg-color:#000000;">T4</span><span id="A4.p5.pic1.p8.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Follow-up.</span><span id="A4.p5.pic1.p8.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A4.p5.pic1.p8.1.4" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#146E46;">The snippet prints <span id="A4.p5.pic1.p8.1.4.1" class="ltx_text ltx_font_typewriter">Result: None</span> / <span id="A4.p5.pic1.p8.1.4.2" class="ltx_text ltx_font_typewriter">unavailable directory: no override</span></span><span id="A4.p5.pic1.p8.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">; audited closure at turn 36. Two later notes on the same trial were also closed: </span><span id="A4.p5.pic1.p8.1.6" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">diff_scope_review</span><span id="A4.p5.pic1.p8.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> (the </span><span id="A4.p5.pic1.p8.1.8" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">qt.workarounds.locale</span><span id="A4.p5.pic1.p8.1.9" class="ltx_text" style="--ltx-fg-color:#000000;"> option was read but never registered in </span><span id="A4.p5.pic1.p8.1.10" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">configdata.yml</span><span id="A4.p5.pic1.p8.1.11" class="ltx_text" style="--ltx-fg-color:#000000;">; closed at turn 52 after </span><span id="A4.p5.pic1.p8.1.12" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#146E46;">registered</span><span id="A4.p5.pic1.p8.1.13" class="ltx_text" style="--ltx-fg-color:#000000;">) and </span><span id="A4.p5.pic1.p8.1.14" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">requirement_contract_review</span><span id="A4.p5.pic1.p8.1.15" class="ltx_text" style="--ltx-fg-color:#000000;"> (the function took a </span><span id="A4.p5.pic1.p8.1.16" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">WebEngineVersions</span><span id="A4.p5.pic1.p8.1.17" class="ltx_text" style="--ltx-fg-color:#000000;"> object instead of the version value; closed at turn 63 after </span><span id="A4.p5.pic1.p8.1.18" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#146E46;">version accepted</span><span id="A4.p5.pic1.p8.1.19" class="ltx_text" style="--ltx-fg-color:#000000;">).</span></span>
</span>
<span id="A4.p5.pic1.p9" class="ltx_para ltx_noindent">
<span id="A4.p5.pic1.p9.1" class="ltx_p"><span id="A4.p5.pic1.p9.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Outcome.</span><span id="A4.p5.pic1.p9.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A4.p5.pic1.p9.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Note:</span><span id="A4.p5.pic1.p9.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> closed.
</span><span id="A4.p5.pic1.p9.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task:</span><span id="A4.p5.pic1.p9.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> success (0/3 without the critic).</span></span>
</span>
<span id="A4.p5.pic1.p10" class="ltx_para ltx_noindent">
<span id="A4.p5.pic1.p10.1" class="ltx_p"><span id="A4.p5.pic1.p10.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Takeaway.</span><span id="A4.p5.pic1.p10.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> The agent’s own test run was green for the branches it exercised; the note supplied the missing state (directory absent) together with a runnable check, turning an untested transition into an observable one.</span></span>
</span></span></span></span></foreignobject></g></g></svg>