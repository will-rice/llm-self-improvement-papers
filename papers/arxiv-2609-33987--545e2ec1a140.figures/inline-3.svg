<span id="S5.SS1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.52em;">
<span id="S5.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="S5.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S5.I1.i1.p1.1" class="ltx_p"><span id="S5.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The critic mostly flags how agents change code rather than where they look.</span></span>
</span></span>
<span id="S5.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="S5.I1.i2.p1.1" class="ltx_p"><span id="S5.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">As policy capability increases, the most frequent diagnosis shifts from misread requirements to faulty execution logic.</span></span>
</span></span>
<span id="S5.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i3.p1" class="ltx_para">
<span id="S5.I1.i3.p1.1" class="ltx_p"><span id="S5.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A critic’s benefit is a rescue–regression trade-off, and the stronger policy models we tested rank high on both.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>