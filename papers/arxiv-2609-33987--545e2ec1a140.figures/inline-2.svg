<span id="S4.SS3.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.52em;">
<span id="S4.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="S4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S4.I1.i1.p1.1" class="ltx_p"><span id="S4.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A critic can turn a stronger model’s expertise into approximately on-policy self-reflection data for a weaker student.</span></span>
</span></span>
<span id="S4.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I1.i2.p1" class="ltx_para">
<span id="S4.I1.i2.p1.1" class="ltx_p"><span id="S4.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Fine-tuning on critic-guided student trajectories matches distillation from the stronger model on held-out repositories, while preserving generalization capabilities better.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>