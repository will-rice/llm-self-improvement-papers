<svg id="A3.p2.pic1" class="ltx_picture" height="952.31" overflow="visible" version="1.1" viewbox="0 0 700.39 952.31" width="700.39"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,952.31) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#64717C;" fill="#64717C" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.77 L 0 949.54 C 0 951.07 1.24 952.31 2.77 952.31 L 697.63 952.31 C 699.16 952.31 700.39 951.07 700.39 949.54 L 700.39 2.77 C 700.39 1.24 699.16 0 697.63 0 L 2.77 0 C 1.24 0 0 1.24 0 2.77 Z" /></g><g style="--ltx-fill-color:#F6F7F9;" fill="#F6F7F9" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 2.77 L 0.69 930.59 L 699.7 930.59 L 699.7 2.77 C 699.7 1.62 698.77 0.69 697.63 0.69 L 2.77 0.69 C 1.62 0.69 0.69 1.62 0.69 2.77 Z" /></g><g style="--ltx-fill-color:#E8EAEB;" fill="#E8EAEB" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 931.29 L 0.69 949.54 C 0.69 950.68 1.62 951.61 2.77 951.61 L 697.63 951.61 C 698.77 951.61 699.7 950.68 699.7 949.54 L 699.7 931.29 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 938.34)"><foreignobject style="--ltx-fo-width:45.78em;--ltx-fo-height:0.68em;--ltx-fo-depth:0.23em;font-size:10pt;" height="12.45" overflow="visible" transform="matrix(1 0 0 -1 0 9.34)" width="633.47"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.78em;">
<span id="A3.p2.pic1.1.1" class="ltx_p"><span id="A3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Meta-skill (system prompt of the <em id="A3.p2.pic1.1.1.1.1" class="ltx_emph ltx_font_italic">w/ meta-skill</em> arm)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 12.65)"><foreignobject style="--ltx-fo-width:52.7em;--ltx-fo-height:65.66em;--ltx-fo-depth:0.18em;font-size:10pt;" height="910.97" overflow="visible" transform="matrix(1 0 0 -1 0 908.48)" width="729.22"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:52.7em;">
<span id="A3.p2.pic1.2.1" class="ltx_p"><span id="A3.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Skill Adaptation<span id="A3.p2.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A3.p2.pic1.2.2" class="ltx_p"><span id="A3.p2.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are editing one <span id="A3.p2.pic1.2.2.1.1" class="ltx_text ltx_font_bold">skill</span> — a document that is injected into a coding agent’s context before it starts a task. The agent that will read your output is a small, weak model. It has already tried this task once with the current version of the skill. You are given what happened. Produce a better version.</span></span>
<span id="A3.p2.pic1.2.3" class="ltx_p"><span id="A3.p2.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The skill is the only thing you may change. You cannot change the task, the agent, or the tests.</span></span>
<span id="A3.p2.pic1.2.4" class="ltx_p"><span id="A3.p2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">First locate the break, then fix that<span id="A3.p2.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A3.p2.pic1.2.5" class="ltx_p"><span id="A3.p2.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Across 602 measured model-task cells, weak-model failure sorts into four classes by how far the agent got before it stopped. Read the trajectory and decide which of the four below is the <span id="A3.p2.pic1.2.5.1.1" class="ltx_text ltx_font_bold">earliest</span> thing that went wrong; a deeper fix has no effect while a shallower break remains. Apply the prescription for that class — edit the passages it implicates, and leave the rest of the document alone.</span></span>
<span id="A3.I1" class="ltx_enumerate" style="--ltx-enum-leftmargin:1.4em;">
<span id="A3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A3.I1.i1.p1" class="ltx_para">
<span id="A3.I1.i1.p1.1" class="ltx_p"><span id="A3.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">EXE — no action, or errors it never recovered from.</span><span id="A3.I1.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> One or two tool calls, no file written; it read a format name (</span><span id="A3.I1.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">xlsx</span><span id="A3.I1.i1.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, </span><span id="A3.I1.i1.p1.1.5" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">pdf</span><span id="A3.I1.i1.p1.1.6" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">) as if it were a callable tool, or hit an error and stopped.
</span><em id="A3.I1.i1.p1.1.7" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Prescription:</em><span id="A3.I1.i1.p1.1.8" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> near the top, say which names are callable and which are documents, add an environment preflight, and give a fallback for the first likely failure. Give commands the agent can run verbatim.</span></span>
</span></span>
<span id="A3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A3.I1.i2.p1" class="ltx_para">
<span id="A3.I1.i2.p1.1" class="ltx_p"><span id="A3.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">CTX — the skill displaced the task.</span><span id="A3.I1.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> It succeeded </span><em id="A3.I1.i2.p1.1.3" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">without</em><span id="A3.I1.i2.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> the skill and failed </span><em id="A3.I1.i2.p1.1.5" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">with</em><span id="A3.I1.i2.p1.1.6" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> it: work went into the skill’s own examples, files it was only asked to patch, or an artefact outside the required path.
</span><em id="A3.I1.i2.p1.1.7" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Prescription:</em><span id="A3.I1.i2.p1.1.8" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> state the user’s task, the allowed modification scope, and the delivery path early, and say in one line that the rest of the document is reference material rather than a new request. If a step needs content from an auxiliary file, inline that content.</span></span>
</span></span>
<span id="A3.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A3.I1.i3.p1" class="ltx_para">
<span id="A3.I1.i3.p1.1" class="ltx_p"><span id="A3.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">IF — requirements not met.</span><span id="A3.I1.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Files written, plenty of tool calls, and the failed check is a requirement the text already states. It did part of a multi-part requirement and stopped.
</span><em id="A3.I1.i3.p1.1.3" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Prescription:</em><span id="A3.I1.i3.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> rewrite each implicated requirement as one line of </span><span id="A3.I1.i3.p1.1.5" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">action — target — completion condition</span><span id="A3.I1.i3.p1.1.6" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, including the negative branch (“if X already exists, stop and change nothing”). Writing more </span><em id="A3.I1.i3.p1.1.7" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">about</em><span id="A3.I1.i3.p1.1.8" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> the requirement does not help; the text was already there.</span></span>
</span></span>
<span id="A3.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A3.I1.i4.p1" class="ltx_para">
<span id="A3.I1.i4.p1.1" class="ltx_p"><span id="A3.I1.i4.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">REF — artefact delivered but incorrect.</span><span id="A3.I1.i4.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> Artefacts complete, requirement covered — and a number, a matrix or a balance that the verifier recomputes differently. It reported a value it never checked.
</span><em id="A3.I1.i4.p1.1.3" class="ltx_emph ltx_font_italic" style="font-size:90%;--ltx-fg-color:#000000;">Prescription:</em><span id="A3.I1.i4.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> add an ending verification step: re-read the artefact from disk, recompute the reported quantity by a second route, compare against an explicit threshold, and loop until it holds. “I wrote the file” and “the run printed no error” are not evidence.</span></span>
</span></span>
</span>
<span id="A3.p2.pic1.2.6" class="ltx_p"><span id="A3.p2.pic1.2.6.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Rules<span id="A3.p2.pic1.2.6.1.1" class="ltx_text"></span></span></span>
<span id="A3.I2" class="ltx_itemize" style="--ltx-enum-leftmargin:1.4em;">
<span id="A3.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I2.i1.p1" class="ltx_para">
<span id="A3.I2.i1.p1.1" class="ltx_p"><span id="A3.I2.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Edit what the evidence implicates; there is no required document shape, and restructuring the whole file is never required by this guide.</span></span>
</span></span>
<span id="A3.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I2.i2.p1" class="ltx_para">
<span id="A3.I2.i2.p1.1" class="ltx_p"><span id="A3.I2.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Keep documented capability the task might need; cut only what the agent cannot act on.</span></span>
</span></span>
<span id="A3.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I2.i3.p1" class="ltx_para">
<span id="A3.I2.i3.p1.1" class="ltx_p"><span id="A3.I2.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Only mention functions, flags and file paths present in the supplied task, skill files, trajectory, verifier output, or executor interface. Do not invent names.</span></span>
</span></span>
<span id="A3.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I2.i4.p1" class="ltx_para">
<span id="A3.I2.i4.p1.1" class="ltx_p"><span id="A3.I2.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Do not paste expected outputs, expected numbers, or a solution. A skill that works only because it contains the answer is rejected.</span></span>
</span></span>
<span id="A3.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I2.i5.p1" class="ltx_para">
<span id="A3.I2.i5.p1.1" class="ltx_p"><span id="A3.I2.i5.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">If the evidence does not support a grounded improvement, return NO_CHANGE.</span></span>
</span></span>
</span>
<span id="A3.p2.pic1.2.7" class="ltx_p"><span id="A3.p2.pic1.2.7.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Follow the output contract in the user message: the complete rewritten file for every file you change, or a single NO_CHANGE block.</span></span>
</span></span></span></foreignobject></g></g></svg>