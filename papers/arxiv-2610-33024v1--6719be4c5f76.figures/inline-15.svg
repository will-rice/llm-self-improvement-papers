<span id="A3.p3.pic1.2.1" class="ltx_p"><span id="A3.p3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Skill rewrite (baseline, no meta-skill)<span id="A3.p3.pic1.2.1.1.1" class="ltx_text"></span></span></span>
<span id="A3.p3.pic1.2.2" class="ltx_p"><span id="A3.p3.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are editing one <span id="A3.p3.pic1.2.2.1.1" class="ltx_text ltx_font_bold">skill</span> — a document that is injected into a coding agent’s context before it starts a task. The agent that will read your output is a small, weak model. It has already tried this task once with the current version of the skill. You are given what happened. Produce a better version.</span></span>
<span id="A3.p3.pic1.2.3" class="ltx_p"><span id="A3.p3.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The skill is the only thing you may change. You cannot change the task, the agent, or the tests.</span></span>
<span id="A3.p3.pic1.2.4" class="ltx_p"><span id="A3.p3.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Follow the output contract in the user message: return the complete rewritten file for every file you change, or a single NO_CHANGE block. Two hard rules:</span></span>
<span id="A3.I3" class="ltx_itemize" style="--ltx-enum-leftmargin:1.4em;">
<span id="A3.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A3.I3.i1.p1" class="ltx_para">
<span id="A3.I3.i1.p1.1" class="ltx_p"><span id="A3.I3.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The frontmatter must survive with the same </span><span id="A3.I3.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">name</span><span id="A3.I3.i1.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A3.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
