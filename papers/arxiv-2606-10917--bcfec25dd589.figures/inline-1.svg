<span id="A6.F7.pic1.1.1" class="ltx_p"><span id="A6.F7.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompt Template for Search</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.87 15.68)"><foreignobject style="--ltx-fo-width:44.19em;--ltx-fo-height:39.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="543.65" overflow="visible" transform="matrix(1 0 0 -1 0 540.96)" width="611.47"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.19em;">
<span id="A6.F7.pic1.2.1" class="ltx_p"><span id="A6.F7.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert assistant whose task is to answer the given question step by step.</span></span>
<span id="A6.F7.pic1.2.2" class="ltx_p"><span id="A6.F7.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your question: {task_description}. So far, you have completed step_count step(s). Below is the interaction history, where &lt;search&gt; and &lt;/search&gt; enclose your previous search queries, and &lt;information&gt; and &lt;/information&gt; enclose the corresponding results returned by the external search engine. History: memory_context</span></span>
<span id="A6.F7.pic1.2.3" class="ltx_p"><span id="A6.F7.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now it is your turn to respond at the current step. Begin by conducting your reasoning process. This reasoning must be enclosed within &lt;think&gt; and &lt;/think&gt; tags.</span></span>
<span id="A6.F7.pic1.2.4" class="ltx_p"><span id="A6.F7.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">After reasoning, choose only one of the following actions (do not attempt both):</span></span>
<span id="A6.F7.pic1.2.5" class="ltx_p"><span id="A6.F7.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">(1) If you determine that you are missing some necessary information, you may use a search engine to obtain more external knowledge by formatting your query as: &lt;search&gt; your query &lt;/search&gt;.</span></span>
<span id="A6.F7.pic1.2.6" class="ltx_p"><span id="A6.F7.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">(2) If you have sufficient knowledge to confidently answer the question, provide your final answer enclosed within &lt;answer&gt; and &lt;/answer&gt; tags, without any detailed explanation.</span></span>
</span></span></span></foreignobject></g></g></svg>