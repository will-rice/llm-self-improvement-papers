<span id="A6.F8.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.19em;">
<span id="A6.F8.pic1.1.1" class="ltx_p"><span id="A6.F8.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompt Template for Abstracting Failure Modes from Failed Trajectories</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.87 16.45)"><foreignobject style="--ltx-fo-width:44.19em;--ltx-fo-height:28.29em;--ltx-fo-depth:0.25em;font-size:10pt;" height="394.97" overflow="visible" transform="matrix(1 0 0 -1 0 391.51)" width="611.47"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.19em;">
<span id="A6.F8.pic1.2.1" class="ltx_p"><span id="A6.F8.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert AI trainer specializing in diagnosing why AI agents fail at multi-step reasoning tasks.</span></span>
<span id="A6.F8.pic1.2.2" class="ltx_p"><span id="A6.F8.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Task Context</span></span>
<span id="A6.F8.pic1.2.3" class="ltx_p"><span id="A6.F8.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">{task_description}</span></span>
<span id="A6.F8.pic1.2.4" class="ltx_p"><span id="A6.F8.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Failed Trajectory</span></span>
<span id="A6.F8.pic1.2.5" class="ltx_p"><span id="A6.F8.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">The agent attempted the task above but failed. Here are the steps it took:</span></span>
<span id="A6.F8.pic1.2.6" class="ltx_p"><span id="A6.F8.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">{trajectory_description}</span></span>
<span id="A6.F8.pic1.2.7" class="ltx_p"><span id="A6.F8.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Your Analysis Task
Carefully examine the trajectory and produce a structured failure analysis.</span></span>
<span id="A6.F8.pic1.2.8" class="ltx_p"><span id="A6.F8.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">**Step 1 – Root Cause Identification**</span></span>
<span id="A6.F8.pic1.2.9" class="ltx_p"><span id="A6.F8.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify the PRIMARY failure modes and describe briefly:</span></span>
<span id="A6.F8.pic1.2.10" class="ltx_p"><span id="A6.F8.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">**Step 2 – Critical Step Identification**</span></span>
<span id="A6.F8.pic1.2.11" class="ltx_p"><span id="A6.F8.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify the SINGLE step where the failure became irreversible (the &quot;point of no return&quot;).</span></span>
<span id="A6.F8.pic1.2.12" class="ltx_p"><span id="A6.F8.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">**Step 3 – Core Lesson**</span></span>
<span id="A6.F8.pic1.2.13" class="ltx_p"><span id="A6.F8.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">State a concise, generalizable lesson (1-2 sentences) that would help an agent avoid this class of mistake on SIMILAR tasks in the future. Focus on the decision rule, not the specific content.</span></span>
<span id="A6.F8.pic1.2.14" class="ltx_p"><span id="A6.F8.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Output Format</span></span>
<span id="A6.F8.pic1.2.15" class="ltx_p"><span id="A6.F8.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">Wrap your entire analysis in &lt;reflection&gt; tags using this exact structure:</span></span>
<span id="A6.F8.pic1.2.16" class="ltx_p"><span id="A6.F8.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;reflection&gt;</span></span>
<span id="A6.F8.pic1.2.17" class="ltx_p"><span id="A6.F8.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">DOMINANT_TYPE: [category from Step 1]</span></span>
<span id="A6.F8.pic1.2.18" class="ltx_p"><span id="A6.F8.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">DETAIL: [1-2 sentences explaining why this root cause applies]</span></span>
<span id="A6.F8.pic1.2.19" class="ltx_p"><span id="A6.F8.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">CRITICAL_STEP: [step number and brief description of what went wrong]</span></span>
<span id="A6.F8.pic1.2.20" class="ltx_p"><span id="A6.F8.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">CORE_LESSON: [the generalizable rule an agent should follow]</span></span>
<span id="A6.F8.pic1.2.21" class="ltx_p"><span id="A6.F8.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">RETRIEVAL_QUERY: [the query for the retrieval stage]</span></span>
<span id="A6.F8.pic1.2.22" class="ltx_p"><span id="A6.F8.pic1.2.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/reflection&gt;</span></span>
</span></span></span></foreignobject></g></g></svg>