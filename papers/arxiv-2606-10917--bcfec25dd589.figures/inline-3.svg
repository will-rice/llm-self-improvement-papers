<span id="A6.F9.pic1.1.1" class="ltx_p"><span id="A6.F9.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Prompt Template for Retrieving Tasks with Similar Failure Modes</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.87 16.45)"><foreignobject style="--ltx-fo-width:44.19em;--ltx-fo-height:27.09em;--ltx-fo-depth:0.25em;font-size:10pt;" height="378.37" overflow="visible" transform="matrix(1 0 0 -1 0 374.91)" width="611.47"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F9.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.19em;">
<span id="A6.F9.pic1.2.1" class="ltx_p"><span id="A6.F9.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert AI curriculum designer. Your job is to identify which historical training tasks are most relevant for helping an agent overcome a specific failure pattern.</span></span>
<span id="A6.F9.pic1.2.2" class="ltx_p"><span id="A6.F9.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Current Failure Pattern</span></span>
<span id="A6.F9.pic1.2.3" class="ltx_p"><span id="A6.F9.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">The agent is currently struggling with the following error pattern:</span></span>
<span id="A6.F9.pic1.2.4" class="ltx_p"><span id="A6.F9.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">error_pattern</span></span>
<span id="A6.F9.pic1.2.5" class="ltx_p"><span id="A6.F9.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Historical Task Candidates</span></span>
<span id="A6.F9.pic1.2.6" class="ltx_p"><span id="A6.F9.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Below are historical tasks where the agent previously failed. Each entry shows the task description and a brief failure analysis.</span></span>
<span id="A6.F9.pic1.2.7" class="ltx_p"><span id="A6.F9.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">candidates_text</span></span>
<span id="A6.F9.pic1.2.8" class="ltx_p"><span id="A6.F9.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Your Task</span></span>
<span id="A6.F9.pic1.2.9" class="ltx_p"><span id="A6.F9.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Select tasks from the list above that are MOST SIMILAR to the current failure pattern.</span></span>
<span id="A6.F9.pic1.2.10" class="ltx_p"><span id="A6.F9.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Similarity means:</span></span>
<span id="A6.F9.pic1.2.11" class="ltx_p"><span id="A6.F9.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. The task requires the same type of reasoning or skill that the agent is currently failing at.</span></span>
<span id="A6.F9.pic1.2.12" class="ltx_p"><span id="A6.F9.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. The task’s failure analysis describes a similar root cause or mistake.</span></span>
<span id="A6.F9.pic1.2.13" class="ltx_p"><span id="A6.F9.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. Re-training on this task would most directly help the agent overcome the current pattern.</span></span>
<span id="A6.F9.pic1.2.14" class="ltx_p"><span id="A6.F9.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Output Format</span></span>
<span id="A6.F9.pic1.2.15" class="ltx_p"><span id="A6.F9.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">Output ONLY the following structured block, with no additional text:</span></span>
<span id="A6.F9.pic1.2.16" class="ltx_p"><span id="A6.F9.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;selected_tasks&gt;</span></span>
<span id="A6.F9.pic1.2.17" class="ltx_p"><span id="A6.F9.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">INDEX/TASK/REFLECTIONS: &lt;index, task and reflections from the candidate list&gt;</span></span>
<span id="A6.F9.pic1.2.18" class="ltx_p"><span id="A6.F9.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">REASON: &lt;one sentence explaining why this task matches the current failure pattern&gt;</span></span>
<span id="A6.F9.pic1.2.19" class="ltx_p"><span id="A6.F9.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">INDEX/TASK/REFLECTIONS: &lt;index, task and reflections from the candidate list&gt;</span></span>
<span id="A6.F9.pic1.2.20" class="ltx_p"><span id="A6.F9.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">REASON: &lt;one sentence explaining why this task matches the current failure pattern&gt;</span></span>
<span id="A6.F9.pic1.2.21" class="ltx_p"><span id="A6.F9.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;/selected_tasks&gt;</span></span>
</span></span></span></foreignobject></g></g></svg>