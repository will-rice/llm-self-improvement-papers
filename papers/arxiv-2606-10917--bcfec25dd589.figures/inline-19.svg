<span id="A6.pic1.2.2" class="ltx_p"><span id="A6.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">DETAIL: &quot;The agent picked up the soapbar and immediately attempted to place it at the target location without first checking whether the object satisfied the task precondition (clean). The task description explicitly states ‘clean soapbar’, but the agent ignored this constraint until the placement failed.&quot;</span></span>
<span id="A6.pic1.2.3" class="ltx_p"><span id="A6.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;CRITICAL_STEP&quot;: &quot;Step 3, agent navigated to the target location with a dirty soapbar instead of cleaning it first at the sinkbasin.&quot;</span></span>
<span id="A6.pic1.2.4" class="ltx_p"><span id="A6.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;CORE_LESSON&quot;: &quot;Before transporting an object to its target location, always verify that the object satisfies all task preconditions (e.g., clean, heated, cooled). If the task specifies an object state, perform the required state-change action first.&quot;</span></span>
<span id="A6.pic1.2.5" class="ltx_p"><span id="A6.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">&quot;RETRIEVAL_QUERY&quot;: &quot;precondition check, object state, clean before place, task constraint, soapbar, sinkbasin&quot;</span></span>
