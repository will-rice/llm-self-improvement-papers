<span id="p1.pic1.p2" class="ltx_para">
<span id="p1.pic1.p2.1" class="ltx_p ltx_align_left"><span id="p1.pic1.p2.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:207%;--ltx-fg-color:#000000;">A Predictive Law for On-Policy Self-Distillation From World Feedback</span></span>
<span id="p1.pic1.p2.2" class="ltx_p"><span id="p1.pic1.p2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Tommy He   Jerome Sieber<sup id="p1.pic1.p2.2.1.1" class="ltx_sup">*</sup>   Matteo Saponati<sup id="p1.pic1.p2.2.1.2" class="ltx_sup">*</sup></span></span>
<span id="p1.pic1.p2.3" class="ltx_p"><span id="p1.pic1.p2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Tufa Labs, Zürich, Switzerland</span></span>
<span id="p1.pic1.p2.4" class="ltx_p"><span id="p1.pic1.p2.4.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:120%;--ltx-fg-color:#000000;">Abstract</span></span>
<span id="p1.pic1.p2.5" class="ltx_p"><span id="p1.pic1.p2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Moving beyond simple scalar rewards toward richer world feedback is a natural path to more scalable RL post-training. On-policy self-distillation (OPSD) is a promising recent approach that uses arbitrary feedback as learning signal, yet its reliability compared to established methods, such as GRPO, remains unclear. We identify a strikingly consistent linear correlation between the initial student–self-teacher performance gap and the final performance improvement in OPSD. This relationship holds across context types and model families, providing a powerful predictive law for anticipating the outcome of an OPSD configuration without running the full training procedure. Interestingly, we show that this linear predictability holds with model scale, suggesting a potential basis for new empirical scaling laws on larger models with stronger in-context learning capabilities. In essence, our findings show that OPSD performance can be predicted and tuned before training, offering a principled way to incorporate world feedback as a first-class component of the post-training pipeline.</span></span>
<span id="p1.pic1.p2.6" class="ltx_p"><span id="p1.pic1.p2.6.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">contact:</span><span id="p1.pic1.p2.6.2" class="ltx_text" style="--ltx-fg-color:#000000;"> <a href="mailto:tommy@tufalabs.ai" title class="ltx_ref ltx_href"><span class="ltx_ref ltx_nolink">tommy@tufalabs.ai</span></a></span></span>
