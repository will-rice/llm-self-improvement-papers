<span id="S3.SS4.SSS2.p3.pic1.1.1" class="ltx_p"><span id="S3.SS4.SSS2.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Takeaway</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 14.94 216.89)"><foreignobject style="--ltx-fo-width:51.02em;--ltx-fo-height:1.69em;--ltx-fo-depth:14.79em;font-size:10pt;" height="228.16" overflow="visible" transform="matrix(1 0 0 -1 0 23.45)" width="705.97"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS4.SSS2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:51.02em;">
<span id="S3.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="S3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S3.I1.i1.p1.1" class="ltx_p"><span id="S3.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Risks.</span><span id="S3.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Biased experience, shared errors, and mismatched evaluation can inflate scores; ineffective updates and regressions can prevent genuine gains from persisting.</span></span>
</span></span>
<span id="S3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="S3.I1.i2.p1.1" class="ltx_p"><span id="S3.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Safeguards.</span><span id="S3.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Independent verification, comparisons using the same total resources, and tests of retained capabilities assess whether gains are genuine, attributable to specific changes, and sustained. The conclusions depend on the accuracy and coverage of these checks.</span></span>
</span></span>
<span id="S3.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S3.I1.i3.p1" class="ltx_para">
<span id="S3.I1.i3.p1.1" class="ltx_p"><span id="S3.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Future work.</span><span id="S3.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Track whether capabilities persist and transfer to new tasks across later system versions. Compare revised and unchanged improvement procedures under matched conditions to determine whether revisions produce better future updates.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>