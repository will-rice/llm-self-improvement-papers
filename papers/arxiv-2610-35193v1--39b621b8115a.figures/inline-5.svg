<svg id="S2.SS1.SSS1.p7.pic1" class="ltx_picture" height="285.95" overflow="visible" version="1.1" viewbox="0 0 735.83 285.95" width="735.83"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,285.95) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#9DB9DF;" fill="#9DB9DF" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.46 L 0 282.49 C 0 284.41 1.55 285.95 3.46 285.95 L 732.37 285.95 C 734.28 285.95 735.83 284.41 735.83 282.49 L 735.83 3.46 C 735.83 1.55 734.28 0 732.37 0 L 3.46 0 C 1.55 0 0 1.55 0 3.46 Z" /></g><g style="--ltx-fill-color:#F1F6FC;" fill="#F1F6FC" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 3.46 L 0.69 254.56 L 735.14 254.56 L 735.14 3.46 C 735.14 1.93 733.9 0.69 732.37 0.69 L 3.46 0.69 C 1.93 0.69 0.69 1.93 0.69 3.46 Z" /></g><g style="--ltx-fill-color:#4E80C4;" fill="#4E80C4" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 255.25 L 0.69 282.49 C 0.69 284.02 1.93 285.26 3.46 285.26 L 732.37 285.26 C 733.9 285.26 735.14 284.02 735.14 282.49 L 735.14 255.25 Z" /></g><g style="--ltx-stroke-color:#235AA0;--ltx-fill-color:#235AA0;--ltx-fg-color:#235AA0;" color="#235AA0" fill="#235AA0" stroke="#235AA0" stroke-width="2.5pt"><path style="fill:none" d="M 1.73 285.95 L 1.73 0" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.7 266.8)"><foreignobject style="--ltx-fo-width:44.27em;--ltx-fo-height:0.75em;--ltx-fo-depth:0.25em;font-size:10pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="612.57"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S2.SS1.SSS1.p7.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.27em;">
<span id="S2.SS1.SSS1.p7.pic1.1.1" class="ltx_p"><span id="S2.SS1.SSS1.p7.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Definition (Recursive Self-Improvement, RSI)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.7 15.62)"><foreignobject style="--ltx-fo-width:50.91em;--ltx-fo-height:16.38em;--ltx-fo-depth:0.19em;font-size:10pt;" height="229.39" overflow="visible" transform="matrix(1 0 0 -1 0 226.7)" width="704.45"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S2.SS1.SSS1.p7.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:50.91em;">
<span id="S2.SS1.SSS1.p7.pic1.p2" class="ltx_para">
<span id="S2.SS1.SSS1.p7.pic1.p2.1" class="ltx_p"><span id="S2.SS1.SSS1.p7.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">RSI is a process in which a learning system updates its policy from new
experience, autonomously revises its inductive bias, and revises and reuses
the mechanism for future bias updates, with the aim of sustained gains in
task performance.</span></span>
</span>
<span id="S2.SS1.SSS1.p7.pic1.p1" class="ltx_para ltx_noindent">
<span id="S2.SS1.SSS1.p7.pic1.p1.1" class="ltx_p"><span id="S2.SS1.SSS1.p7.pic1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Formally, let </span><math id="S2.SS1.SSS1.p7.pic1.p1.m1" class="ltx_Math" alttext="t" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math><span id="S2.SS1.SSS1.p7.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> index completed improvement cycles, including
cycles in which no revision is accepted.
The states </span><math id="S2.SS1.SSS1.p7.pic1.p1.m2" class="ltx_Math" alttext="h_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">h</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">h_{t}</annotation></semantics></math><span id="S2.SS1.SSS1.p7.pic1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><math id="S2.SS1.SSS1.p7.pic1.p1.m3" class="ltx_Math" alttext="B_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">B_{t}</annotation></semantics></math><span id="S2.SS1.SSS1.p7.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">, and </span><math id="S2.SS1.SSS1.p7.pic1.p1.m4" class="ltx_Math" alttext="\mathcal{U}_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒰</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">\mathcal{U}_{t}</annotation></semantics></math><span id="S2.SS1.SSS1.p7.pic1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> are the components
retained at the end of cycle </span><math id="S2.SS1.SSS1.p7.pic1.p1.m5" class="ltx_Math" alttext="t" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><annotation encoding="application/x-tex">t</annotation></semantics></math><span id="S2.SS1.SSS1.p7.pic1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">.
RSI can be expressed as follows:</span></span>
<span id="S2.EGx1" class="ltx_equationgroup ltx_eqn_align ltx_eqn_table">

<span id="S2.E2"><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_td ltx_align_right ltx_eqn_cell"><math id="S2.E2.m1" class="ltx_Math" alttext="\displaystyle h_{t+1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">h</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><annotation encoding="application/x-tex">\displaystyle h_{t+1}</annotation></semantics></math></span>
<span class="ltx_td ltx_align_left ltx_eqn_cell"><math id="S2.E2.m2" class="ltx_Math" alttext="\displaystyle=\mathcal{A}_{B_{t}}(h_{t},E_{t+1})," display="inline" intent=":literal"><semantics><mrow><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒜</mi><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">h</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">E</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo></mrow><annotation encoding="application/x-tex">\displaystyle=\mathcal{A}_{B_{t}}(h_{t},E_{t+1}),</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(2)</span></span></span></span>
<span id="S2.E3"><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_td ltx_align_right ltx_eqn_cell"><math id="S2.E3.m1" class="ltx_Math" alttext="\displaystyle(B_{t+1},\mathcal{U}_{t+1})" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒰</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\displaystyle(B_{t+1},\mathcal{U}_{t+1})</annotation></semantics></math></span>
<span class="ltx_td ltx_align_left ltx_eqn_cell"><math id="S2.E3.m2" class="ltx_Math" alttext="\displaystyle=\mathcal{U}_{t}(B_{t},h_{t+1},F_{t+1})," display="inline" intent=":literal"><semantics><mrow><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒰</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">h</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">F</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo></mrow><annotation encoding="application/x-tex">\displaystyle=\mathcal{U}_{t}(B_{t},h_{t+1},F_{t+1}),</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(3)</span></span></span></span>
</span>
<span id="S2.SS1.SSS1.p7.pic1.p1.2" class="ltx_p"><span id="S2.SS1.SSS1.p7.pic1.p1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">In Eq. (</span><a href="#S2.E2" title="Equation 2 ‣ 2.1.1 Definition of Recursive Self-Improvement ‣ 2.1 Recursive Self-Improvement: Definition and Process ‣ 2 Preliminaries ‣ Trustworthy Recursive Self-Improvement in the Era of Large Models: Foundation, Risks, Evaluation and Open Challenges" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">2</span></a><span id="S2.SS1.SSS1.p7.pic1.p1.2.2" class="ltx_text" style="--ltx-fg-color:#000000;">), </span><math id="S2.SS1.SSS1.p7.pic1.p1.m6" class="ltx_Math" alttext="E_{t+1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">E</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><annotation encoding="application/x-tex">E_{t+1}</annotation></semantics></math><span id="S2.SS1.SSS1.p7.pic1.p1.2.3" class="ltx_text" style="--ltx-fg-color:#000000;"> is new experience
and </span><math id="S2.SS1.SSS1.p7.pic1.p1.m7" class="ltx_Math" alttext="\mathcal{A}_{B_{t}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒜</mi><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub></msub><annotation encoding="application/x-tex">\mathcal{A}_{B_{t}}</annotation></semantics></math><span id="S2.SS1.SSS1.p7.pic1.p1.2.4" class="ltx_text" style="--ltx-fg-color:#000000;"> is the learning process under the current
inductive bias </span><math id="S2.SS1.SSS1.p7.pic1.p1.m8" class="ltx_Math" alttext="B_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">B_{t}</annotation></semantics></math><span id="S2.SS1.SSS1.p7.pic1.p1.2.5" class="ltx_text" style="--ltx-fg-color:#000000;">.
In Eq. (</span><a href="#S2.E3" title="Equation 3 ‣ 2.1.1 Definition of Recursive Self-Improvement ‣ 2.1 Recursive Self-Improvement: Definition and Process ‣ 2 Preliminaries ‣ Trustworthy Recursive Self-Improvement in the Era of Large Models: Foundation, Risks, Evaluation and Open Challenges" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">3</span></a><span id="S2.SS1.SSS1.p7.pic1.p1.2.6" class="ltx_text" style="--ltx-fg-color:#000000;">), </span><math id="S2.SS1.SSS1.p7.pic1.p1.m9" class="ltx_Math" alttext="F_{t+1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">F</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><annotation encoding="application/x-tex">F_{t+1}</annotation></semantics></math><span id="S2.SS1.SSS1.p7.pic1.p1.2.7" class="ltx_text" style="--ltx-fg-color:#000000;"> is feedback
on performance and prior improvement attempts, and </span><math id="S2.SS1.SSS1.p7.pic1.p1.m10" class="ltx_Math" alttext="\mathcal{U}_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒰</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">\mathcal{U}_{t}</annotation></semantics></math><span id="S2.SS1.SSS1.p7.pic1.p1.2.8" class="ltx_text" style="--ltx-fg-color:#000000;">
is the bias update function.
The resulting </span><math id="S2.SS1.SSS1.p7.pic1.p1.m11" class="ltx_Math" alttext="B_{t+1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><annotation encoding="application/x-tex">B_{t+1}</annotation></semantics></math><span id="S2.SS1.SSS1.p7.pic1.p1.2.9" class="ltx_text" style="--ltx-fg-color:#000000;"> and </span><math id="S2.SS1.SSS1.p7.pic1.p1.m12" class="ltx_Math" alttext="\mathcal{U}_{t+1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒰</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><annotation encoding="application/x-tex">\mathcal{U}_{t+1}</annotation></semantics></math><span id="S2.SS1.SSS1.p7.pic1.p1.2.10" class="ltx_text" style="--ltx-fg-color:#000000;"> are retained for
subsequent cycles.</span></span>
</span>
<span id="S2.SS1.SSS1.p7.pic1.p3" class="ltx_para">
<span id="S2.SS1.SSS1.p7.pic1.p3.1" class="ltx_p"><span id="S2.SS1.SSS1.p7.pic1.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">These equations summarize complete improvement cycles.
The operators include diagnosis, proposal generation, evaluation,
and implementation, whose stages are shown as S1–S4 in
Figure <a href="#S2.F3" title="Figure 3 ‣ 2.1.2 The RSI Process in the Era of Large Models ‣ 2.1 Recursive Self-Improvement: Definition and Process ‣ 2 Preliminaries ‣ Trustworthy Recursive Self-Improvement in the Era of Large Models: Foundation, Risks, Evaluation and Open Challenges" class="ltx_ref"><span class="ltx_text ltx_ref_tag">3</span></a>.
Their outputs denote the states retained after S4.
Each component without an accepted revision retains its previous
value.
The policy update uses <math id="S2.SS1.SSS1.p7.pic1.m1" class="ltx_Math" alttext="B_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">B_{t}</annotation></semantics></math>; accepted changes to <math id="S2.SS1.SSS1.p7.pic1.m2" class="ltx_Math" alttext="B_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">B</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">B_{t}</annotation></semantics></math> and
<math id="S2.SS1.SSS1.p7.pic1.m3" class="ltx_Math" alttext="\mathcal{U}_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒰</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">\mathcal{U}_{t}</annotation></semantics></math> govern later improvement cycles.</span></span>
</span></span></span></span></foreignobject></g></g></svg>