</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 14.94 197.59)"><foreignobject style="--ltx-fo-width:51.02em;--ltx-fo-height:1.69em;--ltx-fo-depth:13.4em;font-size:10pt;" height="208.86" overflow="visible" transform="matrix(1 0 0 -1 0 23.45)" width="705.97"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S4.SS4.SSS2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:51.02em;">
<span id="S4.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="S4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S4.I1.i1.p1.1" class="ltx_p"><span id="S4.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Risks.</span><span id="S4.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Updates can weaken behavioral constraints, redirect optimization away from authorized goals, or harm particular groups. Evidence remains limited for systems that revise and then reuse their own improvement procedures.</span></span>
</span></span>
<span id="S4.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="S4.I1.i2.p1.1" class="ltx_p"><span id="S4.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Safeguards.</span><span id="S4.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Independent behavioral tests, evaluation at the group level, and checks across system versions address distinct risks. The value of these measures depends on adequate coverage and valid evaluation criteria.</span></span>
</span></span>
<span id="S4.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I1.i3.p1" class="ltx_para">
<span id="S4.I1.i3.p1.1" class="ltx_p"><span id="S4.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Future work.</span><span id="S4.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Assess whether behavioral constraints, alignment with authorized goals, and fairness persist across later system versions, including after the improvement procedure is revised and reused. Use matched resources and independent evaluations.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>