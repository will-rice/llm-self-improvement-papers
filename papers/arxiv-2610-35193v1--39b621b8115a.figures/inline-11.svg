</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 14.94 214.2)"><foreignobject style="--ltx-fo-width:51.02em;--ltx-fo-height:1.69em;--ltx-fo-depth:14.6em;font-size:10pt;" height="225.47" overflow="visible" transform="matrix(1 0 0 -1 0 23.45)" width="705.97"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S7.SS3.SSS0.Px4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:51.02em;">
<span id="S7.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="S7.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S7.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S7.I1.i1.p1.1" class="ltx_p"><span id="S7.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Risks.</span><span id="S7.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Endpoint-only gains can conceal measurement noise, loss of previously acquired capabilities, unsafe behavior inherited by later versions, and overfitting to evaluation feedback.</span></span>
</span></span>
<span id="S7.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S7.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="S7.I1.i2.p1.1" class="ltx_p"><span id="S7.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Safeguards.</span><span id="S7.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Use unchanged control systems, separate improvement feedback from independent reporting, evaluate updates after reuse, and compare successors under matched resource budgets. These measures help relate reported gains to specific changes.</span></span>
</span></span>
<span id="S7.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S7.I1.i3.p1" class="ltx_para">
<span id="S7.I1.i3.p1.1" class="ltx_p"><span id="S7.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Future work.</span><span id="S7.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Compare improvement procedures reused by later system versions under matched conditions. Test whether behavioral and safety constraints remain satisfied and authorized interventions remain effective across successive versions.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>