</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 14.94 183.68)"><foreignobject style="--ltx-fo-width:51.02em;--ltx-fo-height:1.69em;--ltx-fo-depth:12.39em;font-size:10pt;" height="194.95" overflow="visible" transform="matrix(1 0 0 -1 0 23.45)" width="705.97"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S6.SS4.SSS2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:51.02em;">
<span id="S6.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="S6.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S6.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S6.I1.i1.p1.1" class="ltx_p"><span id="S6.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Risks.</span><span id="S6.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Misleading diagnoses, unfaithful explanations, and dependent review evidence can undermine oversight.
Ineffective interventions may allow failures to persist across successors and recursive updates.</span></span>
</span></span>
<span id="S6.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S6.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="S6.I1.i2.p1.1" class="ltx_p"><span id="S6.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Safeguards.</span><span id="S6.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Matched replay, faithfulness tests, and provenance tracking support reliable diagnosis and traceability.
Independent review and enforceable controls help ensure effective oversight and correction.</span></span>
</span></span>
<span id="S6.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S6.I1.i3.p1" class="ltx_para">
<span id="S6.I1.i3.p1.1" class="ltx_p"><span id="S6.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Future work.</span><span id="S6.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Assess explanation validity, monitoring effectiveness, correction reach, and attribution across successors.
Use matched comparisons to test whether oversight remains effective after improvement-mechanism revisions.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>