<span id="S2.SS1.SSS1.p2.pic1.1.1" class="ltx_p"><span id="S2.SS1.SSS1.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Definition (Machine Learning)
<cite class="ltx_cite ltx_citemacro_citep">(<a href="#bib.bib2" title class="ltx_ref">Mitchell, 1997</a>)</cite></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.7 15.62)"><foreignobject style="--ltx-fo-width:50.91em;--ltx-fo-height:1.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="28.9" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="704.45"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S2.SS1.SSS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:50.91em;">
<span id="S2.SS1.SSS1.p2.pic1.2.1" class="ltx_p"><span id="S2.SS1.SSS1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A computer program is said to learn from experience<span id="footnote1" class="ltx_note ltx_role_footnote"><sup class="ltx_note_mark">1</sup><span class="ltx_note_outer"><span class="ltx_note_content"><sup class="ltx_note_mark">1</sup>
                              <span class="ltx_tag ltx_tag_note"><span id="footnote1.1" class="ltx_text" style="--ltx-fg-color:#000000;">1</span></span>
                              
                              
                              
                              
                              
                              
                              
                            <cite class="ltx_cite ltx_citemacro_cite"><a href="#bib.bib8" title class="ltx_ref">Silver and Sutton (2025)</a></cite>
emphasize that “experience” is generated through an agent’s
interaction with its environment. Here, “experience” refers to a
broader concept that encompasses any data that can contribute to
improving the system’s learning performance.</span></span></span><math id="S2.SS1.SSS1.p2.pic1.m1" class="ltx_Math" alttext="E" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">E</mi><annotation encoding="application/x-tex">E</annotation></semantics></math>
with respect to some class of tasks <math id="S2.SS1.SSS1.p2.pic1.m2" class="ltx_Math" alttext="T" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi><annotation encoding="application/x-tex">T</annotation></semantics></math> and performance measure <math id="S2.SS1.SSS1.p2.pic1.m3" class="ltx_Math" alttext="P" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><annotation encoding="application/x-tex">P</annotation></semantics></math>,
if its performance at tasks in <math id="S2.SS1.SSS1.p2.pic1.m4" class="ltx_Math" alttext="T" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi><annotation encoding="application/x-tex">T</annotation></semantics></math>, as measured by <math id="S2.SS1.SSS1.p2.pic1.m5" class="ltx_Math" alttext="P" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><annotation encoding="application/x-tex">P</annotation></semantics></math>, improves with
experience <math id="S2.SS1.SSS1.p2.pic1.m6" class="ltx_Math" alttext="E" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">E</mi><annotation encoding="application/x-tex">E</annotation></semantics></math>.</span></span>
</span></span></span></foreignobject></g></g></svg>