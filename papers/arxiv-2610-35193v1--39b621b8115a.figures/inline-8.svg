<span id="S5.SS4.SSS2.p3.pic1.1.1" class="ltx_p"><span id="S5.SS4.SSS2.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Takeaway</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 14.94 266.7)"><foreignobject style="--ltx-fo-width:51.02em;--ltx-fo-height:1.69em;--ltx-fo-depth:18.39em;font-size:10pt;" height="277.97" overflow="visible" transform="matrix(1 0 0 -1 0 23.45)" width="705.97"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S5.SS4.SSS2.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:51.02em;">
<span id="S5.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="S5.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="S5.I1.i1.p1.1" class="ltx_p"><span id="S5.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Risks.</span><span id="S5.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Studies demonstrate poisoning of memory, skills, and evidence used to accept updates, as well as inappropriate collection and exposure of information carried into later versions. Persistent contamination alone does not show that the improvement procedure itself has been revised.</span></span>
</span></span>
<span id="S5.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="S5.I1.i2.p1.1" class="ltx_p"><span id="S5.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Safeguards.</span><span id="S5.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Verifying the origin of artifacts, constraining execution, protecting evaluation, controlling data access, and tracking cumulative privacy loss address specific risks. These protections depend on trusted enforcement and clearly specified data access. Their coverage remains limited after artifacts are transformed or combined, or the improvement procedure is revised.</span></span>
</span></span>
<span id="S5.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S5.I1.i3.p1" class="ltx_para">
<span id="S5.I1.i3.p1.1" class="ltx_p"><span id="S5.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Future work.</span><span id="S5.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Compare cleanup of contaminated source artifacts and their derivatives, recovery of normal service, and information deletion across historical versions. Retest protections after a revised improvement procedure is reused, using matched resource budgets. Report harm and information disclosure alongside performance on legitimate tasks and rejection of legitimate inputs or updates.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>