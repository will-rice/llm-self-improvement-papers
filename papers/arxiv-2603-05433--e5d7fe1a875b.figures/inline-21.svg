<span id="A10.F13.pic2.p2.2" class="ltx_p"><span id="A10.F13.pic2.p2.2.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">The polynomial <math id="A10.F13.pic2.m1" class="ltx_Math" alttext="8x^{2}-8x+1" display="inline" intent=":literal"><semantics><mrow><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">8</mn><mo lspace="0em" rspace="0em">​</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">8</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">8x^{2}-8x+1</annotation></semantics></math> (a scaled Chebyshev polynomial) meets the constraint and maximizes <math id="A10.F13.pic2.m2" class="ltx_Math" alttext="|a|+|b|+|c|=8+8+1" display="inline" intent=":literal"><semantics><mrow><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">c</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">8</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">8</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></mrow><annotation encoding="application/x-tex">|a|+|b|+|c|=8+8+1</annotation></semantics></math>.</span></span>
