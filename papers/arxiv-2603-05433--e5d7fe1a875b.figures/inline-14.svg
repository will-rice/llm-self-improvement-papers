<span id="S5.F3.pic6.p2.2" class="ltx_p"><math id="S5.F3.pic6.m1" class="ltx_Math" alttext="8" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.700em">8</mn><annotation encoding="application/x-tex">8</annotation></semantics></math><span id="S5.F3.pic6.p2.2.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;"> R and <math id="S5.F3.pic6.m2" class="ltx_Math" alttext="8" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">8</mn><annotation encoding="application/x-tex">8</annotation></semantics></math> U moves; four direction changes give five runs, partitioned <math id="S5.F3.pic6.m3" class="ltx_Math" alttext="3{+}2" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><annotation encoding="application/x-tex">3{+}2</annotation></semantics></math>. Segment counts: <math id="S5.F3.pic6.m4" class="ltx_Math" alttext="\binom{7}{2}" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><mfrac style="--ltx-fg-color:#000000;" linethickness="0pt" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">7</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow><annotation encoding="application/x-tex">\binom{7}{2}</annotation></semantics></math> and <math id="S5.F3.pic6.m5" class="ltx_Math" alttext="\binom{7}{1}" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><mfrac style="--ltx-fg-color:#000000;" linethickness="0pt" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">7</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow><annotation encoding="application/x-tex">\binom{7}{1}</annotation></semantics></math>, times two starting letters.</span></span>
<span id="S5.F3.pic6.p2.3" class="ltx_p"><span id="S5.F3.pic6.p2.3.1" class="ltx_text ltx_font_typewriter" style="font-size:70%;--ltx-fg-color:#B3B3B3;">&lt;/think&gt;<span id="S5.F3.pic6.p2.3.1.1" class="ltx_text ltx_font_serif" style="--ltx-fg-color:#000000;">
</span></span></span>
