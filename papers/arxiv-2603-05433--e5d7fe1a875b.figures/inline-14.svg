<span id="S5.F3.pic6.p3.1" class="ltx_p"><math id="S5.F3.pic6.m6" class="ltx_Math" alttext="2\times 21\times 7=294" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.700em">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" mathsize="0.700em" rspace="0.222em">×</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.700em">21</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" mathsize="0.700em" rspace="0.222em">×</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.700em">7</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.700em">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.700em">294</mn></mrow><annotation encoding="application/x-tex">2\times 21\times 7=294</annotation></semantics></math><span id="S5.F3.pic6.p3.1.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">.</span></span>
