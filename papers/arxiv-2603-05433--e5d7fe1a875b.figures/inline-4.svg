<svg id="S4.SS3.p2.pic1" class="ltx_picture" height="102.58" overflow="visible" version="1.1" viewbox="0 0 477.38 102.58" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,102.58) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4D4D4D;" fill="#4D4D4D" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.46 L 0 99.12 C 0 101.03 1.55 102.58 3.46 102.58 L 473.92 102.58 C 475.83 102.58 477.38 101.03 477.38 99.12 L 477.38 3.46 C 477.38 1.55 475.83 0 473.92 0 L 3.46 0 C 1.55 0 0 1.55 0 3.46 Z" /></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 3.46 L 0.69 99.12 C 0.69 100.65 1.93 101.89 3.46 101.89 L 473.92 101.89 C 475.45 101.89 476.68 100.65 476.68 99.12 L 476.68 3.46 C 476.68 1.93 475.45 0.69 473.92 0.69 L 3.46 0.69 C 1.93 0.69 0.69 1.93 0.69 3.46 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 15.01)"><foreignobject style="--ltx-fo-width:32.83em;--ltx-fo-height:5.49em;--ltx-fo-depth:0.25em;font-size:10pt;" height="79.49" overflow="visible" transform="matrix(1 0 0 -1 0 76.03)" width="454.27"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S4.SS3.p2.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:32.83em;">
<span id="S4.SS3.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="S4.SS3.p2.pic1.p1.1" class="ltx_p"><span id="S4.SS3.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Theorem</span><span id="S4.SS3.p2.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> [Accuracy preservation; Theorem </span><a href="#Thmtheorem2" title="Theorem 2 (Accuracy preservation). ‣ A.2 Accuracy Preservation under Compression ‣ Appendix A Theoretical Analysis ‣ CRISP: Compressed Reasoning via Iterative Self-Policy Distillation" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">2</span></a><span id="S4.SS3.p2.pic1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">]. 
If training converges to loss </span><math id="S4.SS3.p2.pic1.p1.m1" class="ltx_Math" alttext="\epsilon_{\mathrm{KL}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϵ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">KL</mi></msub><annotation encoding="application/x-tex">\epsilon_{\mathrm{KL}}</annotation></semantics></math><span id="S4.SS3.p2.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> and the concise teacher preserves accuracy to within </span><math id="S4.SS3.p2.pic1.p1.m2" class="ltx_Math" alttext="\epsilon_{T}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϵ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi></msub><annotation encoding="application/x-tex">\epsilon_{T}</annotation></semantics></math><span id="S4.SS3.p2.pic1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> of the base model, the student satisfies:</span></span>
<span id="S4.E6" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="S4.E6.m1" class="ltx_Math" alttext="\mathrm{Acc}(\pi_{\theta^{*}})\geq\mathrm{Acc}(\pi_{\bar{\theta}})-\epsilon_{T}-\sqrt{\epsilon_{\mathrm{KL}}/2}." display="block" intent=":literal"><semantics><mrow><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Acc</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</mo></msup></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Acc</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϵ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϵ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">KL</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow></msqrt></mrow></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">\mathrm{Acc}(\pi_{\theta^{*}})\geq\mathrm{Acc}(\pi_{\bar{\theta}})-\epsilon_{T}-\sqrt{\epsilon_{\mathrm{KL}}/2}.</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
