<span id="S5.SS1.SSS0.Px2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:35.86em;">
<span id="S5.SS1.SSS0.Px2.p2.pic1.2.1" class="ltx_p"><span id="S5.SS1.SSS0.Px2.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">v1 (uniform concise prompt):<span id="S5.SS1.SSS0.Px2.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Solve the following math problem concisely and correctly. Be direct: avoid unnecessary elaboration, redundant steps, or restating the problem. Focus only on the key reasoning steps needed to reach the answer.
<br class="ltx_break" style="--ltx-break-space:4.0pt;">
</span>v2 (difficulty-aware concise prompt):<span id="S5.SS1.SSS0.Px2.p2.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> Solve the following math problem concisely and correctly. Prioritize a correct final answer above brevity. For straightforward problems, be direct: avoid unnecessary elaboration, redundant steps, or restating the problem. For difficult or multi-step problems, do NOT over-compress: keep every reasoning step needed for correctness, including case analysis, edge cases, and a brief check of the final answer. Never omit a step that the answer depends on.</span></span></span>
</span></span></span></foreignobject></g></g></svg>