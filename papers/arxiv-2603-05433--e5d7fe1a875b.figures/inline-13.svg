<svg id="S5.F3.pic5" class="ltx_picture" height="245.58" overflow="visible" version="1.1" viewbox="0 0 477.38 245.58" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,245.58) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#008C00;" fill="#008C00" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 239.67 C 0 242.93 2.64 245.58 5.91 245.58 L 471.47 245.58 C 474.73 245.58 477.38 242.93 477.38 239.67 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#E8F5E9;" fill="#E8F5E9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 174.89 L 475.41 174.89 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.06 183.21)"><foreignobject style="--ltx-fo-width:36.48em;--ltx-fo-height:4.08em;--ltx-fo-depth:0.18em;font-size:10pt;" height="58.88" overflow="visible" transform="matrix(1 0 0 -1 0 56.46)" width="504.78"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
