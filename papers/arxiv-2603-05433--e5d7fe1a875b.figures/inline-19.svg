<span id="S5.T3.pic1.1.2.3.1.1" class="ltx_p ltx_align_left"><span id="S5.T3.pic1.1.2.3.1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Solve concisely and correctly. Be direct—avoid unnecessary elaboration, redundant steps, or restating the problem; focus only on the key reasoning steps needed to reach the answer.</span></span>
