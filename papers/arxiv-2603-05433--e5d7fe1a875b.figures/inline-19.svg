<span id="S5.T3.pic1.1.4.3.1" class="ltx_inline-block ltx_align_top">
<span id="S5.T3.pic1.1.4.3.1.1" class="ltx_p ltx_align_left"><span id="S5.T3.pic1.1.4.3.1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Write only what is needed: omit restatements, narration, and obvious arithmetic; keep every logically necessary step (case splits, key idea, a one-line check).</span></span>
