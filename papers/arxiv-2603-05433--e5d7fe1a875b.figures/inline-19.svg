</span></td>
<td id="S5.T3.pic1.1.3.3" class="ltx_td ltx_nopad_r ltx_align_left" style="padding-top:1.15pt;padding-bottom:1.15pt;">
<span id="S5.T3.pic1.1.3.3.1" class="ltx_inline-block ltx_align_top">
<span id="S5.T3.pic1.1.3.3.1.1" class="ltx_p ltx_align_left"><span id="S5.T3.pic1.1.3.3.1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Solve concisely and correctly; prioritize a correct answer over brevity. Be direct on straightforward problems; for hard/multi-step ones do not over-compress—keep case analysis, edge cases, and a final check.</span></span>
