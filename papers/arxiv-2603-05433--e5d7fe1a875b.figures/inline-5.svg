<span id="S4.SS4.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="S4.SS4.p2.pic1.p1.1" class="ltx_p"><span id="S4.SS4.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Proposition</span><span id="S4.SS4.p2.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> [Difficulty-adaptive compression; Proposition </span><a href="#Thmproposition1" title="Proposition 1 (Difficulty-adaptive compression signal). ‣ A.3 Difficulty-Adaptive Compression ‣ Appendix A Theoretical Analysis ‣ CRISP: Compressed Reasoning via Iterative Self-Policy Distillation" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">1</span></a><span id="S4.SS4.p2.pic1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">]. 
The per-token compression signal </span><math id="S4.SS4.p2.pic1.p1.m1" class="ltx_Math" alttext="S(x)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">S(x)</annotation></semantics></math><span id="S4.SS4.p2.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> is non-increasing in problem difficulty </span><math id="S4.SS4.p2.pic1.p1.m2" class="ltx_Math" alttext="d(x)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">d(x)</annotation></semantics></math><span id="S4.SS4.p2.pic1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">: easy problems receive strong compression pressure while hard problems, whose reasoning steps are predominantly essential, receive weak pressure.</span></span>
</span></span></span></span></foreignobject></g></g></svg>