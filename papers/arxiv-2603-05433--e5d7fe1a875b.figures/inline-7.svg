<svg id="S4.SS6.p2.pic1" class="ltx_picture" height="115.73" overflow="visible" version="1.1" viewbox="0 0 477.38 115.73" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,115.73) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4D4D4D;" fill="#4D4D4D" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.46 L 0 112.27 C 0 114.18 1.55 115.73 3.46 115.73 L 473.92 115.73 C 475.83 115.73 477.38 114.18 477.38 112.27 L 477.38 3.46 C 477.38 1.55 475.83 0 473.92 0 L 3.46 0 C 1.55 0 0 1.55 0 3.46 Z" /></g><g style="--ltx-fill-color:#F5F5F5;" fill="#F5F5F5" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 3.46 L 0.69 112.27 C 0.69 113.79 1.93 115.03 3.46 115.03 L 473.92 115.03 C 475.45 115.03 476.68 113.79 476.68 112.27 L 476.68 3.46 C 476.68 1.93 475.45 0.69 473.92 0.69 L 3.46 0.69 C 1.93 0.69 0.69 1.93 0.69 3.46 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.55 11.55)"><foreignobject style="--ltx-fo-width:32.83em;--ltx-fo-height:6.69em;--ltx-fo-depth:0em;font-size:10pt;" height="92.63" overflow="visible" transform="matrix(1 0 0 -1 0 92.63)" width="454.27"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S4.SS6.p2.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:32.83em;">
<span id="S4.SS6.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="S4.SS6.p2.pic1.p1.1" class="ltx_p"><span id="S4.SS6.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Proposition</span><span id="S4.SS6.p2.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> [Compression reduces compounding error; Proposition </span><a href="#Thmproposition3" title="Proposition 3 (Shorter traces reduce error accumulation). ‣ A.5 Compression Reduces Compounding Error ‣ Appendix A Theoretical Analysis ‣ CRISP: Compressed Reasoning via Iterative Self-Policy Distillation" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">3</span></a><span id="S4.SS6.p2.pic1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">]. 
Under a model where each token independently introduces a reasoning error with probability </span><math id="S4.SS6.p2.pic1.p1.m1" class="ltx_Math" alttext="p_{\mathrm{err}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">err</mi></msub><annotation encoding="application/x-tex">p_{\mathrm{err}}</annotation></semantics></math><span id="S4.SS6.p2.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">, compressing from </span><math id="S4.SS6.p2.pic1.p1.m2" class="ltx_Math" alttext="L" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">L</mi><annotation encoding="application/x-tex">L</annotation></semantics></math><span id="S4.SS6.p2.pic1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> to </span><math id="S4.SS6.p2.pic1.p1.m3" class="ltx_Math" alttext="\alpha L" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">α</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">L</mi></mrow><annotation encoding="application/x-tex">\alpha L</annotation></semantics></math><span id="S4.SS6.p2.pic1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> tokens yields an accuracy ratio </span><math id="S4.SS6.p2.pic1.p1.m4" class="ltx_Math" alttext="(1-p_{\mathrm{err}})^{-(1-\alpha)L}" display="inline" intent=":literal"><semantics><msup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">p</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">err</mi></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">α</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">L</mi></mrow></mrow></msup><annotation encoding="application/x-tex">(1-p_{\mathrm{err}})^{-(1-\alpha)L}</annotation></semantics></math><span id="S4.SS6.p2.pic1.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">, which grows exponentially in the number of removed tokens.</span></span>
</span></span></span></span></foreignobject></g></g></svg>