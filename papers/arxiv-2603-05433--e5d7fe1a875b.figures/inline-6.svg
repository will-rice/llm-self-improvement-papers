<span id="S4.SS5.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="S4.SS5.p2.pic1.p1.1" class="ltx_p"><span id="S4.SS5.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Proposition</span><span id="S4.SS5.p2.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> [Bounded forgetting; Proposition </span><a href="#Thmproposition2" title="Proposition 2 (Bounded forgetting under on-policy self-distillation). ‣ A.4 Bounded Forgetting from the Base Model ‣ Appendix A Theoretical Analysis ‣ CRISP: Compressed Reasoning via Iterative Self-Policy Distillation" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">2</span></a><span id="S4.SS5.p2.pic1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">]. 
Divergence from the base model is bounded by:</span></span>
<span id="S4.E7" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="S4.E7.m1" class="ltx_math_unparsed" alttext="\mathbb{E}_{x}\big[d_{\mathrm{TV}}(\pi_{\theta^{*}}(\cdot\mid x),\,\pi_{\theta_{0}}(\cdot\mid x))\big]\leq\sqrt{\epsilon_{\mathrm{KL}}/2}+\mathbb{E}_{x}[\gamma(x)]," display="block" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔼</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="1.200em" minsize="1.200em">[</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">TV</mi></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</mo></msup></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">⋅</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.337em">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">⋅</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="1.200em" minsize="1.200em">]</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϵ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">KL</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow></msqrt><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔼</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">γ</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo></mrow><annotation encoding="application/x-tex">\mathbb{E}_{x}\big[d_{\mathrm{TV}}(\pi_{\theta^{*}}(\cdot\mid x),\,\pi_{\theta_{0}}(\cdot\mid x))\big]\leq\sqrt{\epsilon_{\mathrm{KL}}/2}+\mathbb{E}_{x}[\gamma(x)],</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(7)</span></span></span></span>
</span>
<span id="S4.SS5.p2.pic1.p1.2" class="ltx_p"><span id="S4.SS5.p2.pic1.p1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">where </span><math id="S4.SS5.p2.pic1.p1.m1" class="ltx_Math" alttext="\gamma(x)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">γ</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\gamma(x)</annotation></semantics></math><span id="S4.SS5.p2.pic1.p1.2.2" class="ltx_text" style="--ltx-fg-color:#000000;"> is the conciseness gap, i.e., the total variation between the base model’s outputs with and without the conciseness instruction.</span></span>
</span></span></span></span></foreignobject></g></g></svg>