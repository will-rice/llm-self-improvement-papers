<span id="S4.SS1.p2.pic1.p1.1" class="ltx_p"><span id="S4.SS1.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Lemma</span><span id="S4.SS1.p2.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> [Training loss equals sequence-level KL; Lemma </span><a href="#Thmlemma1" title="Lemma 1 (Chain rule of KL for autoregressive models). ‣ A.1 Sequence-Level Divergence and the Training Objective ‣ Appendix A Theoretical Analysis ‣ CRISP: Compressed Reasoning via Iterative Self-Policy Distillation" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">1</span></a><span id="S4.SS1.p2.pic1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">]. 
The per-token CRISP loss (Eq. </span><a href="#S3.E1" title="In 3.2 Training Objective ‣ 3 Method ‣ CRISP: Compressed Reasoning via Iterative Self-Policy Distillation" class="ltx_ref" style="--ltx-fg-color:#000000;"><span class="ltx_text ltx_ref_tag">1</span></a><span id="S4.SS1.p2.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">) equals the sequence-level KL divergence </span><math id="S4.SS1.p2.pic1.p1.m1" class="ltx_math_unparsed" alttext="D_{\mathrm{KL}}(\pi_{\theta}(\cdot\mid x)\|\pi_{\bar{\theta}}(\cdot\mid x,c))" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">KL</mi></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">⋅</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">∥</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><mo>¯</mo></mover></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">⋅</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">c</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">D_{\mathrm{KL}}(\pi_{\theta}(\cdot\mid x)\|\pi_{\bar{\theta}}(\cdot\mid x,c))</annotation></semantics></math><span id="S4.SS1.p2.pic1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> by the chain rule for autoregressive models.</span></span>
