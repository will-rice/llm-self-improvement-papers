<span id="S5.F3.pic9.p3.2" class="ltx_p"><span id="S5.F3.pic9.p3.2.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Answer: <math id="S5.F3.pic9.m6" class="ltx_Math" alttext="\boldsymbol{77}" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#008000;" mathcolor="#008000">𝟕𝟕</mn><annotation encoding="application/x-tex">\boldsymbol{77}</annotation></semantics></math> <span id="S5.F3.pic9.p3.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> <span id="S5.F3.pic9.p3.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#008000;">✓</span></span></span></span>
