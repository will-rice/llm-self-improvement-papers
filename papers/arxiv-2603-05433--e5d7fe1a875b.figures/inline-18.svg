<span id="S5.SS3.SSS1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.83em;">
<span id="S5.SS3.SSS1.p2.pic1.1.1" class="ltx_p"><span id="S5.SS3.SSS1.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Finding: compressing about <math id="S5.SS3.SSS1.p2.pic1.m1" class="ltx_math_unparsed" alttext="2\times" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000">×</mo></mrow><annotation encoding="application/x-tex">2\times</annotation></semantics></math> is the sweet spot.<span id="S5.SS3.SSS1.p2.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Up to roughly <math id="S5.SS3.SSS1.p2.pic1.m2" class="ltx_math_unparsed" alttext="2\times" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000">×</mo></mrow><annotation encoding="application/x-tex">2\times</annotation></semantics></math> reduction in reasoning length, accuracy is preserved (MATH-500 stays near 95%, AIME 2024 near its base level). Further training keeps shrinking responses, but the extra compression is modest and accuracy begins to drop, on AIME 2024 first and eventually on MATH-500.</span></span></span>
</span></span></span></foreignobject></g></g></svg>