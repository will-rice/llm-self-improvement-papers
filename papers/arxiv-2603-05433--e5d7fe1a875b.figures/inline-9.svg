<span id="S5.F3.pic1.p3" class="ltx_para">
<span id="S5.F3.pic1.p3.1" class="ltx_p"><span id="S5.F3.pic1.p3.1.1" class="ltx_text" style="font-size:70%;--ltx-fg-color:#000000;">Triangle 1: <math id="S5.F3.pic1.m2" class="ltx_Math" alttext="\tfrac{1}{2}\cdot 2\cdot 4=4" display="inline" intent=":literal"><semantics><mrow><mrow><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mfrac><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></mrow><annotation encoding="application/x-tex">\tfrac{1}{2}\cdot 2\cdot 4=4</annotation></semantics></math>. Triangle 2: <math id="S5.F3.pic1.m3" class="ltx_Math" alttext="\tfrac{1}{2}\cdot 3\cdot 4=6" display="inline" intent=":literal"><semantics><mrow><mrow><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mfrac><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">⋅</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">6</mn></mrow><annotation encoding="application/x-tex">\tfrac{1}{2}\cdot 3\cdot 4=6</annotation></semantics></math>. Total <math id="S5.F3.pic1.m4" class="ltx_Math" alttext="=10" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn></mrow><annotation encoding="application/x-tex">=10</annotation></semantics></math>.</span></span>
