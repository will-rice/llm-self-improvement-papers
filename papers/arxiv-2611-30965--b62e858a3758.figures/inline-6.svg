<span id="A5.F6.pic4.2.1" class="ltx_p"><math id="A5.F6.pic4.m2" class="ltx_Math" alttext="\boldsymbol{a_{4}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒂</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">𝟒</mn></msub><annotation encoding="application/x-tex">\boldsymbol{a_{4}}</annotation></semantics></math><span id="A5.F6.pic4.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"> “A plausible and consistent angle configuration …”</span></span>
<span id="A5.F6.pic4.2.2" class="ltx_p"><math id="A5.F6.pic4.m3" class="ltx_Math" alttext="\angle APC={\color[rgb]{0.6484,0.4023,0.4648}80^{\circ}}" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">∠</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">C</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msup><mn style="--ltx-fg-color:#A56777;" mathcolor="#A56777">80</mn><mo style="--ltx-fg-color:#A56777;" mathcolor="#A56777">∘</mo></msup></mrow><annotation encoding="application/x-tex">\angle APC={\color[rgb]{0.6484,0.4023,0.4648}80^{\circ}}</annotation></semantics></math><span id="A5.F6.pic4.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">, <math id="A5.F6.pic4.m4" class="ltx_Math" alttext="\angle ACP=28^{\circ}" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">∠</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">C</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msup><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">28</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∘</mo></msup></mrow><annotation encoding="application/x-tex">\angle ACP=28^{\circ}</annotation></semantics></math>.</span></span>
<span id="A5.F6.pic4.2.3" class="ltx_p ltx_align_center"><span id="A5.F6.pic4.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;"><math id="A5.F6.pic4.m5" class="ltx_Math" alttext="72+80+28=180" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">72</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">80</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">28</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">180</mn></mrow><annotation encoding="application/x-tex">72+80+28=180</annotation></semantics></math>.</span></span>
<span id="A5.F6.pic4.2.4" class="ltx_p"><math id="A5.F6.pic4.m6" class="ltx_Math" alttext="\downarrow" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#245581;" mathcolor="#245581" stretchy="false">↓</mo><annotation encoding="application/x-tex">\downarrow</annotation></semantics></math><span id="A5.F6.pic4.2.4.1" class="ltx_text" style="--ltx-fg-color:#245581;"> <span id="A5.F6.pic4.2.4.1.1" class="ltx_text ltx_font_bold">Refine</span> Use coordinates and a cosine-rule check.</span></span>
