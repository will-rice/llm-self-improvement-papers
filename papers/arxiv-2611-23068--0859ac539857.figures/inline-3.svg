<svg id="A9.SS1.SSS1.p1.pic1" class="ltx_picture" height="964.17" overflow="visible" version="1.1" viewbox="0 0 653.15 964.17" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,964.17) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#C6C6C6;" fill="#C6C6C6" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.28 L 0 958.89 C 0 961.8 2.36 964.17 5.28 964.17 L 647.87 964.17 C 650.79 964.17 653.15 961.8 653.15 958.89 L 653.15 5.28 C 653.15 2.36 650.79 0 647.87 0 L 5.28 0 C 2.36 0 0 2.36 0 5.28 Z" /></g><g style="--ltx-fill-color:#FAFAFA;" fill="#FAFAFA" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 5.28 L 0.55 958.89 C 0.55 961.5 2.67 963.61 5.28 963.61 L 647.87 963.61 C 650.48 963.61 652.6 961.5 652.6 958.89 L 652.6 5.28 C 652.6 2.67 650.48 0.55 647.87 0.55 L 5.28 0.55 C 2.67 0.55 0.55 2.67 0.55 5.28 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.36 10.4)"><foreignobject style="--ltx-fo-width:53.44em;--ltx-fo-height:68.18em;--ltx-fo-depth:0em;font-size:10pt;" height="943.39" overflow="visible" transform="matrix(1 0 0 -1 0 943.39)" width="739.46"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A9.SS1.SSS1.p1.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:53.44em;">
<span id="A9.SS1.SSS1.p1.pic1.p3" class="ltx_para">
<span id="A9.SS1.SSS1.p1.pic1.p3.1" class="ltx_p"><span id="A9.SS1.SSS1.p1.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Software Engineering Skill<span id="A9.SS1.SSS1.p1.pic1.p3.1.1.1" class="ltx_text"></span></span></span>
<span id="A9.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:4mm;">
<span id="A9.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A9.I1.i1.p1.1" class="ltx_p"><span id="A9.I1.i1.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Read the task and relevant source before changing code.</span></span>
</span></span>
<span id="A9.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="A9.I1.i2.p1.1" class="ltx_p"><span id="A9.I1.i2.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Preserve existing behavior while implementing the requested public API.</span></span>
</span></span>
<span id="A9.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I1.i3.p1" class="ltx_para ltx_noindent">
<span id="A9.I1.i3.p1.1" class="ltx_p"><span id="A9.I1.i3.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Make a coherent implementation across affected modules.</span></span>
</span></span>
<span id="A9.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I1.i4.p1" class="ltx_para ltx_noindent">
<span id="A9.I1.i4.p1.1" class="ltx_p"><span id="A9.I1.i4.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Verify normal behavior and edge cases with focused tests.</span></span>
</span></span>
<span id="A9.I1.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I1.i5.p1" class="ltx_para ltx_noindent">
<span id="A9.I1.i5.p1.1" class="ltx_p"><span id="A9.I1.i5.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Treat every precise validation, parsing, error, export, and format rule in the prompt as an explicit assertion.</span></span>
</span></span>
<span id="A9.I1.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I1.i6.p1" class="ltx_para">
<span id="A9.I1.i6.p1.1" class="ltx_p"><span id="A9.I1.i6.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Run relevant existing tests and address regressions.</span></span>
</span></span>
</span>
</span>
<span id="A9.SS1.SSS1.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A9.SS1.SSS1.p1.pic1.p1.1" class="ltx_p"><span id="A9.SS1.SSS1.p1.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Agent pitfall:</span><span id="A9.SS1.SSS1.p1.pic1.p1.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> Substituting an idiomatic library name, conventional class name, or a generalized “reasonable” signature for the exact exported symbol, function signature, return shape, or error-message string that the task explicitly names.</span></span>
</span>
<span id="A9.SS1.SSS1.p1.pic1.p4" class="ltx_para">
<span id="A9.SS1.SSS1.p1.pic1.p4.1" class="ltx_p"><span id="A9.SS1.SSS1.p1.pic1.p4.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Trigger:<span id="A9.SS1.SSS1.p1.pic1.p4.1.1.1" class="ltx_text ltx_font_medium"> A prompt that gives a verbatim public identifier (class/function/entrypoint) or a literal error/status text that a hidden caller or assertion will match, while the agent invents a library-flavored alternative such as a generated servicer class name.</span></span></span>
<span id="A9.SS1.SSS1.p1.pic1.p4.2" class="ltx_p"><span id="A9.SS1.SSS1.p1.pic1.p4.2.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Concrete correction:<span id="A9.SS1.SSS1.p1.pic1.p4.2.1.1" class="ltx_text ltx_font_medium"> Before coding, extract every verbatim identifier, signature, empty/zero-value return rule, and error fragment from the task; export and reference those exact strings on the public surface and error paths, and add a focused check asserting each named symbol and message exists exactly as spelled.</span></span></span>
<span id="A9.SS1.SSS1.p1.pic1.p4.3" class="ltx_p"><span id="A9.SS1.SSS1.p1.pic1.p4.3.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Tiny verification:<span id="A9.SS1.SSS1.p1.pic1.p4.3.1.1" class="ltx_text ltx_font_medium"> For a spec that exports <span id="A9.SS1.SSS1.p1.pic1.p4.3.1.1.1" class="ltx_text ltx_font_typewriter">Mean(xs []int) (float64, error)</span> and must return <span id="A9.SS1.SSS1.p1.pic1.p4.3.1.1.2" class="ltx_text ltx_font_typewriter">(0, nil)</span> on an empty slice, expose exactly <span id="A9.SS1.SSS1.p1.pic1.p4.3.1.1.3" class="ltx_text ltx_font_typewriter">Mean</span> (not <span id="A9.SS1.SSS1.p1.pic1.p4.3.1.1.4" class="ltx_text ltx_font_typewriter">computeMean</span>) and return the documented <span id="A9.SS1.SSS1.p1.pic1.p4.3.1.1.5" class="ltx_text ltx_font_typewriter">(0, nil)</span> instead of <span id="A9.SS1.SSS1.p1.pic1.p4.3.1.1.6" class="ltx_text ltx_font_typewriter">(-1, err)</span>, then confirm with one empty-input call.</span></span></span>
</span>
<span id="A9.SS1.SSS1.p1.pic1.p2" class="ltx_para ltx_noindent">
<span id="A9.SS1.SSS1.p1.pic1.p2.1" class="ltx_p"><span id="A9.SS1.SSS1.p1.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Agent pitfall:</span><span id="A9.SS1.SSS1.p1.pic1.p2.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> Improvising tokenization or embedding calls by hand (custom separators, toggling special-token flags, or a single generic task/prompt name applied to both query and corpus) instead of delegating to the named model/package and its documented encoding conventions.</span></span>
</span>
<span id="A9.SS1.SSS1.p1.pic1.p5" class="ltx_para">
<span id="A9.SS1.SSS1.p1.pic1.p5.1" class="ltx_p"><span id="A9.SS1.SSS1.p1.pic1.p5.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Trigger:<span id="A9.SS1.SSS1.p1.pic1.p5.1.1.1" class="ltx_text ltx_font_medium"> A data task that names a specific tokenizer, embedding model, or package and requires an exact numeric count or ranking derived from that model’s own encoding behavior.</span></span></span>
<span id="A9.SS1.SSS1.p1.pic1.p5.2" class="ltx_p"><span id="A9.SS1.SSS1.p1.pic1.p5.2.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Concrete correction:<span id="A9.SS1.SSS1.p1.pic1.p5.2.1.1" class="ltx_text ltx_font_medium"> Load the model only through the named package/entrypoint and let it both tokenize and encode every input; when the wrapper distinguishes query vs. passage or exposes special-token/clip parameters, set those explicitly per side rather than passing one default, and recompute the count or ranking a second time to confirm it is stable.</span></span></span>
<span id="A9.SS1.SSS1.p1.pic1.p5.3" class="ltx_p"><span id="A9.SS1.SSS1.p1.pic1.p5.3.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Tiny verification:<span id="A9.SS1.SSS1.p1.pic1.p5.3.1.1" class="ltx_text ltx_font_medium"> Two short strings joined by <span id="A9.SS1.SSS1.p1.pic1.p5.3.1.1.1" class="ltx_text ltx_font_typewriter">&quot;\n&quot;</span> and <span id="A9.SS1.SSS1.p1.pic1.p5.3.1.1.2" class="ltx_text ltx_font_typewriter">&quot; &quot;</span> should tokenize to the same total under the named tokenizer’s documented defaults; assert that changing the separator or the query/passage prompt flag alters the result, then keep the documented default so the final number matches the scorer’s.</span></span></span>
</span></span></span></span></foreignobject></g></g></svg>