<svg id="A9.SS1.SSS3.p1.pic1" class="ltx_picture" height="947.56" overflow="visible" version="1.1" viewbox="0 0 653.15 947.56" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,947.56) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#C6C6C6;" fill="#C6C6C6" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.28 L 0 942.29 C 0 945.2 2.36 947.56 5.28 947.56 L 647.87 947.56 C 650.79 947.56 653.15 945.2 653.15 942.29 L 653.15 5.28 C 653.15 2.36 650.79 0 647.87 0 L 5.28 0 C 2.36 0 0 2.36 0 5.28 Z" /></g><g style="--ltx-fill-color:#FAFAFA;" fill="#FAFAFA" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 5.28 L 0.55 942.29 C 0.55 944.89 2.67 947.01 5.28 947.01 L 647.87 947.01 C 650.48 947.01 652.6 944.89 652.6 942.29 L 652.6 5.28 C 652.6 2.67 650.48 0.55 647.87 0.55 L 5.28 0.55 C 2.67 0.55 0.55 2.67 0.55 5.28 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.36 10.4)"><foreignobject style="--ltx-fo-width:53.44em;--ltx-fo-height:66.98em;--ltx-fo-depth:0em;font-size:10pt;" height="926.78" overflow="visible" transform="matrix(1 0 0 -1 0 926.78)" width="739.46"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A9.SS1.SSS3.p1.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:53.44em;">
<span id="A9.SS1.SSS3.p1.pic1.p3" class="ltx_para">
<span id="A9.SS1.SSS3.p1.pic1.p3.1" class="ltx_p"><span id="A9.SS1.SSS3.p1.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Software Engineering Skill<span id="A9.SS1.SSS3.p1.pic1.p3.1.1.1" class="ltx_text"></span></span></span>
<span id="A9.I3" class="ltx_itemize" style="--ltx-enum-leftmargin:4mm;">
<span id="A9.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I3.i1.p1" class="ltx_para ltx_noindent">
<span id="A9.I3.i1.p1.1" class="ltx_p"><span id="A9.I3.i1.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Read the task and relevant source before changing code.</span></span>
</span></span>
<span id="A9.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I3.i2.p1" class="ltx_para ltx_noindent">
<span id="A9.I3.i2.p1.1" class="ltx_p"><span id="A9.I3.i2.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Preserve existing behavior while implementing the requested public API.</span></span>
</span></span>
<span id="A9.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I3.i3.p1" class="ltx_para ltx_noindent">
<span id="A9.I3.i3.p1.1" class="ltx_p"><span id="A9.I3.i3.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Make a coherent implementation across affected modules.</span></span>
</span></span>
<span id="A9.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I3.i4.p1" class="ltx_para ltx_noindent">
<span id="A9.I3.i4.p1.1" class="ltx_p"><span id="A9.I3.i4.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Verify normal behavior and edge cases with focused tests.</span></span>
</span></span>
<span id="A9.I3.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I3.i5.p1" class="ltx_para ltx_noindent">
<span id="A9.I3.i5.p1.1" class="ltx_p"><span id="A9.I3.i5.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Treat every precise validation, parsing, error, export, and format rule in the prompt as an explicit assertion.</span></span>
</span></span>
<span id="A9.I3.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I3.i6.p1" class="ltx_para">
<span id="A9.I3.i6.p1.1" class="ltx_p"><span id="A9.I3.i6.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Run relevant existing tests and address regressions.</span></span>
</span></span>
</span>
</span>
<span id="A9.SS1.SSS3.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A9.SS1.SSS3.p1.pic1.p1.1" class="ltx_p"><span id="A9.SS1.SSS3.p1.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Agent pitfall:</span><span id="A9.SS1.SSS3.p1.pic1.p1.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> When feeding text to a subword tokenizer or a retrieval encoder from an external AI library, the agent guessed the assembled text shape (joining related fields with a space or nothing) and the special-token flag, and guessed the per-role prompt, instead of reading the documented contract.</span></span>
</span>
<span id="A9.SS1.SSS3.p1.pic1.p4" class="ltx_para">
<span id="A9.SS1.SSS3.p1.pic1.p4.1" class="ltx_p"><span id="A9.SS1.SSS3.p1.pic1.p4.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Trigger:<span id="A9.SS1.SSS3.p1.pic1.p4.1.1.1" class="ltx_text ltx_font_medium"> A counting or retrieval result that is sensitive to how the exact text is assembled and to which prompt is applied: combining two text fields with a space versus a newline, a guessed special-token setting, or encoding the query and the documents with the same prompt while task-aware encoders distinguish them, can shift a token count or change which document ranks <math id="A9.SS1.SSS3.p1.pic1.m1" class="ltx_Math" alttext="N" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><annotation encoding="application/x-tex">N</annotation></semantics></math>th.</span></span></span>
<span id="A9.SS1.SSS3.p1.pic1.p4.2" class="ltx_p"><span id="A9.SS1.SSS3.p1.pic1.p4.2.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Concrete correction:<span id="A9.SS1.SSS3.p1.pic1.p4.2.1.1" class="ltx_text ltx_font_medium"> Check the source/package documentation for the exact text format and prompt roles before encoding. Join independent text fields with the documented separator (BPE tokenizers merge a leading space into the following subword, so a newline avoids cross-field merging) and set the tokenizer’s special-token flag deliberately. With a retrieval encoder, encode the query with the query prompt and the documents with the passage prompt (e.g. a <span id="A9.SS1.SSS3.p1.pic1.p4.2.1.1.1" class="ltx_text ltx_font_typewriter">prompt_type</span>/role argument), never one shared default for both.</span></span></span>
<span id="A9.SS1.SSS3.p1.pic1.p4.3" class="ltx_p"><span id="A9.SS1.SSS3.p1.pic1.p4.3.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Tiny verification:<span id="A9.SS1.SSS3.p1.pic1.p4.3.1.1" class="ltx_text ltx_font_medium"> For a BPE tokenizer, tokenizing <span id="A9.SS1.SSS3.p1.pic1.p4.3.1.1.1" class="ltx_text ltx_font_typewriter">&quot;a&quot; + &quot; &quot; + &quot;b&quot;</span> returns a different subword count than <span id="A9.SS1.SSS3.p1.pic1.p4.3.1.1.2" class="ltx_text ltx_font_typewriter">&quot;a&quot; + &quot;\n&quot; + &quot;b&quot;</span>; embedding a query with the query prompt versus the passage prompt reorders which document has the <math id="A9.SS1.SSS3.p1.pic1.m2" class="ltx_Math" alttext="N" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><annotation encoding="application/x-tex">N</annotation></semantics></math>th-highest cosine similarity.</span></span></span>
</span>
<span id="A9.SS1.SSS3.p1.pic1.p2" class="ltx_para ltx_noindent">
<span id="A9.SS1.SSS3.p1.pic1.p2.1" class="ltx_p"><span id="A9.SS1.SSS3.p1.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Agent pitfall:</span><span id="A9.SS1.SSS3.p1.pic1.p2.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> The agent implemented the requested behavior behind an idiomatically-named class, function, or registry key instead of the exact public identifier and signature the task states, so the code builds and runs under its own tests but the checker never reaches it.</span></span>
</span>
<span id="A9.SS1.SSS3.p1.pic1.p5" class="ltx_para">
<span id="A9.SS1.SSS3.p1.pic1.p5.1" class="ltx_p"><span id="A9.SS1.SSS3.p1.pic1.p5.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Trigger:<span id="A9.SS1.SSS3.p1.pic1.p5.1.1.1" class="ltx_text ltx_font_medium"> A hidden checker imports or instantiates a documented identifier (a service class name, a package function, a module registry key) or calls a documented public entrypoint with a stated signature; any differently-named or re-signatured variant is invisible to it even though it behaves correctly in isolation.</span></span></span>
<span id="A9.SS1.SSS3.p1.pic1.p5.2" class="ltx_p"><span id="A9.SS1.SSS3.p1.pic1.p5.2.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Concrete correction:<span id="A9.SS1.SSS3.p1.pic1.p5.2.1.1" class="ltx_text ltx_font_medium"> Before writing code, enumerate the exact public identifiers the prompt names—class name, function name, full parameter list and return type, registry key—and name the artifacts precisely; keep existing public entrypoints and signatures unchanged and add new internals around them rather than renaming the reachable surface.</span></span></span>
<span id="A9.SS1.SSS3.p1.pic1.p5.3" class="ltx_p"><span id="A9.SS1.SSS3.p1.pic1.p5.3.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Tiny verification:<span id="A9.SS1.SSS3.p1.pic1.p5.3.1.1" class="ltx_text ltx_font_medium"> <span id="A9.SS1.SSS3.p1.pic1.p5.3.1.1.1" class="ltx_text ltx_font_typewriter">from module import ExactName</span> resolves only when the class/function is literally <span id="A9.SS1.SSS3.p1.pic1.p5.3.1.1.2" class="ltx_text ltx_font_typewriter">ExactName</span>; a <span id="A9.SS1.SSS3.p1.pic1.p5.3.1.1.3" class="ltx_text ltx_font_typewriter">class NearbyName</span> that subclasses the expected type is not found by an importer that looks up <span id="A9.SS1.SSS3.p1.pic1.p5.3.1.1.4" class="ltx_text ltx_font_typewriter">ExactName</span>.</span></span></span>
</span></span></span></span></foreignobject></g></g></svg>