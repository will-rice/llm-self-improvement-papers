<span id="A1.SS2.p4.pic1.1.1" class="ltx_p"><span id="A1.SS2.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Evaluation prompt for LLM-as-a-judge methods on ProcessBench</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:45.78em;--ltx-fo-height:66.7em;--ltx-fo-depth:0.25em;font-size:10pt;" height="926.32" overflow="visible" transform="matrix(1 0 0 -1 0 922.86)" width="633.47"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS2.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.78em;">
<span id="A1.SS2.p4.pic1.2.1" class="ltx_p"><span id="A1.SS2.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">I will provide a math problem along with a solution. They will be formatted as
follows: 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.2" class="ltx_p"><span id="A1.SS2.p4.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Math Problem] 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.3" class="ltx_p"><span id="A1.SS2.p4.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;math_problem&gt;
<br class="ltx_break">…(math problem)… 
<br class="ltx_break">&lt;/math_problem&gt;
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.4" class="ltx_p"><span id="A1.SS2.p4.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Solution] 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.5" class="ltx_p"><span id="A1.SS2.p4.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;paragraph_1&gt;
<br class="ltx_break">…(paragraph 1 of solution)… 
<br class="ltx_break">&lt;/paragraph_1&gt;
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.6" class="ltx_p"><span id="A1.SS2.p4.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">… 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.7" class="ltx_p"><span id="A1.SS2.p4.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;paragraph_n&gt;
<br class="ltx_break">…(paragraph n of solution)… 
<br class="ltx_break">&lt;/paragraph_n&gt;
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.8" class="ltx_p"><span id="A1.SS2.p4.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to review each paragraph of the solution in sequence, analyzing, verifying, and critiquing the reasoning in detail. You need to provide the analyses and the conclusion in the following format: 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.9" class="ltx_p"><span id="A1.SS2.p4.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;analysis_1&gt;
<br class="ltx_break">…(analysis of paragraph 1)… 
<br class="ltx_break">&lt;/analysis_1&gt;
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.10" class="ltx_p"><span id="A1.SS2.p4.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">… 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.11" class="ltx_p"><span id="A1.SS2.p4.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;analysis_n&gt;
<br class="ltx_break">…(analysis of paragraph n)… 
<br class="ltx_break">&lt;/analysis_n&gt;
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.12" class="ltx_p"><span id="A1.SS2.p4.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;conclusion&gt;
<br class="ltx_break">Correct/Incorrect 
<br class="ltx_break">&lt;/conclusion&gt;
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.13" class="ltx_p"><span id="A1.SS2.p4.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">* When you analyze each paragraph, you should use proper verification, recalculation, or reflection to indicate whether it is logically and mathematically valid. Please elaborate on the analysis process carefully. 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.14" class="ltx_p"><span id="A1.SS2.p4.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">* If an error is detected in any paragraph, you should describe the nature and cause of the error in detail, and suggest how to correct the error or the correct approach. Once a paragraph is found to contain any error, stop further analysis of subsequent paragraphs (as they may depend on the identified error) and directly provide the conclusion of &quot;Incorrect.&quot; 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.15" class="ltx_p"><span id="A1.SS2.p4.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">For instance, given a solution of five paragraphs, if an error is found in the third paragraph, you should reply in the following format: 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.16" class="ltx_p"><span id="A1.SS2.p4.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;analysis_1&gt;
<br class="ltx_break">…(analysis of paragraph 1)… 
<br class="ltx_break">&lt;/analysis_1&gt;
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.17" class="ltx_p"><span id="A1.SS2.p4.pic1.2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;analysis_2&gt;
<br class="ltx_break">…(analysis of paragraph 2)… 
<br class="ltx_break">&lt;/analysis_2&gt;
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.18" class="ltx_p"><span id="A1.SS2.p4.pic1.2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;analysis_3&gt;
<br class="ltx_break">…(analysis of paragraph 3; since an error is found here, also provide detailed critique and correction guideline)… 
<br class="ltx_break">&lt;/analysis_3&gt;
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.19" class="ltx_p"><span id="A1.SS2.p4.pic1.2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;conclusion&gt;
<br class="ltx_break">Incorrect 
<br class="ltx_break">&lt;/conclusion&gt;
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.20" class="ltx_p"><span id="A1.SS2.p4.pic1.2.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">Note that the analyses of paragraphs 4 and 5 should be skipped as the paragraph 3 has been found to contain an error. 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.21" class="ltx_p"><span id="A1.SS2.p4.pic1.2.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">* Respond with your analyses and conclusion directly. 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.22" class="ltx_p"><span id="A1.SS2.p4.pic1.2.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">————————————————– 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.23" class="ltx_p"><span id="A1.SS2.p4.pic1.2.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">The following is the math problem and the solution for you task: 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.24" class="ltx_p"><span id="A1.SS2.p4.pic1.2.24.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Math Problem] 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.25" class="ltx_p"><span id="A1.SS2.p4.pic1.2.25.1" class="ltx_text" style="--ltx-fg-color:#000000;">{tagged_problem} 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.26" class="ltx_p"><span id="A1.SS2.p4.pic1.2.26.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Solution] 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p4.pic1.2.27" class="ltx_p"><span id="A1.SS2.p4.pic1.2.27.1" class="ltx_text" style="--ltx-fg-color:#000000;">{tagged_response}</span></span>
