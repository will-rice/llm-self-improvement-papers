<span id="A1.SS2.p2.pic1.1.1" class="ltx_p"><span id="A1.SS2.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt for CoT and code rationale generation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:45.78em;--ltx-fo-height:39.15em;--ltx-fo-depth:0.25em;font-size:10pt;" height="545.18" overflow="visible" transform="matrix(1 0 0 -1 0 541.73)" width="633.47"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.78em;">
<span id="A1.SS2.p2.pic1.2.1" class="ltx_p"><span id="A1.SS2.p2.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[System]:<span id="A1.SS2.p2.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">You are a math teacher. Your task is to review and critique the paragraphs in solution step by step with python code. 
<br class="ltx_break"></span></span></span>
<span id="A1.SS2.p2.pic1.2.2" class="ltx_p"><span id="A1.SS2.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">[User]:<span id="A1.SS2.p2.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">The following is the math problem and a solution (split into paragraphs, enclosed with tags and indexed from 1): 
<br class="ltx_break"></span></span></span>
<span id="A1.SS2.p2.pic1.2.3" class="ltx_p"><span id="A1.SS2.p2.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Math Problem] 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p2.pic1.2.4" class="ltx_p"><span id="A1.SS2.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">{problem} 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p2.pic1.2.5" class="ltx_p"><span id="A1.SS2.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Solution] 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p2.pic1.2.6" class="ltx_p"><span id="A1.SS2.p2.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;paragraph_1&gt;
<br class="ltx_break">{solution_section_1} 
<br class="ltx_break">&lt;/paragraph_1&gt;
<br class="ltx_break"></span></span>
<span id="A1.SS2.p2.pic1.2.7" class="ltx_p"><span id="A1.SS2.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">… 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p2.pic1.2.8" class="ltx_p"><span id="A1.SS2.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;paragraph_n&gt;
<br class="ltx_break">{solution_section_n} 
<br class="ltx_break">&lt;/paragraph_n&gt;
<br class="ltx_break"></span></span>
<span id="A1.SS2.p2.pic1.2.9" class="ltx_p"><span id="A1.SS2.p2.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your task is to verify the correctness of paragraph in the solution. Split your verification by <code id="A1.SS2.p2.pic1.2.9.1.1" class="ltx_verbatim ltx_font_typewriter">`### Paragraph {{ID}}`</code>. 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p2.pic1.2.10" class="ltx_p"><span id="A1.SS2.p2.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your verification for each paragraph should be constructed by 2 parts, wrapped by <code id="A1.SS2.p2.pic1.2.10.1.1" class="ltx_verbatim ltx_font_typewriter">`&lt;analyze&gt;&lt;/analyze&gt;`</code> and <code id="A1.SS2.p2.pic1.2.10.1.2" class="ltx_verbatim ltx_font_typewriter">`&lt;verify&gt;&lt;/verify&gt;`</code> separately. 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p2.pic1.2.11" class="ltx_p"><span id="A1.SS2.p2.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. In <code id="A1.SS2.p2.pic1.2.11.1.1" class="ltx_verbatim ltx_font_typewriter">`&lt;analyze&gt;&lt;/analyze&gt;`</code> part, you need to analyze the reasoning process and explain why the paragraph is correct or incorrect in detail. 
<br class="ltx_break">2. In <code id="A1.SS2.p2.pic1.2.11.1.2" class="ltx_verbatim ltx_font_typewriter">`&lt;verify&gt;&lt;/verify&gt;`</code> part, you must write **Python code** in the form of <code id="A1.SS2.p2.pic1.2.11.1.3" class="ltx_verbatim ltx_font_typewriter">```python\n{{CODE}}\n```</code> to verify every details that can be verified by code. You can import PyPI (i.e., ‘sympy‘, ‘scipy‘ and so on) to implement complicated calculation. Make sure to print the critic results in the code. Every code will be executed automatically by system. You need to analyze the ‘[Code Output]‘ after code executing. 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p2.pic1.2.12" class="ltx_p"><span id="A1.SS2.p2.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">&gt;Pay attention that you must follow the format of <code id="A1.SS2.p2.pic1.2.12.1.1" class="ltx_verbatim ltx_font_typewriter">```python\n{{CODE}}\n```</code> when you write the code, otherwise the code will not be executed. 
<br class="ltx_break"></span></span>
<span id="A1.SS2.p2.pic1.2.13" class="ltx_p"><span id="A1.SS2.p2.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">After all verifications, if you identify an error in a paragraph, return the **index of the paragraph where the earliest error occurs**. Otherwise, return the **index of -1 (which typically denotes &quot;not found&quot;)**. Please put your final answer (i.e., the index) within box in the form of <code id="A1.SS2.p2.pic1.2.13.1.1" class="ltx_verbatim ltx_font_typewriter">`$\\boxed{{INDEX}}$`</code>.</span></span>
</span></span></span></foreignobject></g></g></svg>