<span id="A7.SS7.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.32em;">
<span id="A7.SS7.p2.pic1.1.1" class="ltx_p"><span id="A7.SS7.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Case Study: The Validation Gate Is the Only Filter</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.2)"><foreignobject style="--ltx-fo-width:47.64em;--ltx-fo-height:20.88em;--ltx-fo-depth:0.18em;font-size:10pt;" height="291.34" overflow="visible" transform="matrix(1 0 0 -1 0 288.92)" width="659.2"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A7.SS7.p2.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:47.64em;">
<span id="A7.SS7.p2.pic1.p2" class="ltx_para">
<span id="A7.SS7.p2.pic1.p2.1" class="ltx_p"><span id="A7.SS7.p2.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Case 1<span id="A7.SS7.p2.pic1.p2.1.1.1" class="ltx_text ltx_font_medium"> — SpreadsheetBench, DeepSeek-V4.1-Flash, ACE; the four noise arms and their gate records.</span></span></span>
<span id="A7.SS7.p2.pic1.p2.2" class="ltx_p"><span id="A7.SS7.p2.pic1.p2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">ACE’s curator is <span id="A7.SS7.p2.pic1.p2.2.1.1" class="ltx_text ltx_font_typewriter">AlwaysAccept</span>, so every proposed rule is written and the version selection is the only interception point. Both outcomes are visible in one arm set. Contamination ships: the <math id="A7.SS7.p2.pic1.m1" class="ltx_Math" alttext="N_{\mathrm{Evid}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Evid</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Evid}}</annotation></semantics></math> arm writes <math id="A7.SS7.p2.pic1.m2" class="ltx_Math" alttext="22" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">22</mn><annotation encoding="application/x-tex">22</annotation></semantics></math> rules, freezes at v3 with all <math id="A7.SS7.p2.pic1.m3" class="ltx_Math" alttext="22" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">22</mn><annotation encoding="application/x-tex">22</annotation></semantics></math> present, <math id="A7.SS7.p2.pic1.m4" class="ltx_Math" alttext="3" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><annotation encoding="application/x-tex">3</annotation></semantics></math> of them flagged as noise-carrying and all <math id="A7.SS7.p2.pic1.m5" class="ltx_Math" alttext="3" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><annotation encoding="application/x-tex">3</annotation></semantics></math> deployed; the <math id="A7.SS7.p2.pic1.m6" class="ltx_Math" alttext="N_{\mathrm{Inst}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Inst</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Inst}}</annotation></semantics></math> arm writes <math id="A7.SS7.p2.pic1.m7" class="ltx_Math" alttext="30" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">30</mn><annotation encoding="application/x-tex">30</annotation></semantics></math>, freezes at v2 and keeps <math id="A7.SS7.p2.pic1.m8" class="ltx_Math" alttext="18" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">18</mn><annotation encoding="application/x-tex">18</annotation></semantics></math>. The round is discarded: the <math id="A7.SS7.p2.pic1.m9" class="ltx_Math" alttext="N_{\mathrm{Bind}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Bind</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Bind}}</annotation></semantics></math> arm freezes at v0, so what is deployed is an empty playbook.</span></span>
</span>
<span id="A7.SS7.p2.pic1.p1" class="ltx_para ltx_noindent"><span class="ltx_inline-block"><svg id="A7.SS7.p2.pic1.p1.pic1" class="ltx_picture" color="#000000" height="23.62" overflow="visible" version="1.1" viewbox="0 0 609.84 23.62" width="609.84"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0" stroke="#000000" stroke-dasharray="2.84528pt,2.84528pt" stroke-dashoffset="0.0pt" stroke-width="0.4pt" transform="translate(0,23.62) matrix(1 0 0 -1 0 0) translate(0,11.81)"><path style="fill:none" d="M -19.68 0 L 629.53 0" /></g></svg>