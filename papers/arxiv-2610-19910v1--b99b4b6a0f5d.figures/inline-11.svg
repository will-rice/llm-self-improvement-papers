<span id="A7.SS8.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.32em;">
<span id="A7.SS8.p2.pic1.1.1" class="ltx_p"><span id="A7.SS8.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Case Study: Store Size Drifts Toward Both Extremes</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.2)"><foreignobject style="--ltx-fo-width:47.64em;--ltx-fo-height:23.35em;--ltx-fo-depth:0.18em;font-size:10pt;" height="325.58" overflow="visible" transform="matrix(1 0 0 -1 0 323.16)" width="659.2"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A7.SS8.p2.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:47.64em;">
<span id="A7.SS8.p2.pic1.p2" class="ltx_para">
<span id="A7.SS8.p2.pic1.p2.1" class="ltx_p"><span id="A7.SS8.p2.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Case 1<span id="A7.SS8.p2.pic1.p2.1.1.1" class="ltx_text ltx_font_medium"> — SpreadsheetBench, DeepSeek-V4.1-Flash, ACE; frozen store sizes by arm.</span></span></span>
<span id="A7.SS8.p2.pic1.p2.2" class="ltx_p"><span id="A7.SS8.p2.pic1.p2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The clean arm freezes on an earlier version (<math id="A7.SS8.p2.pic1.m1" class="ltx_Math" alttext="11" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">11</mn><annotation encoding="application/x-tex">11</annotation></semantics></math> rules, <math id="A7.SS8.p2.pic1.m2" class="ltx_Math" alttext="2730" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2730</mn><annotation encoding="application/x-tex">2730</annotation></semantics></math> characters, <math id="A7.SS8.p2.pic1.m3" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math> clauses with defensive wording). The noise arms advance further and inflate, and what they add is dominated by clauses of the form “treat X as a distractor” and “reconcile everything before acting”: <math id="A7.SS8.p2.pic1.m4" class="ltx_Math" alttext="N_{\mathrm{Inst}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Inst</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Inst}}</annotation></semantics></math> freezes at <math id="A7.SS8.p2.pic1.m5" class="ltx_Math" alttext="18" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">18</mn><annotation encoding="application/x-tex">18</annotation></semantics></math> rules, <math id="A7.SS8.p2.pic1.m6" class="ltx_Math" alttext="6330" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">6330</mn><annotation encoding="application/x-tex">6330</annotation></semantics></math> characters, <math id="A7.SS8.p2.pic1.m7" class="ltx_Math" alttext="2" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><annotation encoding="application/x-tex">2</annotation></semantics></math> defensive clauses, and <math id="A7.SS8.p2.pic1.m8" class="ltx_Math" alttext="N_{\mathrm{Evid}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Evid</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Evid}}</annotation></semantics></math> at v3 with <math id="A7.SS8.p2.pic1.m9" class="ltx_Math" alttext="22" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">22</mn><annotation encoding="application/x-tex">22</annotation></semantics></math> rules, <math id="A7.SS8.p2.pic1.m10" class="ltx_Math" alttext="8279" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">8279</mn><annotation encoding="application/x-tex">8279</annotation></semantics></math> characters, <math id="A7.SS8.p2.pic1.m11" class="ltx_Math" alttext="2" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><annotation encoding="application/x-tex">2</annotation></semantics></math> defensive clauses. This is the path that connects directly to budget exhaustion in the execution layer (Section <a href="#A7.SS2" title="G.2 Precautionary Clauses Consume the Interaction Budget ‣ Appendix G Case Studies ‣ When Non-Adversarial Noise Hurts Learning: Benchmarking Skill Self-Evolution in Agents" class="ltx_ref"><span class="ltx_text ltx_ref_tag">G.2</span></a>).</span></span>
</span>
<span id="A7.SS8.p2.pic1.p1" class="ltx_para ltx_noindent"><span class="ltx_inline-block"><svg id="A7.SS8.p2.pic1.p1.pic1" class="ltx_picture" color="#000000" height="23.62" overflow="visible" version="1.1" viewbox="0 0 609.84 23.62" width="609.84"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0" stroke="#000000" stroke-dasharray="2.84528pt,2.84528pt" stroke-dashoffset="0.0pt" stroke-width="0.4pt" transform="translate(0,23.62) matrix(1 0 0 -1 0 0) translate(0,11.81)"><path style="fill:none" d="M -19.68 0 L 629.53 0" /></g></svg>