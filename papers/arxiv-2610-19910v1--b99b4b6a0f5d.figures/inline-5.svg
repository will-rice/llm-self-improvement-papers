<span id="A7.SS2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.32em;">
<span id="A7.SS2.p2.pic1.1.1" class="ltx_p"><span id="A7.SS2.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Case Study: Precautionary Clauses Consume the Interaction Budget</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.2)"><foreignobject style="--ltx-fo-width:47.64em;--ltx-fo-height:29.28em;--ltx-fo-depth:0.18em;font-size:10pt;" height="407.57" overflow="visible" transform="matrix(1 0 0 -1 0 405.15)" width="659.2"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A7.SS2.p2.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:47.64em;">
<span id="A7.SS2.p2.pic1.p2" class="ltx_para">
<span id="A7.SS2.p2.pic1.p2.1" class="ltx_p"><span id="A7.SS2.p2.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Case 1<span id="A7.SS2.p2.pic1.p2.1.1.1" class="ltx_text ltx_font_medium"> — SpreadsheetBench, DeepSeek-V4.1-Flash, ACE; <math id="A7.SS2.p2.pic1.m1" class="ltx_Math" alttext="N_{\mathrm{Inst}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Inst</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Inst}}</annotation></semantics></math> on the test release; task <span id="A7.SS2.p2.pic1.p2.1.1.1.1" class="ltx_text ltx_font_typewriter">14240</span>.</span></span></span>
<span id="A7.SS2.p2.pic1.p2.2" class="ltx_p"><span id="A7.SS2.p2.pic1.p2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The clean run of this task terminates normally in <math id="A7.SS2.p2.pic1.m2" class="ltx_Math" alttext="13" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">13</mn><annotation encoding="application/x-tex">13</annotation></semantics></math> steps; with the inserted sentences present the same store runs <math id="A7.SS2.p2.pic1.m3" class="ltx_Math" alttext="40" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">40</mn><annotation encoding="application/x-tex">40</annotation></semantics></math> steps and ends at <span id="A7.SS2.p2.pic1.p2.2.1.1" class="ltx_text ltx_font_typewriter">step_limit</span>, never submitting. The unevolved agent scores <math id="A7.SS2.p2.pic1.m4" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> on the same noisy item. The playbook in force front-loads clauses such as enumerating every worksheet and reconciling the declared structure against the actual one before writing anything, and the inserted text multiplies the surfaces that clause demands be checked. Arm-wide, <math id="A7.SS2.p2.pic1.m5" class="ltx_Math" alttext="2" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><annotation encoding="application/x-tex">2</annotation></semantics></math> of the <math id="A7.SS2.p2.pic1.m6" class="ltx_Math" alttext="11" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">11</mn><annotation encoding="application/x-tex">11</annotation></semantics></math> tasks that drop under <math id="A7.SS2.p2.pic1.m7" class="ltx_Math" alttext="N_{\mathrm{Inst}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Inst</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Inst}}</annotation></semantics></math> and <math id="A7.SS2.p2.pic1.m8" class="ltx_Math" alttext="4" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn><annotation encoding="application/x-tex">4</annotation></semantics></math> of the <math id="A7.SS2.p2.pic1.m9" class="ltx_Math" alttext="10" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><annotation encoding="application/x-tex">10</annotation></semantics></math> that drop under <math id="A7.SS2.p2.pic1.m10" class="ltx_Math" alttext="N_{\mathrm{Evid}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Evid</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Evid}}</annotation></semantics></math> end in a step or output limit, against an arm mean of only <math id="A7.SS2.p2.pic1.m11" class="ltx_Math" alttext="8.5" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">8.5</mn><annotation encoding="application/x-tex">8.5</annotation></semantics></math>–<math id="A7.SS2.p2.pic1.m12" class="ltx_Math" alttext="13.2" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">13.2</mn><annotation encoding="application/x-tex">13.2</annotation></semantics></math> steps.</span></span>
</span>
<span id="A7.SS2.p2.pic1.p1" class="ltx_para ltx_noindent"><span class="ltx_inline-block"><svg id="A7.SS2.p2.pic1.p1.pic1" class="ltx_picture" color="#000000" height="23.62" overflow="visible" version="1.1" viewbox="0 0 609.84 23.62" width="609.84"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0" stroke="#000000" stroke-dasharray="2.84528pt,2.84528pt" stroke-dashoffset="0.0pt" stroke-width="0.4pt" transform="translate(0,23.62) matrix(1 0 0 -1 0 0) translate(0,11.81)"><path style="fill:none" d="M -19.68 0 L 629.53 0" /></g></svg>