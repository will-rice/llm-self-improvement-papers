<span id="A7.SS3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.32em;">
<span id="A7.SS3.p2.pic1.1.1" class="ltx_p"><span id="A7.SS3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Case Study: Defensive Rules Cross the Noise Boundary</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.2)"><foreignobject style="--ltx-fo-width:47.64em;--ltx-fo-height:34.13em;--ltx-fo-depth:0.18em;font-size:10pt;" height="474.68" overflow="visible" transform="matrix(1 0 0 -1 0 472.26)" width="659.2"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A7.SS3.p2.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:47.64em;">
<span id="A7.SS3.p2.pic1.p2" class="ltx_para">
<span id="A7.SS3.p2.pic1.p2.1" class="ltx_p"><span id="A7.SS3.p2.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Case 1<span id="A7.SS3.p2.pic1.p2.1.1.1" class="ltx_text ltx_font_medium"> — SpreadsheetBench, DeepSeek-V4.1-Flash, ACE; store evolved under <math id="A7.SS3.p2.pic1.m1" class="ltx_Math" alttext="N_{\mathrm{Evid}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Evid</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Evid}}</annotation></semantics></math>, evaluated on the clean release; task <span id="A7.SS3.p2.pic1.p2.1.1.1.1" class="ltx_text ltx_font_typewriter">45372</span>.</span></span></span>
<span id="A7.SS3.p2.pic1.p2.2" class="ltx_p"><span id="A7.SS3.p2.pic1.p2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Unevolved <math id="A7.SS3.p2.pic1.m2" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>, cleanly evolved <math id="A7.SS3.p2.pic1.m3" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>, noise-evolved <math id="A7.SS3.p2.pic1.m4" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math>, with the run ending <span id="A7.SS3.p2.pic1.p2.2.1.1" class="ltx_text ltx_font_typewriter">completed</span> rather than at a limit, and the trajectory citing a rule that the diagnostics mark as noise-carrying and that the validation gate had deployed. The store had written “treat worksheets the task does not name as distractors and do not modify them” and “treat a sheet whose content disavows the requested operation as a distractor”; on the clean release both are still retrieved at high rate, the unnamed region of the workbook is re-read as off-limits, and the correct value is left in an auxiliary column instead of being written into the main data block. The selection filter is “unevolved correct <em id="A7.SS3.p2.pic1.p2.2.1.2" class="ltx_emph ltx_font_italic">and</em> cleanly evolved correct <em id="A7.SS3.p2.pic1.p2.2.1.3" class="ltx_emph ltx_font_italic">and</em> noise-evolved wrong”, which excludes items that are simply hard: <math id="A7.SS3.p2.pic1.m5" class="ltx_Math" alttext="8" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">8</mn><annotation encoding="application/x-tex">8</annotation></semantics></math> such tasks under <math id="A7.SS3.p2.pic1.m6" class="ltx_Math" alttext="N_{\mathrm{Inst}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Inst</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Inst}}</annotation></semantics></math> and <math id="A7.SS3.p2.pic1.m7" class="ltx_Math" alttext="11" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">11</mn><annotation encoding="application/x-tex">11</annotation></semantics></math> under <math id="A7.SS3.p2.pic1.m8" class="ltx_Math" alttext="N_{\mathrm{Evid}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Evid</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Evid}}</annotation></semantics></math>, of which <math id="A7.SS3.p2.pic1.m9" class="ltx_Math" alttext="0/8" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">8</mn></mrow><annotation encoding="application/x-tex">0/8</annotation></semantics></math> and <math id="A7.SS3.p2.pic1.m10" class="ltx_Math" alttext="7/11" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">7</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">11</mn></mrow><annotation encoding="application/x-tex">7/11</annotation></semantics></math> retrieve a deployed noise-carrying rule.</span></span>
</span>
<span id="A7.SS3.p2.pic1.p1" class="ltx_para ltx_noindent"><span class="ltx_inline-block"><svg id="A7.SS3.p2.pic1.p1.pic1" class="ltx_picture" color="#000000" height="23.62" overflow="visible" version="1.1" viewbox="0 0 609.84 23.62" width="609.84"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0" stroke="#000000" stroke-dasharray="2.84528pt,2.84528pt" stroke-dashoffset="0.0pt" stroke-width="0.4pt" transform="translate(0,23.62) matrix(1 0 0 -1 0 0) translate(0,11.81)"><path style="fill:none" d="M -19.68 0 L 629.53 0" /></g></svg>