<span id="A7.SS4.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.32em;">
<span id="A7.SS4.p2.pic1.1.1" class="ltx_p"><span id="A7.SS4.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Case Study: Contamination and Useful Experience Share One Rule</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:47.64em;--ltx-fo-height:28.08em;--ltx-fo-depth:0em;font-size:10pt;" height="388.54" overflow="visible" transform="matrix(1 0 0 -1 0 388.54)" width="659.2"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A7.SS4.p2.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:47.64em;">
<span id="A7.SS4.p2.pic1.p2" class="ltx_para">
<span id="A7.SS4.p2.pic1.p2.1" class="ltx_p"><span id="A7.SS4.p2.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Case 1<span id="A7.SS4.p2.pic1.p2.1.1.1" class="ltx_text ltx_font_medium"> — SpreadsheetBench, DeepSeek-V4.1-Flash, ACE; <math id="A7.SS4.p2.pic1.m1" class="ltx_Math" alttext="N_{\mathrm{Evid}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Evid</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Evid}}</annotation></semantics></math>; rule <span id="A7.SS4.p2.pic1.p2.1.1.1.1" class="ltx_text ltx_font_typewriter">general-00001</span>.</span></span></span>
<span id="A7.SS4.p2.pic1.p2.2" class="ltx_p"><span id="A7.SS4.p2.pic1.p2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Written in round <math id="A7.SS4.p2.pic1.m2" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>, passed the validation gate into the frozen version, cited on <math id="A7.SS4.p2.pic1.m3" class="ltx_Math" alttext="75" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">75</mn><annotation encoding="application/x-tex">75</annotation></semantics></math> of the <math id="A7.SS4.p2.pic1.m4" class="ltx_Math" alttext="80" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">80</mn><annotation encoding="application/x-tex">80</annotation></semantics></math> test items, of which <math id="A7.SS4.p2.pic1.m5" class="ltx_Math" alttext="56" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">56</mn><annotation encoding="application/x-tex">56</annotation></semantics></math> are still answered correctly — the rule is useful and contaminated at once, and the diagnostics flag it as a piggyback: one clause is a precautionary discipline the clean arm learns as well, the other carries the distractor. Noise-carrying rules per position in this arm are <math id="A7.SS4.p2.pic1.m6" class="ltx_Math" alttext="3/30" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">30</mn></mrow><annotation encoding="application/x-tex">3/30</annotation></semantics></math> under <math id="A7.SS4.p2.pic1.m7" class="ltx_Math" alttext="N_{\mathrm{Inst}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Inst</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Inst}}</annotation></semantics></math>, <math id="A7.SS4.p2.pic1.m8" class="ltx_Math" alttext="3/22" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">22</mn></mrow><annotation encoding="application/x-tex">3/22</annotation></semantics></math> under <math id="A7.SS4.p2.pic1.m9" class="ltx_Math" alttext="N_{\mathrm{Evid}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Evid</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Evid}}</annotation></semantics></math>, <math id="A7.SS4.p2.pic1.m10" class="ltx_Math" alttext="4/23" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">23</mn></mrow><annotation encoding="application/x-tex">4/23</annotation></semantics></math> under <math id="A7.SS4.p2.pic1.m11" class="ltx_Math" alttext="N_{\mathrm{Rec}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Rec</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Rec}}</annotation></semantics></math> and <math id="A7.SS4.p2.pic1.m12" class="ltx_Math" alttext="12/28" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">12</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">28</mn></mrow><annotation encoding="application/x-tex">12/28</annotation></semantics></math> under <math id="A7.SS4.p2.pic1.m13" class="ltx_Math" alttext="N_{\mathrm{Bind}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Bind</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Bind}}</annotation></semantics></math>, and the piggyback subset is retrieved at a visibly higher rate than purely noise-derived rules, because the high rate is bought by the useful clause. With curation at rule granularity — the granularity ACE’s interface exposes — no operation deletes only the contaminated clause.</span></span>
</span>
<span id="A7.SS4.p2.pic1.p1" class="ltx_para ltx_noindent"><span class="ltx_inline-block"><svg id="A7.SS4.p2.pic1.p1.pic1" class="ltx_picture" color="#000000" height="23.62" overflow="visible" version="1.1" viewbox="0 0 609.84 23.62" width="609.84"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0" stroke="#000000" stroke-dasharray="2.84528pt,2.84528pt" stroke-dashoffset="0.0pt" stroke-width="0.4pt" transform="translate(0,23.62) matrix(1 0 0 -1 0 0) translate(0,11.81)"><path style="fill:none" d="M -19.68 0 L 629.53 0" /></g></svg>