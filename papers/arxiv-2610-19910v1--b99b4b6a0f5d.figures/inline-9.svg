<span id="A7.SS6.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.32em;">
<span id="A7.SS6.p2.pic1.1.1" class="ltx_p"><span id="A7.SS6.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Case Study: Attribution Is Displaced from the Error to the Observation Channel</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.2)"><foreignobject style="--ltx-fo-width:47.64em;--ltx-fo-height:26.88em;--ltx-fo-depth:0.18em;font-size:10pt;" height="374.36" overflow="visible" transform="matrix(1 0 0 -1 0 371.94)" width="659.2"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A7.SS6.p2.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:47.64em;">
<span id="A7.SS6.p2.pic1.p2" class="ltx_para">
<span id="A7.SS6.p2.pic1.p2.1" class="ltx_p"><span id="A7.SS6.p2.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Case 1<span id="A7.SS6.p2.pic1.p2.1.1.1" class="ltx_text ltx_font_medium"> — SpreadsheetBench, DeepSeek-V4.1-Flash, ACE; <math id="A7.SS6.p2.pic1.m1" class="ltx_Math" alttext="N_{\mathrm{Rec}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Rec</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Rec}}</annotation></semantics></math>, round <math id="A7.SS6.p2.pic1.m2" class="ltx_Math" alttext="01" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">01</mn><annotation encoding="application/x-tex">01</annotation></semantics></math>; task <span id="A7.SS6.p2.pic1.p2.1.1.1.1" class="ltx_text ltx_font_typewriter">22-47</span>.</span></span></span>
<span id="A7.SS6.p2.pic1.p2.2" class="ltx_p"><span id="A7.SS6.p2.pic1.p2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The task truly scores <math id="A7.SS6.p2.pic1.m3" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math>. The reflection attributes the failure to garbled or truncated output, does not claim that any step was unnecessary, and produces <math id="A7.SS6.p2.pic1.m4" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> skill write about the trustworthiness of tool output. Arm-wide, <math id="A7.SS6.p2.pic1.m5" class="ltx_Math" alttext="94/150=63\%" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">94</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">150</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">63</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="1.110em">%</mo></mrow></mrow><annotation encoding="application/x-tex">94/150=63\%</annotation></semantics></math> of reflections hit the garbled-or-truncated detector, against a false-positive floor of <math id="A7.SS6.p2.pic1.m6" class="ltx_Math" alttext="11/150=7\%" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">11</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">150</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">7</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="1.110em">%</mo></mrow></mrow><annotation encoding="application/x-tex">11/150=7\%</annotation></semantics></math> measured with the same detector on the clean arm. The counter-evidence holds simultaneously: “some step was unnecessary” fires on <math id="A7.SS6.p2.pic1.m7" class="ltx_Math" alttext="3/150" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">150</mn></mrow><annotation encoding="application/x-tex">3/150</annotation></semantics></math> here and <math id="A7.SS6.p2.pic1.m8" class="ltx_Math" alttext="9/150" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">150</mn></mrow><annotation encoding="application/x-tex">9/150</annotation></semantics></math> in the clean arm, so it is no higher than the floor.</span></span>
</span>
<span id="A7.SS6.p2.pic1.p1" class="ltx_para ltx_noindent"><span class="ltx_inline-block"><svg id="A7.SS6.p2.pic1.p1.pic1" class="ltx_picture" color="#000000" height="23.62" overflow="visible" version="1.1" viewbox="0 0 609.84 23.62" width="609.84"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0" stroke="#000000" stroke-dasharray="2.84528pt,2.84528pt" stroke-dashoffset="0.0pt" stroke-width="0.4pt" transform="translate(0,23.62) matrix(1 0 0 -1 0 0) translate(0,11.81)"><path style="fill:none" d="M -19.68 0 L 629.53 0" /></g></svg>