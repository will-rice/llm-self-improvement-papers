<span id="A7.SS5.p2.pic1.1.1" class="ltx_p"><span id="A7.SS5.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Case Study: Misbinding Induces Fabrication That Is Then Frozen In</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.2)"><foreignobject style="--ltx-fo-width:47.64em;--ltx-fo-height:29.1em;--ltx-fo-depth:0.18em;font-size:10pt;" height="405.15" overflow="visible" transform="matrix(1 0 0 -1 0 402.73)" width="659.2"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A7.SS5.p2.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:47.64em;">
<span id="A7.SS5.p2.pic1.p2" class="ltx_para">
<span id="A7.SS5.p2.pic1.p2.1" class="ltx_p"><span id="A7.SS5.p2.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Case 1<span id="A7.SS5.p2.pic1.p2.1.1.1" class="ltx_text ltx_font_medium"> — SpreadsheetBench, DeepSeek-V4.1-Flash, ACE; <math id="A7.SS5.p2.pic1.m1" class="ltx_Math" alttext="N_{\mathrm{Bind}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Bind</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Bind}}</annotation></semantics></math>, round <math id="A7.SS5.p2.pic1.m2" class="ltx_Math" alttext="01" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">01</mn><annotation encoding="application/x-tex">01</annotation></semantics></math>; task <span id="A7.SS5.p2.pic1.p2.1.1.1.1" class="ltx_text ltx_font_typewriter">41978</span>.</span></span></span>
<span id="A7.SS5.p2.pic1.p2.2" class="ltx_p"><span id="A7.SS5.p2.pic1.p2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The task truly scores <math id="A7.SS5.p2.pic1.m3" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>; what is presented to the method is the donor attempt’s non-<math id="A7.SS5.p2.pic1.m4" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> outcome (donor <span id="A7.SS5.p2.pic1.p2.2.1.1" class="ltx_text ltx_font_typewriter">227-40</span>, true score <math id="A7.SS5.p2.pic1.m5" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math>). The reflection duly reads the episode as a failure, supplies a mechanism for it, and that mechanism becomes the stated reason for <math id="A7.SS5.p2.pic1.m6" class="ltx_Math" alttext="2" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><annotation encoding="application/x-tex">2</annotation></semantics></math> skill writes. Over the arm’s three rounds, <math id="A7.SS5.p2.pic1.m7" class="ltx_Math" alttext="32" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">32</mn><annotation encoding="application/x-tex">32</annotation></semantics></math> payloads are swapped, <math id="A7.SS5.p2.pic1.m8" class="ltx_Math" alttext="16" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">16</mn><annotation encoding="application/x-tex">16</annotation></semantics></math> of them presenting a true <math id="A7.SS5.p2.pic1.m9" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> as non-<math id="A7.SS5.p2.pic1.m10" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math>, and the reflections on those items consistently narrate a success as a failure.</span></span>
</span>
