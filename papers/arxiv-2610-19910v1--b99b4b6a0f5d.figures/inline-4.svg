<span id="A7.SS1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.32em;">
<span id="A7.SS1.p2.pic1.1.1" class="ltx_p"><span id="A7.SS1.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Case Study: Learned Skills and Noise Are Mutually Exclusive</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.2)"><foreignobject style="--ltx-fo-width:47.64em;--ltx-fo-height:25.68em;--ltx-fo-depth:0.18em;font-size:10pt;" height="357.76" overflow="visible" transform="matrix(1 0 0 -1 0 355.33)" width="659.2"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A7.SS1.p2.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:47.64em;">
<span id="A7.SS1.p2.pic1.p2" class="ltx_para">
<span id="A7.SS1.p2.pic1.p2.1" class="ltx_p"><span id="A7.SS1.p2.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Case 1<span id="A7.SS1.p2.pic1.p2.1.1.1" class="ltx_text ltx_font_medium"> — SpreadsheetBench, DeepSeek-V4.1-Flash, ACE; <math id="A7.SS1.p2.pic1.m1" class="ltx_Math" alttext="N_{\mathrm{Evid}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Evid</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Evid}}</annotation></semantics></math> on the test release; task <span id="A7.SS1.p2.pic1.p2.1.1.1.1" class="ltx_text ltx_font_typewriter">33157</span>.</span></span></span>
<span id="A7.SS1.p2.pic1.p2.2" class="ltx_p"><span id="A7.SS1.p2.pic1.p2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The unevolved agent scores <math id="A7.SS1.p2.pic1.m2" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> on this noisy item. The cleanly evolved playbook scores <math id="A7.SS1.p2.pic1.m3" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> on the clean release of the same task and <math id="A7.SS1.p2.pic1.m4" class="ltx_Math" alttext="0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><annotation encoding="application/x-tex">0</annotation></semantics></math> on the noisy one. The noisy run ends in state <span id="A7.SS1.p2.pic1.p2.2.1.1" class="ltx_text ltx_font_typewriter">completed</span>, so nothing was truncated, and the trajectory is shorter rather than longer (<math id="A7.SS1.p2.pic1.m5" class="ltx_Math" alttext="21\rightarrow 13" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">21</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">13</mn></mrow><annotation encoding="application/x-tex">21\rightarrow 13</annotation></semantics></math> steps): the agent finished early on a premise the distractor file had already invalidated. Over the whole arm the unevolved baseline is essentially flat when the noise is moved into the test release, while the cleanly evolved store moves <math id="A7.SS1.p2.pic1.m6" class="ltx_Math" alttext="11" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">11</mn><annotation encoding="application/x-tex">11</annotation></semantics></math> down and <math id="A7.SS1.p2.pic1.m7" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> up under <math id="A7.SS1.p2.pic1.m8" class="ltx_Math" alttext="N_{\mathrm{Inst}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Inst</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Inst}}</annotation></semantics></math>, and <math id="A7.SS1.p2.pic1.m9" class="ltx_Math" alttext="10" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">10</mn><annotation encoding="application/x-tex">10</annotation></semantics></math> down and <math id="A7.SS1.p2.pic1.m10" class="ltx_Math" alttext="1" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><annotation encoding="application/x-tex">1</annotation></semantics></math> up under <math id="A7.SS1.p2.pic1.m11" class="ltx_Math" alttext="N_{\mathrm{Evid}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Evid</mi></msub><annotation encoding="application/x-tex">N_{\mathrm{Evid}}</annotation></semantics></math>.</span></span>
</span>
<span id="A7.SS1.p2.pic1.p1" class="ltx_para ltx_noindent"><span class="ltx_inline-block"><svg id="A7.SS1.p2.pic1.p1.pic1" class="ltx_picture" color="#000000" height="23.62" overflow="visible" version="1.1" viewbox="0 0 609.84 23.62" width="609.84"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0" stroke="#000000" stroke-dasharray="2.84528pt,2.84528pt" stroke-dashoffset="0.0pt" stroke-width="0.4pt" transform="translate(0,23.62) matrix(1 0 0 -1 0 0) translate(0,11.81)"><path style="fill:none" d="M -19.68 0 L 629.53 0" /></g></svg>