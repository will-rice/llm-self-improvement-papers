<span id="S1.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.64em;">
<span id="S1.p4.pic1.1.1" class="ltx_p"><span id="S1.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Main Contributions of AC-ODM</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.86 349.17)"><foreignobject style="--ltx-fo-width:32.93em;--ltx-fo-height:1.69em;--ltx-fo-depth:24.45em;font-size:10pt;" height="361.76" overflow="visible" transform="matrix(1 0 0 -1 0 23.45)" width="455.66"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.93em;">
<span id="S1.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="S1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I1.i1.p1" class="ltx_para">
<span id="S1.I1.i1.p1.1" class="ltx_p"><span id="S1.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">RL-Based Framework:</span><span id="S1.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> We propose AC-ODM, an online data mixing method that uses an Actor-Critic network to capture intra-domain interactions via a novel gradient alignment reward, steering pretraining toward faster convergence.</span></span>
</span></span>
<span id="S1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I1.i2.p1" class="ltx_para">
<span id="S1.I1.i2.p1.1" class="ltx_p"><span id="S1.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Theoretical Analysis:</span><span id="S1.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> We provide a theoretical analysis demonstrating that our reward mechanism acts as a first-order proxy for spectral coherence in the optimization landscape, explicitly maximizing the effective gradient update magnitude.</span></span>
</span></span>
<span id="S1.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S1.I1.i3.p1" class="ltx_para">
<span id="S1.I1.i3.p1.1" class="ltx_p"><span id="S1.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Dual-Mode Flexibility &amp; Superior Performance:</span><span id="S1.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> We introduce two complementary modes (Proxy/Non-Proxy) to handle diverse data constraints. Empirically, AC-ODM-410M reaches optimal validation perplexity on Pythia-1B using </span><span id="S1.I1.i3.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">66%</span><span id="S1.I1.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> fewer steps than baselines and achieves a </span><span id="S1.I1.i3.p1.1.5" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">27.5%</span><span id="S1.I1.i3.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> gain in MMLU accuracy, all while maintaining the fastest convergence on LLaMA3 architectures with virtually negligible computational overhead (</span><math id="S1.I1.i3.p1.m1" class="ltx_Math" alttext="&lt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><annotation encoding="application/x-tex">&lt;</annotation></semantics></math><span id="S1.I1.i3.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;">0.5% time and 2% memory).</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>