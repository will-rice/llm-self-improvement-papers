</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.55)"><foreignobject style="--ltx-fo-width:46.4em;--ltx-fo-height:18.55em;--ltx-fo-depth:0.2em;font-size:10pt;" height="259.45" overflow="visible" transform="matrix(1 0 0 -1 0 256.68)" width="642.05"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.SS3.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.4em;">
<span id="A8.SS3.p3.pic1.2.1" class="ltx_p"><span id="A8.SS3.p3.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">class Solution:
<br class="ltx_break"> def assignElements(self, groups, elements):
<br class="ltx_break">  value_to_min_index = {}
<br class="ltx_break">  for j, val in enumerate(elements):
<br class="ltx_break">   if val not in value_to_min_index:
<br class="ltx_break">    value_to_min_index[val] = j
<br class="ltx_break">  assigned = [-1] * len(groups)
<br class="ltx_break">  for i, g in enumerate(groups):
<br class="ltx_break">   # Enumerate divisors of g in O(sqrt(g))
<br class="ltx_break">   d = 1
<br class="ltx_break">   while d * d &lt;= g:
<br class="ltx_break">    if g % d == 0:
<br class="ltx_break">     # Check both d and g//d in the map
<br class="ltx_break">     ...
<br class="ltx_break">    d += 1
<br class="ltx_break">  return assigned
</span></span>
</span></span></span></foreignobject></g></g></svg>