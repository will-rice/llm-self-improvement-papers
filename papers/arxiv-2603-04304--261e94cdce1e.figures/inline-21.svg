<span id="A7.SS4.p1.pic1.1.1" class="ltx_p"><span id="A7.SS4.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Issue: Q(…) &amp; Exists(…) raises a TypeError</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:47.41em;--ltx-fo-height:19.83em;--ltx-fo-depth:0em;font-size:10pt;" height="274.32" overflow="visible" transform="matrix(1 0 0 -1 0 274.32)" width="656.02"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS4.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.41em;">
<span id="A7.SS4.p1.pic1.2.1" class="ltx_p"><span id="A7.SS4.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Exists(...) &amp; Q(...)<span id="A7.SS4.p1.pic1.2.1.1.1" class="ltx_text ltx_font_serif"> works, but </span>Q(...) &amp; Exists(...)<span id="A7.SS4.p1.pic1.2.1.1.2" class="ltx_text ltx_font_serif"> raises a </span>TypeError<span id="A7.SS4.p1.pic1.2.1.1.3" class="ltx_text ltx_font_serif">. The </span>&amp;<span id="A7.SS4.p1.pic1.2.1.1.4" class="ltx_text ltx_font_serif"> (and </span>|<span id="A7.SS4.p1.pic1.2.1.1.5" class="ltx_text ltx_font_serif">) operators should be commutative on Q-Exists pairs, but they are not. The issue is in </span>Q._combine()<span id="A7.SS4.p1.pic1.2.1.1.6" class="ltx_text ltx_font_serif"> which checks </span>isinstance(other, Q)<span id="A7.SS4.p1.pic1.2.1.1.7" class="ltx_text ltx_font_serif"> and raises </span>TypeError<span id="A7.SS4.p1.pic1.2.1.1.8" class="ltx_text ltx_font_serif"> for non-Q operands like </span>Exists<span id="A7.SS4.p1.pic1.2.1.1.9" class="ltx_text ltx_font_serif">.
</span></span></span>
</span></span></span></foreignobject></g></g></svg>