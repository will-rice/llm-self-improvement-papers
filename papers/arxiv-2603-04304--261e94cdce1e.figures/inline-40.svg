<span id="A8.SS5.p3.pic1.1.1" class="ltx_p"><span id="A8.SS5.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Pairwise-Selected Solution (idx=3): Correct ✓</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.55)"><foreignobject style="--ltx-fo-width:46.4em;--ltx-fo-height:19.83em;--ltx-fo-depth:0.2em;font-size:10pt;" height="277.09" overflow="visible" transform="matrix(1 0 0 -1 0 274.32)" width="642.05"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.SS5.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.4em;">
<span id="A8.SS5.p3.pic1.2.1" class="ltx_p"><span id="A8.SS5.p3.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">def solve():
<br class="ltx_break"> n = int(input())
<br class="ltx_break"> a = list(map(int, input().split()))
<br class="ltx_break"> # Precompute prefix/suffix distinct counts
<br class="ltx_break"> prefix = [0] * (n + 1); seen = set()
<br class="ltx_break"> for i in range(n):
<br class="ltx_break">  seen.add(a[i]); prefix[i+1] = len(seen)
<br class="ltx_break"> suffix = [0] * (n + 1); seen = set()
<br class="ltx_break"> for i in range(n-1, -1, -1):
<br class="ltx_break">  seen.add(a[i]); suffix[i] = len(seen)
<br class="ltx_break"> # Enumerate all split positions with O(N</span>ˆ<span id="A8.SS5.p3.pic1.2.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">2) middle segment
<br class="ltx_break"> max_sum = 0
<br class="ltx_break"> for i in range(n - 2):
<br class="ltx_break">  for j in range(i+1, n-1):
<br class="ltx_break">   mid_seen = set(a[i+1:j+1])
<br class="ltx_break">   max_sum = max(max_sum, prefix[i+1] + len(mid_seen) + suffix[j+1])
<br class="ltx_break"> print(max_sum)
</span></span>
</span></span></span></foreignobject></g></g></svg>