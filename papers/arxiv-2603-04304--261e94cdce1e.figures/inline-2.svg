<span id="S3.p4.pic1.1.1" class="ltx_p"><span id="S3.p4.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Takeaway: Key Limitations of Existing Self-Verification and Aggregation Approaches</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:4.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="62.11" overflow="visible" transform="matrix(1 0 0 -1 0 59.42)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="S3.p4.pic1.2.1" class="ltx_p"><span id="S3.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Pointwise self-verification lacks calibration due to the absence of comparative references, while self-aggregation methods suffer from diversity collapse that discards correct solutions during aggregation. Pairwise self-verification offers a principled orthogonal method that is both better calibrated and diversity-preserving.</span></span>
</span></span></span></foreignobject></g></g></svg>