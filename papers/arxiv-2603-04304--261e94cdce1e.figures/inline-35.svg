<span id="A8.SS3.p4.pic1.2.1" class="ltx_p"><span id="A8.SS3.p4.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">class Solution:
<br class="ltx_break"> def assignElements(self, groups, elements):
<br class="ltx_break">  assigned = [-1] * len(groups)
<br class="ltx_break">  for i in range(len(groups)):
<br class="ltx_break">   for j in range(len(elements)):
<br class="ltx_break">    if groups[i] % elements[j] == 0:
<br class="ltx_break">     assigned[i] = j
<br class="ltx_break">     break
<br class="ltx_break">  return assigned
</span></span>
