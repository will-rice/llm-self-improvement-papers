<span id="A8.SS4.p1.pic1.2.1" class="ltx_p"><span id="A8.SS4.p1.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Given an integer array <span id="A8.SS4.p1.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">nums</span> and an integer <math id="A8.SS4.p1.pic1.m1" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math>, an integer <math id="A8.SS4.p1.pic1.m2" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math> is <em id="A8.SS4.p1.pic1.2.1.1.2" class="ltx_emph ltx_font_italic">almost missing</em> if <math id="A8.SS4.p1.pic1.m3" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math> appears in exactly one subarray of size <math id="A8.SS4.p1.pic1.m4" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math>. Return the largest such integer, or <math id="A8.SS4.p1.pic1.m5" class="ltx_Math" alttext="-1" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">-1</annotation></semantics></math> if none exists.</span></span>
