</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.27)"><foreignobject style="--ltx-fo-width:46.4em;--ltx-fo-height:24.55em;--ltx-fo-depth:0.18em;font-size:10pt;" height="342.19" overflow="visible" transform="matrix(1 0 0 -1 0 339.7)" width="642.05"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.SS1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.4em;">
<span id="A8.SS1.p3.pic1.2.1" class="ltx_p"><span id="A8.SS1.p3.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">class Solution:
<br class="ltx_break"> def maxActiveSectionsAfterTrade(self, s: str) -&gt; int:
<br class="ltx_break">  t = ’1’ + s + ’1’
<br class="ltx_break">  original_ones = s.count(’1’)
<br class="ltx_break">  # Split augmented string into blocks of 1s and 0s
<br class="ltx_break">  blocks = []
<br class="ltx_break">  i = 0
<br class="ltx_break">  while i &lt; len(t):
<br class="ltx_break">   j = i
<br class="ltx_break">   while j &lt; len(t) and t[j] == t[i]: j += 1
<br class="ltx_break">   blocks.append((t[i], i, j-1, j - i))
<br class="ltx_break">   i = j
<br class="ltx_break">  # For each 1-block surrounded by 0-blocks,
<br class="ltx_break">  # compute gain from trading it and filling adjacent 0-block
<br class="ltx_break">  max_candidate = original_ones
<br class="ltx_break">  for idx in range(len(blocks)):
<br class="ltx_break">   if blocks[idx][0] == ’1’:
<br class="ltx_break">    # Check if surrounded by 0-blocks on both sides
<br class="ltx_break">    # Trade: sacrifice this 1-block, fill a neighboring 0-block
<br class="ltx_break">    ... # correct enumeration of all valid trades
<br class="ltx_break">  return max_candidate
</span></span>
</span></span></span></foreignobject></g></g></svg>