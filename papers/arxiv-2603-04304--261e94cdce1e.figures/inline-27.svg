<span id="A8.SS1.p1.pic1.1.1" class="ltx_p"><span id="A8.SS1.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Problem: Maximize active sections after at most one trade</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.2)"><foreignobject style="--ltx-fo-width:47.41em;--ltx-fo-height:29.43em;--ltx-fo-depth:0.18em;font-size:10pt;" height="409.58" overflow="visible" transform="matrix(1 0 0 -1 0 407.16)" width="656.02"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.SS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.41em;">
<span id="A8.SS1.p1.pic1.2.1" class="ltx_p"><span id="A8.SS1.p1.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are given a binary string <span id="A8.SS1.p1.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">s</span> of length <math id="A8.SS1.p1.pic1.m1" class="ltx_Math" alttext="n" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi><annotation encoding="application/x-tex">n</annotation></semantics></math>, where <span id="A8.SS1.p1.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">’1’</span> represents an active section and <span id="A8.SS1.p1.pic1.2.1.1.3" class="ltx_text ltx_font_typewriter">’0’</span> represents an inactive section. You can perform at most one <em id="A8.SS1.p1.pic1.2.1.1.4" class="ltx_emph ltx_font_italic">trade</em>: (1) convert a contiguous block of <span id="A8.SS1.p1.pic1.2.1.1.5" class="ltx_text ltx_font_typewriter">’1’</span>s surrounded by <span id="A8.SS1.p1.pic1.2.1.1.6" class="ltx_text ltx_font_typewriter">’0’</span>s to all <span id="A8.SS1.p1.pic1.2.1.1.7" class="ltx_text ltx_font_typewriter">’0’</span>s, then (2) convert a contiguous block of <span id="A8.SS1.p1.pic1.2.1.1.8" class="ltx_text ltx_font_typewriter">’0’</span>s surrounded by <span id="A8.SS1.p1.pic1.2.1.1.9" class="ltx_text ltx_font_typewriter">’1’</span>s to all <span id="A8.SS1.p1.pic1.2.1.1.10" class="ltx_text ltx_font_typewriter">’1’</span>s. The string is augmented with <span id="A8.SS1.p1.pic1.2.1.1.11" class="ltx_text ltx_font_typewriter">’1’</span> at both ends: <math id="A8.SS1.p1.pic1.m2" class="ltx_Math" alttext="t=" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mphantom></mphantom></mrow><annotation encoding="application/x-tex">t=</annotation></semantics></math> <span id="A8.SS1.p1.pic1.2.1.1.12" class="ltx_text ltx_font_typewriter">’1’</span> + <math id="A8.SS1.p1.pic1.m3" class="ltx_Math" alttext="s" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><annotation encoding="application/x-tex">s</annotation></semantics></math> + <span id="A8.SS1.p1.pic1.2.1.1.13" class="ltx_text ltx_font_typewriter">’1’</span>. Return the maximum number of active sections after the optimal trade.</span></span>
</span></span></span></foreignobject></g></g></svg>