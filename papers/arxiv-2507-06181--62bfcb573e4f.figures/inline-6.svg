<span id="A8.p1.pic1.1.1" class="ltx_p"><span id="A8.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt:Lean Flaw Injection</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.23 19.16)"><foreignobject style="--ltx-fo-width:31.43em;--ltx-fo-height:78.29em;--ltx-fo-depth:0.25em;font-size:10pt;" height="1086.76" overflow="visible" transform="matrix(1 0 0 -1 0 1083.3)" width="434.9"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A8.p1.pic1.2" class="ltx_inline-sectional-block ltx_minipage">
                  
<span id="A8.p1.pic1.p1" class="ltx_para">
<span id="A8.p1.pic1.p1.1" class="ltx_p"><span id="A8.p1.pic1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an exceptional Lean 4 code formalization engineer. Your current task is to meticulously introduce errors into correct Lean 4 code, following a specific checklist of error types.</span></span>
<span id="A8.p1.pic1.p1.2" class="ltx_p"><span id="A8.p1.pic1.p1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">I will provide you with:</span></span>
<span id="A8.I1" class="ltx_enumerate">
<span id="A8.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A8.I1.i1.p1" class="ltx_para">
<span id="A8.I1.i1.p1.1" class="ltx_p"><span id="A8.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A problem pair consisting of:</span></span>
<span id="A8.I1.i1.I1" class="ltx_enumerate">
<span id="A8.I1.i1.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(a)</span> 
<span id="A8.I1.i1.I1.i1.p1" class="ltx_para">
<span id="A8.I1.i1.I1.i1.p1.1" class="ltx_p"><span id="A8.I1.i1.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A mathematical definition or statement.</span></span>
</span></span>
<span id="A8.I1.i1.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">(b)</span> 
<span id="A8.I1.i1.I1.i2.p1" class="ltx_para">
<span id="A8.I1.i1.I1.i2.p1.1" class="ltx_p"><span id="A8.I1.i1.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Its corresponding correct Lean 4 code formalization.</span></span>
</span></span>
</span>
</span></span>
<span id="A8.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A8.I1.i2.p1" class="ltx_para">
<span id="A8.I1.i2.p1.1" class="ltx_p"><span id="A8.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">An error checklist and Lean 4 theorem statement: A list of potential error types or modification strategies, along with a Lean 4 theorem statement that formalizes the problem. Note that the proof is intentionally omitted (e.g., using </span><span id="A8.I1.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">sorry</span><span id="A8.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">).</span></span>
</span></span>
</span>
<span id="A8.p1.pic1.p1.3" class="ltx_p"><span id="A8.p1.pic1.p1.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Your process should be as follows:</span></span>
<span id="A8.I2" class="ltx_enumerate">
<span id="A8.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A8.I2.i1.p1" class="ltx_para">
<span id="A8.I2.i1.p1.1" class="ltx_p"><span id="A8.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">From the provided checklist, select exactly 2 error types or modification strategies. Each chosen item must be directly and plausibly applicable to the structure, logic, or types within the provided mathematical statement and its Lean 4 code.</span></span>
</span></span>
<span id="A8.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A8.I2.i2.p1" class="ltx_para">
<span id="A8.I2.i2.p1.1" class="ltx_p"><span id="A8.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Based on your selection(s), intentionally modify the Lean 4 code to make it incorrect or subtly deviate from the original mathematical intent. The modification should be contextually relevant to the provided mathematical statement and its original Lean 4 formalization. Aim for errors that someone might plausibly make when formalizing *this specific* concept, rather than completely arbitrary changes.</span></span>
</span></span>
<span id="A8.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A8.I2.i3.p1" class="ltx_para">
<span id="A8.I2.i3.p1.1" class="ltx_p"><span id="A8.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">When applying multiple selected error types, aim to incorporate all of them naturally into the code modification. If this proves too complex or makes the resulting error contrived, you may focus on a primary subset of the selected types, but clearly explain your rationale and how the chosen modifications relate to your selections.</span></span>
</span></span>
<span id="A8.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A8.I2.i4.p1" class="ltx_para">
<span id="A8.I2.i4.p1.1" class="ltx_p"><span id="A8.I2.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Important: Do not add any comments directly within the mathematical description or the Lean 4 code itself to explain your changes. All explanations should be in the ”Detailed Explanation of Modifications” section.</span></span>
</span></span>
</span>
</span>
                  
<section id="A8.SSx1" class="ltx_subsection">
<h3 class="ltx_title ltx_title_subsection"></h3>

<span id="A8.SSx1.p1" class="ltx_para">
<span id="A8.SSx1.p1.1" class="ltx_p"><span id="A8.SSx1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You must then return your response as a JSON object with the following structure and content:</span></span>
</span>
<span id="A8.SSx1.p2" class="ltx_para">
<span id="A8.SSx1.p2.1" class="ltx_p"><span id="A8.SSx1.p2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">“‘json</span></span>
</span>
<span id="A8.SSx1.p3" class="ltx_para">
<span id="A8.SSx1.p3.1" class="ltx_p"><span id="A8.SSx1.p3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output Format</span></span>
</span>
<span id="A8.SSx1.p4" class="ltx_para">
<span id="A8.SSx1.p4.1" class="ltx_p"><span id="A8.SSx1.p4.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You must then return your response as a JSON object with the following structure and content:</span></span><pre id="A8.SSx1.p4.2" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{
  &quot;modified_lean_code&quot;: &quot;[Your intentionally flawed Lean 4 code here.
  Please ensure that you do not add any comments directly within the
  mathematical description or the Lean 4 code itself to explain your
  changes.]&quot;,
  &quot;explanation&quot;: &quot;Here, you will:\n1. Clearly state which 2 error
  types or modification strategies you selected from the checklist.
  \n2. Explain precisely what changes you made to the original
  correct code to introduce these errors/deviations.\n3. Describe
  how these changes reflect the selected strateg(ies). Crucially,
  point out the specific \&quot;error points\&quot; you introduced by comparing
  the modified code to the (unstated) original correct version, and
  explain *why* this type of error is plausible or relevant given
  the specific mathematical content and structure of the original
  code.&quot;
}
</pre>
</span>
<span id="A8.SSx1.p5" class="ltx_para">
<span id="A8.SSx1.p5.1" class="ltx_p"><span id="A8.SSx1.p5.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">checklist:</span></span>
</span>
<span id="A8.SSx1.p6" class="ltx_para">
<span id="A8.SSx1.p6.1" class="ltx_p"><span id="A8.SSx1.p6.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">{</span><span id="A8.SSx1.p6.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">selected_checklist_items_placeholder</span><span id="A8.SSx1.p6.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}</span></span>
</span>
<span id="A8.SSx1.p7" class="ltx_para">
<span id="A8.SSx1.p7.1" class="ltx_p"><span id="A8.SSx1.p7.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">”Mathematical statement”: ”{</span><span id="A8.SSx1.p7.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">refined_statement_placeholder</span><span id="A8.SSx1.p7.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}”</span></span>
</span>
<span id="A8.SSx1.p8" class="ltx_para">
<span id="A8.SSx1.p8.1" class="ltx_p"><span id="A8.SSx1.p8.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">”Lean4 code”: ”{</span><span id="A8.SSx1.p8.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">autoformalization_placeholder</span><span id="A8.SSx1.p8.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">}”</span></span>
</span>
</section>
                </span></span></span></foreignobject></g></g></svg>