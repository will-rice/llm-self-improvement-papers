<svg id="A9.p1.pic1" class="ltx_picture" height="1510.07" overflow="visible" version="1.1" viewbox="0 0 477.38 1510.07" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1510.07) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#C4DAFC;" fill="#C4DAFC" fill-opacity="1.0"><path style="stroke:none" d="M 0 11.76 L 0 1498.31 C 0 1504.8 5.27 1510.07 11.76 1510.07 L 465.62 1510.07 C 472.11 1510.07 477.38 1504.8 477.38 1498.31 L 477.38 11.76 C 477.38 5.27 472.11 0 465.62 0 L 11.76 0 C 5.27 0 0 5.27 0 11.76 Z" /></g><g style="--ltx-fill-color:#F3F4F6;" fill="#F3F4F6" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 11.76 L 0.69 1488.51 L 476.68 1488.51 L 476.68 11.76 C 476.68 5.65 471.73 0.69 465.62 0.69 L 11.76 0.69 C 5.65 0.69 0.69 5.65 0.69 11.76 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.23 1495.83)"><foreignobject style="--ltx-fo-width:27.33em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="378.17"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A9.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.33em;">
<span id="A9.p1.pic1.1.1" class="ltx_p"><span id="A9.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt: Mathematical Problem Classification Task</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.23 19.16)"><foreignobject style="--ltx-fo-width:29.93em;--ltx-fo-height:105.11em;--ltx-fo-depth:0.25em;font-size:10pt;" height="1457.82" overflow="visible" transform="matrix(1 0 0 -1 0 1454.36)" width="414.15"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A9.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:29.93em;">
<span id="A9.p1.pic1.2.1" class="ltx_p"><span id="A9.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">I am working with natural language statements of advanced mathematics problems, which are intended to be later formalized in Lean.
Before formalization, I need to categorize each problem into its appropriate mathematical domain.</span></span>
<span id="A9.p1.pic1.2.2" class="ltx_p"><span id="A9.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">#OBJECTIVE#<span id="A9.p1.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A9.I1" class="ltx_enumerate">
<span id="A9.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A9.I1.i1.p1" class="ltx_para">
<span id="A9.I1.i1.p1.1" class="ltx_p"><span id="A9.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Summarize the math problem in one or two sentences, highlighting the key mathematical concepts or structures involved.</span></span>
</span></span>
<span id="A9.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A9.I1.i2.p1" class="ltx_para">
<span id="A9.I1.i2.p1.1" class="ltx_p"><span id="A9.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Classify the problem into one or more mathematical domains, using a hierarchical classification chain. For example: </span>
<br class="ltx_break"><span id="A9.I1.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Algebra -&gt; Intermediate Algebra -&gt; Inequalities</span><span id="A9.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
<span id="A9.p1.pic1.2.3" class="ltx_p"><span id="A9.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">The classification should be based on the mathematical content of the <span id="A9.p1.pic1.2.3.1.1" class="ltx_text ltx_font_italic">natural language</span> problem, even if no formal notation is used yet.</span></span>
<span id="A9.p1.pic1.2.4" class="ltx_p"><span id="A9.p1.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">#DOMAIN TAXONOMY#<span id="A9.p1.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A9.p1.pic1.2.5" class="ltx_p"><span id="A9.p1.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">The domain classification should follow a standard taxonomy:</span></span>
<span id="A9.p1.pic1.2.6" class="ltx_p"><span id="A9.p1.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;math domains&gt;
<br class="ltx_break"><span id="A9.p1.pic1.2.6.1.1" class="ltx_text ltx_font_serif">Algebra -¿ Intermediate Algebra -¿ Inequalities
<br class="ltx_break">Algebra -¿ Intermediate Algebra -¿ Polynomials
<br class="ltx_break">Algebra -¿ Intermediate Algebra -¿ Functional Equations
<br class="ltx_break">Algebra -¿ Linear Algebra -¿ Vector Spaces
<br class="ltx_break">Algebra -¿ Linear Algebra -¿ Matrices
<br class="ltx_break">Geometry -¿ Euclidean Geometry -¿ Triangles
<br class="ltx_break">Geometry -¿ Euclidean Geometry -¿ Circles
<br class="ltx_break">Geometry -¿ Euclidean Geometry -¿ Coordinate Geometry
<br class="ltx_break">Geometry -¿ Euclidean Geometry -¿ Transformations
<br class="ltx_break">Geometry -¿ Analytic Geometry -¿ Conic Sections
<br class="ltx_break">Number Theory -¿ Elementary Number Theory -¿ Divisibility
<br class="ltx_break">Number Theory -¿ Elementary Number Theory -¿ Modular Arithmetic
<br class="ltx_break">Number Theory -¿ Elementary Number Theory -¿ Diophantine Equations
<br class="ltx_break">Number Theory -¿ Elementary Number Theory -¿ Prime Numbers
<br class="ltx_break">Combinatorics -¿ Enumerative Combinatorics -¿ Permutations
<br class="ltx_break">Combinatorics -¿ Enumerative Combinatorics -¿ Combinations
<br class="ltx_break">Combinatorics -¿ Extremal Combinatorics -¿ Pigeonhole Principle
<br class="ltx_break">Combinatorics -¿ Constructive Combinatorics -¿ Invariants
<br class="ltx_break">Combinatorics -¿ Graph Theory -¿ Trees
<br class="ltx_break">Calculus -¿ Differential Calculus -¿ Derivatives
<br class="ltx_break">Calculus -¿ Integral Calculus -¿ Definite Integrals
<br class="ltx_break">Discrete Mathematics -¿ Logic -¿ Propositional Logic
<br class="ltx_break">Discrete Mathematics -¿ Set Theory -¿ Cardinality
<br class="ltx_break">Applied Mathematics -¿ Probability -¿ Expected Value
<br class="ltx_break">Applied Mathematics -¿ Probability -¿ Conditional Probability
<br class="ltx_break">Applied Mathematics -¿ Optimization -¿ Linear Programming
<br class="ltx_break">Applied Mathematics -¿ Algorithms -¿ Greedy Algorithms
<br class="ltx_break">Algebra -¿ Intermediate Algebra -¿ Other
<br class="ltx_break">Geometry -¿ Euclidean Geometry -¿ Other
<br class="ltx_break">Number Theory -¿ Elementary Number Theory -¿ Other
<br class="ltx_break">Combinatorics -¿ Enumerative Combinatorics -¿ Other
<br class="ltx_break">Calculus -¿ Integral Calculus -¿ Other
<br class="ltx_break">Discrete Mathematics -¿ Other -¿ Other
<br class="ltx_break"></span>&lt;/math domains&gt;<span id="A9.p1.pic1.2.6.1.2" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A9.p1.pic1.2.7" class="ltx_p"><span id="A9.p1.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">#RESPONSE FORMAT#<span id="A9.p1.pic1.2.7.1.1" class="ltx_text ltx_font_medium">
</span>##Summarization<span id="A9.p1.pic1.2.7.1.2" class="ltx_text ltx_font_medium">
[A brief summary of the problem, describing the mathematical concepts it involves.]</span></span></span>
<span id="A9.p1.pic1.2.8" class="ltx_p"><span id="A9.p1.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">##Math domains<span id="A9.p1.pic1.2.8.1.1" class="ltx_text ltx_font_medium">
[A hierarchical classification of the mathematical domains involved in the problem.]</span></span></span>
<span id="A9.p1.pic1.2.9" class="ltx_p"><span id="A9.p1.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">#INSTRUCTIONS#<span id="A9.p1.pic1.2.9.1.1" class="ltx_text"></span></span></span>
<span id="A9.I2" class="ltx_itemize">
<span id="A9.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I2.i1.p1" class="ltx_para">
<span id="A9.I2.i1.p1.1" class="ltx_p"><span id="A9.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You may include up to </span><span id="A9.I2.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">three</span><span id="A9.I2.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> domain classification chains, separated by semicolons.</span></span>
</span></span>
<span id="A9.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I2.i2.p1" class="ltx_para">
<span id="A9.I2.i2.p1.1" class="ltx_p"><span id="A9.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The format must be: </span><span id="A9.I2.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Major Domain -&gt; Subdomain -&gt; Specific Topic</span><span id="A9.I2.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A9.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I2.i3.p1" class="ltx_para">
<span id="A9.I2.i3.p1.1" class="ltx_p"><span id="A9.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If a concept doesn’t fit exactly, use </span><span id="A9.I2.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Other</span><span id="A9.I2.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> as the last node only. For example: </span><span id="A9.I2.i3.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Algebra -&gt; Intermediate Algebra -&gt; Other</span><span id="A9.I2.i3.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A9.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I2.i4.p1" class="ltx_para">
<span id="A9.I2.i4.p1.1" class="ltx_p"><span id="A9.I2.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Avoid using vague or overlapping categories.</span></span>
</span></span>
<span id="A9.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I2.i5.p1" class="ltx_para">
<span id="A9.I2.i5.p1.1" class="ltx_p"><span id="A9.I2.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">End each report with the line </span><span id="A9.I2.i5.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">=== report over ===</span><span id="A9.I2.i5.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
<span id="A9.p1.pic1.2.10" class="ltx_p"><span id="A9.p1.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">#INPUT#<span id="A9.p1.pic1.2.10.1.1" class="ltx_text ltx_font_medium">
Below is the original natural language math problem statement:</span></span></span>
<span id="A9.p1.pic1.2.11" class="ltx_p"><span id="A9.p1.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;statement&gt;{statement}&lt;/statement&gt;<span id="A9.p1.pic1.2.11.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A9.p1.pic1.2.12" class="ltx_p"><span id="A9.p1.pic1.2.12.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">#OUTPUT FORMAT#<span id="A9.p1.pic1.2.12.1.1" class="ltx_text ltx_font_medium">
Please return your response in </span>JSON<span id="A9.p1.pic1.2.12.1.2" class="ltx_text ltx_font_medium"> format. For example:</span></span></span><pre id="A9.p1.pic1.2.13" class="ltx_verbatim ltx_font_typewriter" style="--ltx-fg-color:#000000;">
{
  &quot;Summary&quot;: &quot;This problem involves minimizing a symmetric function
  over real variables under absolute value constraints.&quot;,
  &quot;Domains&quot;: [
    &quot;Algebra -&gt; Intermediate Algebra -&gt; Inequalities&quot;,
    &quot;Calculus -&gt; Differential Calculus -&gt; Applications of Derivatives&quot;
  ]
}
</pre>
</span></span></span></foreignobject></g></g></svg>