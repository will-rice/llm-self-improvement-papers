<svg id="A6.T13.pic1" class="ltx_picture" height="1155.01" overflow="visible" version="1.1" viewbox="0 0 653.15 1155.01" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,1155.01) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 1149.1 C 0 1152.36 2.64 1155.01 5.91 1155.01 L 647.24 1155.01 C 650.51 1155.01 653.15 1152.36 653.15 1149.1 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 1130.9 L 651.18 1130.9 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 1139.49)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.T13.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A6.T13.pic1.1.1" class="ltx_p"><span id="A6.T13.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Step 1: Logic Architecture &amp; Code Generation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:79.63em;--ltx-fo-depth:0.25em;font-size:10pt;" height="1105.32" overflow="visible" transform="matrix(1 0 0 -1 0 1101.86)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.T13.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A6.T13.pic1.2.1" class="ltx_p"><span id="A6.T13.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Role 
<br class="ltx_break">You are an expert Data Scientist specializing in <span id="A6.T13.pic1.2.1.1.1" class="ltx_text ltx_font_bold">Algorithmic Synthesis</span>. Your task is to look at raw data arrays from visualization code and engineer sophisticated, multi-step quantitative operations without needing instructions.</span></span>
<span id="A6.T13.pic1.2.2" class="ltx_p"><span id="A6.T13.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Objective 
<br class="ltx_break">You will be provided with a <span id="A6.T13.pic1.2.2.1.1" class="ltx_text ltx_font_bold">Visualization Code Snippet</span>. Your workflow is:</span></span>
<span id="A6.I4" class="ltx_enumerate">
<span id="A6.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A6.I4.i1.p1" class="ltx_para">
<span id="A6.I4.i1.p1.1" class="ltx_p"><span id="A6.I4.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Decode</span><span id="A6.I4.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Extract the raw data signals from the visualization code.</span></span>
</span></span>
<span id="A6.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A6.I4.i2.p1" class="ltx_para">
<span id="A6.I4.i2.p1.1" class="ltx_p"><span id="A6.I4.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Engineer</span><span id="A6.I4.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Design a </span><span id="A6.I4.i2.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">multi-stage analysis</span><span id="A6.I4.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> logic.</span></span>
</span></span>
<span id="A6.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A6.I4.i3.p1" class="ltx_para">
<span id="A6.I4.i3.p1.1" class="ltx_p"><span id="A6.I4.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Implement</span><span id="A6.I4.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Write a standalone Python script that executes this logic to produce a single significant </span><span id="A6.I4.i3.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">result (a specific number or a text label)</span><span id="A6.I4.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
<span id="A6.T13.pic1.2.3" class="ltx_p"><span id="A6.T13.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Design Constraints (Difficulty Control)</span></span>
<span id="A6.I5" class="ltx_itemize">
<span id="A6.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I5.i1.p1" class="ltx_para">
<span id="A6.I5.i1.p1.1" class="ltx_p"><span id="A6.I5.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Target Level</span><span id="A6.I5.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The logic must be </span><span id="A6.I5.i1.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">accessible to a High School student</span><span id="A6.I5.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A6.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I5.i2.p1" class="ltx_para">
<span id="A6.I5.i2.p1.1" class="ltx_p"><span id="A6.I5.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Linearity</span><span id="A6.I5.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Focus on clear, linear logic, but avoid trivial operations.</span></span>
</span></span>
</span>
<span id="A6.T13.pic1.2.4" class="ltx_p"><span id="A6.T13.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Logic Architecture (The &quot;Triangle of Complexity&quot;)
You must invent a calculation path that adheres to these rules:</span></span>
<span id="A6.I6" class="ltx_enumerate">
<span id="A6.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A6.I6.i1.p1" class="ltx_para">
<span id="A6.I6.i1.p1.1" class="ltx_p"><span id="A6.I6.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Cross-Variable Correlation</span><span id="A6.I6.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: You must use interactions between at least three different data lists.</span></span>
</span></span>
<span id="A6.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A6.I6.i2.p1" class="ltx_para">
<span id="A6.I6.i2.p1.1" class="ltx_p"><span id="A6.I6.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Multi-Subplot Integration (CRITICAL)</span><span id="A6.I6.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: If the input code contains multiple subplots, your calculation logic </span><span id="A6.I6.i2.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">MUST synthesize data across at least 2 subplots</span><span id="A6.I6.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A6.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A6.I6.i3.p1" class="ltx_para">
<span id="A6.I6.i3.p1.1" class="ltx_p"><span id="A6.I6.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Structural Dependency</span><span id="A6.I6.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Do not simply process the dataset uniformly.</span></span>
</span></span>
<span id="A6.I6.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A6.I6.i4.p1" class="ltx_para">
<span id="A6.I6.i4.p1.1" class="ltx_p"><span id="A6.I6.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Derived Aggregation</span><span id="A6.I6.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The final output must be a single synthesized value (numerical scalar OR categorical label).</span></span>
</span></span>
</span>
<span id="A6.T13.pic1.2.5" class="ltx_p"><span id="A6.T13.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Output Requirements</span></span>
<span id="A6.I7" class="ltx_enumerate">
<span id="A6.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A6.I7.i1.p1" class="ltx_para">
<span id="A6.I7.i1.p1.1" class="ltx_p"><span id="A6.I7.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Data Context</span><span id="A6.I7.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: A brief professional summary of what the data represents.</span></span>
</span></span>
<span id="A6.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A6.I7.i2.p1" class="ltx_para">
<span id="A6.I7.i2.p1.1" class="ltx_p"><span id="A6.I7.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Logic Blueprint</span><span id="A6.I7.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: A step-by-step text description of the algorithm.</span></span>
</span></span>
<span id="A6.I7.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A6.I7.i3.p1" class="ltx_para">
<span id="A6.I7.i3.p1.1" class="ltx_p"><span id="A6.I7.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">The Python Script (The Solution)</span><span id="A6.I7.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">:</span></span>
<span id="A6.I7.i3.I1" class="ltx_itemize">
<span id="A6.I7.i3.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I7.i3.I1.i1.p1" class="ltx_para">
<span id="A6.I7.i3.I1.i1.p1.1" class="ltx_p"><span id="A6.I7.i3.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Self-Contained</span><span id="A6.I7.i3.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Define all data lists explicitly inside the script.</span></span>
</span></span>
<span id="A6.I7.i3.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I7.i3.I1.i2.p1" class="ltx_para">
<span id="A6.I7.i3.I1.i2.p1.1" class="ltx_p"><span id="A6.I7.i3.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Narrative Variable Naming</span><span id="A6.I7.i3.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Variable names </span><span id="A6.I7.i3.I1.i2.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">MUST</span><span id="A6.I7.i3.I1.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> serve as documentation.</span></span>
</span></span>
<span id="A6.I7.i3.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I7.i3.I1.i3.p1" class="ltx_para">
<span id="A6.I7.i3.I1.i3.p1.1" class="ltx_p"><span id="A6.I7.i3.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Atomic Output</span><span id="A6.I7.i3.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: The script must end with exactly </span><span id="A6.I7.i3.I1.i3.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">ONE</span><span id="A6.I7.i3.I1.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A6.I7.i3.I1.i3.p1.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">print()</span><span id="A6.I7.i3.I1.i3.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> statement showing </span><span id="A6.I7.i3.I1.i3.p1.1.7" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">ONLY</span><span id="A6.I7.i3.I1.i3.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> the final result.</span></span>
</span></span>
<span id="A6.I7.i3.I1.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I7.i3.I1.i4.p1" class="ltx_para">
<span id="A6.I7.i3.I1.i4.p1.1" class="ltx_p"><span id="A6.I7.i3.I1.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Wrap the code in: </span><span id="A6.I7.i3.I1.i4.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;answer&gt;[Your Code] &lt;/answer&gt;</span></span>
</span></span>
</span>
</span></span>
</span>
<span id="A6.T13.pic1.2.6" class="ltx_p"><span id="A6.T13.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Input Data 
<br class="ltx_break"><span id="A6.T13.pic1.2.6.1.1" class="ltx_text ltx_font_bold">Input Code for Analysis:</span> 
<br class="ltx_break"><span id="A6.T13.pic1.2.6.1.2" class="ltx_text ltx_font_typewriter">{chart code}</span></span></span>
</span></span></span></foreignobject></g></g></svg>