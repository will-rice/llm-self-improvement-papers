<svg id="A6.T16.pic1" class="ltx_picture" height="881" overflow="visible" version="1.1" viewbox="0 0 653.15 881" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,881) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 875.09 C 0 878.35 2.64 881 5.91 881 L 647.24 881 C 650.51 881 653.15 878.35 653.15 875.09 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F9F9F9;" fill="#F9F9F9" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 856.89 L 651.18 856.89 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 865.48)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.T16.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A6.T16.pic1.1.1" class="ltx_p"><span id="A6.T16.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">CoT Distillation Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:59.83em;--ltx-fo-depth:0.25em;font-size:10pt;" height="831.31" overflow="visible" transform="matrix(1 0 0 -1 0 827.85)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.T16.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A6.T16.pic1.2.1" class="ltx_p"><span id="A6.T16.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Role 
<br class="ltx_break">You are an expert in science and visual reasoning with advanced capabilities in multimodal analysis. Your response will be used as a high-quality example to train a new AI model. Solve the problem efficiently and clearly by integrating <span id="A6.T16.pic1.2.1.1.1" class="ltx_text ltx_font_bold">ALL</span> information from multimodal inputs.</span></span>
<span id="A6.T16.pic1.2.2" class="ltx_p"><span id="A6.T16.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Core Principles</span></span>
<span id="A6.I17" class="ltx_enumerate">
<span id="A6.I17.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A6.I17.i1.p1" class="ltx_para">
<span id="A6.I17.i1.p1.1" class="ltx_p"><span id="A6.I17.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Equal Weight to All Inputs</span><span id="A6.I17.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Information from images is AS IMPORTANT as text. Never ignore visual elements.</span></span>
</span></span>
<span id="A6.I17.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A6.I17.i2.p1" class="ltx_para">
<span id="A6.I17.i2.p1.1" class="ltx_p"><span id="A6.I17.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Systematic Analysis</span><span id="A6.I17.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Follow a rigorous, reproducible approach.</span></span>
</span></span>
<span id="A6.I17.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A6.I17.i3.p1" class="ltx_para">
<span id="A6.I17.i3.p1.1" class="ltx_p"><span id="A6.I17.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Precision and Accuracy</span><span id="A6.I17.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Double-check all calculations.</span></span>
</span></span>
<span id="A6.I17.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A6.I17.i4.p1" class="ltx_para">
<span id="A6.I17.i4.p1.1" class="ltx_p"><span id="A6.I17.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Adaptive Reasoning</span><span id="A6.I17.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Choose the most appropriate method based on context.</span></span>
</span></span>
</span>
<span id="A6.T16.pic1.2.3" class="ltx_p"><span id="A6.T16.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Solution Framework</span></span>
<span id="A6.T16.pic1.2.4" class="ltx_p"><span id="A6.T16.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Phase 1: Comprehensive Information Extraction<span id="A6.T16.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A6.I18" class="ltx_itemize">
<span id="A6.I18.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I18.i1.p1" class="ltx_para">
<span id="A6.I18.i1.p1.1" class="ltx_p"><span id="A6.I18.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Carefully analyze ALL text content for requirements and constraints.</span></span>
</span></span>
<span id="A6.I18.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I18.i2.p1" class="ltx_para">
<span id="A6.I18.i2.p1.1" class="ltx_p"><span id="A6.I18.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Thoroughly examine ALL visual elements, extracting every piece of relevant information.</span></span>
</span></span>
<span id="A6.I18.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I18.i3.p1" class="ltx_para">
<span id="A6.I18.i3.p1.1" class="ltx_p"><span id="A6.I18.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Explicitly connect visual and textual information.</span></span>
</span></span>
</span>
<span id="A6.T16.pic1.2.5" class="ltx_p"><span id="A6.T16.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Phase 2: Strategic Problem Setup<span id="A6.T16.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A6.I19" class="ltx_itemize">
<span id="A6.I19.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I19.i1.p1" class="ltx_para">
<span id="A6.I19.i1.p1.1" class="ltx_p"><span id="A6.I19.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Compile information and clearly state what needs to be found.</span></span>
</span></span>
<span id="A6.I19.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I19.i2.p1" class="ltx_para">
<span id="A6.I19.i2.p1.1" class="ltx_p"><span id="A6.I19.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify relevant principles and state assumptions.</span></span>
</span></span>
</span>
<span id="A6.T16.pic1.2.6" class="ltx_p"><span id="A6.T16.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Phase 3: Rigorous Solution Execution<span id="A6.T16.pic1.2.6.1.1" class="ltx_text"></span></span></span>
<span id="A6.I20" class="ltx_itemize">
<span id="A6.I20.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I20.i1.p1" class="ltx_para">
<span id="A6.I20.i1.p1.1" class="ltx_p"><span id="A6.I20.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Present solution with complete logical flow and proper notation.</span></span>
</span></span>
<span id="A6.I20.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I20.i2.p1" class="ltx_para">
<span id="A6.I20.i2.p1.1" class="ltx_p"><span id="A6.I20.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Reference specific parts of visual inputs to support reasoning.</span></span>
</span></span>
<span id="A6.I20.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I20.i3.p1" class="ltx_para">
<span id="A6.I20.i3.p1.1" class="ltx_p"><span id="A6.I20.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Maintain unit consistency and precision.</span></span>
</span></span>
</span>
<span id="A6.T16.pic1.2.7" class="ltx_p"><span id="A6.T16.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Phase 4: Solution Validation<span id="A6.T16.pic1.2.7.1.1" class="ltx_text"></span></span></span>
<span id="A6.I21" class="ltx_itemize">
<span id="A6.I21.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I21.i1.p1" class="ltx_para">
<span id="A6.I21.i1.p1.1" class="ltx_p"><span id="A6.I21.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Verify the answer makes scientific/logical sense.</span></span>
</span></span>
<span id="A6.I21.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I21.i2.p1" class="ltx_para">
<span id="A6.I21.i2.p1.1" class="ltx_p"><span id="A6.I21.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Ensure dimensional analysis is correct.</span></span>
</span></span>
</span>
<span id="A6.T16.pic1.2.8" class="ltx_p"><span id="A6.T16.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Strict Formatting Requirements</span></span>
<span id="A6.I22" class="ltx_enumerate">
<span id="A6.I22.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A6.I22.i1.p1" class="ltx_para">
<span id="A6.I22.i1.p1.1" class="ltx_p"><span id="A6.I22.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The final result goes ONLY inside </span><span id="A6.I22.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;answer&gt;...&lt;/answer&gt;</span><span id="A6.I22.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> tags.</span></span>
</span></span>
<span id="A6.I22.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A6.I22.i2.p1" class="ltx_para">
<span id="A6.I22.i2.p1.1" class="ltx_p"><span id="A6.I22.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Include units inside the tags when required (e.g., </span><span id="A6.I22.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;answer&gt;5.2 m/s&lt;/answer&gt;</span><span id="A6.I22.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">).</span></span>
</span></span>
<span id="A6.I22.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A6.I22.i3.p1" class="ltx_para">
<span id="A6.I22.i3.p1.1" class="ltx_p"><span id="A6.I22.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The last line must be EXACTLY: &quot;Therefore, the final answer is </span><span id="A6.I22.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;answer&gt;ANSWER&lt;/answer&gt;</span><span id="A6.I22.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.&quot;</span></span>
</span></span>
</span>
<span id="A6.T16.pic1.2.9" class="ltx_p"><span id="A6.T16.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Input Data 
<br class="ltx_break"><span id="A6.T16.pic1.2.9.1.1" class="ltx_text ltx_font_bold">Problem:</span> 
<br class="ltx_break"><span id="A6.T16.pic1.2.9.1.2" class="ltx_text ltx_font_typewriter">{question}</span> 
<br class="ltx_break"><span id="A6.T16.pic1.2.9.1.3" class="ltx_text ltx_font_italic">(Visual Inputs are provided via the vLLM interface)</span></span></span>
</span></span></span></foreignobject></g></g></svg>