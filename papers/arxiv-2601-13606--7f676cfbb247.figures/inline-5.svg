<span id="A6.T15.pic1.1.1" class="ltx_p"><span id="A6.T15.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Step 3: LLM Inference Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:62.15em;--ltx-fo-depth:0.25em;font-size:10pt;" height="863.4" overflow="visible" transform="matrix(1 0 0 -1 0 859.94)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.T15.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A6.T15.pic1.2.1" class="ltx_p"><span id="A6.T15.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Role 
<br class="ltx_break">You are an expert in <span id="A6.T15.pic1.2.1.1.1" class="ltx_text ltx_font_bold">Chart Code Comprehension</span> and <span id="A6.T15.pic1.2.1.1.2" class="ltx_text ltx_font_bold">Data Reasoning</span>. Your task is to answer a specific question by interpreting the raw data structures defined in a Python code snippet.</span></span>
<span id="A6.T15.pic1.2.2" class="ltx_p"><span id="A6.T15.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Core Principles</span></span>
<span id="A6.I12" class="ltx_enumerate">
<span id="A6.I12.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A6.I12.i1.p1" class="ltx_para">
<span id="A6.I12.i1.p1.1" class="ltx_p"><span id="A6.I12.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Code as Data Source</span><span id="A6.I12.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Treat the Python code as a structured document containing the ground truth data. You do not need to &quot;run&quot; the code, but you must &quot;read&quot; and understand the variables (lists, dictionaries, values).</span></span>
</span></span>
<span id="A6.I12.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A6.I12.i2.p1" class="ltx_para">
<span id="A6.I12.i2.p1.1" class="ltx_p"><span id="A6.I12.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Semantic Mapping</span><span id="A6.I12.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Map the terms in the question to the corresponding variables and indices in the code.</span></span>
</span></span>
<span id="A6.I12.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A6.I12.i3.p1" class="ltx_para">
<span id="A6.I12.i3.p1.1" class="ltx_p"><span id="A6.I12.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Logical Derivation</span><span id="A6.I12.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Based on the extracted data, perform the necessary logical reasoning to answer the question.</span></span>
</span></span>
</span>
<span id="A6.T15.pic1.2.3" class="ltx_p"><span id="A6.T15.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Solution Framework</span></span>
<span id="A6.T15.pic1.2.4" class="ltx_p"><span id="A6.T15.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Phase 1: Code Structure Analysis<span id="A6.T15.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A6.I13" class="ltx_itemize">
<span id="A6.I13.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I13.i1.p1" class="ltx_para">
<span id="A6.I13.i1.p1.1" class="ltx_p"><span id="A6.I13.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Scan the code to identify key variables and data lists.</span></span>
</span></span>
<span id="A6.I13.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I13.i2.p1" class="ltx_para">
<span id="A6.I13.i2.p1.1" class="ltx_p"><span id="A6.I13.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Understand the relationship between different lists (e.g., </span><span id="A6.I13.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">x_axis</span><span id="A6.I13.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> usually corresponds to </span><span id="A6.I13.i2.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">y_axis</span><span id="A6.I13.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> by index).</span></span>
</span></span>
</span>
<span id="A6.T15.pic1.2.5" class="ltx_p"><span id="A6.T15.pic1.2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Phase 2: Information Extraction &amp; Reasoning<span id="A6.T15.pic1.2.5.1.1" class="ltx_text"></span></span></span>
<span id="A6.I14" class="ltx_itemize">
<span id="A6.I14.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I14.i1.p1" class="ltx_para">
<span id="A6.I14.i1.p1.1" class="ltx_p"><span id="A6.I14.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Locate Data</span><span id="A6.I14.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Pinpoint the specific data points (values, labels, axis limits) in the code required by the question.</span></span>
</span></span>
<span id="A6.I14.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I14.i2.p1" class="ltx_para">
<span id="A6.I14.i2.p1.1" class="ltx_p"><span id="A6.I14.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Step-by-Step Derivation</span><span id="A6.I14.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Execute a clear, logical reasoning process. First, explicitly quote the values found in the code. Then, perform the necessary logical comparisons or arithmetic calculations step-by-step to derive the answer.</span></span>
</span></span>
<span id="A6.I14.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I14.i3.p1" class="ltx_para">
<span id="A6.I14.i3.p1.1" class="ltx_p"><span id="A6.I14.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Note</span><span id="A6.I14.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Rely ONLY on the information explicitly present in the code.</span></span>
</span></span>
</span>
<span id="A6.T15.pic1.2.6" class="ltx_p"><span id="A6.T15.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Phase 3: Answer Formulation<span id="A6.T15.pic1.2.6.1.1" class="ltx_text"></span></span></span>
<span id="A6.I15" class="ltx_itemize">
<span id="A6.I15.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I15.i1.p1" class="ltx_para">
<span id="A6.I15.i1.p1.1" class="ltx_p"><span id="A6.I15.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Formulate a clear, concise answer based on your findings.</span></span>
</span></span>
<span id="A6.I15.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I15.i2.p1" class="ltx_para">
<span id="A6.I15.i2.p1.1" class="ltx_p"><span id="A6.I15.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Ensure the answer directly addresses the inquiry.</span></span>
</span></span>
</span>
<span id="A6.T15.pic1.2.7" class="ltx_p"><span id="A6.T15.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Strict Formatting Requirements</span></span>
<span id="A6.I16" class="ltx_enumerate">
<span id="A6.I16.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A6.I16.i1.p1" class="ltx_para">
<span id="A6.I16.i1.p1.1" class="ltx_p"><span id="A6.I16.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The final result goes ONLY inside </span><span id="A6.I16.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;answer&gt;...&lt;/answer&gt;</span><span id="A6.I16.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> tags.</span></span>
</span></span>
<span id="A6.I16.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A6.I16.i2.p1" class="ltx_para">
<span id="A6.I16.i2.p1.1" class="ltx_p"><span id="A6.I16.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The last line of your response must be EXACTLY: &quot;Therefore, the final answer is </span><span id="A6.I16.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;answer&gt;ANSWER&lt;/answer&gt;</span><span id="A6.I16.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.&quot;</span></span>
</span></span>
</span>
<span id="A6.T15.pic1.2.8" class="ltx_p"><span id="A6.T15.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Input Data 
<br class="ltx_break"><span id="A6.T15.pic1.2.8.1.1" class="ltx_text ltx_font_bold">1. Chart Code:</span> 
<br class="ltx_break"><span id="A6.T15.pic1.2.8.1.2" class="ltx_text ltx_font_typewriter">{chart code}</span></span></span>
<span id="A6.T15.pic1.2.9" class="ltx_p"><span id="A6.T15.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">2. Question:<span id="A6.T15.pic1.2.9.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break"><span id="A6.T15.pic1.2.9.1.1.1" class="ltx_text ltx_font_typewriter">{generated_question}</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>