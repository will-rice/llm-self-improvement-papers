<span id="A6.T12.pic1.2.1" class="ltx_p"><span id="A6.T12.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Role 
<br class="ltx_break">You are a Python visualization expert.</span></span>
<span id="A6.T12.pic1.2.2" class="ltx_p"><span id="A6.T12.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Goal 
<br class="ltx_break">Generate a random Python visualization code focusing on charts, tables, or diagrams.</span></span>
<span id="A6.T12.pic1.2.3" class="ltx_p"><span id="A6.T12.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">## Requirements</span></span>
<span id="A6.I3" class="ltx_enumerate">
<span id="A6.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
