<span id="A6.I3.i4.p1.1" class="ltx_p"><span id="A6.I3.i4.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output Format</span><span id="A6.I3.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">:</span></span>
