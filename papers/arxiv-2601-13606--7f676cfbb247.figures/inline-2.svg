<span id="A6.I3.i2.p1.1" class="ltx_p"><span id="A6.I3.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Visual Design</span><span id="A6.I3.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">:</span></span>
<span id="A6.I3.i2.I1" class="ltx_itemize">
<span id="A6.I3.i2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
