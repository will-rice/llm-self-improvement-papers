<span id="A6.I3.i4.I1.i1.p1.1" class="ltx_p"><span id="A6.I3.i4.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Only output the Python visualization code wrapped in: </span>
<br class="ltx_break"><span id="A6.I3.i4.I1.i1.p1.1.2" class="ltx_text">```</span><span id="A6.I3.i4.I1.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">python</span><span id="A6.I3.i4.I1.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> </span>
