<span id="A6.I3.i3.I1.i2.p1.1" class="ltx_p"><span id="A6.I3.i3.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Adjust figure size, margins, and spacing parameters for optimal clarity.</span></span>
</span></span>
</span>
</span></span>
<span id="A6.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
