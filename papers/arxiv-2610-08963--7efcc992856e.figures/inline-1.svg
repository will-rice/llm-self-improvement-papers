 <span id="S1.F1.pic1.1.1.1.1" class="ltx_text" style="font-size:71%;">At <math id="S1.F1.pic1.m3" class="ltx_Math" alttext="s_{u}=(x,y_{&lt;u})" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">s</mi><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">u</mi></msub><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">=</mo><mrow><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" stretchy="false">(</mo><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">x</mi><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">,</mo><msub><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">y</mi><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">&lt;</mo><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">u</mi></mrow></msub><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">s_{u}=(x,y_{&lt;u})</annotation></semantics></math>: <math id="S1.F1.pic1.m4" class="ltx_Math" alttext="q=\pi_{\mathrm{sampler}},\ p=\pi_{\theta}" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">q</mi><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">=</mo><msub><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">π</mi><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">sampler</mi></msub></mrow><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" rspace="0.537em">,</mo><mrow><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">p</mi><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">=</mo><msub><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">π</mi><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">θ</mi></msub></mrow></mrow><annotation encoding="application/x-tex">q=\pi_{\mathrm{sampler}},\ p=\pi_{\theta}</annotation></semantics></math>.</span></span></span>
