<span id="S1.F1.pic1.1.1" class="ltx_p ltx_align_center"><math id="S1.F1.pic1.m1" class="ltx_Math" alttext="\displaystyle\pi_{\mathrm{sampler}}:=\pi^{\mathrm{sampler}}_{\theta_{t-k}},\hskip 16.38895pt\ell_{\theta,u}:=\log\frac{\pi^{\mathrm{trainer}}_{\theta}(y_{u}\mid x,y_{&lt;u})}{\pi_{\mathrm{sampler}}(y_{u}\mid x,y_{&lt;u})},\hskip 16.38895ptA_{u}:=A^{\mathrm{sampler}}_{t,k}(x,y_{&lt;u},y_{u})" display="inline" intent=":literal"><semantics><mrow><mrow><msub><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">π</mi><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">sampler</mi></msub><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">:=</mo><msubsup><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">π</mi><msub><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">θ</mi><mrow><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">t</mi><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">−</mo><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">k</mi></mrow></msub><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">sampler</mi></msubsup></mrow><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em" rspace="1.807em">,</mo><mrow><msub><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em" mathvariant="normal">ℓ</mi><mrow><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">θ</mi><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">,</mo><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">u</mi></mrow></msub><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">:=</mo><mrow><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">log</mi><mo lspace="0.167em">⁡</mo><mstyle displaystyle="true"><mfrac style="--ltx-fg-color:#172