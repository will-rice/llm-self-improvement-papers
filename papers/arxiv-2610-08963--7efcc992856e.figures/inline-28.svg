<span id="A4.F4.pic4.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.91em;">
<span id="A4.F4.pic4.1.1" class="ltx_p ltx_align_center"><math id="A4.F4.pic4.m1" class="ltx_Math" alttext="\displaystyle\nabla\mathcal{L}_{\mathrm{SR}}=\nabla\mathcal{L}_{\mathrm{tok}}=\nabla\mathcal{L}_{\mathrm{TR}}=\nabla_{\theta}^{\mathrm{AD}}\mathbb{E}_{\pi_{\mathrm{sampler}}}L^{\mathrm{bp,SR}}_{\theta}." display="inline" intent=":literal"><semantics><mrow><mrow><mrow><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em" rspace="0.167em">∇</mo><msub><mi style="--ltx-fg-color:#172B4D;" class="ltx_font_mathcaligraphic" mathcolor="#172B4D" mathsize="0.700em">ℒ</mi><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">SR</mi></msub></mrow><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">=</mo><mrow><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em" rspace="0.167em">∇</mo><msub><mi style="--ltx-fg-color:#172B4D;" class="ltx_font_mathcaligraphic" mathcolor="#172B4D" mathsize="0.700em">ℒ</mi><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">tok</mi></msub></mrow><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">=</mo><mrow><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em" rspace="0.167em">∇</mo><msub><mi style="--ltx-fg-color:#172B4D;" class="ltx_font_mathcaligraphic" mathcolor="#172B4D" mathsize="0.700em">ℒ</mi><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">TR</mi></msub></mrow><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">=</mo><mrow><msubsup><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em" rspace="0.167em">∇</mo><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">θ</mi><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">AD</mi></msubsup><mrow><msub><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">𝔼</mi><msub><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">π</mi><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">sampler</mi></msub></msub><mo>⁡</mo><msubsup><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">L</mi><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">θ</mi><mrow><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">bp</mi><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">,</mo><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">SR</mi></mrow></msubsup></mrow></mrow></mrow><mo style="--ltx-fg-color:#172B4D;" lspace="0em" mathcolor="#172B4D" mathsize="0.700em">.</mo></mrow><annotation encoding="application/x-tex">\displaystyle\nabla\mathcal{L}_{\mathrm{SR}}=\nabla\mathcal{L}_{\mathrm{tok}}=\nabla\mathcal{L}_{\mathrm{TR}}=\nabla_{\theta}^{\mathrm{AD}}\mathbb{E}_{\pi_{\mathrm{sampler}}}L^{\mathrm{bp,SR}}_{\theta}.</annotation></semantics></math></span>
<span id="A4.F4.pic4.1.2" class="ltx_p ltx_align_center"><span id="A4.F4.pic4.1.2.1" class="ltx_text ltx_font_sansserif" style="font-size:70%;--ltx-fg-color:#172B4D;">Exact routes: same population gradient; different sample estimators.
<br class="ltx_break" style="--ltx-break-space:2.8pt;"><span id="A4.F4.pic4.1.2.1.1" class="ltx_text ltx_font_serif">
</span><span id="A4.F4.pic4.1.2.1.2" class="ltx_text" style="--ltx-fg-color:#667085;">MC-KL preserves the expected gradient; TopK-KL and binary KL approximate it.
<br class="ltx_break" style="--ltx-break-space:1.7pt;"></span><span id="A4.F4.pic4.1.2.1.3" class="ltx_text ltx_font_serif">
</span><span id="A4.F4.pic4.1.2.1.4" class="ltx_text" style="--ltx-fg-color:#667085;">Neither identity requires deterministic transitions.</span></span></span>
</span></span></span></foreignobject></g></g></svg>