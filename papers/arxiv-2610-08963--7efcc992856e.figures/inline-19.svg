<span id="S1.F1.pic10.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.82em;">
<span id="S1.F1.pic10.1.1" class="ltx_p ltx_align_center"><span id="S1.F1.pic10.1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="font-size:70%;--ltx-fg-color:#172B4D;">Exact routes:<span id="S1.F1.pic10.1.1.1.1" class="ltx_text ltx_font_medium"> <math id="S1.F1.pic10.m1" class="ltx_Math" alttext="\displaystyle\nabla\mathcal{L}_{\mathrm{SR}}=\nabla\mathcal{L}_{\mathrm{tok}}=\nabla\mathcal{L}_{\mathrm{TR}}." display="inline" intent=":literal"><semantics><mrow><mrow><mrow><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" rspace="0.167em">∇</mo><msub><mi style="--ltx-fg-color:#172B4D;" class="ltx_font_mathcaligraphic" mathcolor="#172B4D">ℒ</mi><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">SR</mi></msub></mrow><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">=</mo><mrow><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" rspace="0.167em">∇</mo><msub><mi style="--ltx-fg-color:#172B4D;" class="ltx_font_mathcaligraphic" mathcolor="#172B4D">ℒ</mi><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">tok</mi></msub></mrow><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">=</mo><mrow><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" rspace="0.167em">∇</mo><msub><mi style="--ltx-fg-color:#172B4D;" class="ltx_font_mathcaligraphic" mathcolor="#172B4D">ℒ</mi><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">TR</mi></msub></mrow></mrow><mo style="--ltx-fg-color:#172B4D;" lspace="0em" mathcolor="#172B4D">.</mo></mrow><annotation encoding="application/x-tex">\displaystyle\nabla\mathcal{L}_{\mathrm{SR}}=\nabla\mathcal{L}_{\mathrm{tok}}=\nabla\mathcal{L}_{\mathrm{TR}}.</annotation></semantics></math>

<br class="ltx_break" style="--ltx-break-space:2.3pt;">
<span id="S1.F1.pic10.1.1.1.1.1" class="ltx_text" style="font-size:71%;--ltx-fg-color:#667085;">Both routes: complete matched-sampler rollouts with exact centering or full KL; deterministic transitions are not required.</span>

<br class="ltx_break" style="--ltx-break-space:2.3pt;">
<math id="S1.F1.pic10.m2" class="ltx_math_unparsed" alttext="\displaystyle v_{u,j}\overset{\mathrm{iid}}{\sim}q(\cdot\mid s_{u}),\hskip 8.19447ptM\geq 1,\hskip 8.19447pt\mathbb{E}_{\mathrm{MC}}\nabla_{\theta}^{\mathrm{AD}}\sum_{u}L^{\mathrm{bp,TR\text{-}MC}}_{\theta,u}=\nabla_{\theta}^{\mathrm{AD}}\sum_{u}L^{\mathrm{bp,TR}}_{\theta,u}." display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">v</mi><mrow><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">u</mi><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">,</mo><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">j</mi></mrow></msub><mover accent="true"><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">∼</mo><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" mathsize="0.700em">iid</mo></mover><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">q</mi><mrow><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" stretchy="false">(</mo><mo style="--ltx-fg-color:#172B4D;" lspace="0em" mathcolor="#172B4D" rspace="0em">⋅</mo><mo style="--ltx-fg-color:#172B4D;" lspace="0em" mathcolor="#172B4D" rspace="0.167em">∣</mo><msub><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">s</mi><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">u</mi></msub><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" rspace="0.987em">,</mo><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">M</mi><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">≥</mo><mn style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">1</mn><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" rspace="0.987em">,</mo><msub><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">𝔼</mi><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">MC</mi></msub><msubsup><mo style="--ltx-fg-color:#172B4D;" lspace="0.167em" mathcolor="#172B4D" rspace="0.167em">∇</mo><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">θ</mi><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">AD</mi></msubsup><mstyle displaystyle="true"><munder><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" movablelimits="false">∑</mo><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">u</mi></munder></mstyle><msubsup><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">L</mi><mrow><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">θ</mi><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">,</mo><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">u</mi></mrow><mrow><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">bp</mi><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">,</mo><mrow><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">TR</mi><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">-</mtext><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">MC</mi></mrow></mrow></msubsup><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">=</mo><msubsup><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" rspace="0.167em">∇</mo><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">θ</mi><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">AD</mi></msubsup><mstyle displaystyle="true"><munder><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D" movablelimits="false">∑</mo><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">u</mi></munder></mstyle><msubsup><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">L</mi><mrow><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">θ</mi><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">,</mo><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">u</mi></mrow><mrow><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">bp</mi><mo style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">,</mo><mi style="--ltx-fg-color:#172B4D;" mathcolor="#172B4D">TR</mi></mrow></msubsup><mo style="--ltx-fg-color:#172B4D;" lspace="0em" mathcolor="#172B4D">.</mo></mrow><annotation encoding="application/x-tex">\displaystyle v_{u,j}\overset{\mathrm{iid}}{\sim}q(\cdot\mid s_{u}),\hskip 8.19447ptM\geq 1,\hskip 8.19447pt\mathbb{E}_{\mathrm{MC}}\nabla_{\theta}^{\mathrm{AD}}\sum_{u}L^{\mathrm{bp,TR\text{-}MC}}_{\theta,u}=\nabla_{\theta}^{\mathrm{AD}}\sum_{u}L^{\mathrm{bp,TR}}_{\theta,u}.</annotation></semantics></math>

