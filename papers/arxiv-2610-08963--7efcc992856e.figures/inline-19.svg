<span id="S1.F1.pic10.1.1.1.1.2" class="ltx_text" style="font-size:71%;--ltx-fg-color:#667085;">Sequence regression (Steps <math id="S1.F1.pic10.m3" class="ltx_Math" alttext="7^{\dagger}" display="inline" intent=":literal"><semantics><msup><mn style="--ltx-fg-color:#667085;" mathcolor="#667085">7</mn><mo style="--ltx-fg-color:#667085;" mathcolor="#667085">†</mo></msup><annotation encoding="application/x-tex">7^{\dagger}</annotation></semantics></math>–<math id="S1.F1.pic10.m4" class="ltx_Math" alttext="9^{\dagger}" display="inline" intent=":literal"><semantics><msup><mn style="--ltx-fg-color:#667085;" mathcolor="#667085">9</mn><mo style="--ltx-fg-color:#667085;" mathcolor="#667085">†</mo></msup><annotation encoding="application/x-tex">9^{\dagger}</annotation></semantics></math>): Figure <a href="#A4.F4" title="Figure 4 ‣ D.2 The Sequence-Regression Route ‣ Appendix D Additional Details for the Main Text ‣ On KL-Regularized Policy Optimization" class="ltx_ref"><span class="ltx_text ltx_ref_tag">4</span></a>. TopK-KL and binary KL: Section <a href="#S5" title="5 Estimating the Local KL Correction ‣ On KL-Regularized Policy Optimization" class="ltx_ref"><span class="ltx_text ltx_ref_tag">5</span></a>.</span></span></span></span>
