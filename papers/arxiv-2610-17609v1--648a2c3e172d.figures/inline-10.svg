<svg id="A5.SS7.SSS0.Px2.p5.pic1" class="ltx_picture" height="179.06" overflow="visible" version="1.1" viewbox="0 0 550 179.06" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,179.06) matrix(1 0 0 -1 0 0)"><clippath id="pgfcp22"><path d="M -22670.54 -22670.54 L 22670.54 -22670.54 L 22670.54 22670.54 L -22670.54 22670.54 Z M 0 2.35 L 0 176.7 C 0 178 1.05 179.06 2.35 179.06 L 547.65 179.06 C 548.95 179.06 550 178 550 176.7 L 550 2.35 C 550 1.05 548.95 0 547.65 0 L 2.35 0 C 1.05 0 0 1.05 0 2.35 Z" /></clippath><g fill-rule="evenodd"><g style="--ltx-fill-color:#C6A34B;" fill="#C6A34B" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.35 L 0 176.7 C 0 178 1.05 179.06 2.35 179.06 L 547.65 179.06 C 548.95 179.06 550 178 550 176.7 L 550 2.35 C 550 1.05 548.95 0 547.65 0 L 2.35 0 C 1.05 0 0 1.05 0 2.35 Z M 0.69 2.35 L 0.69 158.43 L 549.31 158.43 L 549.31 2.35 C 549.31 1.44 548.56 0.69 547.65 0.69 L 2.35 0.69 C 1.44 0.69 0.69 1.44 0.69 2.35 Z M 0.69 158.98 L 0.69 176.7 C 0.69 177.62 1.44 178.36 2.35 178.36 L 547.65 178.36 C 548.56 178.36 549.31 177.62 549.31 176.7 L 549.31 158.98 Z" /></g><g style="--ltx-fill-color:#FCF8EA;" fill="#FCF8EA" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 2.35 L 0.69 158.43 L 549.31 158.43 L 549.31 2.35 C 549.31 1.44 548.56 0.69 547.65 0.69 L 2.35 0.69 C 1.44 0.69 0.69 1.44 0.69 2.35 Z" /></g><g style="--ltx-fill-color:#FCF8EA;" fill="#FCF8EA" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 158.98 L 0.69 176.7 C 0.69 177.62 1.44 178.36 2.35 178.36 L 547.65 178.36 C 548.56 178.36 549.31 177.62 549.31 176.7 L 549.31 158.98 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.57 165.21)"><foreignobject style="--ltx-fo-width:33.49em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="463.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS7.SSS0.Px2.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.49em;">
<span id="A5.SS7.SSS0.Px2.p5.pic1.1.1" class="ltx_p"><span id="A5.SS7.SSS0.Px2.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">What the update changed</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.57 9.68)"><foreignobject style="--ltx-fo-width:38.51em;--ltx-fo-height:10.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="145.14" overflow="visible" transform="matrix(1 0 0 -1 0 142.45)" width="532.87"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS7.SSS0.Px2.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.51em;">
<span id="A5.SS7.SSS0.Px2.p5.pic1.2.1" class="ltx_p"><span id="A5.SS7.SSS0.Px2.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The update keeps all nine existing criteria and appends two: soundness and safety, and structure for readability. It rewrites the aggregation. The weight on correctness rises from <math id="A5.SS7.SSS0.Px2.p5.pic1.m1" class="ltx_Math" alttext="0.25" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.25</mn><annotation encoding="application/x-tex">0.25</annotation></semantics></math> to <math id="A5.SS7.SSS0.Px2.p5.pic1.m2" class="ltx_Math" alttext="0.5" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.5</mn><annotation encoding="application/x-tex">0.5</annotation></semantics></math>, while instruction adherence falls from <math id="A5.SS7.SSS0.Px2.p5.pic1.m3" class="ltx_Math" alttext="0.20" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.20</mn><annotation encoding="application/x-tex">0.20</annotation></semantics></math> to <math id="A5.SS7.SSS0.Px2.p5.pic1.m4" class="ltx_Math" alttext="0.10" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.10</mn><annotation encoding="application/x-tex">0.10</annotation></semantics></math>, completeness from <math id="A5.SS7.SSS0.Px2.p5.pic1.m5" class="ltx_Math" alttext="0.15" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.15</mn><annotation encoding="application/x-tex">0.15</annotation></semantics></math> to <math id="A5.SS7.SSS0.Px2.p5.pic1.m6" class="ltx_Math" alttext="0.10" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.10</mn><annotation encoding="application/x-tex">0.10</annotation></semantics></math>, relevance and clarity from <math id="A5.SS7.SSS0.Px2.p5.pic1.m7" class="ltx_Math" alttext="0.10" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.10</mn><annotation encoding="application/x-tex">0.10</annotation></semantics></math> to <math id="A5.SS7.SSS0.Px2.p5.pic1.m8" class="ltx_Math" alttext="0.05" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.05</mn><annotation encoding="application/x-tex">0.05</annotation></semantics></math>, root-cause specificity and precision of details from <math id="A5.SS7.SSS0.Px2.p5.pic1.m9" class="ltx_Math" alttext="0.10" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.10</mn><annotation encoding="application/x-tex">0.10</annotation></semantics></math> to <math id="A5.SS7.SSS0.Px2.p5.pic1.m10" class="ltx_Math" alttext="0.03" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.03</mn><annotation encoding="application/x-tex">0.03</annotation></semantics></math>, and the mechanical checks from <math id="A5.SS7.SSS0.Px2.p5.pic1.m11" class="ltx_Math" alttext="0.03" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.03</mn><annotation encoding="application/x-tex">0.03</annotation></semantics></math> and <math id="A5.SS7.SSS0.Px2.p5.pic1.m12" class="ltx_Math" alttext="0.02" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.02</mn><annotation encoding="application/x-tex">0.02</annotation></semantics></math> to <math id="A5.SS7.SSS0.Px2.p5.pic1.m13" class="ltx_Math" alttext="0.02" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.02</mn><annotation encoding="application/x-tex">0.02</annotation></semantics></math> each. The multiplicative factor changes from <math id="A5.SS7.SSS0.Px2.p5.pic1.m14" class="ltx_Math" alttext="1-0.8\,(1-\mathrm{co})(1-\mathrm{ia})" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.8</mn><mo lspace="0.170em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">co</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ia</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">1-0.8\,(1-\mathrm{co})(1-\mathrm{ia})</annotation></semantics></math>, which reduces the score only when correctness and instruction adherence both fail, to <math id="A5.SS7.SSS0.Px2.p5.pic1.m15" class="ltx_Math" alttext="0.4+0.6\,\mathrm{co}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.4</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.6</mn><mo lspace="0.170em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">co</mi></mrow></mrow><annotation encoding="application/x-tex">0.4+0.6\,\mathrm{co}</annotation></semantics></math>, which scales every score by correctness alone. A fully incorrect response therefore keeps at most <math id="A5.SS7.SSS0.Px2.p5.pic1.m16" class="ltx_Math" alttext="0.4" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.4</mn><annotation encoding="application/x-tex">0.4</annotation></semantics></math> of its weighted sum under <math id="A5.SS7.SSS0.Px2.p5.pic1.m17" class="ltx_Math" alttext="V_{1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><annotation encoding="application/x-tex">V_{1}</annotation></semantics></math>.</span></span>
</span></span></span></foreignobject></g></g></g></svg>