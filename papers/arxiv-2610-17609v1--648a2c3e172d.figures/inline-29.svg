<span id="A5.SS7.SSS0.Px6.p3.pic1.1.1" class="ltx_p"><span id="A5.SS7.SSS0.Px6.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Candidate adopted at task 128</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.57 9.68)"><foreignobject style="--ltx-fo-width:38.51em;--ltx-fo-height:22.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="311.18" overflow="visible" transform="matrix(1 0 0 -1 0 308.49)" width="532.87"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS7.SSS0.Px6.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.51em;">
<span id="A5.SS7.SSS0.Px6.p3.pic1.2.1" class="ltx_p"><span id="A5.SS7.SSS0.Px6.p3.pic1.2.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Substantive changes.<span id="A5.SS7.SSS0.Px6.p3.pic1.2.1.1.1" class="ltx_text ltx_font_upright"> Two appended criteria (soundness and safety; structure for readability) and a rewritten aggregation that weights correctness at <math id="A5.SS7.SSS0.Px6.p3.pic1.m1" class="ltx_Math" alttext="0.5" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.5</mn><annotation encoding="application/x-tex">0.5</annotation></semantics></math> and multiplies the sum by <math id="A5.SS7.SSS0.Px6.p3.pic1.m2" class="ltx_Math" alttext="0.4+0.6\,\mathrm{co}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.4</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.6</mn><mo lspace="0.170em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">co</mi></mrow></mrow><annotation encoding="application/x-tex">0.4+0.6\,\mathrm{co}</annotation></semantics></math>, as shown in the verifier cards above.</span></span></span>
<span id="A5.SS7.SSS0.Px6.p3.pic1.2.2" class="ltx_p"><span id="A5.SS7.SSS0.Px6.p3.pic1.2.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Selection set.<span id="A5.SS7.SSS0.Px6.p3.pic1.2.2.1.1" class="ltx_text ltx_font_upright"> Worst-family centered accuracy <math id="A5.SS7.SSS0.Px6.p3.pic1.m3" class="ltx_Math" alttext="-0.1667" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.1667</mn></mrow><annotation encoding="application/x-tex">-0.1667</annotation></semantics></math> for the current verifier and <math id="A5.SS7.SSS0.Px6.p3.pic1.m4" class="ltx_Math" alttext="0.0" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.0</mn><annotation encoding="application/x-tex">0.0</annotation></semantics></math> for the selected candidate; mean centered accuracy <math id="A5.SS7.SSS0.Px6.p3.pic1.m5" class="ltx_Math" alttext="0.2708" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.2708</mn><annotation encoding="application/x-tex">0.2708</annotation></semantics></math> and <math id="A5.SS7.SSS0.Px6.p3.pic1.m6" class="ltx_Math" alttext="0.4583" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.4583</mn><annotation encoding="application/x-tex">0.4583</annotation></semantics></math>. This is a strict gain.</span></span></span>
<span id="A5.SS7.SSS0.Px6.p3.pic1.2.3" class="ltx_p"><span id="A5.SS7.SSS0.Px6.p3.pic1.2.3.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Held-out set, centered accuracy by family (candidate versus current verifier).<span id="A5.SS7.SSS0.Px6.p3.pic1.2.3.1.1" class="ltx_text ltx_font_upright"> Omission <math id="A5.SS7.SSS0.Px6.p3.pic1.m7" class="ltx_Math" alttext="0.4792" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.4792</mn><annotation encoding="application/x-tex">0.4792</annotation></semantics></math> vs. <math id="A5.SS7.SSS0.Px6.p3.pic1.m8" class="ltx_Math" alttext="0.3542" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.3542</mn><annotation encoding="application/x-tex">0.3542</annotation></semantics></math>; unsupported claim <math id="A5.SS7.SSS0.Px6.p3.pic1.m9" class="ltx_Math" alttext="0.9792" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.9792</mn><annotation encoding="application/x-tex">0.9792</annotation></semantics></math> vs. <math id="A5.SS7.SSS0.Px6.p3.pic1.m10" class="ltx_Math" alttext="0.9792" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.9792</mn><annotation encoding="application/x-tex">0.9792</annotation></semantics></math>; irrelevant insertion <math id="A5.SS7.SSS0.Px6.p3.pic1.m11" class="ltx_Math" alttext="0.1875" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.1875</mn><annotation encoding="application/x-tex">0.1875</annotation></semantics></math> vs. <math id="A5.SS7.SSS0.Px6.p3.pic1.m12" class="ltx_Math" alttext="-0.0417" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.0417</mn></mrow><annotation encoding="application/x-tex">-0.0417</annotation></semantics></math>; root cause <math id="A5.SS7.SSS0.Px6.p3.pic1.m13" class="ltx_Math" alttext="0.0000" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.0000</mn><annotation encoding="application/x-tex">0.0000</annotation></semantics></math> vs. <math id="A5.SS7.SSS0.Px6.p3.pic1.m14" class="ltx_Math" alttext="0.0000" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.0000</mn><annotation encoding="application/x-tex">0.0000</annotation></semantics></math>. Candidate successes per family: 71/96, 95/96, 57/96, 12/24.</span></span></span>
<span id="A5.SS7.SSS0.Px6.p3.pic1.2.4" class="ltx_p"><span id="A5.SS7.SSS0.Px6.p3.pic1.2.4.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Paired held-out result.<span id="A5.SS7.SSS0.Px6.p3.pic1.2.4.1.1" class="ltx_text ltx_font_upright"> 19 pairs won only by the candidate, 2 won only by the current verifier. No family regressed by more than <math id="A5.SS7.SSS0.Px6.p3.pic1.m15" class="ltx_Math" alttext="0.10" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.10</mn><annotation encoding="application/x-tex">0.10</annotation></semantics></math>.</span></span></span>
<span id="A5.SS7.SSS0.Px6.p3.pic1.2.5" class="ltx_p"><span id="A5.SS7.SSS0.Px6.p3.pic1.2.5.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Decision.<span id="A5.SS7.SSS0.Px6.p3.pic1.2.5.1.1" class="ltx_text ltx_font_upright"> The candidate was adopted under the empirical verifier-update rule. Auxiliary
confidence bounds were mixed: the paired lower bound cleared <math id="A5.SS7.SSS0.Px6.p3.pic1.m16" class="ltx_Math" alttext="0.5" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.5</mn><annotation encoding="application/x-tex">0.5</annotation></semantics></math>, whereas the per-family lower
bounds did not reach the logged threshold. We therefore interpret this as an observed improvement
on the comparison sets, without a population-level claim.</span></span></span>
</span></span></span></foreignobject></g></g></g></svg>