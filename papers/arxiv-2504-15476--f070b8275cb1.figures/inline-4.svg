</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 18.6 128.45)"><foreignobject style="--ltx-fo-width:44.51em;--ltx-fo-height:1.9em;--ltx-fo-depth:8.19em;font-size:10pt;" height="139.6" overflow="visible" transform="matrix(1 0 0 -1 0 26.29)" width="615.89"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS2.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.51em;">
<span id="A5.SS2.p4.pic1.2.1" class="ltx_p"><span id="A5.SS2.p4.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The following are example queries from <math id="A5.SS2.p4.pic1.m2" class="ltx_Math" alttext="\mathcal{Q}_{\text{tmp}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒬</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">tmp</mtext></msub><annotation encoding="application/x-tex">\mathcal{Q}_{\text{tmp}}</annotation></semantics></math>, sourced from Reddit movie recommendation discussions. These templates guide the style and tone of synthetic query generation.</span></span>
<span id="A5.SS2.p4.pic1.2.2" class="ltx_p"><span id="A5.SS2.p4.pic1.2.2.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">“Sick with Covid, dealing with some serious cabin fever. Any good carefree films that might lighten the mood?”</span></span>
<span id="A5.SS2.p4.pic1.2.3" class="ltx_p"><span id="A5.SS2.p4.pic1.2.3.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">“Movies about the friends made along the way. I’m interested in movies where the main character continually meets and befriends new interesting characters. Maybe the main character is on a journey. Maybe the relationships with the new characters both begin and end during the story. Something like ‘Into the Wild’ would be perfect.”<span id="A5.SS2.p4.pic1.2.3.1.1" class="ltx_text"></span></span></span>
</span></span></span></foreignobject></g></g></svg>