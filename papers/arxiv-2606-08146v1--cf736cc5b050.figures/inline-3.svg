--ltx-fo-width:47.52em;--ltx-fo-height:4.29em;--ltx-fo-depth:0.19em;font-size:10pt;" height="62.11" overflow="visible" transform="matrix(1 0 0 -1 0 59.42)" width="657.54"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S5.SS3.SSS0.Px2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.52em;">
<span id="S5.SS3.SSS0.Px2.p2.pic1.2.1" class="ltx_p"><span id="S5.SS3.SSS0.Px2.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">SAGE’s performance is largely insensitive to the underlying LLM: all five backbones keep its win rate above <math id="S5.SS3.SSS0.Px2.p2.pic1.m1" class="ltx_Math" alttext="85\%" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">85</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow><annotation encoding="application/x-tex">85\%</annotation></semantics></math> (average <math id="S5.SS3.SSS0.Px2.p2.pic1.m2" class="ltx_Math" alttext="88.80\%" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">88.80</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow><annotation encoding="application/x-tex">88.80\%</annotation></semantics></math>), with an average spread of only <math id="S5.SS3.SSS0.Px2.p2.pic1.m3" class="ltx_Math" alttext="1.13\%" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1.13</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow><annotation encoding="application/x-tex">1.13\%</annotation></semantics></math> in AUPRC and <math id="S5.SS3.SSS0.Px2.p2.pic1.m4" class="ltx_Math" alttext="3.60\%" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3.60</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">%</mo></mrow><annotation encoding="application/x-tex">3.60\%</annotation></semantics></math> in F1 across datasets. It is also the least sensitive method to the random data splits, showing that the framework, rather than any specific model or partition, drives its effectiveness.</span></span>
</span></span></span></foreignobject></g></g></svg>