<span id="S5.SS4.SSS0.Px2.p2.pic1.pic2.2.1" class="ltx_p"><span id="S5.SS4.SSS0.Px2.p2.pic1.pic2.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;">High scale_pos_weight=27.58 combined with threshold=0.50 inflates positive predictions causing precision collapse; also missing engineered features on rich IEEE-fraud columns (TransactionAmt, C1/C13/C14, D1/D2/D15, card1/addr1/emaildomain) which are known high-signal.
