<span id="S5.SS4.SSS0.Px2.p2.pic1.pic3.2.1" class="ltx_p"><span id="S5.SS4.SSS0.Px2.p2.pic1.pic3.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:80%;">(1) Raise threshold 0.50<math id="S5.SS4.SSS0.Px2.p2.pic1.pic3.m1" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math>0.55 to restore precision. (2) Reduce scale_pos_weight 27.58<math id="S5.SS4.SSS0.Px2.p2.pic1.pic3.m2" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math>15.0 to reduce false positives while keeping recall. (3) Strengthen model: n_estimators 500<math id="S5.SS4.SSS0.Px2.p2.pic1.pic3.m3" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math>800, max_depth 7<math id="S5.SS4.SSS0.Px2.p2.pic1.pic3.m4" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math>8, learning_rate 0.05<math id="S5.SS4.SSS0.Px2.p2.pic1.pic3.m5" class="ltx_Math" alttext="\rightarrow" display="inline" intent=":literal"><semantics><mo stretchy="false">→</mo><annotation encoding="application/x-tex">\rightarrow</annotation></semantics></math>0.03. (4) Add features: log1p(TransactionAmt), C1/C13 and C14/C1 ratios, D1<math id="S5.SS4.SSS0.Px2.p2.pic1.pic3.m6" class="ltx_Math" alttext="-" display="inline" intent=":literal"><semantics><mo>−</mo><annotation encoding="application/x-tex">-</annotation></semantics></math>D2, D15/D1, frequency encoding of card1/addr1/P_emaildomain, card1<math id="S5.SS4.SSS0.Px2.p2.pic1.pic3.m7" class="ltx_Math" alttext="\times" display="inline" intent=":literal"><semantics><mo>×</mo><annotation encoding="application/x-tex">\times</annotation></semantics></math>card2.
</span></span>
</span></span></span></foreignobject></g></g></svg>