tx-fo-width:47.52em;--ltx-fo-height:3.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="45.51" overflow="visible" transform="matrix(1 0 0 -1 0 42.82)" width="657.54"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S5.SS5.SSS0.Px1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.52em;">
<span id="S5.SS5.SSS0.Px1.p2.pic1.2.1" class="ltx_p"><span id="S5.SS5.SSS0.Px1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The three agents form a progressive value chain: <math id="S5.SS5.SSS0.Px1.p2.pic1.m1" class="ltx_Math" alttext="\mathcal{A}_{1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒜</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><annotation encoding="application/x-tex">\mathcal{A}_{1}</annotation></semantics></math> supplies data insight, <math id="S5.SS5.SSS0.Px1.p2.pic1.m2" class="ltx_Math" alttext="\mathcal{A}_{2}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒜</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><annotation encoding="application/x-tex">\mathcal{A}_{2}</annotation></semantics></math> makes the optimal algorithmic decision, and <math id="S5.SS5.SSS0.Px1.p2.pic1.m3" class="ltx_Math" alttext="\mathcal{A}_{3}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒜</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></msub><annotation encoding="application/x-tex">\mathcal{A}_{3}</annotation></semantics></math> pushes performance to its ceiling through iterative optimization. Their contributions are complementary rather than redundant, and removing any one degrades performance.</span></span>
</span></span></span></foreignobject></g></g></svg>