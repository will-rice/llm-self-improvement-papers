<svg id="S4.SS2.SSS1.p2.pic1" class="ltx_picture" height="467.78" overflow="visible" version="1.1" viewbox="0 0 687.5 467.78" width="687.5"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,467.78) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.7 L 0 459.08 C 0 463.88 3.9 467.78 8.7 467.78 L 678.8 467.78 C 683.6 467.78 687.5 463.88 687.5 459.08 L 687.5 8.7 C 687.5 3.9 683.6 0 678.8 0 L 8.7 0 C 3.9 0 0 3.9 0 8.7 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.83 8.7 L 0.83 459.08 C 0.83 463.43 4.36 466.95 8.7 466.95 L 678.8 466.95 C 683.14 466.95 686.67 463.43 686.67 459.08 L 686.67 8.7 C 686.67 4.36 683.14 0.83 678.8 0.83 L 8.7 0.83 C 4.36 0.83 0.83 4.36 0.83 8.7 Z" /></g><g style="--ltx-fill-color:#000000;" fill="#000000"><path style="stroke:none" d="M 160.08 476.6 L 16.88 476.6 C 15.35 476.6 14.11 475.36 14.11 473.83 L 14.11 461.73 C 14.11 460.2 15.35 458.96 16.88 458.96 L 160.08 458.96 C 161.61 458.96 162.85 460.2 162.85 461.73 L 162.85 473.83 C 162.85 475.36 161.61 476.6 160.08 476.6 Z M 14.11 458.96" /></g><g style="--ltx-stroke-color:#FFFFFF;--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" stroke="#FFFFFF" transform="matrix(1.0 0.0 0.0 1.0 22.42 465.19)"><foreignobject style="--ltx-fo-width:5.36em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:9pt;" height="11.07" overflow="visible" transform="matrix(1 0 0 -1 0 8.65)" width="66.72"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S4.SS2.SSS1.p2.pic1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Prompt for <math id="S4.SS2.SSS1.p2.pic1.m1" class="ltx_Math" alttext="\mathrm{LLM}_{\mathrm{codegen}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">LLM</mi><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">codegen</mi></msub><annotation encoding="application/x-tex">\mathrm{LLM}_{\mathrm{codegen}}</annotation></semantics></math></span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.84 18.6)"><foreignobject style="--ltx-fo-width:51.24em;--ltx-fo-height:31.32em;--ltx-fo-depth:0.2em;font-size:10pt;" height="436.11" overflow="visible" transform="matrix(1 0 0 -1 0 433.35)" width="709.02"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S4.SS2.SSS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:51.24em;">
<span id="S4.SS2.SSS1.p2.pic1.2.1" class="ltx_p"><span id="S4.SS2.SSS1.p2.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You are an expert ML engineer for fraud detection. You will receive a Data Diagnostic Tree (DDT) describing the target dataset and must (i) choose a suitable algorithm, (ii) generate a complete Python training code following the structure (Loading, Preprocessing, Feature Engineering, Training, Metric Computation), and (iii) provide a brief justification for your algorithm choice.</span></span>
<span id="S4.SS2.SSS1.p2.pic1.2.2" class="ltx_p"><span id="S4.SS2.SSS1.p2.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">DDT (input):
<br class="ltx_break"><span id="S4.SS2.SSS1.p2.pic1.2.2.1.1" class="ltx_text ltx_font_typewriter ltx_font_medium">&lt;DDT omitted for brevity&gt;<span id="S4.SS2.SSS1.p2.pic1.2.2.1.1.1" class="ltx_text ltx_font_serif">
</span></span></span></span>
<span id="S4.SS2.SSS1.p2.pic1.2.3" class="ltx_p"><span id="S4.SS2.SSS1.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Empirical cues:<span id="S4.SS2.SSS1.p2.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="S4.I1" class="ltx_itemize ltx_leftmargin_flush">
<span id="S4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I1.i1.p1" class="ltx_para">
<span id="S4.I1.i1.p1.1" class="ltx_p"><span id="S4.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">XGBoost</span><span id="S4.I1.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> — robust missing-value handling; strong on heterogeneous tabular features.</span></span>
</span></span>
<span id="S4.I1.i2" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I1.i2.p1" class="ltx_para">
<span id="S4.I1.i2.p1.1" class="ltx_p"><span id="S4.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">LightGBM</span><span id="S4.I1.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> — high training efficiency on large-scale datasets (</span><math id="S4.I1.i2.p1.m1" class="ltx_Math" alttext="&gt;" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">&gt;</mo><annotation encoding="application/x-tex">&gt;</annotation></semantics></math><span id="S4.I1.i2.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">1M rows).</span></span>
</span></span>
<span id="S4.I1.i3" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I1.i3.p1" class="ltx_para">
<span id="S4.I1.i3.p1.1" class="ltx_p"><span id="S4.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">CatBoost</span><span id="S4.I1.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> — native categorical encoding; strong with high-cardinality categoricals.</span></span>
</span></span>
<span id="S4.I1.i4" class="ltx_item" style="list-style-type:none;padding-top:0.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="S4.I1.i4.p1" class="ltx_para">
<span id="S4.I1.i4.p1.1" class="ltx_p"><math id="S4.I1.i4.p1.m1" class="ltx_Math" alttext="\cdots" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">⋯</mo><annotation encoding="application/x-tex">\cdots</annotation></semantics></math><span id="S4.I1.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> (additional candidates may be appended via prompt extension)</span></span>
</span></span>
</span>
<span id="S4.SS2.SSS1.p2.pic1.2.4" class="ltx_p"><span id="S4.SS2.SSS1.p2.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Selection guidelines:<span id="S4.SS2.SSS1.p2.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> Read <math id="S4.SS2.SSS1.p2.pic1.m2" class="ltx_Math" alttext="L_{\mathrm{scale}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">L</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">scale</mi></msub><annotation encoding="application/x-tex">L_{\mathrm{scale}}</annotation></semantics></math> for size, <math id="S4.SS2.SSS1.p2.pic1.m3" class="ltx_Math" alttext="L_{\mathrm{label}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">L</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">label</mi></msub><annotation encoding="application/x-tex">L_{\mathrm{label}}</annotation></semantics></math> for imbalance, <math id="S4.SS2.SSS1.p2.pic1.m4" class="ltx_Math" alttext="L_{\mathrm{feature}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">L</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">feature</mi></msub><annotation encoding="application/x-tex">L_{\mathrm{feature}}</annotation></semantics></math> for feature typing, and <math id="S4.SS2.SSS1.p2.pic1.m5" class="ltx_Math" alttext="L_{\mathrm{quality}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">L</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">quality</mi></msub><annotation encoding="application/x-tex">L_{\mathrm{quality}}</annotation></semantics></math> for missingness. Weigh these jointly; a single layer should not dominate.</span></span></span>
<span id="S4.SS2.SSS1.p2.pic1.2.5" class="ltx_p"><span id="S4.SS2.SSS1.p2.pic1.2.5.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Output format:<span id="S4.SS2.SSS1.p2.pic1.2.5.1.1" class="ltx_text ltx_font_medium"> JSON with fields <span id="S4.SS2.SSS1.p2.pic1.2.5.1.1.1" class="ltx_text ltx_font_typewriter">algorithm</span>, <span id="S4.SS2.SSS1.p2.pic1.2.5.1.1.2" class="ltx_text ltx_font_typewriter">code</span>, <span id="S4.SS2.SSS1.p2.pic1.2.5.1.1.3" class="ltx_text ltx_font_typewriter">justification</span>.</span></span></span>
</span></span></span></foreignobject></g></g></svg>