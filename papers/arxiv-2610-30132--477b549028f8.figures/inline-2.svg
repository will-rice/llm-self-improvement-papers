<span id="A3.SS2.p1.pic1.2.1" class="ltx_p"><span id="A3.SS2.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Question:<span id="A3.SS2.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> In what year was Soleil Tincture first used by Enrico Vittori?
<br class="ltx_break"></span>Answer:<span id="A3.SS2.p1.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> 1897, from F11 Soleil Tincture was used by Enrico Vittori in 1897.
<br class="ltx_break"></span>Distractors:<span id="A3.SS2.p1.pic1.2.1.1.3" class="ltx_text ltx_font_medium"> D8 Enrico Vittori used Soleil Tincture in the development of the Luminosa Antiseptic in 1890; D9 Soleil Tincture was used by Enrico Vittori in 1896.
<br class="ltx_break"></span>Documents:<span id="A3.SS2.p1.pic1.2.1.1.4" class="ltx_text ltx_font_medium"> “Vittori’s application of Soleil Tincture in the development process in 1890 was instrumental …”; “Soleil Tincture’s documented use by Enrico Vittori in 1896 and 1897 was primarily within the context of specific, localized outbreaks …”
<br class="ltx_break"></span>Filtering answers:<span id="A3.SS2.p1.pic1.2.1.1.5" class="ltx_text ltx_font_medium"> 1896 ✗, 1896 ✗, 1890 ✗, 1890 ✗.</span></span></span>
