</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.16 11.55)"><foreignobject style="--ltx-fo-width:45.73em;--ltx-fo-height:21.09em;--ltx-fo-depth:0.2em;font-size:10pt;" height="294.65" overflow="visible" transform="matrix(1 0 0 -1 0 291.89)" width="632.77"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.73em;">
<span id="A3.SS1.p1.pic1.2.1" class="ltx_p"><span id="A3.SS1.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Question:<span id="A3.SS1.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> Who was the researcher who used the Vitae Extract developed by Aurora Biologica in 1885?
<br class="ltx_break"></span>Answer:<span id="A3.SS1.p1.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> Sofia Bianchi.
<br class="ltx_break"></span>Supporting facts:<span id="A3.SS1.p1.pic1.2.1.1.3" class="ltx_text ltx_font_medium"> F2 Aurora Biologica developed Vitae Extract in 1885, in Document 1; F3 Sofia Bianchi used Vitae Extract in 1887, in Document 8.
<br class="ltx_break"></span>Distractors:<span id="A3.SS1.p1.pic1.2.1.1.4" class="ltx_text ltx_font_medium"> D2 Sofia Bianchi was the head of the research division at Aurora Biologica in 1886, in Document 1; D3 Sofia Bianchi worked on the development of the Luminosa Antiseptic for Aurora Farmaceutica in 1890, in Document 5.
<br class="ltx_break"></span>Document 1:<span id="A3.SS1.p1.pic1.2.1.1.5" class="ltx_text ltx_font_medium"> “By the end of 1885, Vitae Extract had become Aurora Biologica’s first commercially viable product …”
<br class="ltx_break"></span>Document 8:<span id="A3.SS1.p1.pic1.2.1.1.6" class="ltx_text ltx_font_medium"> “Sofia Bianchi’s work with Vitae Extract in 1887 provides a valuable case study for understanding the intersection of early research and regulatory oversight.”
<br class="ltx_break"></span>Filtering answers:<span id="A3.SS1.p1.pic1.2.1.1.7" class="ltx_text ltx_font_medium"> Sofia Bianchi ✓, Marco Rossi ✗.</span></span></span>
</span></span></span></foreignobject></g></g></svg>