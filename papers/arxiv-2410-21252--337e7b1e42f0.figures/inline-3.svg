<span id="A2.F5.pic1.p1.1" class="ltx_p"><span id="A2.F5.pic1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will receive a user query about an uploaded document (the document will not be displayed to you due to its length) and the answer from an AI document QA assistant. Your task is to extract factual statements from the answer provided. These factual statements are typically expressed in individual sentences and must be directly based on the information in the document, not introductory sentences, transition sentences, or summaries, inferences, or deductions based on previous answer content. If a factual statement lacks a subject or contains pronouns such as &quot;he/she/it/these/those&quot;, you must add the subject or resolve the pronoun based on the context. You must output in the following format:</span></span>
</span>
