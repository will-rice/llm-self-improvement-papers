<svg id="A2.F4.pic1" class="ltx_picture ltx_centering" height="358.15" overflow="visible" version="1.1" viewbox="0 0 653.15 358.15" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,358.15) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="0.1"><path style="stroke:none" d="M 0 4.53 L 0 353.62 C 0 356.12 2.03 358.15 4.53 358.15 L 648.62 358.15 C 651.12 358.15 653.15 356.12 653.15 353.62 L 653.15 4.53 C 653.15 2.03 651.12 0 648.62 0 L 4.53 0 C 2.03 0 0 2.03 0 4.53 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="0.1"><path style="stroke:none" d="M 1.57 4.53 L 1.57 353.62 C 1.57 355.25 2.9 356.57 4.53 356.57 L 648.62 356.57 C 650.25 356.57 651.57 355.25 651.57 353.62 L 651.57 4.53 C 651.57 2.9 650.25 1.57 648.62 1.57 L 4.53 1.57 C 2.9 1.57 1.57 2.9 1.57 4.53 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.39 9.96)"><foreignobject style="--ltx-fo-width:45.27em;--ltx-fo-height:24.69em;--ltx-fo-depth:0.25em;font-size:10pt;" height="345.16" overflow="visible" transform="matrix(1 0 0 -1 0 341.7)" width="626.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A2.F4.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:45.27em;">
<span id="A2.F4.pic1.p1" class="ltx_para ltx_noindent">
<span id="A2.F4.pic1.p1.1" class="ltx_p"><span id="A2.F4.pic1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert at evaluating the quality of text.</span></span>
</span>
<span id="A2.F4.pic1.p2" class="ltx_para">
<span id="A2.F4.pic1.p2.1" class="ltx_p"><span id="A2.F4.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">As an impartial evaluator, please assess the logicality of an AI document question-and-answer assistant’s response to a user’s query. Specifically, assess whether the different parts of the response are logically consistent, whether the viewpoints remain consistent throughout, and whether the reasoning and calculations are correct, without self-contradictions.</span></span>
<span id="A2.F4.pic1.p2.2" class="ltx_p"><span id="A2.F4.pic1.p2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You must first provide an analysis and then rate the response strictly according to the following format with a rating from 0 to 10: “[[Rating]]”, for example: “[[5]]”. 
<br class="ltx_break"></span></span>
<span id="A2.F4.pic1.p2.3" class="ltx_p"><span id="A2.F4.pic1.p2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Make sure not to use any information or knowledge outside of the assistant’s response during the evaluation, and focus solely on the logical consistency of the response. 
<br class="ltx_break"></span></span>
<span id="A2.F4.pic1.p2.4" class="ltx_p"><span id="A2.F4.pic1.p2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here are a few scoring examples: 
<br class="ltx_break"></span></span>
<span id="A2.F4.pic1.p2.5" class="ltx_p"><span id="A2.F4.pic1.p2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F4.pic1.p2.5.1.1" class="ltx_text ltx_font_italic">Example 1</span>}</span></span>
<span id="A2.F4.pic1.p2.6" class="ltx_p"><span id="A2.F4.pic1.p2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F4.pic1.p2.6.1.1" class="ltx_text ltx_font_italic">Example 2</span>}</span></span>
<span id="A2.F4.pic1.p2.7" class="ltx_p"><span id="A2.F4.pic1.p2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F4.pic1.p2.7.1.1" class="ltx_text ltx_font_italic">Example 3</span>} 
<br class="ltx_break"></span></span>
<span id="A2.F4.pic1.p2.8" class="ltx_p"><span id="A2.F4.pic1.p2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now, please rate the following AI assistant’s response based on the scoring principles and examples above: 
<br class="ltx_break"></span></span>
<span id="A2.F4.pic1.p2.9" class="ltx_p"><span id="A2.F4.pic1.p2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Question]</span></span>
<span id="A2.F4.pic1.p2.10" class="ltx_p"><span id="A2.F4.pic1.p2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F4.pic1.p2.10.1.1" class="ltx_text ltx_font_italic">Query</span>} 
<br class="ltx_break"></span></span>
<span id="A2.F4.pic1.p2.11" class="ltx_p"><span id="A2.F4.pic1.p2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Assistant’s Answer Begins]</span></span>
<span id="A2.F4.pic1.p2.12" class="ltx_p"><span id="A2.F4.pic1.p2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F4.pic1.p2.12.1.1" class="ltx_text ltx_font_italic">Model Response</span>}</span></span>
<span id="A2.F4.pic1.p2.13" class="ltx_p"><span id="A2.F4.pic1.p2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Assistant’s Answer Ends] 
<br class="ltx_break"></span></span>
<span id="A2.F4.pic1.p2.14" class="ltx_p"><span id="A2.F4.pic1.p2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Analysis]</span></span>
</span></span></span></span></foreignobject></g></g></svg>