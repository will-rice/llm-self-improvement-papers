<svg id="A2.F8.pic1" class="ltx_picture ltx_centering" height="424.57" overflow="visible" version="1.1" viewbox="0 0 653.15 424.57" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,424.57) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="0.1"><path style="stroke:none" d="M 0 4.53 L 0 420.04 C 0 422.54 2.03 424.57 4.53 424.57 L 648.62 424.57 C 651.12 424.57 653.15 422.54 653.15 420.04 L 653.15 4.53 C 653.15 2.03 651.12 0 648.62 0 L 4.53 0 C 2.03 0 0 2.03 0 4.53 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="0.1"><path style="stroke:none" d="M 1.57 4.53 L 1.57 420.04 C 1.57 421.67 2.9 422.99 4.53 422.99 L 648.62 422.99 C 650.25 422.99 651.57 421.67 651.57 420.04 L 651.57 4.53 C 651.57 2.9 650.25 1.57 648.62 1.57 L 4.53 1.57 C 2.9 1.57 1.57 2.9 1.57 4.53 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.39 9.96)"><foreignobject style="--ltx-fo-width:45.27em;--ltx-fo-height:29.49em;--ltx-fo-depth:0.25em;font-size:10pt;" height="411.58" overflow="visible" transform="matrix(1 0 0 -1 0 408.12)" width="626.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A2.F8.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:45.27em;">
<span id="A2.F8.pic1.p1" class="ltx_para ltx_noindent">
<span id="A2.F8.pic1.p1.1" class="ltx_p"><span id="A2.F8.pic1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert at evaluating the quality of text.</span></span>
</span>
<span id="A2.F8.pic1.p2" class="ltx_para">
<span id="A2.F8.pic1.p2.1" class="ltx_p"><span id="A2.F8.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will receive a user’s question regarding a document, the relevant information from each part of the document, and an answer from an AI document question-answering assistant. Your task is to carefully assess the completeness of the AI assistant’s answer based on the given information—that is, whether the answer covers the key points highly relevant to the question, does not omit important aspects, and provides sufficient information and details to meet the user’s needs.</span></span>
<span id="A2.F8.pic1.p2.2" class="ltx_p"><span id="A2.F8.pic1.p2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You need to first provide an analysis and then rate the answer on a scale from 0 to 10 strictly in the following format: &quot;[[rating]]&quot;, for example: &quot;[[5]]&quot;.</span></span>
<span id="A2.F8.pic1.p2.3" class="ltx_p"><span id="A2.F8.pic1.p2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here are a few scoring examples: 
<br class="ltx_break"></span></span>
<span id="A2.F8.pic1.p2.4" class="ltx_p"><span id="A2.F8.pic1.p2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F8.pic1.p2.4.1.1" class="ltx_text ltx_font_italic">Example 1</span>}</span></span>
<span id="A2.F8.pic1.p2.5" class="ltx_p"><span id="A2.F8.pic1.p2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F8.pic1.p2.5.1.1" class="ltx_text ltx_font_italic">Example 2</span>}</span></span>
<span id="A2.F8.pic1.p2.6" class="ltx_p"><span id="A2.F8.pic1.p2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F8.pic1.p2.6.1.1" class="ltx_text ltx_font_italic">Example 3</span>} 
<br class="ltx_break"></span></span>
<span id="A2.F8.pic1.p2.7" class="ltx_p"><span id="A2.F8.pic1.p2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now, please rate the following AI assistant’s response based on the scoring principles and examples above: 
<br class="ltx_break"></span></span>
<span id="A2.F8.pic1.p2.8" class="ltx_p"><span id="A2.F8.pic1.p2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Question]</span></span>
<span id="A2.F8.pic1.p2.9" class="ltx_p"><span id="A2.F8.pic1.p2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F8.pic1.p2.9.1.1" class="ltx_text ltx_font_italic">Query</span>} 
<br class="ltx_break"></span></span>
<span id="A2.F8.pic1.p2.10" class="ltx_p"><span id="A2.F8.pic1.p2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Document <math id="A2.F8.pic1.m1" class="ltx_Math" alttext="a" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><annotation encoding="application/x-tex">a</annotation></semantics></math>% - <math id="A2.F8.pic1.m2" class="ltx_Math" alttext="b" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><annotation encoding="application/x-tex">b</annotation></semantics></math>% related information]</span></span>
<span id="A2.F8.pic1.p2.11" class="ltx_p"><span id="A2.F8.pic1.p2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F8.pic1.p2.11.1.1" class="ltx_text ltx_font_italic">related information list 1</span>} 
<br class="ltx_break"></span></span>
<span id="A2.F8.pic1.p2.12" class="ltx_p"><span id="A2.F8.pic1.p2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Document <math id="A2.F8.pic1.m3" class="ltx_Math" alttext="c" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">c</mi><annotation encoding="application/x-tex">c</annotation></semantics></math>% - <math id="A2.F8.pic1.m4" class="ltx_Math" alttext="d" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">d</mi><annotation encoding="application/x-tex">d</annotation></semantics></math>% related information]</span></span>
<span id="A2.F8.pic1.p2.13" class="ltx_p"><span id="A2.F8.pic1.p2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F8.pic1.p2.13.1.1" class="ltx_text ltx_font_italic">related information list 2</span>} 
<br class="ltx_break"></span></span>
<span id="A2.F8.pic1.p2.14" class="ltx_p"><span id="A2.F8.pic1.p2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">… 
<br class="ltx_break"></span></span>
<span id="A2.F8.pic1.p2.15" class="ltx_p"><span id="A2.F8.pic1.p2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Assistant’s Answer Begins]</span></span>
<span id="A2.F8.pic1.p2.16" class="ltx_p"><span id="A2.F8.pic1.p2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F8.pic1.p2.16.1.1" class="ltx_text ltx_font_italic">Model Response</span>}</span></span>
<span id="A2.F8.pic1.p2.17" class="ltx_p"><span id="A2.F8.pic1.p2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Assistant’s Answer Ends] 
<br class="ltx_break"></span></span>
<span id="A2.F8.pic1.p2.18" class="ltx_p"><span id="A2.F8.pic1.p2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Analysis]</span></span>
</span></span></span></span></foreignobject></g></g></svg>