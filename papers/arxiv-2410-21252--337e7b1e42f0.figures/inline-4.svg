<svg id="A2.F6.pic1" class="ltx_picture ltx_centering" height="507.59" overflow="visible" version="1.1" viewbox="0 0 653.15 507.59" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,507.59) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="0.1"><path style="stroke:none" d="M 0 4.53 L 0 503.06 C 0 505.56 2.03 507.59 4.53 507.59 L 648.62 507.59 C 651.12 507.59 653.15 505.56 653.15 503.06 L 653.15 4.53 C 653.15 2.03 651.12 0 648.62 0 L 4.53 0 C 2.03 0 0 2.03 0 4.53 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="0.1"><path style="stroke:none" d="M 1.57 4.53 L 1.57 503.06 C 1.57 504.69 2.9 506.01 4.53 506.01 L 648.62 506.01 C 650.25 506.01 651.57 504.69 651.57 503.06 L 651.57 4.53 C 651.57 2.9 650.25 1.57 648.62 1.57 L 4.53 1.57 C 2.9 1.57 1.57 2.9 1.57 4.53 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.39 9.96)"><foreignobject style="--ltx-fo-width:45.27em;--ltx-fo-height:35.49em;--ltx-fo-depth:0.25em;font-size:10pt;" height="494.6" overflow="visible" transform="matrix(1 0 0 -1 0 491.14)" width="626.41"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A2.F6.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:45.27em;">
<span id="A2.F6.pic1.p1" class="ltx_para ltx_noindent">
<span id="A2.F6.pic1.p1.1" class="ltx_p"><span id="A2.F6.pic1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert at evaluating the quality of text.</span></span>
</span>
<span id="A2.F6.pic1.p2" class="ltx_para">
<span id="A2.F6.pic1.p2.1" class="ltx_p"><span id="A2.F6.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You will receive a question from the user regarding an uploaded document, a factual statement in the AI assistant’s response based on that document, and several fragments from the document (since the document is too long to display in its entirety). Your task is to carefully assess whether the statement is supported by these fragments. Please use the following ratings to generate your assessment:</span></span>
<span id="A2.F6.pic1.p2.2" class="ltx_p"><span id="A2.F6.pic1.p2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">- [[Fully supported]] - Almost all of the information in the statement is supported by or extracted from the fragments. This applies only if the statement is almost exactly the same as part of the content in the fragments.</span></span>
<span id="A2.F6.pic1.p2.3" class="ltx_p"><span id="A2.F6.pic1.p2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">- [[Partially supported]] - More than half of the content in the statement is supported by the fragments, but there are minor parts not present in or inconsistent with the fragments. For example, if the statement has two main points and only one is supported by the fragments, it should be considered partially supported.</span></span>
<span id="A2.F6.pic1.p2.4" class="ltx_p"><span id="A2.F6.pic1.p2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">- [[No support]] - The statement is largely unrelated to the fragments, or most of the key points in the statement are inconsistent with the fragments.</span></span>
<span id="A2.F6.pic1.p2.5" class="ltx_p"><span id="A2.F6.pic1.p2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Ensure that you do not use any information or knowledge beyond the fragments provided, and only check whether the statement is supported by the fragments.</span></span>
<span id="A2.F6.pic1.p2.6" class="ltx_p"><span id="A2.F6.pic1.p2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">You must provide an analysis first, followed by the rating.</span></span>
<span id="A2.F6.pic1.p2.7" class="ltx_p"><span id="A2.F6.pic1.p2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here are some examples: 
<br class="ltx_break"></span></span>
<span id="A2.F6.pic1.p2.8" class="ltx_p"><span id="A2.F6.pic1.p2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F6.pic1.p2.8.1.1" class="ltx_text ltx_font_italic">Example 1</span>}</span></span>
<span id="A2.F6.pic1.p2.9" class="ltx_p"><span id="A2.F6.pic1.p2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F6.pic1.p2.9.1.1" class="ltx_text ltx_font_italic">Example 2</span>}</span></span>
<span id="A2.F6.pic1.p2.10" class="ltx_p"><span id="A2.F6.pic1.p2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F6.pic1.p2.10.1.1" class="ltx_text ltx_font_italic">Example 3</span>} 
<br class="ltx_break"></span></span>
<span id="A2.F6.pic1.p2.11" class="ltx_p"><span id="A2.F6.pic1.p2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now, please refer to the rating principles and the above examples to rate the following statement: 
<br class="ltx_break"></span></span>
<span id="A2.F6.pic1.p2.12" class="ltx_p"><span id="A2.F6.pic1.p2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Statement]</span></span>
<span id="A2.F6.pic1.p2.13" class="ltx_p"><span id="A2.F6.pic1.p2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F6.pic1.p2.13.1.1" class="ltx_text ltx_font_italic">Factual statement</span>} 
<br class="ltx_break"></span></span>
<span id="A2.F6.pic1.p2.14" class="ltx_p"><span id="A2.F6.pic1.p2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Fragment 1]</span></span>
<span id="A2.F6.pic1.p2.15" class="ltx_p"><span id="A2.F6.pic1.p2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F6.pic1.p2.15.1.1" class="ltx_text ltx_font_italic">Context chunk 1</span>}</span></span>
<span id="A2.F6.pic1.p2.16" class="ltx_p"><span id="A2.F6.pic1.p2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Fragment 2]</span></span>
<span id="A2.F6.pic1.p2.17" class="ltx_p"><span id="A2.F6.pic1.p2.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F6.pic1.p2.17.1.1" class="ltx_text ltx_font_italic">Context chunk 2</span>}</span></span>
<span id="A2.F6.pic1.p2.18" class="ltx_p"><span id="A2.F6.pic1.p2.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">… 
<br class="ltx_break"></span></span>
<span id="A2.F6.pic1.p2.19" class="ltx_p"><span id="A2.F6.pic1.p2.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Analysis]</span></span>
</span></span></span></span></foreignobject></g></g></svg>