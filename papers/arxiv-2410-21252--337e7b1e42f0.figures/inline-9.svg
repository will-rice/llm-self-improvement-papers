<span id="A2.F11.pic1.p1" class="ltx_para ltx_noindent">
<span id="A2.F11.pic1.p1.1" class="ltx_inline-block fa fa-user" aria-hidden="true">
</span>
<span id="A2.F11.pic1.p1.2" class="ltx_p"><span id="A2.F11.pic1.p1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;"></span><span id="A2.F11.pic1.p1.2.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Question</span><span id="A2.F11.pic1.p1.2.3" class="ltx_text" style="--ltx-fg-color:#000000;">: Summarize the technical route and development status of Zhipu AI based on the text above.
</span>
<br class="ltx_break">
<br class="ltx_break">
<span id="A2.F11.pic1.p1.2.4" class="ltx_inline-block fa fa-cogs" aria-hidden="true">
</span><span id="A2.F11.pic1.p1.2.5" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="A2.F11.pic1.p1.2.6" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Llama-3.1-8B-SFT</span><span id="A2.F11.pic1.p1.2.7" class="ltx_text" style="--ltx-fg-color:#000000;">:</span></span>
</span>
<span id="A2.F11.pic1.p2" class="ltx_para">
<span id="A2.F11.pic1.p2.1" class="ltx_p"><span id="A2.F11.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The technical route and development progress of Zhipu AI are as follows:</span></span>
<span id="A2.I6" class="ltx_enumerate">
<span id="A2.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A2.I6.i1.p1" class="ltx_para">
<span id="A2.I6.i1.p1.1" class="ltx_p"><span id="A2.I6.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">…</span></span>
</span></span>
<span id="A2.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A2.I6.i2.p1" class="ltx_para">
<span id="A2.I6.i2.p1.1" class="ltx_p"><span id="A2.I6.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">…</span></span>
</span></span>
<span id="A2.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A2.I6.i3.p1" class="ltx_para">
<span id="A2.I6.i3.p1.1" class="ltx_p"><span id="A2.I6.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">…</span></span>
</span></span>
<span id="A2.I6.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A2.I6.i4.p1" class="ltx_para">
<span id="A2.I6.i4.p1.1" class="ltx_p"><span id="A2.I6.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Zhipu AI has made significant progress in the research and development of large model technology, such as </span><span id="A2.I6.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#FF0000;">multimodal large models</span><span id="A2.I6.i4.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> like VisualGLM-6B, CogVLM, and </span><span id="A2.I6.i4.p1.1.4" class="ltx_text" style="--ltx-fg-color:#FF0000;">AgentLM</span><span id="A2.I6.i4.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">, promoting the diversification of large model technologies.</span></span>
</span></span>
<span id="A2.I6.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A2.I6.i5.p1" class="ltx_para">
<span id="A2.I6.i5.p1.1" class="ltx_p"><span id="A2.I6.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">…</span></span>
</span></span>
<span id="A2.I6.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">6.</span> 
<span id="A2.I6.i6.p1" class="ltx_para">
<span id="A2.I6.i6.p1.1" class="ltx_p"><span id="A2.I6.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">…</span></span>
</span></span>
</span>
<span id="A2.F11.pic1.p2.2" class="ltx_p"><span id="A2.F11.pic1.p2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">
<br class="ltx_break"></span></span>
<span id="A2.F11.pic1.p2.3" class="ltx_inline-block fa fa-cogs" aria-hidden="true">
</span>
<span id="A2.F11.pic1.p2.4" class="ltx_p"><span id="A2.F11.pic1.p2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;"><span id="A2.F11.pic1.p2.4.1.1" class="ltx_text ltx_font_bold">Llama-3.1-8B-DPO w/ LongReward</span>:</span></span>
<span id="A2.F11.pic1.p2.5" class="ltx_p"><span id="A2.F11.pic1.p2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">The technical roadmap and development of Zhipu AI can be summarized as follows:</span></span>
<span id="A2.I7" class="ltx_enumerate">
<span id="A2.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A2.I7.i1.p1" class="ltx_para">
<span id="A2.I7.i1.p1.1" class="ltx_p"><span id="A2.I7.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Zhipu AI focuses on the research and application of large-scale language models, launching the GLM series models, including ChatGLM, CodeGeeX, etc. These models perform excellently in Chinese and multilingual fields.</span></span>
</span></span>
<span id="A2.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A2.I7.i2.p1" class="ltx_para">
<span id="A2.I7.i2.p1.1" class="ltx_p"><span id="A2.I7.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Zhipu AI continuously optimizes the performance of the GLM series models, releasing upgraded versions such as ChatGLM2 and ChatGLM2-6B with significant performance improvements. ChatGLM3 is the latest version with even stronger capabilities.</span></span>
</span></span>
<span id="A2.I7.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A2.I7.i3.p1" class="ltx_para">
<span id="A2.I7.i3.p1.1" class="ltx_p"><span id="A2.I7.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The GLM series models from Zhipu AI natively support multimodal capabilities, including VisualGLM, CogVLM, and more, allowing them to process various media types like images and videos.</span></span>
</span></span>
<span id="A2.I7.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A2.I7.i4.p1" class="ltx_para">
<span id="A2.I7.i4.p1.1" class="ltx_p"><span id="A2.I7.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Zhipu AI developed the AgentLM model, which possesses intelligent agent capabilities to accomplish complex tasks such as tool invocation, code execution, database operations, and more.</span></span>
</span></span>
<span id="A2.I7.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A2.I7.i5.p1" class="ltx_para">
<span id="A2.I7.i5.p1.1" class="ltx_p"><span id="A2.I7.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Zhipu AI has launched generative AI assistant products like Zhipu Qingyan, leveraging the GLM series models to provide intelligent services.</span></span>
</span></span>
<span id="A2.I7.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">6.</span> 
<span id="A2.I7.i6.p1" class="ltx_para">
<span id="A2.I7.i6.p1.1" class="ltx_p"><span id="A2.I7.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Zhipu AI is committed to promoting open-source large models, offering open-source code and APIs for models like ChatGLM, CodeGeeX, VisualGLM, CogVLM, and AgentLM.</span></span>
</span></span>
<span id="A2.I7.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">7.</span> 
<span id="A2.I7.i7.p1" class="ltx_para">
<span id="A2.I7.i7.p1.1" class="ltx_p"><span id="A2.I7.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Zhipu AI collaborates with ecosystem partners to provide infrastructure and computational power support for large models.</span></span>
</span></span>
<span id="A2.I7.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">8.</span> 
<span id="A2.I7.i8.p1" class="ltx_para">
<span id="A2.I7.i8.p1.1" class="ltx_p"><span id="A2.I7.i8.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Zhipu AI introduced the “Z Plan,” providing investment, technical services, and resources to global entrepreneurs working on large models.</span></span>
</span></span>
<span id="A2.I7.i9" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">9.</span> 
<span id="A2.I7.i9.p1" class="ltx_para">
<span id="A2.I7.i9.p1.1" class="ltx_p"><span id="A2.I7.i9.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Zhipu AI continues to delve into research on large models, exploring their application across various industries.</span></span>
</span></span>
</span>
<span id="A2.F11.pic1.p2.6" class="ltx_p"><span id="A2.F11.pic1.p2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">Overall, Zhipu AI is at the forefront of the large-scale language model field, driving improvements in model performance and multimodal capabilities, and making significant contributions to the advancement and application of AI technology.</span></span>
</span></span></span></span></foreignobject></g></g></svg>