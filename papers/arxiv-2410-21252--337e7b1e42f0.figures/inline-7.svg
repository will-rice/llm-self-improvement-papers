<span id="A2.I3.i4.p1.1" class="ltx_p"><span id="A2.I3.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#FF0000;">Ethical Considerations: …</span><span id="A2.I3.i4.p1.1.2" class="ltx_text"></span></span>
</span></span>
</span>
<span id="A2.F9.pic1.p2.7" class="ltx_p"><span id="A2.F9.pic1.p2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">
<br class="ltx_break"></span></span>
<span id="A2.F9.pic1.p2.8" class="ltx_inline-block fa fa-cogs" aria-hidden="true">
</span>
<span id="A2.F9.pic1.p2.9" class="ltx_p"><span id="A2.F9.pic1.p2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;"><span id="A2.F9.pic1.p2.9.1.1" class="ltx_text ltx_font_bold">Llama-3.1-8B-DPO w/ LongReward</span>:</span></span>
<span id="A2.F9.pic1.p2.10" class="ltx_p"><span id="A2.F9.pic1.p2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">PaLM achieved impressive results on BigBench, a recently released benchmark of over 150 language understanding and generation tasks:</span></span>
<span id="A2.I4" class="ltx_itemize">
<span id="A2.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i1.p1" class="ltx_para">
<span id="A2.I4.i1.p1.1" class="ltx_p"><span id="A2.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">PaLM significantly outperformed previous state-of-the-art models like GPT-3, Gopher, and Chinchilla on the majority of the tasks evaluated.</span></span>
</span></span>
<span id="A2.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i2.p1" class="ltx_para">
<span id="A2.I4.i2.p1.1" class="ltx_p"><span id="A2.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">5-shot PaLM 540B achieved a higher score than the average score of humans asked to solve the same tasks on a large subset of the tasks.</span></span>
</span></span>
<span id="A2.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i3.p1" class="ltx_para">
<span id="A2.I4.i3.p1.1" class="ltx_p"><span id="A2.I4.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">PaLM outperformed previous SOTA on 44 out of the 58 common tasks evaluated.</span></span>
</span></span>
<span id="A2.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i4.p1" class="ltx_para">
<span id="A2.I4.i4.p1.1" class="ltx_p"><span id="A2.I4.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The performance of PaLM models as a function of scale appeared to follow log-linear behavior, indicating further scaling up is likely to result in increased performance.</span></span>
</span></span>
<span id="A2.I4.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i5.p1" class="ltx_para">
<span id="A2.I4.i5.p1.1" class="ltx_p"><span id="A2.I4.i5.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">PaLM showed breakthrough performance on tasks requiring logical reasoning like goal step wikihow and logical args, achieving accuracy close to the best human performance.</span></span>
</span></span>
<span id="A2.I4.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i6.p1" class="ltx_para">
<span id="A2.I4.i6.p1.1" class="ltx_p"><span id="A2.I4.i6.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">PaLM also showed strong performance on tasks like english proverbs and logical sequence that require abstract reasoning, with large improvements from 62B to 540B model scale.</span></span>
</span></span>
<span id="A2.I4.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i7.p1" class="ltx_para">
<span id="A2.I4.i7.p1.1" class="ltx_p"><span id="A2.I4.i7.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">However, PaLM did not show significant improvement on tasks like navigate and mathematical induction that have high example-level difficulty.</span></span>
</span></span>
<span id="A2.I4.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i8.p1" class="ltx_para">
<span id="A2.I4.i8.p1.1" class="ltx_p"><span id="A2.I4.i8.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Overall, PaLM achieved state-of-the-art few-shot results on a wide array of language understanding and generation tasks in BigBench, demonstrating the continued benefits of scaling language models.</span></span>
</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>