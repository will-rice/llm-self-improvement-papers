<span id="A2.I3.i2.p1" class="ltx_para">
<span id="A2.I3.i2.p1.1" class="ltx_p"><span id="A2.I3.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Discontinuous Improvements: …</span></span>
</span></span>
<span id="A2.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
