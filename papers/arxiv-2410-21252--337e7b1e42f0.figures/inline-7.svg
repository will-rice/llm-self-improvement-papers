<span id="A2.F9.pic1.p1.1" class="ltx_inline-block fa fa-user" aria-hidden="true">
</span>
<span id="A2.F9.pic1.p1.2" class="ltx_p"><span id="A2.F9.pic1.p1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;"></span><span id="A2.F9.pic1.p1.2.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Question</span><span id="A2.F9.pic1.p1.2.3" class="ltx_text" style="--ltx-fg-color:#000000;">: Please summarize PaLM’s results on BigBench. </span>
<br class="ltx_break"></span>
</span>
<span id="A2.F9.pic1.p2" class="ltx_para">
<span id="A2.F9.pic1.p2.1" class="ltx_inline-block fa fa-cogs" aria-hidden="true">
</span>
<span id="A2.F9.pic1.p2.2" class="ltx_p"><span id="A2.F9.pic1.p2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;"><span id="A2.F9.pic1.p2.2.1.1" class="ltx_text ltx_font_bold">Llama-3.1-8B-SFT</span>:</span></span>
<span id="A2.F9.pic1.p2.3" class="ltx_p"><span id="A2.F9.pic1.p2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">PaLM achieved impressive results on BigBench, a diverse collection of 150+ language understanding and generation tasks. Here’s a summary:</span></span>
<span id="A2.F9.pic1.p2.4" class="ltx_p"><span id="A2.F9.pic1.p2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Overall Performance:</span></span>
<span id="A2.I1" class="ltx_itemize">
<span id="A2.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i1.p1" class="ltx_para">
<span id="A2.I1.i1.p1.1" class="ltx_p"><span id="A2.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">State-of-the-Art: PaLM significantly outperformed previous state-of-the-art models like GPT-3, Gopher, and Chinchilla across a wide range of tasks.</span></span>
</span></span>
<span id="A2.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i2.p1" class="ltx_para">
<span id="A2.I1.i2.p1.1" class="ltx_p"><span id="A2.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Close to Human Performance: PaLM 5-shot achieved a higher score than the average human performance on 44 out of 58 common tasks.</span></span>
</span></span>
<span id="A2.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I1.i3.p1" class="ltx_para">
<span id="A2.I1.i3.p1.1" class="ltx_p"><span id="A2.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Log-Linear Scaling: The performance of PaLM models as a function of scale followed a log-linear behavior, indicating potential for further improvements with larger models.</span></span>
</span></span>
</span>
<span id="A2.F9.pic1.p2.5" class="ltx_p"><span id="A2.F9.pic1.p2.5.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task Highlights:<span id="A2.F9.pic1.p2.5.1.1" class="ltx_text"></span></span></span>
