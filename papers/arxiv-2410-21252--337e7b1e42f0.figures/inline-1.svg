<span id="A2.F3.pic1.p1" class="ltx_para ltx_noindent">
<span id="A2.F3.pic1.p1.1" class="ltx_p"><span id="A2.F3.pic1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are an expert at evaluating the quality of text.</span></span>
</span>
<span id="A2.F3.pic1.p2" class="ltx_para">
<span id="A2.F3.pic1.p2.1" class="ltx_p"><span id="A2.F3.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">As an impartial evaluator, please assess the usefulness of an AI document question-and-answer assistant’s response to a user’s query. Specifically, evaluate whether the response: 1) is relevant to the question; 2) meets the user’s purpose and needs; 3) provides a thorough and appropriate answer; 4) meets the user’s formatting requirements, if any;</span></span>
<span id="A2.F3.pic1.p2.2" class="ltx_p"><span id="A2.F3.pic1.p2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You must first provide an analysis and then rate the response strictly according to the following format with a rating from 0 to 10: “[[Rating]]”, for example: “[[5]]”. 
<br class="ltx_break"></span></span>
<span id="A2.F3.pic1.p2.3" class="ltx_p"><span id="A2.F3.pic1.p2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here are a few scoring examples: 
<br class="ltx_break"></span></span>
<span id="A2.F3.pic1.p2.4" class="ltx_p"><span id="A2.F3.pic1.p2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F3.pic1.p2.4.1.1" class="ltx_text ltx_font_italic">Example 1</span>}</span></span>
<span id="A2.F3.pic1.p2.5" class="ltx_p"><span id="A2.F3.pic1.p2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F3.pic1.p2.5.1.1" class="ltx_text ltx_font_italic">Example 2</span>}</span></span>
<span id="A2.F3.pic1.p2.6" class="ltx_p"><span id="A2.F3.pic1.p2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F3.pic1.p2.6.1.1" class="ltx_text ltx_font_italic">Example 3</span>}</span></span>
<span id="A2.F3.pic1.p2.7" class="ltx_p"><span id="A2.F3.pic1.p2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F3.pic1.p2.7.1.1" class="ltx_text ltx_font_italic">Example 4</span>} 
<br class="ltx_break"></span></span>
<span id="A2.F3.pic1.p2.8" class="ltx_p"><span id="A2.F3.pic1.p2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now, please rate the following AI assistant’s response based on the scoring principles and examples above: 
<br class="ltx_break"></span></span>
<span id="A2.F3.pic1.p2.9" class="ltx_p"><span id="A2.F3.pic1.p2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Question]</span></span>
<span id="A2.F3.pic1.p2.10" class="ltx_p"><span id="A2.F3.pic1.p2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F3.pic1.p2.10.1.1" class="ltx_text ltx_font_italic">Query</span>} 
<br class="ltx_break"></span></span>
<span id="A2.F3.pic1.p2.11" class="ltx_p"><span id="A2.F3.pic1.p2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Assistant’s Answer Begins]</span></span>
<span id="A2.F3.pic1.p2.12" class="ltx_p"><span id="A2.F3.pic1.p2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">{<span id="A2.F3.pic1.p2.12.1.1" class="ltx_text ltx_font_italic">Model Response</span>}</span></span>
<span id="A2.F3.pic1.p2.13" class="ltx_p"><span id="A2.F3.pic1.p2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Assistant’s Answer Ends] 
<br class="ltx_break"></span></span>
<span id="A2.F3.pic1.p2.14" class="ltx_p"><span id="A2.F3.pic1.p2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">[Analysis]</span></span>
