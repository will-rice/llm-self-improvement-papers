</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:4.35em;--ltx-fo-depth:0em;font-size:10pt;" height="60.19" overflow="visible" transform="matrix(1 0 0 -1 0 60.19)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS3.p10.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A1.SS3.p10.pic1.2.1" class="ltx_p"><span id="A1.SS3.p10.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">We optimize the teacher parameters <math id="A1.SS3.p10.pic1.m1" class="ltx_Math" alttext="\phi" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi><annotation encoding="application/x-tex">\phi</annotation></semantics></math> to maximize <math id="A1.SS3.p10.pic1.m2" class="ltx_Math" alttext="\mathcal{F}(q_{\phi})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℱ</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\mathcal{F}(q_{\phi})</annotation></semantics></math> (effectively minimizing <math id="A1.SS3.p10.pic1.m3" class="ltx_math_unparsed" alttext="D_{\mathrm{KL}}(q_{\phi}\parallel\pi^{*})" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">KL</mi></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi></msub><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">∥</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</mo></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">D_{\mathrm{KL}}(q_{\phi}\parallel\pi^{*})</annotation></semantics></math>). As derived in Section <a href="#S3.SS2" title="3.2 E-Step: Teacher Refinement via Off-policy Preference Optimization ‣ 3 Variational Policy Distillation ‣ Learning from Language Feedback viaVariational Policy Distillation" class="ltx_ref"><span class="ltx_text ltx_ref_tag">3.2</span></a>, we approximate this optimization using Binary Classifier Optimization on the implicit rewards.</span></span>
