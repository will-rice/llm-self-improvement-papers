</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:6.69em;--ltx-fo-depth:0em;font-size:10pt;" height="92.63" overflow="visible" transform="matrix(1 0 0 -1 0 92.63)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS3.p13.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A1.SS3.p13.pic1.2.1" class="ltx_p"><span id="A1.SS3.p13.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Operating on the mathematical decomposition above, we project this refined knowledge back into the student policy space. By minimizing <math id="A1.SS3.p13.pic1.m1" class="ltx_math_unparsed" alttext="D_{\mathrm{KL}}(\pi_{\theta}\parallel q_{\phi})" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">KL</mi></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></msub><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">∥</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϕ</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">D_{\mathrm{KL}}(\pi_{\theta}\parallel q_{\phi})</annotation></semantics></math> over the student’s on-policy rollouts, we strictly minimize the remaining divergence against our optimal surrogate, completing the distillation cycle without requiring the privileged feedback <math id="A1.SS3.p13.pic1.m2" class="ltx_Math" alttext="\mathcal{C}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒞</mi><annotation encoding="application/x-tex">\mathcal{C}</annotation></semantics></math> at inference time.</span></span>
</span></span></span></foreignobject></g></g></svg>