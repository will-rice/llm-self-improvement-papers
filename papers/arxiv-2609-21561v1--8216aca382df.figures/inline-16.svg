<span id="A1.SS2.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.57em;">
<span id="A1.SS2.p5.pic1.2.1" class="ltx_p"><span id="A1.SS2.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Fine-grained credit assignment performs best. Small pools remain effective, while larger pools and permutation increasingly weaken learning. The two teachers therefore provide information about where credit should be assigned, not just a sequence-level signed update.</span></span>
