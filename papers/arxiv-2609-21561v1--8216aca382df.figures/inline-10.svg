<span id="S5.SS2.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.57em;">
<span id="S5.SS2.p5.pic1.2.1" class="ltx_p"><span id="S5.SS2.p5.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#64B5A6;">Contrastive</span><span id="S5.SS2.p5.pic1.2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> self-distillation also improves a model that has no explicit thinking mode to activate.
Its gains therefore extend beyond switching the model into thinking mode.
<span id="S5.SS2.p5.pic1.2.1.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#E47B71;">Repulsive</span> alone still makes responses grow until truncation causes collapse, whereas <span id="S5.SS2.p5.pic1.2.1.2.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#64B5A6;">contrastive</span> training improves performance with controlled response-length growth.</span></span>
</span></span></span></foreignobject></g></g></svg>