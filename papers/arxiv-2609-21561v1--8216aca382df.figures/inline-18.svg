<span id="A1.SS3.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.57em;">
<span id="A1.SS3.p3.pic1.2.1" class="ltx_p"><span id="A1.SS3.p3.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">The privileged context governs how much the model reasons. Retaining the model’s own thinking trace lets reasoning lengthen over training and gives the strongest accuracy. Removing it drives the thinking segment toward zero, and replacing the rollout with an expert demonstration strengthens this effect.</span></span>
</span></span></span></foreignobject></g></g></svg>