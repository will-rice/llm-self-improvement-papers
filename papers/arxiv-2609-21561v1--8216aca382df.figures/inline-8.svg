<span id="S5.SS1.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.57em;">
<span id="S5.SS1.p5.pic1.2.1" class="ltx_p"><span id="S5.SS1.p5.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#E47B71;">Repulsive</span><span id="S5.SS1.p5.pic1.2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> self-distillation makes the model use reasoning behavior it already has, but does not outperform simply enabling thinking mode.
It also makes responses grow until they are truncated and performance collapses.
<span id="S5.SS1.p5.pic1.2.1.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#64B5A6;">Contrastive</span> self-distillation improves performance while keeping response-length growth under control.</span></span>
</span></span></span></foreignobject></g></g></svg>