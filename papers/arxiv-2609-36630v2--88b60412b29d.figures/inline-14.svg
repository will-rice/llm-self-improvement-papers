<span id="S2.SS2.p2.pic1.p1.1" class="ltx_p"><span id="S2.SS2.p2.pic1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">[Step 1] </span><span id="S2.SS2.p2.pic1.p1.1.2" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Reproduce</span><span id="S2.SS2.p2.pic1.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">:
