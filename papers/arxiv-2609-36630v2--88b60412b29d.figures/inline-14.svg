</span>
<span id="S2.SS2.p2.pic1.p4" class="ltx_para ltx_noindent">
<span id="S2.SS2.p2.pic1.p4.1" class="ltx_p"><span id="S2.SS2.p2.pic1.p4.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">[Step 4] </span><span id="S2.SS2.p2.pic1.p4.1.2" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Rollback</span><span id="S2.SS2.p2.pic1.p4.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">:
The teacher reverts the broad patch and restores the repository to its pre-patch state.</span></span>
</span>
<span id="S2.SS2.p2.pic1.p5" class="ltx_para ltx_noindent">
<span id="S2.SS2.p2.pic1.p5.1" class="ltx_p"><span id="S2.SS2.p2.pic1.p5.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">[Step 5] </span><span id="S2.SS2.p2.pic1.p5.1.2" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Local fix</span><span id="S2.SS2.p2.pic1.p5.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">:
