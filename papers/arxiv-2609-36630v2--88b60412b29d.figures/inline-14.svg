</span>
<span id="S2.SS2.p2.pic1.p6" class="ltx_para ltx_noindent">
<span id="S2.SS2.p2.pic1.p6.1" class="ltx_p"><span id="S2.SS2.p2.pic1.p6.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">[Step 6] </span><span id="S2.SS2.p2.pic1.p6.1.2" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Verify</span><span id="S2.SS2.p2.pic1.p6.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">:
