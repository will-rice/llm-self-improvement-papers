<span id="A1.SS3.p3.pic1.2.4" class="ltx_p"><span id="A1.SS3.p3.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;"># <span id="A1.SS3.p3.pic1.2.4.1.1" class="ltx_text ltx_font_typewriter">SETUP INSTRUCT</span>:
<br class="ltx_break">Setup. Use Mermaid syntax only and produce exactly one valid Mermaid diagram definition. Do not output explanations, comments outside the code block, or code in other languages or formats. Do not split the diagram into multiple blocks. Ensure the code can be rendered directly by mermaid-cli (mmdc). 
