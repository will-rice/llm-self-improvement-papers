<span id="A1.SS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.8em;">
<span id="A1.SS1.p1.pic1.2.1" class="ltx_p"><span id="A1.SS1.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Model: GPT-4.1-mini
<br class="ltx_break">
<br class="ltx_break"><span id="A1.SS1.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium"># <span id="A1.SS1.p1.pic1.2.1.1.1.1" class="ltx_text ltx_font_typewriter">LANGUAGE</span>= [<span id="A1.SS1.p1.pic1.2.1.1.1.2" class="ltx_text ltx_font_typewriter">Python</span>, <span id="A1.SS1.p1.pic1.2.1.1.1.3" class="ltx_text ltx_font_typewriter">JavaScript</span>, <span id="A1.SS1.p1.pic1.2.1.1.1.4" class="ltx_text ltx_font_typewriter">TypeScript</span>, <span id="A1.SS1.p1.pic1.2.1.1.1.5" class="ltx_text ltx_font_typewriter">C++</span>, <span id="A1.SS1.p1.pic1.2.1.1.1.6" class="ltx_text ltx_font_typewriter">R</span>, <span id="A1.SS1.p1.pic1.2.1.1.1.7" class="ltx_text ltx_font_typewriter">HTML</span>]
<br class="ltx_break"># <span id="A1.SS1.p1.pic1.2.1.1.1.8" class="ltx_text ltx_font_typewriter">LANG_BULLET</span> = { 
<br class="ltx_break"><span id="A1.SS1.p1.pic1.2.1.1.1.9" class="ltx_text ltx_font_typewriter">Python</span>: Write a single <span id="A1.SS1.p1.pic1.2.1.1.1.10" class="ltx_text ltx_font_typewriter">.py</span> file. No external files or internet access. Use helper libraries only if truly required for the chart. 
<br class="ltx_break"><span id="A1.SS1.p1.pic1.2.1.1.1.11" class="ltx_text ltx_font_typewriter">JavaScript</span>: Write a single <span id="A1.SS1.p1.pic1.2.1.1.1.12" class="ltx_text ltx_font_typewriter">.js</span> file. Add necessary imports for any required libraries. 
<br class="ltx_break"><span id="A1.SS1.p1.pic1.2.1.1.1.13" class="ltx_text ltx_font_typewriter">TypeScript</span>: Write a single <span id="A1.SS1.p1.pic1.2.1.1.1.14" class="ltx_text ltx_font_typewriter">.ts</span> file. Use ES6 module syntax (import/export). The code should not require a module bundler. 
<br class="ltx_break"><span id="A1.SS1.p1.pic1.2.1.1.1.15" class="ltx_text ltx_font_typewriter">C++</span>: Write a single <span id="A1.SS1.p1.pic1.2.1.1.1.16" class="ltx_text ltx_font_typewriter">.cpp</span> file with <span id="A1.SS1.p1.pic1.2.1.1.1.17" class="ltx_text ltx_font_typewriter">main()</span>. Program must exit automatically. Do not load external assets. If linking is needed, add one build command as a comment. 
<br class="ltx_break"><span id="A1.SS1.p1.pic1.2.1.1.1.18" class="ltx_text ltx_font_typewriter">R</span>: Write a single <span id="A1.SS1.p1.pic1.2.1.1.1.19" class="ltx_text ltx_font_typewriter">.R</span> file. Use <span id="A1.SS1.p1.pic1.2.1.1.1.20" class="ltx_text ltx_font_typewriter">library(Library)</span>. Create mock data if needed. No external files. 
<br class="ltx_break"><span id="A1.SS1.p1.pic1.2.1.1.1.21" class="ltx_text ltx_font_typewriter">HTML</span>: Write a single HTML file. Include a <span id="A1.SS1.p1.pic1.2.1.1.1.22" class="ltx_text ltx_font_typewriter">&lt;script&gt;</span> tag and the needed DOM element for the chart. All code runs in the browser. 
<br class="ltx_break">} 
<br class="ltx_break">
<br class="ltx_break"></span></span></span>
<span id="A1.SS1.p1.pic1.2.2" class="ltx_p"><span id="A1.SS1.p1.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a <span id="A1.SS1.p1.pic1.2.2.1.1" class="ltx_text ltx_font_typewriter">{LANGUAGE}</span> visualization code extraction agent.
<br class="ltx_break"></span></span>
<span id="A1.SS1.p1.pic1.2.3" class="ltx_p"><span id="A1.SS1.p1.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">Given a <span id="A1.SS1.p1.pic1.2.3.1.1" class="ltx_text ltx_font_typewriter">{LANGUAGE}</span> code snippet and the used library, your task is to extract a <span id="A1.SS1.p1.pic1.2.3.1.2" class="ltx_text ltx_font_bold">minimal yet runnable</span> <span id="A1.SS1.p1.pic1.2.3.1.3" class="ltx_text ltx_font_typewriter">{LANGUAGE}</span> snippet that reflects how the library is actually used <span id="A1.SS1.p1.pic1.2.3.1.4" class="ltx_text ltx_font_bold">for visual output</span>.</span></span>
<span id="A1.SS1.p1.pic1.2.4" class="ltx_p"><span id="A1.SS1.p1.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Guidelines:
- Keep only the logic needed for the <span id="A1.SS1.p1.pic1.2.4.1.1" class="ltx_text ltx_font_bold">visual output</span>; remove unrelated code.
<br class="ltx_break">- If the library is <span id="A1.SS1.p1.pic1.2.4.1.2" class="ltx_text ltx_font_bold">not used for rendering/drawing/plotting</span> in Code, return ”null”.
<br class="ltx_break">- If inputs/assets are missing, create <span id="A1.SS1.p1.pic1.2.4.1.3" class="ltx_text ltx_font_bold">semantically relevant</span> mock data that makes the output meaningful.
<br class="ltx_break">- Preserve the <span id="A1.SS1.p1.pic1.2.4.1.4" class="ltx_text ltx_font_bold">main intent</span>, API pattern, key parameters, and style** from the original code; simplify when it improves clarity, and avoid adding new wrappers or layers that are not essential.
<br class="ltx_break">- Make the <span id="A1.SS1.p1.pic1.2.4.1.5" class="ltx_text ltx_font_bold">visual output</span> clear and professional: use appropriate visual cues (titles/labels/legends when applicable); keep layout readable.
<br class="ltx_break">- Ensure the snippet runs standalone in a minimal environment and <span id="A1.SS1.p1.pic1.2.4.1.6" class="ltx_text ltx_font_bold">terminates automatically</span> (no user input required).
<br class="ltx_break">- <span id="A1.SS1.p1.pic1.2.4.1.7" class="ltx_text ltx_font_typewriter">{LANG_BULLET}</span> 
<br class="ltx_break">- If the library is unused or information is insufficient, return ”null”. 
<br class="ltx_break">
<br class="ltx_break">Used Library:
<span id="A1.SS1.p1.pic1.2.4.1.8" class="ltx_text ltx_font_typewriter">{used_libs}</span></span></span>
