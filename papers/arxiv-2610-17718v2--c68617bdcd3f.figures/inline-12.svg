<span id="S10.SS4.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.34em;">
<span id="S10.SS4.p1.pic1.2.1" class="ltx_p"><span id="S10.SS4.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#70528F;">System role.<span id="S10.SS4.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> You audit a candidate ECG training example.</span></span></span>
<span id="S10.SS4.p1.pic1.2.2" class="ltx_p"><span id="S10.SS4.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#235E91;">User inputs.<span id="S10.SS4.p1.pic1.2.2.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> [source and edited evidence], [target/protected-feature checks], [question and options], [context provenance], [proposed answer and teacher response], [fixed rubric and aggregation rule].</span></span></span>
<span id="S10.SS4.p1.pic1.2.3" class="ltx_p"><span id="S10.SS4.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#70528F;">Instructions.<span id="S10.SS4.p1.pic1.2.3.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> <span id="S10.SS4.p1.pic1.2.3.1.1.1" class="ltx_text ltx_font_bold">Independently solve the question</span>, then audit target attainment, protected drift, morphology, context consistency, answer uniqueness, leakage, and explanation support. Return separate decisions for each gate and cite the relevant observation. Score only with the supplied rubric. The aggregate-score threshold is </span><span id="S10.SS4.p1.pic1.2.3.1.2" class="ltx_text" style="--ltx-fg-color:#235E91;">80/100<span id="S10.SS4.p1.pic1.2.3.1.2.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;">, but <span id="S10.SS4.p1.pic1.2.3.1.2.1.1" class="ltx_text ltx_font_bold">every mandatory gate must also pass</span>.</span></span></span></span>
<span id="S10.SS4.p1.pic1.2.4" class="ltx_p"><span id="S10.SS4.p1.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#235E91;">Output fields.<span id="S10.SS4.p1.pic1.2.4.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> Independent answer; gate-wise pass/fail decisions and evidence; rubric scores; aggregate if defined; accept/review/reject status; failure codes and repair target.</span></span></span>
