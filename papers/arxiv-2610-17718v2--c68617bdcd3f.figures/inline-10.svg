<span id="S10.SS2.p1.pic1.1.1" class="ltx_p"><span id="S10.SS2.p1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#70528F;">Prompt P2</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.38 10.38)"><foreignobject style="--ltx-fo-width:46.34em;--ltx-fo-height:21.2em;--ltx-fo-depth:0em;font-size:10pt;" height="293.35" overflow="visible" transform="matrix(1 0 0 -1 0 293.35)" width="641.22"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S10.SS2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.34em;">
<span id="S10.SS2.p1.pic1.2.1" class="ltx_p"><span id="S10.SS2.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#70528F;">System role.<span id="S10.SS2.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> You construct ECG multiple-choice questions from verified signal evidence. Keep internal labels and generator intent out of the student-visible question.</span></span></span>
<span id="S10.SS2.p1.pic1.2.2" class="ltx_p"><span id="S10.SS2.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#235E91;">User inputs.<span id="S10.SS2.p1.pic1.2.2.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> [verified ECG image], [measurement evidence], [supported label level], [target category], [question type and difficulty], [option count], [context policy], [permitted source context].</span></span></span>
<span id="S10.SS2.p1.pic1.2.3" class="ltx_p"><span id="S10.SS2.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#70528F;">Instructions.<span id="S10.SS2.p1.pic1.2.3.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> Write one question with exactly the requested number of options and </span><span id="S10.SS2.p1.pic1.2.3.1.2" class="ltx_text" style="--ltx-fg-color:#235E91;">one evidence-supported answer<span id="S10.SS2.p1.pic1.2.3.1.2.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;">. Use plausible distractors that remain incorrect for this signal. Ask only at the supported level: measurement, ECG pattern, or clinically supported diagnosis. Default to image-only or traceable demographics. <span id="S10.SS2.p1.pic1.2.3.1.2.1.1" class="ltx_text ltx_font_bold">Mark any synthetic teaching context explicitly</span> and check it against the achieved waveform.</span></span></span></span>
<span id="S10.SS2.p1.pic1.2.4" class="ltx_p"><span id="S10.SS2.p1.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#235E91;">Output fields.<span id="S10.SS2.p1.pic1.2.4.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> Student-visible question, options, and allowed context; evaluator-only answer, evidence mapping, context provenance, category, and difficulty; ambiguity or insufficient-evidence flag.</span></span></span>
</span></span></span></foreignobject></g></g></svg>