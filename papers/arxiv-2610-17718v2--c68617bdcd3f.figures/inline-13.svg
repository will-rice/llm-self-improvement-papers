<span id="S10.SS5.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.34em;">
<span id="S10.SS5.p1.pic1.2.1" class="ltx_p"><span id="S10.SS5.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#70528F;">System role.<span id="S10.SS5.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> You propose a minimal repair to a failed data-construction component while keeping the acceptance <span id="S10.SS5.p1.pic1.2.1.1.1.1" class="ltx_text">criteria fixed</span>.</span></span></span>
<span id="S10.SS5.p1.pic1.2.2" class="ltx_p"><span id="S10.SS5.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#235E91;">User inputs.<span id="S10.SS5.p1.pic1.2.2.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> [failed attempt and evidence], [failure codes], [current operator/prompt/skill version], [allowed repair scope], [fixed regression suite], [attempt budget].</span></span></span>
<span id="S10.SS5.p1.pic1.2.3" class="ltx_p"><span id="S10.SS5.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#70528F;">Instructions.<span id="S10.SS5.p1.pic1.2.3.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> Map numerical or boundary failures to operator repair; missing morphology to applicability or donor retrieval; ambiguity/leakage to question or context repair; unsupported explanation to response-prompt repair. <span id="S10.SS5.p1.pic1.2.3.1.1.1" class="ltx_text ltx_font_bold">Specify the exact change</span> and why it addresses the observed failure. <span id="S10.SS5.p1.pic1.2.3.1.1.2" class="ltx_text ltx_font_bold">Compare old and new versions</span> on the same sources, requests, seeds, and budget. Quarantine <span id="S10.SS5.p1.pic1.2.3.1.1.3" class="ltx_text">or reject</span> when the budget <span id="S10.SS5.p1.pic1.2.3.1.1.4" class="ltx_text">is exhausted</span>.</span></span></span>
<span id="S10.SS5.p1.pic1.2.4" class="ltx_p"><span id="S10.SS5.p1.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#235E91;">Output fields.<span id="S10.SS5.p1.pic1.2.4.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> Triggering failure; component; exact revision; old/new version; proposer; validation results; acceptance rationale; next-round scope.</span></span></span>
</span></span></span></foreignobject></g></g></svg>