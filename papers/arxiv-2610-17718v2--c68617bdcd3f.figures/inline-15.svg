</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.38 10.38)"><foreignobject style="--ltx-fo-width:46.34em;--ltx-fo-height:20em;--ltx-fo-depth:0em;font-size:10pt;" height="276.74" overflow="visible" transform="matrix(1 0 0 -1 0 276.74)" width="641.22"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S10.SS7.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.34em;">
<span id="S10.SS7.p1.pic1.2.1" class="ltx_p"><span id="S10.SS7.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#70528F;">System role.<span id="S10.SS7.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> You apply a preregistered development-only promotion rule to comparable candidate learners.</span></span></span>
<span id="S10.SS7.p1.pic1.2.2" class="ltx_p"><span id="S10.SS7.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#235E91;">User inputs.<span id="S10.SS7.p1.pic1.2.2.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> [parent and candidate checkpoint IDs], [new/replay manifests], [supervised-token budgets], [fixed selection-set results], [primary score], [regression tolerances], [tie/stopping rules].</span></span></span>
<span id="S10.SS7.p1.pic1.2.3" class="ltx_p"><span id="S10.SS7.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#70528F;">Instructions.<span id="S10.SS7.p1.pic1.2.3.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> <span id="S10.SS7.p1.pic1.2.3.1.1.1" class="ltx_text ltx_font_bold">Check that candidates share the required parent</span>, training budget, and evaluation protocol. Apply the supplied score, regression, and valid-output gates exactly; do not invent thresholds. <span id="S10.SS7.p1.pic1.2.3.1.1.2" class="ltx_text ltx_font_bold">Promote only an eligible candidate</span>, otherwise retain the parent. Count only previously unused accepted items from the promoted branch toward cumulative additions, preserving replay provenance. <span id="S10.SS7.p1.pic1.2.3.1.1.3" class="ltx_text ltx_font_bold">Archive other branches and log the decision</span>.</span></span></span>
<span id="S10.SS7.p1.pic1.2.4" class="ltx_p"><span id="S10.SS7.p1.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#235E91;">Output fields.<span id="S10.SS7.p1.pic1.2.4.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> Comparability checks; gate results; chosen checkpoint or retain-parent decision; supporting scores; admitted item manifest; replay manifest; stopping status.</span></span></span>
</span></span></span></foreignobject></g></g></svg>