<span id="S10.SS6.p1.pic1.1.1" class="ltx_p"><span id="S10.SS6.p1.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#70528F;">Prompt P6</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.38 10.38)"><foreignobject style="--ltx-fo-width:46.34em;--ltx-fo-height:24.8em;--ltx-fo-depth:0em;font-size:10pt;" height="343.16" overflow="visible" transform="matrix(1 0 0 -1 0 343.16)" width="641.22"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S10.SS6.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.34em;">
<span id="S10.SS6.p1.pic1.2.1" class="ltx_p"><span id="S10.SS6.p1.pic1.2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#70528F;">System role.<span id="S10.SS6.p1.pic1.2.1.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> You propose training-data interventions from development feedback.</span></span></span>
<span id="S10.SS6.p1.pic1.2.2" class="ltx_p"><span id="S10.SS6.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#235E91;">User inputs.<span id="S10.SS6.p1.pic1.2.2.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> [accepted parent and feedback version], [category/type/difficulty counts and errors], [confusions and regressions], [training-pool coverage], [construction yield/cost], [history], [token and attempt budgets].</span></span></span>
<span id="S10.SS6.p1.pic1.2.3" class="ltx_p"><span id="S10.SS6.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#70528F;">Instructions.<span id="S10.SS6.p1.pic1.2.3.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> <span id="S10.SS6.p1.pic1.2.3.1.1.1" class="ltx_text ltx_font_bold">Prioritize deficits with adequate support</span>; report sparse or uncertain groups explicitly. Propose distinct candidates for </span><span id="S10.SS6.p1.pic1.2.3.1.2" class="ltx_text" style="--ltx-fg-color:#235E91;">direct weakness coverage<span id="S10.SS6.p1.pic1.2.3.1.2.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;">, </span>confusion contrasts<span id="S10.SS6.p1.pic1.2.3.1.2.2" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;">, and </span>difficulty or evidence-granularity progression<span id="S10.SS6.p1.pic1.2.3.1.2.3" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;">. For each, give normalized category, difficulty, and supervision-style allocations; requested feature ranges; protected attributes; allowed routes/operators; source filters; and cost limits. A/B/C retain the same previous cumulative training set unchanged and each add 10,000 first-use accepted questions, without an extra shared baseline set; <span id="S10.SS6.p1.pic1.2.3.1.2.3.1" class="ltx_text ltx_font_bold">only the winning additions enter the next cumulative set</span>.</span></span></span></span>
<span id="S10.SS6.p1.pic1.2.4" class="ltx_p"><span id="S10.SS6.p1.pic1.2.4.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#235E91;">Output fields.<span id="S10.SS6.p1.pic1.2.4.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> candidate recipes and hypotheses; normalized allocations and budgets; construction requests; <span id="S10.SS6.p1.pic1.2.4.1.1.1" class="ltx_text">provenance restrictions</span>.</span></span></span>
</span></span></span></foreignobject></g></g></svg>