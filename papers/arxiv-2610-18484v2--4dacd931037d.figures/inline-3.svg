<span id="A1.SS2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.24em;">
<span id="A1.SS2.p2.pic1.1.1" class="ltx_p"><span id="A1.SS2.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Recovery Workflow</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.52 12.59)"><foreignobject style="--ltx-fo-width:38.23em;--ltx-fo-height:43.89em;--ltx-fo-depth:0.25em;font-size:10pt;" height="610.83" overflow="visible" transform="matrix(1 0 0 -1 0 607.37)" width="529"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS2.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.23em;">
<span id="A1.SS2.p2.pic1.2.1" class="ltx_p"><span id="A1.SS2.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are in a recovery attempt. The environment
was not reset. The chat history above is your own
failed attempt history, and the current environment
may contain broken, partial, or misleading state
left by that attempt.</span></span>
<span id="A1.SS2.p2.pic1.2.2" class="ltx_p"><span id="A1.SS2.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Follow this recovery protocol before doing
substantial new work:</span></span>
<span id="A1.SS2.p2.pic1.2.3" class="ltx_p"><span id="A1.SS2.p2.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">1. Inherited state audit.<span id="A1.SS2.p2.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A1.SS2.p2.pic1.2.4" class="ltx_p"><span id="A1.SS2.p2.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Goal: understand what the failed attempt left
in the current environment.</span></span>
<span id="A1.SS2.p2.pic1.2.5" class="ltx_p"><span id="A1.SS2.p2.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">Inspect task artifacts, intermediate outputs,
temporary files, configuration changes, service
or process state, system or environment changes,
and other residue that may continue to affect
later actions. Classify each relevant state as
trusted, partially trusted, broken, or harmful.</span></span>
<span id="A1.SS2.p2.pic1.2.6" class="ltx_p"><span id="A1.SS2.p2.pic1.2.6.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">2. Original task contract reconstruction.<span id="A1.SS2.p2.pic1.2.6.1.1" class="ltx_text"></span></span></span>
<span id="A1.SS2.p2.pic1.2.7" class="ltx_p"><span id="A1.SS2.p2.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">Goal: realign with the original task instead
of following the failed attempt’s assumptions.</span></span>
<span id="A1.SS2.p2.pic1.2.8" class="ltx_p"><span id="A1.SS2.p2.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Reconstruct from the task instructions what
final state must be satisfied, what final result
is required, which constraints must hold, and
what semantically counts as success.</span></span>
<span id="A1.SS2.p2.pic1.2.9" class="ltx_p"><span id="A1.SS2.p2.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">3. Failure diagnosis.<span id="A1.SS2.p2.pic1.2.9.1.1" class="ltx_text"></span></span></span>
<span id="A1.SS2.p2.pic1.2.10" class="ltx_p"><span id="A1.SS2.p2.pic1.2.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Goal: understand why the previous attempt failed
and determine whether its approach is still valid.</span></span>
<span id="A1.SS2.p2.pic1.2.11" class="ltx_p"><span id="A1.SS2.p2.pic1.2.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">Before making further changes, decide whether the
failure most likely came from a wrong high-level
approach, local patching, polluted state, missing
final result, misunderstood requirement, shallow
validation, timeout, or syntax/runtime error.</span></span>
<span id="A1.SS2.p2.pic1.2.12" class="ltx_p"><span id="A1.SS2.p2.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">Identify the approach’s core assumptions and
known counterexamples. Construct a new independent
test from the original task contract; do not reuse
inherited self-tests or expected results generated
by the current implementation.</span></span>
<span id="A1.SS2.p2.pic1.2.13" class="ltx_p"><span id="A1.SS2.p2.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">If the independent test fails or a known
counterexample remains, discard or redesign
the approach instead of continuing to patch
it locally.</span></span>
<span id="A1.SS2.p2.pic1.2.14" class="ltx_p"><span id="A1.SS2.p2.pic1.2.14.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">4. Inherited state handling.<span id="A1.SS2.p2.pic1.2.14.1.1" class="ltx_text"></span></span></span>
<span id="A1.SS2.p2.pic1.2.15" class="ltx_p"><span id="A1.SS2.p2.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">Goal: decide how state left by the failed attempt
should participate in recovery.</span></span>
<span id="A1.SS2.p2.pic1.2.16" class="ltx_p"><span id="A1.SS2.p2.pic1.2.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">For each relevant inherited state, decide whether
to keep, repair, isolate, or discard it. Keep only
state that is consistent with the original task
and will not mislead later recovery; repair locally
useful but incomplete work; isolate or discard
artifacts and generated state that came from a
wrong hypothesis, even if they look close.
<span id="A1.SS2.p2.pic1.2.16.1.1" class="ltx_text ltx_font_bold">Original Task:</span> {original task}</span></span>
<span id="A1.SS2.p2.pic1.2.17" class="ltx_p"><span id="A1.SS2.p2.pic1.2.17.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Previous Attempt History:<span id="A1.SS2.p2.pic1.2.17.1.1" class="ltx_text ltx_font_medium"> {previous attempt history}</span></span></span>
</span></span></span></foreignobject></g></g></svg>