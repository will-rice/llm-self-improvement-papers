<svg id="A5.SS2.pic3" class="ltx_picture ltx_centering" height="697.44" overflow="visible" version="1.1" viewbox="0 0 550 697.44" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,697.44) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#BFBFBF;" fill="#BFBFBF" fill-opacity="1.0"><path style="stroke:none" d="M 0 4.63 L 0 692.81 C 0 695.37 2.07 697.44 4.63 697.44 L 545.37 697.44 C 547.93 697.44 550 695.37 550 692.81 L 550 4.63 C 550 2.07 547.93 0 545.37 0 L 4.63 0 C 2.07 0 0 2.07 0 4.63 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 4.63 L 0.69 675.88 L 549.31 675.88 L 549.31 4.63 C 549.31 2.45 547.55 0.69 545.37 0.69 L 4.63 0.69 C 2.45 0.69 0.69 2.45 0.69 4.63 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 676.57 L 0.69 692.81 C 0.69 694.99 2.45 696.75 4.63 696.75 L 545.37 696.75 C 547.55 696.75 549.31 694.99 549.31 692.81 L 549.31 676.57 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 683.2)"><foreignobject style="--ltx-fo-width:37.94em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="524.98"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS2.pic3.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.94em;">
<span id="A5.SS2.pic3.1.1" class="ltx_p"><span id="A5.SS2.pic3.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Prompt for concept generation</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.5 15.19)"><foreignobject style="--ltx-fo-width:37.94em;--ltx-fo-height:46.9em;--ltx-fo-depth:0.19em;font-size:10pt;" height="651.58" overflow="visible" transform="matrix(1 0 0 -1 0 648.89)" width="524.98"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS2.pic3.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.94em;">
<span id="A5.SS2.pic3.2.1" class="ltx_p"><span id="A5.SS2.pic3.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a math education assistant. Given a math problem and its
full solution, your task is to identify the
<span id="A5.SS2.pic3.2.1.1.1" class="ltx_text ltx_font_bold">underlying mathematical concept or topic</span>
required to solve the problem.</span></span>
<span id="A5.SS2.pic3.2.2" class="ltx_p"><span id="A5.SS2.pic3.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Requirements<span id="A5.SS2.pic3.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A5.SS2.pic3.2.3" class="ltx_p"><span id="A5.SS2.pic3.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. <span id="A5.SS2.pic3.2.3.1.1" class="ltx_text ltx_font_bold">Abstraction</span>: The concept should describe the broad
mathematical area or topic involved, not the specific solving
method, reasoning process, or solution strategy.</span></span>
<span id="A5.SS2.pic3.2.4" class="ltx_p"><span id="A5.SS2.pic3.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. <span id="A5.SS2.pic3.2.4.1.1" class="ltx_text ltx_font_bold">No answer leakage</span>: Do NOT include any numerical results,
intermediate calculations, formulas derived from the solution,
or the final answer.</span></span>
<span id="A5.SS2.pic3.2.5" class="ltx_p"><span id="A5.SS2.pic3.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. <span id="A5.SS2.pic3.2.5.1.1" class="ltx_text ltx_font_bold">No solution guidance</span>: Do NOT provide hints, strategies,
or step-by-step reasoning. Only identify the relevant mathematical
category.</span></span>
<span id="A5.SS2.pic3.2.6" class="ltx_p"><span id="A5.SS2.pic3.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. <span id="A5.SS2.pic3.2.6.1.1" class="ltx_text ltx_font_bold">Generality</span>: The concept should be applicable to a class
of similar mathematical problems.</span></span>
<span id="A5.SS2.pic3.2.7" class="ltx_p"><span id="A5.SS2.pic3.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">5. <span id="A5.SS2.pic3.2.7.1.1" class="ltx_text ltx_font_bold">Conciseness</span>: The output should be a short phrase or
one sentence.</span></span>
<span id="A5.SS2.pic3.2.8" class="ltx_p"><span id="A5.SS2.pic3.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output Format<span id="A5.SS2.pic3.2.8.1.1" class="ltx_text"></span></span></span>
<span id="A5.SS2.pic3.2.9" class="ltx_p"><span id="A5.SS2.pic3.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Concept: &lt;the underlying mathematical concept&gt;<span id="A5.SS2.pic3.2.9.1.1" class="ltx_text ltx_font_serif">
</span></span></span>
<span id="A5.SS2.pic3.2.10" class="ltx_p"><span id="A5.SS2.pic3.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Example 1<span id="A5.SS2.pic3.2.10.1.1" class="ltx_text"></span></span></span>
<span id="A5.SS2.pic3.2.11" class="ltx_p"><span id="A5.SS2.pic3.2.11.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Problem<span id="A5.SS2.pic3.2.11.1.1" class="ltx_text ltx_font_medium">: Find the number of ways to arrange 5 distinct
books on a shelf such that two specific books are always adjacent.</span></span></span>
<span id="A5.SS2.pic3.2.12" class="ltx_p"><span id="A5.SS2.pic3.2.12.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Full Solution<span id="A5.SS2.pic3.2.12.1.1" class="ltx_text ltx_font_medium">: Treat the two specific books as a single
unit, giving 4 units to arrange (<math id="A5.SS2.pic3.m1" class="ltx_Math" alttext="4!=24" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">!</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">24</mn></mrow><annotation encoding="application/x-tex">4!=24</annotation></semantics></math> ways). The two books
within the unit can be arranged in <math id="A5.SS2.pic3.m2" class="ltx_Math" alttext="2!=2" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">!</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><annotation encoding="application/x-tex">2!=2</annotation></semantics></math> ways.
Total <math id="A5.SS2.pic3.m3" class="ltx_Math" alttext="=24\times 2=48" display="inline" intent=":literal"><semantics><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">24</mn><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">×</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">48</mn></mrow><annotation encoding="application/x-tex">=24\times 2=48</annotation></semantics></math>.</span></span></span>
<span id="A5.SS2.pic3.2.13" class="ltx_p"><span id="A5.SS2.pic3.2.13.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Generated Concept<span id="A5.SS2.pic3.2.13.1.1" class="ltx_text ltx_font_medium">:</span></span></span>
<span id="A5.SS2.pic3.2.14" class="ltx_p"><span id="A5.SS2.pic3.2.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Concept:<span id="A5.SS2.pic3.2.14.1.1" class="ltx_text ltx_font_serif"> Permutations with constraints.
</span></span></span>
<span id="A5.SS2.pic3.2.15" class="ltx_p"><span id="A5.SS2.pic3.2.15.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Example 2<span id="A5.SS2.pic3.2.15.1.1" class="ltx_text"></span></span></span>
<span id="A5.SS2.pic3.2.16" class="ltx_p"><span id="A5.SS2.pic3.2.16.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Problem<span id="A5.SS2.pic3.2.16.1.1" class="ltx_text ltx_font_medium">: Evaluate the integral
<math id="A5.SS2.pic3.m4" class="ltx_Math" alttext="\int_{0}^{\pi}\sin^{3}(x)\,dx" display="inline" intent=":literal"><semantics><mrow><msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∫</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi></msubsup><mrow><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">sin</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></msup><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo lspace="0.170em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0em">𝑑</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mrow></mrow></mrow><annotation encoding="application/x-tex">\int_{0}^{\pi}\sin^{3}(x)\,dx</annotation></semantics></math>.</span></span></span>
<span id="A5.SS2.pic3.2.17" class="ltx_p"><span id="A5.SS2.pic3.2.17.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Full Solution<span id="A5.SS2.pic3.2.17.1.1" class="ltx_text ltx_font_medium">: Use the identity
<math id="A5.SS2.pic3.m5" class="ltx_Math" alttext="\sin^{3}(x)=\sin(x)(1-\cos^{2}(x))" display="inline" intent=":literal"><semantics><mrow><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">sin</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></msup><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">sin</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">cos</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\sin^{3}(x)=\sin(x)(1-\cos^{2}(x))</annotation></semantics></math>,
then substitute <math id="A5.SS2.pic3.m6" class="ltx_Math" alttext="u=\cos(x)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">cos</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">u=\cos(x)</annotation></semantics></math>, <math id="A5.SS2.pic3.m7" class="ltx_Math" alttext="du=-\sin(x)\,dx" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0em">𝑑</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.167em">−</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">sin</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo lspace="0.170em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0em">𝑑</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mrow></mrow></mrow></mrow><annotation encoding="application/x-tex">du=-\sin(x)\,dx</annotation></semantics></math>.
The integral becomes
<math id="A5.SS2.pic3.m8" class="ltx_Math" alttext="\int_{1}^{-1}-(1-u^{2})\,du" display="inline" intent=":literal"><semantics><mrow><msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∫</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msubsup><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">−</mo><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo lspace="0.170em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0em">𝑑</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi></mrow></mrow></mrow><annotation encoding="application/x-tex">\int_{1}^{-1}-(1-u^{2})\,du</annotation></semantics></math>,
which equals
<math id="A5.SS2.pic3.m9" class="ltx_Math" alttext="\int_{-1}^{1}(1-u^{2})\,du" display="inline" intent=":literal"><semantics><mrow><msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∫</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msubsup><mrow><mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" stretchy="false">(</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo lspace="0.170em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0em">𝑑</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi></mrow></mrow></mrow><annotation encoding="application/x-tex">\int_{-1}^{1}(1-u^{2})\,du</annotation></semantics></math>.
Evaluating gives
<math id="A5.SS2.pic3.m10" class="ltx_Math" alttext="\bigl[u-u^{3}/3\bigr]_{-1}^{1}=4/3" display="inline" intent=":literal"><semantics><mrow><msubsup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="1.200em" minsize="1.200em">[</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">u</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="1.200em" minsize="1.200em">]</mo></mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></mrow></mrow><annotation encoding="application/x-tex">\bigl[u-u^{3}/3\bigr]_{-1}^{1}=4/3</annotation></semantics></math>.</span></span></span>
<span id="A5.SS2.pic3.2.18" class="ltx_p"><span id="A5.SS2.pic3.2.18.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Generated Concept<span id="A5.SS2.pic3.2.18.1.1" class="ltx_text ltx_font_medium">:</span></span></span>
<span id="A5.SS2.pic3.2.19" class="ltx_p"><span id="A5.SS2.pic3.2.19.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Concept:<span id="A5.SS2.pic3.2.19.1.1" class="ltx_text ltx_font_serif"> Integration of trigonometric functions.
</span></span></span>
<span id="A5.SS2.pic3.2.20" class="ltx_p"><span id="A5.SS2.pic3.2.20.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task<span id="A5.SS2.pic3.2.20.1.1" class="ltx_text"></span></span></span>
<span id="A5.SS2.pic3.2.21" class="ltx_p"><span id="A5.SS2.pic3.2.21.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Problem<span id="A5.SS2.pic3.2.21.1.1" class="ltx_text ltx_font_medium">: {{problem}}</span></span></span>
<span id="A5.SS2.pic3.2.22" class="ltx_p"><span id="A5.SS2.pic3.2.22.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Full Solution<span id="A5.SS2.pic3.2.22.1.1" class="ltx_text ltx_font_medium">: {{solution}}</span></span></span>
<span id="A5.SS2.pic3.2.23" class="ltx_p"><span id="A5.SS2.pic3.2.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">Generate a concept following the requirements above.</span></span>
</span></span></span></foreignobject></g></g></svg>