<span id="A4.SS2.p4.pic1.p13" class="ltx_para ltx_noindent">
<span id="A4.SS2.p4.pic1.p13.1" class="ltx_p">Wrap the final reference solution inside &lt;output&gt; &lt;/output&gt; tags. The content within the tags should be the solution only, without introductory phrases, conversational filler, or meta-commentary.</span>
</span></span></span></span>
