<span id="A4.SS2.p4.pic1.1.2" class="ltx_p" style="width:450.3pt;"><span id="A4.SS2.p4.pic1.1.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:450.3pt;--ltx-fg-color:#000000;"><span id="A4.SS2.p4.pic1.1.2.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS2.p4.pic1.1.2.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS2.p4.pic1.1.2.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS2.p4.pic1.1.2.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:429.3pt;">
<span id="A4.SS2.p4.pic1.p2" class="ltx_para ltx_noindent">
<span id="A4.SS2.p4.pic1.p2.1" class="ltx_p">You are an experienced researcher tasked with writing a reference solution for a research problem. Your writing must be rigorous, academic in style, logically structured, and concise.</span>
</span></span></span></span>
<span id="A4.SS2.p4.pic1.1.3" class="ltx_p" style="width:450.3pt;"><span id="A4.SS2.p4.pic1.1.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:450.3pt;--ltx-fg-color:#000000;"><span id="A4.SS2.p4.pic1.1.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:450.3pt;"></span></span></span>
<span id="A4.SS2.p4.pic1.1.4" class="ltx_p" style="width:450.3pt;"><span id="A4.SS2.p4.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:450.3pt;--ltx-fg-color:#000000;"><span id="A4.SS2.p4.pic1.1.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:450.3pt;">
<span id="A4.SS2.p4.pic1.p4" class="ltx_para ltx_noindent">
<span id="A4.SS2.p4.pic1.p4.1" class="ltx_p"># Task</span>
</span></span></span></span>
<span id="A4.SS2.p4.pic1.1.5" class="ltx_p" style="width:450.3pt;"><span id="A4.SS2.p4.pic1.1.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:450.3pt;--ltx-fg-color:#000000;"><span id="A4.SS2.p4.pic1.1.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS2.p4.pic1.1.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS2.p4.pic1.1.5.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS2.p4.pic1.1.5.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:429.3pt;">
<span id="A4.SS2.p4.pic1.p5" class="ltx_para ltx_noindent">
<span id="A4.SS2.p4.pic1.p5.1" class="ltx_p">Based on the provided [Research Problem], [Original Solution], and [Original Experiment], write a reference solution that describes the method and experimental design. The description must adhere to the following principles:</span>
</span></span></span></span>
<span id="A4.SS2.p4.pic1.1.6" class="ltx_p" style="width:450.3pt;"><span id="A4.SS2.p4.pic1.1.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:450.3pt;--ltx-fg-color:#000000;"><span id="A4.SS2.p4.pic1.1.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:450.3pt;"></span></span></span>
<span id="A4.SS2.p4.pic1.1.7" class="ltx_p" style="width:450.3pt;"><span id="A4.SS2.p4.pic1.1.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:450.3pt;--ltx-fg-color:#000000;"><span id="A4.SS2.p4.pic1.1.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS2.p4.pic1.1.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS2.p4.pic1.1.7.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS2.p4.pic1.1.7.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:429.3pt;">
<span id="A4.SS2.p4.pic1.p7" class="ltx_para ltx_noindent">
<span id="A4.SS2.p4.pic1.p7.1" class="ltx_p">1. **Faithfulness**: Only describe content that is directly supported by the provided material. Do NOT add any fabricated details, speculative claims, or information not present in the inputs.</span>
</span></span></span></span>
<span id="A4.SS2.p4.pic1.1.8" class="ltx_p" style="width:450.3pt;"><span id="A4.SS2.p4.pic1.1.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:450.3pt;--ltx-fg-color:#000000;"><span id="A4.SS2.p4.pic1.1.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS2.p4.pic1.1.8.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS2.p4.pic1.1.8.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS2.p4.pic1.1.8.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:429.3pt;">
<span id="A4.SS2.p4.pic1.p8" class="ltx_para ltx_noindent">
<span id="A4.SS2.p4.pic1.p8.1" class="ltx_p">2. **No concrete experimental data**: Exclude all specific numerical results, statistics, or quantitative outcomes. Focus on the rationale and design logic of the method and experiments, not the raw numbers.</span>
</span></span></span></span>
<span id="A4.SS2.p4.pic1.1.9" class="ltx_p" style="width:450.3pt;"><span id="A4.SS2.p4.pic1.1.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:450.3pt;--ltx-fg-color:#000000;"><span id="A4.SS2.p4.pic1.1.9.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS2.p4.pic1.1.9.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS2.p4.pic1.1.9.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS2.p4.pic1.1.9.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:429.3pt;">
<span id="A4.SS2.p4.pic1.p9" class="ltx_para ltx_noindent">
<span id="A4.SS2.p4.pic1.p9.1" class="ltx_p">3. **Content focus**: Emphasize the principles and implementation of the proposed method, the motivation behind the experimental design (e.g., choice of baselines, datasets, evaluation metrics, variable controls), and the reasoning for the approach.</span>
</span></span></span></span>
<span id="A4.SS2.p4.pic1.1.10" class="ltx_p" style="width:450.3pt;"><span id="A4.SS2.p4.pic1.1.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:450.3pt;--ltx-fg-color:#000000;"><span id="A4.SS2.p4.pic1.1.10.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS2.p4.pic1.1.10.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS2.p4.pic1.1.10.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS2.p4.pic1.1.10.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:429.3pt;">
<span id="A4.SS2.p4.pic1.p10" class="ltx_para ltx_noindent">
<span id="A4.SS2.p4.pic1.p10.1" class="ltx_p">4. **Academic style**: Use formal, precise, and concise academic language. Write in a structured but paragraph-based flow - avoid bullet points, numbered lists, or section headers. Each sentence should convey a clear technical point.</span>
</span></span></span></span>
<span id="A4.SS2.p4.pic1.1.11" class="ltx_p" style="width:450.3pt;"><span id="A4.SS2.p4.pic1.1.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:450.3pt;--ltx-fg-color:#000000;"><span id="A4.SS2.p4.pic1.1.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:450.3pt;"></span></span></span>
