<span id="A1.SS1.p2.pic1.p3" class="ltx_para ltx_noindent">
<span id="A1.SS1.p2.pic1.p3.1" class="ltx_p">1. **Method**: Involves proposing a new method, algorithm, model, framework, technique, theoretical contribution, or novel aspects of the solution design itself.</span>
</span></span></span></span>
<span id="A1.SS1.p2.pic1.1.4" class="ltx_p" style="width:450.3pt;"><span id="A1.SS1.p2.pic1.1.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:450.3pt;--ltx-fg-color:#000000;"><span id="A1.SS1.p2.pic1.1.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS1.p2.pic1.1.4.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A1.SS1.p2.pic1.1.4.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A1.SS1.p2.pic1.1.4.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:429.3pt;">
<span id="A1.SS1.p2.pic1.p4" class="ltx_para ltx_noindent">
<span id="A1.SS1.p2.pic1.p4.1" class="ltx_p">2. **Experiment**: Involves experimental setup, evaluation metrics, baseline comparisons, ablation studies, dataset selection, human-machine comparison experiments, cross-institution/cross-user comparisons, robustness verification, and other experiment-related designs.</span>
</span></span></span></span>
