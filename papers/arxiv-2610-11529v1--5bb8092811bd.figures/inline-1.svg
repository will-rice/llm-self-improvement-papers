<span id="A2.p2.pic1.2.1" class="ltx_p"><span id="A2.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Let proposition <math id="A2.p2.pic1.m1" class="ltx_Math" alttext="P" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><annotation encoding="application/x-tex">P</annotation></semantics></math>: The sets of solutions to the inequalities <math id="A2.p2.pic1.m2" class="ltx_Math" alttext="a_{1}x^{2}+b_{1}x+c_{1}&gt;0" display="inline" intent=":literal"><semantics><mrow><mrow><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo lspace="0em" rspace="0em">​</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">c</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">a_{1}x^{2}+b_{1}x+c_{1}&gt;0</annotation></semantics></math> and <math id="A2.p2.pic1.m3" class="ltx_Math" alttext="a_{2}x^{2}+b_{2}x+c_{2}&gt;0" display="inline" intent=":literal"><semantics><mrow><mrow><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo lspace="0em" rspace="0em">​</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">c</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">a_{2}x^{2}+b_{2}x+c_{2}&gt;0</annotation></semantics></math> are identical. Proposition <math id="A2.p2.pic1.m4" class="ltx_Math" alttext="Q" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Q</mi><annotation encoding="application/x-tex">Q</annotation></semantics></math>: <math id="A2.p2.pic1.m5" class="ltx_Math" alttext="\frac{a_{1}}{a_{2}}=\frac{b_{1}}{b_{2}}=\frac{c_{1}}{c_{2}}" display="inline" intent=":literal"><semantics><mrow><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">c</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">c</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub></mfrac></mrow><annotation encoding="application/x-tex">\frac{a_{1}}{a_{2}}=\frac{b_{1}}{b_{2}}=\frac{c_{1}}{c_{2}}</annotation></semantics></math>. Then proposition <math id="A2.p2.pic1.m6" class="ltx_Math" alttext="Q" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Q</mi><annotation encoding="application/x-tex">Q</annotation></semantics></math> is a () condition for proposition <math id="A2.p2.pic1.m7" class="ltx_Math" alttext="P" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">P</mi><annotation encoding="application/x-tex">P</annotation></semantics></math>.
<br class="ltx_break">(A) Necessary and sufficient condition
<br class="ltx_break">(B) Sufficient but not necessary condition
<br class="ltx_break">(C) Necessary but not sufficient condition
<br class="ltx_break">(D) Neither necessary nor sufficient condition</span></span>
</span></span></span></foreignobject></g></g></svg>