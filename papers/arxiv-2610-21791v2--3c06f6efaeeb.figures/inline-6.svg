<span id="A6.SS3.p6.pic1.2.1" class="ltx_p ltx_align_left"><span id="A6.SS3.p6.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;"># Harness Failure Localization Agent</span></span>
<span id="A6.SS3.p6.pic1.2.2" class="ltx_p ltx_align_left"><span id="A6.SS3.p6.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Your goal is to analyze the execution failures of the current winner harness {winner_harness_name} and produce a module-localized, evidence-grounded, generation-ready diagnosis of transferable harness weaknesses.</span></span>
<span id="A6.SS3.p6.pic1.2.3" class="ltx_p ltx_align_left"><span id="A6.SS3.p6.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">[...]</span></span>
<span id="A6.SS3.p6.pic1.2.4" class="ltx_p ltx_align_left"><span id="A6.SS3.p6.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Use failed trajectories as evidence for diagnosing the harness, not as specifications for task-specific fixes.</span></span>
<span id="A6.SS3.p6.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SS3.p6.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">[...]</span></span>
<span id="A6.SS3.p6.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SS3.p6.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">For every major diagnosis, separate:</span></span>
<span id="A6.SS3.p6.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SS3.p6.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">- the task-specific surface manifestation observed in the trajectory</span></span>
<span id="A6.SS3.p6.pic1.2.8" class="ltx_p ltx_align_left"><span id="A6.SS3.p6.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">- the deeper harness behavior that caused it</span></span>
<span id="A6.SS3.p6.pic1.2.9" class="ltx_p ltx_align_left"><span id="A6.SS3.p6.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">- why that behavior is expected to recur across different task families</span></span>
