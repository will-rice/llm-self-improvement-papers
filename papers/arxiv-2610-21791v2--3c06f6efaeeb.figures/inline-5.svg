<span id="A6.SS3.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.09em;">
<span id="A6.SS3.p5.pic1.2.1" class="ltx_p ltx_align_left"><span id="A6.SS3.p5.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Choose exactly one currently executable Task component: HARNESS, MODEL, or ARTIFACTS. Record the intervention proposal and its prospective expectations. Do not implement the intervention or update G/K during routing.</span></span>
<span id="A6.SS3.p5.pic1.2.2" class="ltx_p ltx_align_left"><span id="A6.SS3.p5.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">[...]</span></span>
<span id="A6.SS3.p5.pic1.2.3" class="ltx_p ltx_align_left"><span id="A6.SS3.p5.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Explain the observed problem, a plausible mechanism, why this component is worth prioritizing now, the exact proposed change, and what subsequent evidence would support or contradict the proposal. A justified feasible choice is required; proving that every alternative is worse is not.</span></span>
<span id="A6.SS3.p5.pic1.2.4" class="ltx_p ltx_align_left"><span id="A6.SS3.p5.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">[...]</span></span>
<span id="A6.SS3.p5.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SS3.p5.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">- rationale contains concise mechanism reasoning, relevant principles, counter-evidence, the three-component comparison, and limitations.</span></span>
<span id="A6.SS3.p5.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SS3.p5.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">[...]</span></span>
<span id="A6.SS3.p5.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SS3.p5.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">- Include expectations.implementation_events, preserve, risks, unknowns, evidence, and principle_ids. used_principle_ids names active principles actually used.</span></span>
</span></span></span></foreignobject></g></g></g></svg>