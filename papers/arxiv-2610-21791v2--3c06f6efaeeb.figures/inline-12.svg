</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.56 15.25)"><foreignobject style="--ltx-fo-width:43.09em;--ltx-fo-height:16.51em;--ltx-fo-depth:0.22em;font-size:10pt;" height="231.54" overflow="visible" transform="matrix(1 0 0 -1 0 228.47)" width="596.24"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS3.p12.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.09em;">
<span id="A6.SS3.p12.pic1.2.1" class="ltx_p ltx_align_left"><span id="A6.SS3.p12.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">These are advisory matches, not component rankings. Inspect avoid_when, confidence, counterevidence and unknowns; use read_skill for full records and original rollout references when needed. Empty retrieval is valid.</span></span>
<span id="A6.SS3.p12.pic1.2.2" class="ltx_p ltx_align_left"><span id="A6.SS3.p12.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">[...]</span></span>
<span id="A6.SS3.p12.pic1.2.3" class="ltx_p ltx_align_left"><span id="A6.SS3.p12.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Meta decides semantic coverage and maintenance, not a similarity threshold. Inspect retrieved versions before creating near-duplicates.</span></span>
<span id="A6.SS3.p12.pic1.2.4" class="ltx_p ltx_align_left"><span id="A6.SS3.p12.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Methods use kind=procedure; cases remain immutable observations. Supplementation does not automatically strengthen confidence.</span></span>
<span id="A6.SS3.p12.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SS3.p12.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">[...]</span></span>
<span id="A6.SS3.p12.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SS3.p12.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">One intervention is one support event; summaries or later uses of its ID are not independent replications.</span></span>
</span></span></span></foreignobject></g></g></g></svg>