<span id="A6.SS3.p10.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.09em;">
<span id="A6.SS3.p10.pic1.2.1" class="ltx_p ltx_align_left"><span id="A6.SS3.p10.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Role: You are the Task-Agent revising your own output.</span></span>
<span id="A6.SS3.p10.pic1.2.2" class="ltx_p ltx_align_left"><span id="A6.SS3.p10.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Task: {task_specification}</span></span>
<span id="A6.SS3.p10.pic1.2.3" class="ltx_p ltx_align_left"><span id="A6.SS3.p10.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Your previous output: {own_output}</span></span>
<span id="A6.SS3.p10.pic1.2.4" class="ltx_p ltx_align_left"><span id="A6.SS3.p10.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Available feedback: {permitted_feedback}</span></span>
<span id="A6.SS3.p10.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SS3.p10.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Diagnostic guidance: {revision_guidance}</span></span>
<span id="A6.SS3.p10.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SS3.p10.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Remaining budget: {remaining_budget}</span></span>
<span id="A6.SS3.p10.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SS3.p10.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Identify the defect supported by the supplied feedback. Revise your own program, answer, or structured output and resubmit it through the existing interface.</span></span>
<span id="A6.SS3.p10.pic1.2.8" class="ltx_p ltx_align_left"><span id="A6.SS3.p10.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Preserve the required output format. Use only the permitted tools and feedback. Keep the model and Harness unchanged. Do not copy an answer from another task.</span></span>
<span id="A6.SS3.p10.pic1.2.9" class="ltx_p ltx_align_left"><span id="A6.SS3.p10.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Return the revised submission in the task’s original output format.</span></span>
