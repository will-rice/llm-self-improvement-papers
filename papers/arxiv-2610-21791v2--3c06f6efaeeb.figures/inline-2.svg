<span id="A6.SS3.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.34em;">
<span id="A6.SS3.p2.pic1.1.1" class="ltx_p ltx_align_left"><span id="A6.SS3.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Figure 11. Model: Successful-Trajectory Replay</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.56 15.25)"><foreignobject style="--ltx-fo-width:43.09em;--ltx-fo-height:20.71em;--ltx-fo-depth:0.22em;font-size:10pt;" height="289.66" overflow="visible" transform="matrix(1 0 0 -1 0 286.58)" width="596.24"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS3.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.09em;">
<span id="A6.SS3.p2.pic1.2.1" class="ltx_p ltx_align_left"><span id="A6.SS3.p2.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Record: verified_parent_replay.v1</span></span>
<span id="A6.SS3.p2.pic1.2.2" class="ltx_p ltx_align_left"><span id="A6.SS3.p2.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Scope: Model</span></span>
<span id="A6.SS3.p2.pic1.2.3" class="ltx_p ltx_align_left"><span id="A6.SS3.p2.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">When: Harness contracts are valid, success remains low, and verified successful parent rollouts are available.</span></span>
<span id="A6.SS3.p2.pic1.2.4" class="ltx_p ltx_align_left"><span id="A6.SS3.p2.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Steps:</span></span>
<span id="A6.SS3.p2.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SS3.p2.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">1. Bind calls to checkpoint, task, and native success.</span></span>
<span id="A6.SS3.p2.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SS3.p2.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">2. Exclude reporting tasks, Meta-edited answers, and unverified traces.</span></span>
<span id="A6.SS3.p2.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SS3.p2.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">3. Filter malformed or overlength targets; train one-epoch LoRA.</span></span>
<span id="A6.SS3.p2.pic1.2.8" class="ltx_p ltx_align_left"><span id="A6.SS3.p2.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">4. Verify sample coverage and serving bindings; compare the full paired batch.</span></span>
<span id="A6.SS3.p2.pic1.2.9" class="ltx_p ltx_align_left"><span id="A6.SS3.p2.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Preserve: Harness, artifacts, graders, budgets, memory input, and length filters.</span></span>
<span id="A6.SS3.p2.pic1.2.10" class="ltx_p ltx_align_left"><span id="A6.SS3.p2.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Avoid when: Provenance is missing or extra data repeats coverage without addressing the diagnosed failure.</span></span>
<span id="A6.SS3.p2.pic1.2.11" class="ltx_p ltx_align_left"><span id="A6.SS3.p2.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Evidence: R3: 3,798 calls; 134 -&gt; 141 / 600 (34 gains, 27 regressions).</span></span>
<span id="A6.SS3.p2.pic1.2.12" class="ltx_p ltx_align_left"><span id="A6.SS3.p2.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Reuse: R4: 5,397 calls; 159 -&gt; 160 / 600 (23 gains, 22 regressions). The same procedure receives new evidence.</span></span>
</span></span></span></foreignobject></g></g></g></svg>