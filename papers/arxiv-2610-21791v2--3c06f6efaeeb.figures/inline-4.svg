<svg id="A6.SS3.p4.pic1" class="ltx_picture" height="374.46" overflow="visible" version="1.1" viewbox="0 0 653.15 374.46" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,374.46) matrix(1 0 0 -1 0 0)"><clippath id="pgfcp4"><path d="M -22670.54 -22670.54 L 22670.54 -22670.54 L 22670.54 22670.54 L -22670.54 22670.54 Z M 0 0 L 0 374.46 L 653.15 374.46 L 653.15 0 Z" /></clippath><g fill-rule="evenodd"><g style="--ltx-fill-color:#E8BE35;" fill="#E8BE35" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 374.46 L 653.15 374.46 L 653.15 0 Z M 1.11 1.11 L 1.11 346.11 L 652.04 346.11 L 652.04 1.11 Z M 1.11 347.22 L 1.11 373.35 L 652.04 373.35 L 652.04 347.22 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 1.11 L 1.11 346.11 L 652.04 346.11 L 652.04 1.11 Z" /></g><g style="--ltx-fill-color:#E8BE35;" fill="#E8BE35" fill-opacity="1.0"><path style="stroke:none" d="M 1.11 347.22 L 1.11 373.35 L 652.04 373.35 L 652.04 347.22 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.56 356.83)"><foreignobject style="--ltx-fo-width:39.34em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="544.35"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS3.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.34em;">
<span id="A6.SS3.p4.pic1.1.1" class="ltx_p ltx_align_left"><span id="A6.SS3.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Figure 13. Principle: Scope and Budget</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.56 15.25)"><foreignobject style="--ltx-fo-width:43.09em;--ltx-fo-height:23.11em;--ltx-fo-depth:0.22em;font-size:10pt;" height="322.87" overflow="visible" transform="matrix(1 0 0 -1 0 319.79)" width="596.24"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS3.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.09em;">
<span id="A6.SS3.p4.pic1.2.1" class="ltx_p ltx_align_left"><span id="A6.SS3.p4.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Type: Synthesized principle</span></span>
<span id="A6.SS3.p4.pic1.2.2" class="ltx_p ltx_align_left"><span id="A6.SS3.p4.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Scope: Component selection</span></span>
<span id="A6.SS3.p4.pic1.2.3" class="ltx_p ltx_align_left"><span id="A6.SS3.p4.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">When: Feedback exposes a bottleneck and the remaining budget constrains the next intervention.</span></span>
<span id="A6.SS3.p4.pic1.2.4" class="ltx_p ltx_align_left"><span id="A6.SS3.p4.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Principle: Match intervention scope to the diagnosed failure. Prefer a bounded output revision when it can address the current defect; broader updates need evidence of a reusable bottleneck.</span></span>
<span id="A6.SS3.p4.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SS3.p4.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Steps:</span></span>
<span id="A6.SS3.p4.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SS3.p4.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">1. Local output defect with actionable feedback: revise and resubmit Artifacts.</span></span>
<span id="A6.SS3.p4.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SS3.p4.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">2. Recurring execution or interface failure: consider a Harness repair.</span></span>
<span id="A6.SS3.p4.pic1.2.8" class="ltx_p ltx_align_left"><span id="A6.SS3.p4.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">3. Recurring capability gap with suitable training data: consider a Model update.</span></span>
<span id="A6.SS3.p4.pic1.2.9" class="ltx_p ltx_align_left"><span id="A6.SS3.p4.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">4. Weigh expected benefit and reuse against implementation, training, and validation cost.</span></span>
<span id="A6.SS3.p4.pic1.2.10" class="ltx_p ltx_align_left"><span id="A6.SS3.p4.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Preserve: Task requirements, evaluation rules, and the available budget.</span></span>
<span id="A6.SS3.p4.pic1.2.11" class="ltx_p ltx_align_left"><span id="A6.SS3.p4.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Avoid when: The cheaper action cannot address the failure, or repeated local repairs consume more budget than a reusable fix.</span></span>
<span id="A6.SS3.p4.pic1.2.12" class="ltx_p ltx_align_left"><span id="A6.SS3.p4.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Verify: Use observed quality and cost to revise the next decision; treat the selected route as a hypothesis.</span></span>
</span></span></span></foreignobject></g></g></g></svg>