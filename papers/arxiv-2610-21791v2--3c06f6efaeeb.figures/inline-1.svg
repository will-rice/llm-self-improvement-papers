</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.56 15.25)"><foreignobject style="--ltx-fo-width:43.09em;--ltx-fo-height:21.01em;--ltx-fo-depth:0.22em;font-size:10pt;" height="293.81" overflow="visible" transform="matrix(1 0 0 -1 0 290.73)" width="596.24"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.09em;">
<span id="A6.SS3.p1.pic1.2.1" class="ltx_p ltx_align_left"><span id="A6.SS3.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Record: typed_program_commit.v1</span></span>
<span id="A6.SS3.p1.pic1.2.2" class="ltx_p ltx_align_left"><span id="A6.SS3.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Scope: Harness</span></span>
<span id="A6.SS3.p1.pic1.2.3" class="ltx_p ltx_align_left"><span id="A6.SS3.p1.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">When: The public contract requires source code, but final submissions contain stdout or prose.</span></span>
<span id="A6.SS3.p1.pic1.2.4" class="ltx_p ltx_align_left"><span id="A6.SS3.p1.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Steps:</span></span>
<span id="A6.SS3.p1.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SS3.p1.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">1. Localize submission-shape failures.</span></span>
<span id="A6.SS3.p1.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SS3.p1.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">2. Gate complete-source instructions on the public program contract.</span></span>
<span id="A6.SS3.p1.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SS3.p1.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">3. Keep shape retries inside the original loop and budget.</span></span>
<span id="A6.SS3.p1.pic1.2.8" class="ltx_p ltx_align_left"><span id="A6.SS3.p1.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">4. Test program entry and non-program bypass; inspect paired regressions.</span></span>
<span id="A6.SS3.p1.pic1.2.9" class="ltx_p ltx_align_left"><span id="A6.SS3.p1.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Preserve: Model, Planning, Memory, tools, budget, and grader.</span></span>
<span id="A6.SS3.p1.pic1.2.10" class="ltx_p ltx_align_left"><span id="A6.SS3.p1.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Avoid when: No public program contract exists, or the defect is algorithmic.</span></span>
<span id="A6.SS3.p1.pic1.2.11" class="ltx_p ltx_align_left"><span id="A6.SS3.p1.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Evidence: R1: 106 -&gt; 148 successes / 600; 54 gains and 12 regressions. Code: 31 gains, 5 regressions.</span></span>
<span id="A6.SS3.p1.pic1.2.12" class="ltx_p ltx_align_left"><span id="A6.SS3.p1.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Status: One paired training batch. Full preservation was not achieved.</span></span>
<span id="A6.SS3.p1.pic1.2.13" class="ltx_p ltx_align_left"><span id="A6.SS3.p1.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Reuse: Referenced by the R2 stateful-completion intervention.</span></span>
</span></span></span></foreignobject></g></g></g></svg>