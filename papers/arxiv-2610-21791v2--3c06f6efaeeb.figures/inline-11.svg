</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.56 15.25)"><foreignobject style="--ltx-fo-width:43.09em;--ltx-fo-height:12.01em;--ltx-fo-depth:0.22em;font-size:10pt;" height="169.27" overflow="visible" transform="matrix(1 0 0 -1 0 166.2)" width="596.24"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS3.p11.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.09em;">
<span id="A6.SS3.p11.pic1.2.1" class="ltx_p ltx_align_left"><span id="A6.SS3.p11.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Turn what was expected, changed, and observed into conditional guidance for future component selection and implementation, and revise G when justified. Principle-memory changes, substantive G changes, later actual use, and performance improvement are distinct outcomes.</span></span>
<span id="A6.SS3.p11.pic1.2.2" class="ltx_p ltx_align_left"><span id="A6.SS3.p11.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">[...]</span></span>
<span id="A6.SS3.p11.pic1.2.3" class="ltx_p ltx_align_left"><span id="A6.SS3.p11.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">2. Stage 3 -- Derive principles. Retrieve related experiences, active principles, and counter-evidence. Specify conditions, recommended checks/actions, support, limitations, and invalidation criteria. Local implementation success and terminal failure can support differently scoped lessons. Do not mechanically filter by score sign or infer component exhaustion from one non-improving intervention.</span></span>
</span></span></span></foreignobject></g></g></g></svg>