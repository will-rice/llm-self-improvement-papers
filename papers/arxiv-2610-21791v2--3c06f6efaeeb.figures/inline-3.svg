<span id="A6.SS3.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.34em;">
<span id="A6.SS3.p3.pic1.1.1" class="ltx_p ltx_align_left"><span id="A6.SS3.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Figure 12. Artifacts: Feedback-Guided Revision</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.56 15.25)"><foreignobject style="--ltx-fo-width:43.09em;--ltx-fo-height:23.41em;--ltx-fo-depth:0.22em;font-size:10pt;" height="327.02" overflow="visible" transform="matrix(1 0 0 -1 0 323.94)" width="596.24"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS3.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.09em;">
<span id="A6.SS3.p3.pic1.2.1" class="ltx_p ltx_align_left"><span id="A6.SS3.p3.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Type: Reformulated procedure</span></span>
<span id="A6.SS3.p3.pic1.2.2" class="ltx_p ltx_align_left"><span id="A6.SS3.p3.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Scope: Task outputs (code / answers)</span></span>
<span id="A6.SS3.p3.pic1.2.3" class="ltx_p ltx_align_left"><span id="A6.SS3.p3.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">When: Execution feedback identifies a repairable defect in the current code, and the remaining budget permits a short revision cycle.</span></span>
<span id="A6.SS3.p3.pic1.2.4" class="ltx_p ltx_align_left"><span id="A6.SS3.p3.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Steps:</span></span>
<span id="A6.SS3.p3.pic1.2.5" class="ltx_p ltx_align_left"><span id="A6.SS3.p3.pic1.2.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">1. Inspect permitted tests, stderr, or execution feedback.</span></span>
<span id="A6.SS3.p3.pic1.2.6" class="ltx_p ltx_align_left"><span id="A6.SS3.p3.pic1.2.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">2. Have the Task-Agent revise its own code to address the defect.</span></span>
<span id="A6.SS3.p3.pic1.2.7" class="ltx_p ltx_align_left"><span id="A6.SS3.p3.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">3. Retest and resubmit through the existing interface within budget.</span></span>
<span id="A6.SS3.p3.pic1.2.8" class="ltx_p ltx_align_left"><span id="A6.SS3.p3.pic1.2.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">4. Record the repair, outcome, regressions, and edit/test cost.</span></span>
<span id="A6.SS3.p3.pic1.2.9" class="ltx_p ltx_align_left"><span id="A6.SS3.p3.pic1.2.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Preserve: Model parameters, Harness, task contract, evaluator, and execution limits.</span></span>
<span id="A6.SS3.p3.pic1.2.10" class="ltx_p ltx_align_left"><span id="A6.SS3.p3.pic1.2.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Rationale: Local revision can improve the current submission without paying the cost of model training or Harness reconstruction.</span></span>
<span id="A6.SS3.p3.pic1.2.11" class="ltx_p ltx_align_left"><span id="A6.SS3.p3.pic1.2.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Carry over: Meta distills repair conditions, steps, and observed limits into its skill library. The task-specific code or answer is not transferred to new tasks.</span></span>
<span id="A6.SS3.p3.pic1.2.12" class="ltx_p ltx_align_left"><span id="A6.SS3.p3.pic1.2.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">New task: Meta retrieves the skill to diagnose a new task and guide revision of that task’s own output using its own feedback.</span></span>
<span id="A6.SS3.p3.pic1.2.13" class="ltx_p ltx_align_left"><span id="A6.SS3.p3.pic1.2.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#161C21;">Avoid when: The defect requires a broader execution or capability change, or further local retries would exhaust the budget.</span></span>
</span></span></span></foreignobject></g></g></g></svg>