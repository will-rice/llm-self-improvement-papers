<svg id="A2.SS1.p2.pic1" class="ltx_picture" height="287.09" overflow="visible" version="1.1" viewbox="0 0 550 287.09" width="550"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,287.09) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 1.38 L 0 285.71 C 0 286.47 0.62 287.09 1.38 287.09 L 548.62 287.09 C 549.38 287.09 550 286.47 550 285.71 L 550 1.38 C 550 0.62 549.38 0 548.62 0 L 1.38 0 C 0.62 0 0 0.62 0 1.38 Z" /></g><g style="--ltx-fill-color:#FFFFFF;" fill="#FFFFFF" fill-opacity="1.0"><path style="stroke:none" d="M 0.62 2.01 L 0.62 285.08 C 0.62 285.85 1.24 286.47 2.01 286.47 L 547.99 286.47 C 548.76 286.47 549.38 285.85 549.38 285.08 L 549.38 2.01 C 549.38 1.24 548.76 0.62 547.99 0.62 L 2.01 0.62 C 1.24 0.62 0.62 1.24 0.62 2.01 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.86 15.55)"><foreignobject style="--ltx-fo-width:37.89em;--ltx-fo-height:18.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="261.37" overflow="visible" transform="matrix(1 0 0 -1 0 258.68)" width="524.29"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A2.SS1.p2.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:37.89em;">
<span id="A2.SS1.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="A2.SS1.p2.pic1.p1.1" class="ltx_p"><span id="A2.SS1.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Example: Instantiating a Completeness Requirement.</span></span>
</span>
<span id="A2.SS1.p2.pic1.p2" class="ltx_para">
<span id="A2.SS1.p2.pic1.p2.1" class="ltx_p"><span id="A2.SS1.p2.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For the problem <math id="A2.SS1.p2.pic1.m1" class="ltx_Math" alttext="x^{2}=4" display="inline" intent=":literal"><semantics><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></mrow><annotation encoding="application/x-tex">x^{2}=4</annotation></semantics></math>, suppose the current solution gives only <math id="A2.SS1.p2.pic1.m2" class="ltx_Math" alttext="x=2" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><annotation encoding="application/x-tex">x=2</annotation></semantics></math>. Checking only whether <math id="A2.SS1.p2.pic1.m3" class="ltx_Math" alttext="2" display="inline" intent=":literal"><semantics><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><annotation encoding="application/x-tex">2</annotation></semantics></math> satisfies the equation is insufficient. The problem objective requires the complete set of real solutions, and solving under the problem conditions yields the complete target object</span></span>
<span id="A2.E13" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A2.E13.m1" class="ltx_Math" alttext="S^{*}=\{x\in\mathbb{R}:x^{2}=4\}=\{-2,2\}." display="block" intent=":literal"><semantics><mrow><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</mo></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">{</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ℝ</mi></mrow><mo style="--ltx-fg-color:#000000;" lspace="0.278em" mathcolor="#000000" rspace="0.278em">:</mo><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">}</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">{</mo><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">}</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">S^{*}=\{x\in\mathbb{R}:x^{2}=4\}=\{-2,2\}.</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(13)</span></span></span></span>
</span>
<span id="A2.SS1.p2.pic1.p2.2" class="ltx_p"><span id="A2.SS1.p2.pic1.p2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">If <math id="A2.SS1.p2.pic1.m4" class="ltx_Math" alttext="S_{y}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi></msub><annotation encoding="application/x-tex">S_{y}</annotation></semantics></math> is the set returned by the current solution, the corresponding completeness requirement can be written as</span></span>
<span id="A2.E14" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A2.E14.m1" class="ltx_Math" alttext="h:\quad S_{y}=S^{*}." display="block" intent=":literal"><semantics><mrow><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">h</mi><mo style="--ltx-fg-color:#000000;" lspace="0.278em" mathcolor="#000000" rspace="0.278em">:</mo><mphantom></mphantom></mrow><mspace style="width:1em;" width="1em"></mspace><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</mo></msup></mrow></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">h:\quad S_{y}=S^{*}.</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(14)</span></span></span></span>
</span>
<span id="A2.SS1.p2.pic1.p2.3" class="ltx_p"><span id="A2.SS1.p2.pic1.p2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">AGPV constructs a key claim associated with this objective, such as whether the solution set returned by the current solution is the complete real solution set. The set returned by the current solution is</span></span>
<span id="A2.E15" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A2.E15.m1" class="ltx_Math" alttext="S_{y}=\{2\}." display="block" intent=":literal"><semantics><mrow><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">{</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">}</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">S_{y}=\{2\}.</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(15)</span></span></span></span>
</span>
<span id="A2.SS1.p2.pic1.p2.4" class="ltx_p"><span id="A2.SS1.p2.pic1.p2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">Since</span></span>
<span id="A2.E16" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A2.E16.m1" class="ltx_Math" alttext="S_{y}\neq S^{*}," display="block" intent=":literal"><semantics><mrow><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">y</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≠</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</mo></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo></mrow><annotation encoding="application/x-tex">S_{y}\neq S^{*},</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(16)</span></span></span></span>
</span>
<span id="A2.SS1.p2.pic1.p2.5" class="ltx_p"><span id="A2.SS1.p2.pic1.p2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">the key claim fails verification, allowing AGPV to detect the missing solution.</span></span>
</span></span></span></span></foreignobject></g></g></svg>