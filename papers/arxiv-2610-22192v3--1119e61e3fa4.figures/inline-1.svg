<svg id="p1.pic1" class="ltx_picture" height="909.59" overflow="visible" version="1.1" viewbox="0 0 668.9 909.59" width="668.9"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,909.59) matrix(1 0 0 -1 0 0) translate(-2.08,0)"><g style="--ltx-fill-color:#E6EEFB;" fill="#E6EEFB" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 15.81 L 1.97 893.78 C 1.97 901.43 8.16 907.62 15.81 907.62 L 657.24 907.62 C 664.89 907.62 671.08 901.43 671.08 893.78 L 671.08 15.81 C 671.08 8.16 664.89 1.97 657.24 1.97 L 15.81 1.97 C 8.16 1.97 1.97 8.16 1.97 15.81 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 25.59 25.59)"><foreignobject style="--ltx-fo-width:44.94em;--ltx-fo-height:62.04em;--ltx-fo-depth:0em;font-size:10pt;" height="858.42" overflow="visible" transform="matrix(1 0 0 -1 0 858.42)" width="621.84"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="p1.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:44.94em;">
<span id="p1.pic1.p1" class="ltx_para">
<span id="p1.pic1.p1.1" class="ltx_p"><span id="p1.pic1.p1.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#0052D9;">Junyao Yang<sup id="p1.pic1.p1.1.1.1" class="ltx_sup"><span id="p1.pic1.p1.1.1.1.1" class="ltx_text ltx_font_italic">1,2,∗</span></sup>, Zongxia Li<sup id="p1.pic1.p1.1.1.2" class="ltx_sup"><span id="p1.pic1.p1.1.1.2.1" class="ltx_text ltx_font_italic">1,3,∗</span></sup>, Yucheng Shi<sup id="p1.pic1.p1.1.1.3" class="ltx_sup"><span id="p1.pic1.p1.1.1.3.1" class="ltx_text ltx_font_italic">1,∗</span></sup>, Zhongzhi Li<sup id="p1.pic1.p1.1.1.4" class="ltx_sup"><span id="p1.pic1.p1.1.1.4.1" class="ltx_text ltx_font_italic">1,4</span></sup>, Ruhan Wang<sup id="p1.pic1.p1.1.1.5" class="ltx_sup"><span id="p1.pic1.p1.1.1.5.1" class="ltx_text ltx_font_italic">1,5</span></sup>, Ruiwen Zhou<sup id="p1.pic1.p1.1.1.6" class="ltx_sup">2</sup>, Haitao Mi<sup id="p1.pic1.p1.1.1.7" class="ltx_sup">1</sup>, Shuicheng Yan<sup id="p1.pic1.p1.1.1.8" class="ltx_sup"><span id="p1.pic1.p1.1.1.8.1" class="ltx_text ltx_font_italic">2,†</span></sup>, Leowei Liang<sup id="p1.pic1.p1.1.1.9" class="ltx_sup">1</sup></span></span>
<span id="p1.pic1.p1.2" class="ltx_p"><sup id="p1.pic1.p1.2.1" class="ltx_sup"><span id="p1.pic1.p1.2.1.1" class="ltx_text" style="--ltx-fg-color:#0052D9;">1</span></sup><span id="p1.pic1.p1.2.2" class="ltx_text" style="--ltx-fg-color:#0052D9;">Tencent Hy Frontier <sup id="p1.pic1.p1.2.2.1" class="ltx_sup">2</sup>National University of Singapore <sup id="p1.pic1.p1.2.2.2" class="ltx_sup">3</sup>University of Maryland, College Park <sup id="p1.pic1.p1.2.2.3" class="ltx_sup">4</sup>University of Georgia <sup id="p1.pic1.p1.2.2.4" class="ltx_sup">5</sup>Indiana University</span></span>
<span id="p1.pic1.p1.3" class="ltx_p"><sup id="p1.pic1.p1.3.1" class="ltx_sup"><span id="p1.pic1.p1.3.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#0052D9;">∗</span></sup><span id="p1.pic1.p1.3.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#0052D9;">Equal Contribution, <sup id="p1.pic1.p1.3.2.1" class="ltx_sup"><span id="p1.pic1.p1.3.2.1.1" class="ltx_text ltx_font_italic">†</span></sup>Corresponding Author</span></span>
<span id="p1.pic1.p1.4" class="ltx_p ltx_align_center"><a href="mailto:junyaoyang@u.nus.edu" title class="ltx_ref ltx_href ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#0052D9;">junyaoyang@u.nus.edu</a><span id="p1.pic1.p1.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#0052D9;">, <a href="mailto:tberiusyang@global.tencent.com" title class="ltx_ref ltx_href ltx_font_typewriter">tberiusyang@global.tencent.com</a></span></span>
<span id="p1.pic1.p1.5" class="ltx_p"><span id="p1.pic1.p1.5.1" class="ltx_text" style="--ltx-fg-color:#1C2B33;">Converting verifier outcomes into useful policy updates and partial progress into complete task resolution is crucial for terminal agents. We present <span id="p1.pic1.p1.5.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold">Terminal-RSI</span>, which alternates <span id="p1.pic1.p1.5.1.2" class="ltx_text ltx_font_sansserif ltx_font_bold">Recursive Self-Rewrite (RSR)</span> of verified trajectories with critic-inheriting <span id="p1.pic1.p1.5.1.3" class="ltx_text ltx_font_sansserif ltx_font_bold">Recursive Policy-Refine (RPR)</span>. We formulate <span id="p1.pic1.p1.5.1.4" class="ltx_text ltx_font_sansserif ltx_font_bold">Turn-Boundary Skip-Observation GAE (TB-GAE)</span> to retain token-specific baselines while applying decay across interaction turns. <span id="p1.pic1.p1.5.1.5" class="ltx_text ltx_font_sansserif ltx_font_bold">Family Dense Reward (FDR)</span> calibrates semantic progress across task families; <span id="p1.pic1.p1.5.1.6" class="ltx_text ltx_font_sansserif ltx_font_bold">Success-Prioritized Reward (SPR)</span> separates strict success from bounded partial credit. A Warm-up Critic Model, recursive critic handoff, and stage-specific learning rates coordinate the two refinement phases. The five-stage sequence from Qwen3.8-27B base model through RSR-1, RPR-1, RSR-2, and RPR-2 yields <span id="p1.pic1.p1.5.1.7" class="ltx_text ltx_font_sansserif ltx_font_bold">Terminal-RSI-27B</span>: <span id="p1.pic1.p1.5.1.8" class="ltx_text ltx_font_sansserif ltx_font_bold">19.84%</span> on <span id="p1.pic1.p1.5.1.9" class="ltx_text ltx_font_sansserif ltx_font_bold">Terminal-Bench 4.0</span>, <span id="p1.pic1.p1.5.1.10" class="ltx_text ltx_font_sansserif ltx_font_bold">86.52%</span> on <span id="p1.pic1.p1.5.1.11" class="ltx_text ltx_font_sansserif ltx_font_bold">Terminal-Bench 2.1</span>, <span id="p1.pic1.p1.5.1.12" class="ltx_text ltx_font_sansserif ltx_font_bold">16.95%</span> on <span id="p1.pic1.p1.5.1.13" class="ltx_text ltx_font_sansserif ltx_font_bold">Terminal-Bench 3.0</span>, and <span id="p1.pic1.p1.5.1.14" class="ltx_text ltx_font_sansserif ltx_font_bold">79.00%</span> on <span id="p1.pic1.p1.5.1.15" class="ltx_text ltx_font_sansserif ltx_font_bold">Terminal-Bench Hard</span>.
On <span id="p1.pic1.p1.5.1.16" class="ltx_text ltx_font_sansserif ltx_font_bold">LHTB</span>, process reward rises from 0.21 to <span id="p1.pic1.p1.5.1.17" class="ltx_text ltx_font_sansserif ltx_font_bold">0.37</span> and strict completion from 0/46 to <span id="p1.pic1.p1.5.1.18" class="ltx_text ltx_font_sansserif ltx_font_bold">5/46</span>; <span id="p1.pic1.p1.5.1.19" class="ltx_text ltx_font_sansserif ltx_font_bold">SWR100</span> success doubles from 3.00% to <span id="p1.pic1.p1.5.1.20" class="ltx_text ltx_font_sansserif ltx_font_bold">6.00%</span>. By recursively coupling verified trajectory rewriting with critic-inheriting policy refinement, each stage consolidates discovered behaviors and progressively advances the agent from partial local repairs to strict terminal verification.</span></span><object type="image/svg+xml" data="2610.22192v3/RSI_main_3x2_2to1.svg" id="p1.pic1.g1" class="ltx_graphics ltx_centering ltx_img_landscape" style="aspect-ratio:620/275;" width="620" height="275"></object>
</span>
<span id="S0.F1" class="ltx_figure">
<span class="ltx_caption" style="--ltx-fg-color:#1C2B33;"><span class="ltx_tag ltx_tag_figure">Figure 1: </span><span id="S0.F1.7" class="ltx_text ltx_font_sansserif ltx_font_bold">Evaluation across five retained stages on terminal and long-horizon benchmarks.</span> Positions order Base, RSR-1, RPR-1 with 20 steps, RSR-2, and RPR-2 with 18 steps for <span id="S0.F1.8" class="ltx_text ltx_font_sansserif ltx_font_bold">Terminal-RSI-27B</span>. Dashed lines and diamonds denote RSR; solid lines and stars denote retained RPR; gray branches show discarded alternatives. Retained Terminal-Bench and SWR100 points report Mean@3 success in percentage. LHTB separates mean strictly completed tasks on the left axis from process reward on the right axis.</span>
</span>
<span id="p1.pic1.p2" class="ltx_para">
