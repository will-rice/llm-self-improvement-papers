</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 8.3 11.38)"><foreignobject style="--ltx-fo-width:36.72em;--ltx-fo-height:19.89em;--ltx-fo-depth:0.22em;font-size:10pt;" height="278.36" overflow="visible" transform="matrix(1 0 0 -1 0 275.28)" width="508.1"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS0.SSS0.Px4.p2.pic4.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.72em;">
<span id="A4.SS0.SSS0.Px4.p2.pic4.2.1" class="ltx_p"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.1.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.1.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:364.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p1" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p1.1" class="ltx_p">[GROUND YOUR DIFF IN THE REPO’S EXISTING TESTS -- one-time check; your submission is NOT finalized yet]</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic4.2.2" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:385.5pt;"></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic4.2.3" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.3.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.3.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:364.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p3" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p3.1" class="ltx_p">The most common way this task is failed is submitting a patch that APPLIES cleanly but implements the WRONG contract -- a guessed function/option name, a signature the codebase never uses, a rename or new spelling that no caller expects, or an error/return shape different from what the code around it uses. Re-reading the PR will NOT catch this, because your reading of the PR is what produced the wrong contract. The codebase itself is the authority. The repo ships EXISTING tests that already exercise the code you touched and the API next to it -- they show the EXACT names, signatures, argument spellings, and error/return types the code is expected to have. Use them as ground truth now.</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic4.2.4" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:385.5pt;"></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic4.2.5" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.5.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.5.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:364.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p5" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p5.1" class="ltx_p">1. Print your changes and identify the concrete symbols you added or changed:</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic4.2.6" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:385.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p6" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p6.1" class="ltx_p">   git --no-pager diff</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic4.2.7" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:385.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p7" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p7.1" class="ltx_p">   List every NEW or RENAMED symbol/option/message string in your diff.</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic4.2.8" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.8.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.8.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.8.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:364.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p8" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p8.1" class="ltx_p">2. For each such symbol, search the repo’s tests and existing call sites for how that symbol -- and the nearest EXISTING sibling API -- is actually used:</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic4.2.9" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.9.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.9.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.9.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.9.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:364.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p9" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p9.1" class="ltx_p">   grep -rn --include=’*.py’ -e ’&lt;symbol&gt;’ -e ’&lt;sibling_api&gt;’ . | head -40</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic4.2.10" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.10.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.10.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.10.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.10.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:364.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p10" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p10.1" class="ltx_p">   Then OPEN and READ the specific test files that reference the area you changed (e.g. tests/ or test_*.py near your file) and note the exact spelling, call signature, and expected result/exception the codebase uses.</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic4.2.11" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.11.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.11.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.11.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.11.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:364.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p11" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p11.1" class="ltx_p">3. Confront your diff against what the tests/call sites actually expect. If you introduced a name, option spelling, signature, or error shape that NO existing test or caller uses -- while an existing convention does -- change your diff to MATCH the codebase’s convention. Do not invent a new API; conform to the one already there. Also confirm you did not MISS a behavior the tests imply is required.</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic4.2.12" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:385.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p12" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p12.1" class="ltx_p">4. If you changed anything, regenerate the patch:</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic4.2.13" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.13.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:385.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p13" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p13.1" class="ltx_p">   git diff -- &lt;the source files you modified&gt; &gt; patch.txt</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic4.2.14" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.14.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.14.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.14.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.14.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:364.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p14" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p14.1" class="ltx_p">   and re-inspect patch.txt so it contains ONLY your intended source changes.</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic4.2.15" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.15.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.15.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.15.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic4.2.15.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:364.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p15" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p15.1" class="ltx_p">5. When your diff conforms to the codebase’s real contract, re-issue the EXACT submit command:</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic4.2.16" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:385.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p16" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p16.1" class="ltx_p">   echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT &amp;&amp; cat patch.txt</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic4.2.17" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic4.2.17.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:385.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p17" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic4.p17.1" class="ltx_p">This check happens only once -- after you re-submit, it goes through.</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>