<span id="A4.SS0.SSS0.Px4.p2.pic2.2.5" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic2.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic2.2.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic2.2.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic2.2.5.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic2.2.5.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:364.5pt;">
