<span id="A4.SS0.SSS0.Px4.p2.pic3.2.1" class="ltx_p"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.1.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic3.2.1.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic3.2.1.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic3.2.1.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:364.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic3.p1" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic3.p1.1" class="ltx_p">[YOUR SUBMISSION IS EMPTY -- it contains no source-code changes, so it cannot fix anything. Not finalized.]</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic3.2.2" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:385.5pt;"></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic3.2.3" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic3.2.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic3.2.3.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic3.2.3.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:364.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic3.p3" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic3.p3.1" class="ltx_p">You have not edited any source file yet (patch.txt is empty or has no diff hunks). Do NOT give up. Re-localize the bug:</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic3.2.4" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:385.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic3.p4" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic3.p4.1" class="ltx_p">1. Re-read the PR and grep for the exact symbol/message/flag it names.</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic3.2.5" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic3.2.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic3.2.5.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic3.2.5.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:364.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic3.p5" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic3.p5.1" class="ltx_p">2. Open the file where that symbol lives and make the concrete edit the PR requires.</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic3.2.6" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic3.2.6.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic3.2.6.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic3.2.6.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:364.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic3.p6" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic3.p6.1" class="ltx_p">3. IMPORTANT -- did your fix CREATE a NEW file (a brand-new module)? A plain `git diff` does NOT show untracked new files, so your patch looks empty even though the file exists. Stage new files first so they appear as additions:</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic3.2.7" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:385.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic3.p7" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic3.p7.1" class="ltx_p">   cd /testbed &amp;&amp; git add -N &lt;the new file(s) you created&gt;</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic3.2.8" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic3.2.8.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic3.2.8.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic3.2.8.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:364.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic3.p8" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic3.p8.1" class="ltx_p">4. Verify with `cd /testbed &amp;&amp; git --no-pager diff` that a real change (or a `new file mode` hunk) now shows.</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic3.2.9" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.9.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic3.2.9.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic3.2.9.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A4.SS0.SSS0.Px4.p2.pic3.2.9.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:364.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic3.p9" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic3.p9.1" class="ltx_p">5. Then `cd /testbed &amp;&amp; git diff -- &lt;files&gt; &gt; patch.txt` and submit with:</span>
</span></span></span></span>
<span id="A4.SS0.SSS0.Px4.p2.pic3.2.10" class="ltx_p" style="width:385.5pt;"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:385.5pt;--ltx-fg-color:#000000;"><span id="A4.SS0.SSS0.Px4.p2.pic3.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:385.5pt;">
<span id="A4.SS0.SSS0.Px4.p2.pic3.p10" class="ltx_para ltx_noindent">
<span id="A4.SS0.SSS0.Px4.p2.pic3.p10.1" class="ltx_p">   echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT &amp;&amp; cat patch.txt</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>