<span id="A8.SS3.SSS1.p9.pic1.2.1" class="ltx_p"><math id="A8.SS3.SSS1.p9.pic1.m1" class="ltx_Math" alttext="\delta(\bm{s})\equiv 1" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">δ</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≡</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">\delta(\bm{s})\equiv 1</annotation></semantics></math><span id="A8.SS3.SSS1.p9.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;"> if and only if <math id="A8.SS3.SSS1.p9.pic1.m2" class="ltx_Math" alttext="\mathfrak{D}_{\bm{\pi}_{\text{old}}}^{\text{GSPO}}(\bar{\bm{\pi}}|\bm{s})\geq 0" display="inline" intent=":literal"><semantics><mrow><mrow><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔇</mi><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">old</mtext></msub><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">GSPO</mtext></msubsup><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">\mathfrak{D}_{\bm{\pi}_{\text{old}}}^{\text{GSPO}}(\bar{\bm{\pi}}|\bm{s})\geq 0</annotation></semantics></math> for all states <math id="A8.SS3.SSS1.p9.pic1.m3" class="ltx_Math" alttext="\bm{s}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><annotation encoding="application/x-tex">\bm{s}</annotation></semantics></math>, policies <math id="A8.SS3.SSS1.p9.pic1.m4" class="ltx_Math" alttext="\bm{\pi}_{\text{old}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">old</mtext></msub><annotation encoding="application/x-tex">\bm{\pi}_{\text{old}}</annotation></semantics></math>, and <math id="A8.SS3.SSS1.p9.pic1.m5" class="ltx_Math" alttext="\bar{\bm{\pi}}\in\bm{\Pi}" display="inline" intent=":literal"><semantics><mrow><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝚷</mi></mrow><annotation encoding="application/x-tex">\bar{\bm{\pi}}\in\bm{\Pi}</annotation></semantics></math>.</span></span>
