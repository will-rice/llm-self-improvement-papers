<svg id="A4.p2.pic1" class="ltx_picture" height="315.37" overflow="visible" version="1.1" viewbox="0 0 477.38 315.37" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,315.37) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#3C2569;" fill="#3C2569" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 309.47 C 0 312.73 2.64 315.37 5.91 315.37 L 471.47 315.37 C 474.73 315.37 477.38 312.73 477.38 309.47 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FCF2F5;" fill="#FCF2F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 276.58 L 475.41 276.58 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 282.48)"><foreignobject style="--ltx-fo-width:27.28em;--ltx-fo-height:1.95em;--ltx-fo-depth:0em;font-size:10pt;" height="26.98" overflow="visible" transform="matrix(1 0 0 -1 0 26.98)" width="377.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.p2.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:27.28em;">
<span id="A4.p2.pic1.p1" class="ltx_para ltx_indent">
<span id="A4.p2.pic1.p1.1" class="ltx_p"><span id="A4.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Theorem 4: </span><span id="A4.p2.pic1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">GRAE Bias and Gradient (Un)biasedness in MDPs</span></span>
</span></span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 149.23)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:8.35em;--ltx-fo-depth:9.79em;font-size:10pt;" height="250.99" overflow="visible" transform="matrix(1 0 0 -1 0 115.54)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.p2.pic1.2.1" class="ltx_p"><span id="A4.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Consider a finite-horizon MDP and a policy <math id="A4.p2.pic1.m1" class="ltx_Math" alttext="\pi_{\theta}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></msub><annotation encoding="application/x-tex">\pi_{\theta}</annotation></semantics></math>. For a fixed initial state <math id="A4.p2.pic1.m2" class="ltx_Math" alttext="s_{0}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub><annotation encoding="application/x-tex">s_{0}</annotation></semantics></math>, sample <math id="A4.p2.pic1.m3" class="ltx_Math" alttext="N" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><annotation encoding="application/x-tex">N</annotation></semantics></math> i.i.d. trajectories and define the total return for trajectory <math id="A4.p2.pic1.m4" class="ltx_Math" alttext="\tau^{(i)}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></msup><annotation encoding="application/x-tex">\tau^{(i)}</annotation></semantics></math> as <math id="A4.p2.pic1.m5" class="ltx_Math" alttext="R^{(i)}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></msup><annotation encoding="application/x-tex">R^{(i)}</annotation></semantics></math>. Define the GRAE estimator <math id="A4.p2.pic1.m6" class="ltx_Math" alttext="\hat{A}^{\textup{GRAE}}(s_{t},a_{t})=R^{(i)}-\bar{R}" display="inline" intent=":literal"><semantics><mrow><mrow><msup><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">GRAE</mtext></msup><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover></mrow></mrow><annotation encoding="application/x-tex">\hat{A}^{\textup{GRAE}}(s_{t},a_{t})=R^{(i)}-\bar{R}</annotation></semantics></math> with <math id="A4.p2.pic1.m7" class="ltx_Math" alttext="\bar{R}=\frac{1}{N}\sum_{i=1}^{N}R^{(i)}" display="inline" intent=":literal"><semantics><mrow><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi></mfrac><mo lspace="0em" rspace="0em">​</mo><mrow><msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∑</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi></msubsup><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></msup></mrow></mrow></mrow><annotation encoding="application/x-tex">\bar{R}=\frac{1}{N}\sum_{i=1}^{N}R^{(i)}</annotation></semantics></math>. Then:</span></span>
<span id="A4.I2" class="ltx_enumerate">
<span id="A4.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A4.I2.i1.p1" class="ltx_para">
<span id="A4.I2.i1.p1.1" class="ltx_p"><span id="A4.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><span id="A4.I2.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Structural bias</span><span id="A4.I2.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">) For any </span><math id="A4.I2.i1.p1.m1" class="ltx_Math" alttext="(s_{t},a_{t})" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(s_{t},a_{t})</annotation></semantics></math><span id="A4.I2.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><math id="A4.I2.i1.p1.m2" class="ltx_math_unparsed" alttext="\mathbb{E}[\hat{A}^{\textup{GRAE}}\mid s_{t},a_{t}]=Q(s_{t},a_{t})-V(s_{0})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔼</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><msup><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo>^</mo></mover><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">GRAE</mtext></msup><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">∣</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Q</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\mathbb{E}[\hat{A}^{\textup{GRAE}}\mid s_{t},a_{t}]=Q(s_{t},a_{t})-V(s_{0})</annotation></semantics></math><span id="A4.I2.i1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">, so the bias is </span><math id="A4.I2.i1.p1.m3" class="ltx_Math" alttext="V(s_{t})-V(s_{0})" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">V(s_{t})-V(s_{0})</annotation></semantics></math><span id="A4.I2.i1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">, which is nonzero in general.</span></span>
</span></span>
<span id="A4.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A4.I2.i2.p1" class="ltx_para">
<span id="A4.I2.i2.p1.1" class="ltx_p"><span id="A4.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><span id="A4.I2.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Gradient unbiasedness under undiscounted objective</span><span id="A4.I2.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">) When </span><math id="A4.I2.i2.p1.m1" class="ltx_Math" alttext="\gamma=1" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">γ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">\gamma=1</annotation></semantics></math><span id="A4.I2.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">, the policy-gradient estimator </span><math id="A4.I2.i2.p1.m2" class="ltx_Math" alttext="g_{\textup{GRAE}}=\sum_{t=0}^{T}\nabla_{\theta}\log\pi_{\theta}(a_{t}\mid s_{t})\,\hat{A}^{\textup{GRAE}}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">GRAE</mtext></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.111em">=</mo><mrow><msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∑</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi></msubsup><mrow><msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∇</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></msub><mo lspace="0.167em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">log</mi><mo lspace="0.167em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" fence="true" lspace="0em" mathcolor="#000000" rspace="0em">∣</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo lspace="0.170em" rspace="0em">​</mo><msup><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">^</mo></mover><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">GRAE</mtext></msup></mrow></mrow></mrow><annotation encoding="application/x-tex">g_{\textup{GRAE}}=\sum_{t=0}^{T}\nabla_{\theta}\log\pi_{\theta}(a_{t}\mid s_{t})\,\hat{A}^{\textup{GRAE}}</annotation></semantics></math><span id="A4.I2.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> satisfies </span><math id="A4.I2.i2.p1.m3" class="ltx_Math" alttext="\mathbb{E}[g_{\textup{GRAE}}]=\nabla_{\theta}J(\theta)" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔼</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">GRAE</mtext></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mrow><msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.167em">∇</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\mathbb{E}[g_{\textup{GRAE}}]=\nabla_{\theta}J(\theta)</annotation></semantics></math><span id="A4.I2.i2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> for the undiscounted objective.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>