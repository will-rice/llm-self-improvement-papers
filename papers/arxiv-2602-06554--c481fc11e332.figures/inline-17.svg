<span id="A8.SS1.p2.pic1.p1.1" class="ltx_p"><span id="A8.SS1.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Lemma 6: </span><span id="A8.SS1.p2.pic1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">GRAE Unbiasedness in Contextual Bandits</span></span>
</span></span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:4.3em;--ltx-fo-depth:0.25em;font-size:10pt;" height="62.96" overflow="visible" transform="matrix(1 0 0 -1 0 59.5)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A8.SS1.p2.pic1.2.1" class="ltx_p"><span id="A8.SS1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">In the Contextual Bandit setting, GRAE provides unbiased advantage estimates:</span></span>
<span id="A8.E113" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A8.E113.m1" class="ltx_math_unparsed" alttext="\mathbb{E}[\hat{A}_{\textup{GRAE}}(\bm{s},\bm{a})\mid\bm{s},\bm{a}]=A_{\bm{\pi}}^{\textup{Bandit}}(\bm{s},\bm{a})." display="block" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔼</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><msub><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo>^</mo></mover><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">GRAE</mtext></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒂</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒂</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Bandit</mtext></msubsup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒂</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">\mathbb{E}[\hat{A}_{\textup{GRAE}}(\bm{s},\bm{a})\mid\bm{s},\bm{a}]=A_{\bm{\pi}}^{\textup{Bandit}}(\bm{s},\bm{a}).</annotation></semantics></math></span>
