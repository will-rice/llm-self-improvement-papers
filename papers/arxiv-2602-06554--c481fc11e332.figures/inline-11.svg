<svg id="A5.SS2.p1.pic1" class="ltx_picture" height="276.55" overflow="visible" version="1.1" viewbox="0 0 477.38 276.55" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,276.55) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#3C2569;" fill="#3C2569" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 270.65 C 0 273.91 2.64 276.55 5.91 276.55 L 471.47 276.55 C 474.73 276.55 477.38 273.91 477.38 270.65 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FCF2F5;" fill="#FCF2F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 252.44 L 475.41 252.44 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 261.04)"><foreignobject style="--ltx-fo-width:27.28em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="377.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A5.SS2.p1.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:27.28em;">
<span id="A5.SS2.p1.pic1.p1" class="ltx_para ltx_indent">
<span id="A5.SS2.p1.pic1.p1.1" class="ltx_p"><span id="A5.SS2.p1.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Theorem 5: </span><span id="A5.SS2.p1.pic1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Convergence of GRAE-REINFORCE</span></span>
</span></span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 136.24)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:7.54em;--ltx-fo-depth:8.85em;font-size:10pt;" height="226.85" overflow="visible" transform="matrix(1 0 0 -1 0 104.39)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A5.SS2.p1.pic1.2.1" class="ltx_p"><span id="A5.SS2.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Consider a finite-horizon MDP with <math id="A5.SS2.p1.pic1.m1" class="ltx_Math" alttext="\gamma=1" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">γ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">\gamma=1</annotation></semantics></math> and <math id="A5.SS2.p1.pic1.m2" class="ltx_Math" alttext="|r(s,a)|\leq R_{\max}" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">max</mi></msub></mrow><annotation encoding="application/x-tex">|r(s,a)|\leq R_{\max}</annotation></semantics></math> for all <math id="A5.SS2.p1.pic1.m3" class="ltx_Math" alttext="(s,a)" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(s,a)</annotation></semantics></math>. Let <math id="A5.SS2.p1.pic1.m4" class="ltx_Math" alttext="\pi_{\theta}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></msub><annotation encoding="application/x-tex">\pi_{\theta}</annotation></semantics></math> be a parameterized policy over a compact parameter space <math id="A5.SS2.p1.pic1.m5" class="ltx_Math" alttext="\Theta" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Θ</mi><annotation encoding="application/x-tex">\Theta</annotation></semantics></math>. Suppose the policy is updated by REINFORCE using the GRAE advantage estimator. Then:</span></span>
<span id="A5.I2" class="ltx_enumerate">
<span id="A5.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A5.I2.i1.p1" class="ltx_para">
<span id="A5.I2.i1.p1.1" class="ltx_p"><span id="A5.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><span id="A5.I2.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Gradient unbiasedness</span><span id="A5.I2.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">) </span><math id="A5.I2.i1.p1.m1" class="ltx_Math" alttext="\mathbb{E}_{\tau\sim\pi_{\theta}}[g_{\textup{GRAE}}]=\nabla_{\theta}J(\theta)" display="inline" intent=":literal"><semantics><mrow><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔼</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∼</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></msub></mrow></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">GRAE</mtext></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mrow><msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.167em">∇</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\mathbb{E}_{\tau\sim\pi_{\theta}}[g_{\textup{GRAE}}]=\nabla_{\theta}J(\theta)</annotation></semantics></math><span id="A5.I2.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A5.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A5.I2.i2.p1" class="ltx_para">
<span id="A5.I2.i2.p1.1" class="ltx_p"><span id="A5.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><span id="A5.I2.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Monotonic improvement</span><span id="A5.I2.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">) </span><math id="A5.I2.i2.p1.m1" class="ltx_Math" alttext="J(\pi_{k+1})\geq J(\pi_{k}),\quad\forall k\in\mathbb{N}" display="inline" intent=":literal"><semantics><mrow><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="1.167em">,</mo><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.167em">∀</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ℕ</mi></mrow></mrow><annotation encoding="application/x-tex">J(\pi_{k+1})\geq J(\pi_{k}),\quad\forall k\in\mathbb{N}</annotation></semantics></math><span id="A5.I2.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A5.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A5.I2.i3.p1" class="ltx_para">
<span id="A5.I2.i3.p1.1" class="ltx_p"><span id="A5.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><span id="A5.I2.i3.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Convergence</span><span id="A5.I2.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">) </span><math id="A5.I2.i3.p1.m1" class="ltx_Math" alttext="\exists\,J^{*}\text{ such that }\lim_{k\to\infty}J(\pi_{k})=J^{*}" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.337em">∃</mo><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</mo></msup><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> such that </mtext><mo lspace="0.167em" rspace="0em">​</mo><mrow><msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.167em">lim</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">∞</mi></mrow></msub><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</mo></msup></mrow><annotation encoding="application/x-tex">\exists\,J^{*}\text{ such that }\lim_{k\to\infty}J(\pi_{k})=J^{*}</annotation></semantics></math><span id="A5.I2.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>