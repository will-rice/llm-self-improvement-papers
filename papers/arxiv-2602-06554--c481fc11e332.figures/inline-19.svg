<svg id="A8.SS2.p1.pic1" class="ltx_picture" height="273.86" overflow="visible" version="1.1" viewbox="0 0 477.38 273.86" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,273.86) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#3C2569;" fill="#3C2569" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 267.95 C 0 271.22 2.64 273.86 5.91 273.86 L 471.47 273.86 C 474.73 273.86 477.38 271.22 477.38 267.95 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FCF2F5;" fill="#FCF2F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 235.84 L 475.41 235.84 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 241.74)"><foreignobject style="--ltx-fo-width:27.28em;--ltx-fo-height:1.89em;--ltx-fo-depth:0em;font-size:10pt;" height="26.21" overflow="visible" transform="matrix(1 0 0 -1 0 26.21)" width="377.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A8.SS2.p1.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:27.28em;">
<span id="A8.SS2.p1.pic1.p1" class="ltx_para ltx_indent">
<span id="A8.SS2.p1.pic1.p1.1" class="ltx_p"><span id="A8.SS2.p1.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Theorem 8: </span><span id="A8.SS2.p1.pic1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Convergence of GRAE-PPU in Contextual Bandits</span></span>
</span></span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 136.24)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:6.34em;--ltx-fo-depth:8.85em;font-size:10pt;" height="210.25" overflow="visible" transform="matrix(1 0 0 -1 0 87.79)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.SS2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A8.SS2.p1.pic1.2.1" class="ltx_p"><span id="A8.SS2.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Consider a Contextual Bandit with <math id="A8.SS2.p1.pic1.m1" class="ltx_Math" alttext="|\bm{r}(\bm{s},\bm{a})|\leq R_{\max}" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒓</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒂</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">max</mi></msub></mrow><annotation encoding="application/x-tex">|\bm{r}(\bm{s},\bm{a})|\leq R_{\max}</annotation></semantics></math> for all <math id="A8.SS2.p1.pic1.m2" class="ltx_Math" alttext="(\bm{s},\bm{a})" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒂</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(\bm{s},\bm{a})</annotation></semantics></math>. Let <math id="A8.SS2.p1.pic1.m3" class="ltx_Math" alttext="\bm{\pi}_{\theta}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></msub><annotation encoding="application/x-tex">\bm{\pi}_{\theta}</annotation></semantics></math> be a parameterized policy over a compact parameter space <math id="A8.SS2.p1.pic1.m4" class="ltx_Math" alttext="\Theta" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Θ</mi><annotation encoding="application/x-tex">\Theta</annotation></semantics></math>. Suppose the policy is updated by GRAE-PPU. Then:</span></span>
<span id="A8.I2" class="ltx_enumerate">
<span id="A8.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A8.I2.i1.p1" class="ltx_para">
<span id="A8.I2.i1.p1.1" class="ltx_p"><span id="A8.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><span id="A8.I2.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Advantage unbiasedness</span><span id="A8.I2.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">) </span><math id="A8.I2.i1.p1.m1" class="ltx_math_unparsed" alttext="\mathbb{E}[\hat{A}_{\textup{GRAE}}(\bm{s},\bm{a})\mid\bm{s},\bm{a}]=A_{\bm{\pi}}^{\textup{Bandit}}(\bm{s},\bm{a})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔼</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><msub><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo>^</mo></mover><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">GRAE</mtext></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒂</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒂</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Bandit</mtext></msubsup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒂</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\mathbb{E}[\hat{A}_{\textup{GRAE}}(\bm{s},\bm{a})\mid\bm{s},\bm{a}]=A_{\bm{\pi}}^{\textup{Bandit}}(\bm{s},\bm{a})</annotation></semantics></math><span id="A8.I2.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A8.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A8.I2.i2.p1" class="ltx_para">
<span id="A8.I2.i2.p1.1" class="ltx_p"><span id="A8.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><span id="A8.I2.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Monotonic improvement</span><span id="A8.I2.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">) </span><math id="A8.I2.i2.p1.m1" class="ltx_Math" alttext="J(\bm{\pi}_{k+1})\geq J(\bm{\pi}_{k}),\quad\forall k\in\mathbb{N}" display="inline" intent=":literal"><semantics><mrow><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="1.167em">,</mo><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.167em">∀</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ℕ</mi></mrow></mrow><annotation encoding="application/x-tex">J(\bm{\pi}_{k+1})\geq J(\bm{\pi}_{k}),\quad\forall k\in\mathbb{N}</annotation></semantics></math><span id="A8.I2.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A8.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A8.I2.i3.p1" class="ltx_para">
<span id="A8.I2.i3.p1.1" class="ltx_p"><span id="A8.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><span id="A8.I2.i3.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Convergence</span><span id="A8.I2.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">) </span><math id="A8.I2.i3.p1.m1" class="ltx_Math" alttext="\lim_{k\to\infty}J(\bm{\pi}_{k})=J^{*}" display="inline" intent=":literal"><semantics><mrow><mrow><msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">lim</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">∞</mi></mrow></msub><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</mo></msup></mrow><annotation encoding="application/x-tex">\lim_{k\to\infty}J(\bm{\pi}_{k})=J^{*}</annotation></semantics></math><span id="A8.I2.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>