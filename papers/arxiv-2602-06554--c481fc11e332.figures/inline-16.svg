<svg id="A7.SS2.p1.pic1" class="ltx_picture" height="257.26" overflow="visible" version="1.1" viewbox="0 0 477.38 257.26" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,257.26) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#3C2569;" fill="#3C2569" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 251.35 C 0 254.61 2.64 257.26 5.91 257.26 L 471.47 257.26 C 474.73 257.26 477.38 254.61 477.38 251.35 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FCF2F5;" fill="#FCF2F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 233.15 L 475.41 233.15 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 241.74)"><foreignobject style="--ltx-fo-width:27.28em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="377.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A7.SS2.p1.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:27.28em;">
<span id="A7.SS2.p1.pic1.p1" class="ltx_para ltx_indent">
<span id="A7.SS2.p1.pic1.p1.1" class="ltx_p"><span id="A7.SS2.p1.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Theorem 7: </span><span id="A7.SS2.p1.pic1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Convergence Failure of GRAE-PPU</span></span>
</span></span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 136.24)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:6.15em;--ltx-fo-depth:8.85em;font-size:10pt;" height="207.56" overflow="visible" transform="matrix(1 0 0 -1 0 85.1)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS2.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A7.SS2.p1.pic1.2.1" class="ltx_p"><span id="A7.SS2.p1.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Consider a general MDP where there exist states <math id="A7.SS2.p1.pic1.m1" class="ltx_Math" alttext="s_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">s_{t}</annotation></semantics></math> with <math id="A7.SS2.p1.pic1.m2" class="ltx_Math" alttext="V(s_{t})\neq V(s_{0})" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≠</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">V(s_{t})\neq V(s_{0})</annotation></semantics></math>. Let GRAE-PPU update the policy using the drift function from Lemma 5. Then:</span></span>
<span id="A7.I1" class="ltx_enumerate">
<span id="A7.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A7.I1.i1.p1" class="ltx_para">
<span id="A7.I1.i1.p1.1" class="ltx_p"><span id="A7.I1.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><span id="A7.I1.i1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Drift zero-at-origin violation</span><span id="A7.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">) </span><math id="A7.I1.i1.p1.m1" class="ltx_Math" alttext="\exists\,s_{t}:\mathfrak{D}_{\pi}^{\textup{GRAE-PPU}}(\pi|s_{t})\neq 0" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.337em">∃</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub></mrow><mo style="--ltx-fg-color:#000000;" lspace="0.278em" mathcolor="#000000" rspace="0.278em">:</mo><mrow><mrow><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔇</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">GRAE-PPU</mtext></msubsup><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">|</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≠</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow></mrow><annotation encoding="application/x-tex">\exists\,s_{t}:\mathfrak{D}_{\pi}^{\textup{GRAE-PPU}}(\pi|s_{t})\neq 0</annotation></semantics></math><span id="A7.I1.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A7.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A7.I1.i2.p1" class="ltx_para">
<span id="A7.I1.i2.p1.1" class="ltx_p"><span id="A7.I1.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><span id="A7.I1.i2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Drift nonnegativity violation</span><span id="A7.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">) </span><math id="A7.I1.i2.p1.m1" class="ltx_Math" alttext="\exists\,s_{t},\bar{\pi}:\mathfrak{D}_{\pi}^{\textup{GRAE-PPU}}(\bar{\pi}|s_{t})&lt;0" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.337em">∃</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover><mo style="--ltx-fg-color:#000000;" lspace="0.278em" mathcolor="#000000" rspace="0.278em">:</mo><mrow><mrow><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔇</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">GRAE-PPU</mtext></msubsup><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">|</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow></mrow></mrow><annotation encoding="application/x-tex">\exists\,s_{t},\bar{\pi}:\mathfrak{D}_{\pi}^{\textup{GRAE-PPU}}(\bar{\pi}|s_{t})&lt;0</annotation></semantics></math><span id="A7.I1.i2.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A7.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A7.I1.i3.p1" class="ltx_para">
<span id="A7.I1.i3.p1.1" class="ltx_p"><span id="A7.I1.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">(</span><span id="A7.I1.i3.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Policy degradation</span><span id="A7.I1.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">) </span><math id="A7.I1.i3.p1.m1" class="ltx_Math" alttext="\exists\,\pi_{\textup{old}}:J(\pi_{\textup{new}})&lt;J(\pi_{\textup{old}})" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.337em">∃</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">old</mtext></msub></mrow><mo style="--ltx-fg-color:#000000;" lspace="0.278em" mathcolor="#000000" rspace="0.278em">:</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">new</mtext></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">old</mtext></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow></mrow><annotation encoding="application/x-tex">\exists\,\pi_{\textup{old}}:J(\pi_{\textup{new}})&lt;J(\pi_{\textup{old}})</annotation></semantics></math><span id="A7.I1.i3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>