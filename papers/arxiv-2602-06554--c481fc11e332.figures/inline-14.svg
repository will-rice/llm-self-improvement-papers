<svg id="A7.SS1.p2.pic1" class="ltx_picture" height="130.08" overflow="visible" version="1.1" viewbox="0 0 477.38 130.08" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,130.08) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#3C2569;" fill="#3C2569" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 124.17 C 0 127.43 2.64 130.08 5.91 130.08 L 471.47 130.08 C 474.73 130.08 477.38 127.43 477.38 124.17 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FCF2F5;" fill="#FCF2F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 108.66 L 475.41 108.66 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 114.56)"><foreignobject style="--ltx-fo-width:27.28em;--ltx-fo-height:0.69em;--ltx-fo-depth:0em;font-size:10pt;" height="9.61" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="377.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A7.SS1.p2.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:27.28em;">
<span id="A7.SS1.p2.pic1.p1" class="ltx_para ltx_indent">
<span id="A7.SS1.p2.pic1.p1.1" class="ltx_p"><span id="A7.SS1.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Lemma 4: </span><span id="A7.SS1.p2.pic1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Structural Bias of GRAE in MDPs</span></span>
</span></span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 20.74)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:5.5em;--ltx-fo-depth:0.5em;font-size:10pt;" height="83.07" overflow="visible" transform="matrix(1 0 0 -1 0 76.1)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A7.SS1.p2.pic1.2.1" class="ltx_p"><span id="A7.SS1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">In general MDPs, GRAE introduces a structural bias <math id="A7.SS1.p2.pic1.m1" class="ltx_Math" alttext="\Delta(s_{t})=V(s_{t})-V(s_{0})" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Δ</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow></mrow><annotation encoding="application/x-tex">\Delta(s_{t})=V(s_{t})-V(s_{0})</annotation></semantics></math> that does not vanish as the number of samples increases:</span></span>
<span id="A7.E90" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A7.E90.m1" class="ltx_math_unparsed" alttext="\lim_{N\to\infty}\mathbb{E}[\hat{A}_{\textup{GRAE}}(s_{t},a_{t})-A_{\textup{true}}(s_{t},a_{t})\mid s_{t},a_{t}]=V(s_{t})-V(s_{0})\neq 0." display="block" intent=":literal"><semantics><mrow><munder><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" movablelimits="false">lim</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">N</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">∞</mi></mrow></munder><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔼</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><msub><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo>^</mo></mover><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">GRAE</mtext></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">true</mtext></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">∣</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≠</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">\lim_{N\to\infty}\mathbb{E}[\hat{A}_{\textup{GRAE}}(s_{t},a_{t})-A_{\textup{true}}(s_{t},a_{t})\mid s_{t},a_{t}]=V(s_{t})-V(s_{0})\neq 0.</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(90)</span></span></span></span>
</span>
</span></span></span></foreignobject></g></g></svg>