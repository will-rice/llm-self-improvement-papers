<svg id="A6.SS1.p2.pic1" class="ltx_picture" height="241.8" overflow="visible" version="1.1" viewbox="0 0 477.38 241.8" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,241.8) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#3C2569;" fill="#3C2569" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 235.9 C 0 239.16 2.64 241.8 5.91 241.8 L 471.47 241.8 C 474.73 241.8 477.38 239.16 477.38 235.9 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FCF2F5;" fill="#FCF2F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 217.69 L 475.41 217.69 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 226.29)"><foreignobject style="--ltx-fo-width:27.28em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="377.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A6.SS1.p2.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:27.28em;">
<span id="A6.SS1.p2.pic1.p1" class="ltx_para ltx_indent">
<span id="A6.SS1.p2.pic1.p1.1" class="ltx_p"><span id="A6.SS1.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Lemma 3: </span><span id="A6.SS1.p2.pic1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">PPU as Mirror Learning</span></span>
</span></span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 152.07)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:3.89em;--ltx-fo-depth:9.99em;font-size:10pt;" height="192.11" overflow="visible" transform="matrix(1 0 0 -1 0 53.81)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A6.SS1.p2.pic1.2.1" class="ltx_p"><span id="A6.SS1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">PPU is an instance of Mirror Learning with the following components:</span></span>
<span id="A6.I1" class="ltx_enumerate">
<span id="A6.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A6.I1.i1.p1" class="ltx_para">
<span id="A6.I1.i1.p1.1" class="ltx_p"><span id="A6.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Drift function:</span><span id="A6.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="A6.I1.i1.p1.m1" class="ltx_Math" alttext="\mathfrak{D}_{\pi}^{\textup{PPU}}(\bar{\pi}|s)=\mathbb{E}_{a\sim\pi}\left[\operatorname{ReLU}\left(\left[r(\bar{\pi})-\operatorname{clip}(r(\bar{\pi}),1\pm\epsilon)\right]A_{\pi}(s,a)\right)\right]" display="inline" intent=":literal"><semantics><mrow><mrow><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔇</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">PPU</mtext></msubsup><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔼</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∼</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi></mrow></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">[</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ReLU</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">[</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">clip</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">±</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϵ</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">]</mo></mrow><mo lspace="0em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">]</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\mathfrak{D}_{\pi}^{\textup{PPU}}(\bar{\pi}|s)=\mathbb{E}_{a\sim\pi}\left[\operatorname{ReLU}\left(\left[r(\bar{\pi})-\operatorname{clip}(r(\bar{\pi}),1\pm\epsilon)\right]A_{\pi}(s,a)\right)\right]</annotation></semantics></math><span id="A6.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">,
where </span><math id="A6.I1.i1.p1.m2" class="ltx_Math" alttext="r(\bar{\pi})=\frac{\bar{\pi}(a|s)}{\pi(a|s)}" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mfrac></mrow><annotation encoding="application/x-tex">r(\bar{\pi})=\frac{\bar{\pi}(a|s)}{\pi(a|s)}</annotation></semantics></math><span id="A6.I1.i1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A6.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A6.I1.i2.p1" class="ltx_para">
<span id="A6.I1.i2.p1.1" class="ltx_p"><span id="A6.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Neighbourhood operator:</span><span id="A6.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="A6.I1.i2.p1.m1" class="ltx_Math" alttext="\mathcal{N}=\Pi" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒩</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Π</mi></mrow><annotation encoding="application/x-tex">\mathcal{N}=\Pi</annotation></semantics></math><span id="A6.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> (trivial neighbourhood).</span></span>
</span></span>
<span id="A6.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A6.I1.i3.p1" class="ltx_para">
<span id="A6.I1.i3.p1.1" class="ltx_p"><span id="A6.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Sampling distribution:</span><span id="A6.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="A6.I1.i3.p1.m1" class="ltx_Math" alttext="\beta_{\pi}=\bar{\rho}_{\pi}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">β</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msub><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ρ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi></msub></mrow><annotation encoding="application/x-tex">\beta_{\pi}=\bar{\rho}_{\pi}</annotation></semantics></math><span id="A6.I1.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">, the normalized marginal discounted state distribution.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>