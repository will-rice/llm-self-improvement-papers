<svg id="A4.SS1.p1.pic1" class="ltx_picture" height="127.96" overflow="visible" version="1.1" viewbox="0 0 477.38 127.96" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,127.96) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#3C2569;" fill="#3C2569" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 122.05 C 0 125.31 2.64 127.96 5.91 127.96 L 471.47 127.96 C 474.73 127.96 477.38 125.31 477.38 122.05 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FCF2F5;" fill="#FCF2F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 106.54 L 475.41 106.54 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 112.44)"><foreignobject style="--ltx-fo-width:27.28em;--ltx-fo-height:0.69em;--ltx-fo-depth:0em;font-size:10pt;" height="9.61" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="377.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.SS1.p1.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:27.28em;">
<span id="A4.SS1.p1.pic1.p1" class="ltx_para ltx_indent">
<span id="A4.SS1.p1.pic1.p1.1" class="ltx_p"><span id="A4.SS1.p1.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Lemma 1: </span><span id="A4.SS1.p1.pic1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Baseline Invariance</span></span>
</span></span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 18.7)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:5.49em;--ltx-fo-depth:0.36em;font-size:10pt;" height="80.95" overflow="visible" transform="matrix(1 0 0 -1 0 76.03)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A4.SS1.p1.pic1.2.1" class="ltx_p"><span id="A4.SS1.p1.pic1.2.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">(Adapted from the Theorem of RL <cite class="ltx_cite ltx_citemacro_citep">(<a href="#bib.bib9" title class="ltx_ref">Sutton et al., 1998</a>)</cite>)<span id="A4.SS1.p1.pic1.2.1.1.1" class="ltx_text ltx_font_upright">
For any function <math id="A4.SS1.p1.pic1.m1" class="ltx_Math" alttext="b(s_{t})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">b(s_{t})</annotation></semantics></math> that depends only on the state <math id="A4.SS1.p1.pic1.m2" class="ltx_Math" alttext="s_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">s_{t}</annotation></semantics></math> and not on the current action <math id="A4.SS1.p1.pic1.m3" class="ltx_Math" alttext="a_{t}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><annotation encoding="application/x-tex">a_{t}</annotation></semantics></math>:</span></span></span>
<span id="A4.E51" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A4.E51.m1" class="ltx_math_unparsed" alttext="\mathbb{E}_{a_{t}\sim\pi_{\theta}(\cdot\mid s_{t})}\left[\nabla_{\theta}\log\pi_{\theta}(a_{t}\mid s_{t})\cdot b(s_{t})\right]=0." display="block" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔼</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><msub><mrow></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∼</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><msub><mrow></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">⋅</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><msub><mrow></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">[</mo><msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.167em">∇</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">log</mi><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">θ</mi></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">∣</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.055em" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.222em">⋅</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">b</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">]</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">\mathbb{E}_{a_{t}\sim\pi_{\theta}(\cdot\mid s_{t})}\left[\nabla_{\theta}\log\pi_{\theta}(a_{t}\mid s_{t})\cdot b(s_{t})\right]=0.</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(51)</span></span></span></span>
</span>
</span></span></span></foreignobject></g></g></svg>