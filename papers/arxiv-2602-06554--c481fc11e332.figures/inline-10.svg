<span id="A5.SS1.p2.pic1.p1" class="ltx_para ltx_indent">
<span id="A5.SS1.p2.pic1.p1.1" class="ltx_p"><span id="A5.SS1.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Lemma 2: </span><span id="A5.SS1.p2.pic1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">REINFORCE as Mirror Learning</span></span>
</span></span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 135.47)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:5.09em;--ltx-fo-depth:8.79em;font-size:10pt;" height="192.11" overflow="visible" transform="matrix(1 0 0 -1 0 70.42)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A5.SS1.p2.pic1.2.1" class="ltx_p"><span id="A5.SS1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">REINFORCE is an instance of Mirror Learning with the following components:</span></span>
<span id="A5.I1" class="ltx_enumerate">
<span id="A5.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A5.I1.i1.p1" class="ltx_para">
<span id="A5.I1.i1.p1.1" class="ltx_p"><span id="A5.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Drift function:</span><span id="A5.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="A5.I1.i1.p1.m1" class="ltx_Math" alttext="\mathfrak{D}\equiv 0" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔇</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≡</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">\mathfrak{D}\equiv 0</annotation></semantics></math><span id="A5.I1.i1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> (trivial drift).</span></span>
</span></span>
<span id="A5.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A5.I1.i2.p1" class="ltx_para">
<span id="A5.I1.i2.p1.1" class="ltx_p"><span id="A5.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Neighbourhood operator:</span><span id="A5.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="A5.I1.i2.p1.m1" class="ltx_Math" alttext="\mathcal{N}=\Pi" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒩</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Π</mi></mrow><annotation encoding="application/x-tex">\mathcal{N}=\Pi</annotation></semantics></math><span id="A5.I1.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> (trivial neighbourhood).</span></span>
</span></span>
<span id="A5.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A5.I1.i3.p1" class="ltx_para">
<span id="A5.I1.i3.p1.1" class="ltx_p"><span id="A5.I1.i3.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Sampling distribution:</span><span id="A5.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="A5.I1.i3.p1.m1" class="ltx_Math" alttext="\beta_{\pi}=\rho_{\pi}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">β</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ρ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi></msub></mrow><annotation encoding="application/x-tex">\beta_{\pi}=\rho_{\pi}</annotation></semantics></math><span id="A5.I1.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">, the state visitation distribution under the current policy.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>