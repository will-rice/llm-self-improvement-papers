<span id="S4.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:27.84em;">
<span id="S4.p2.pic1.1.1" class="ltx_p"><span id="S4.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Fundamental Principles of SeeUPO</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 17.13 148.49)"><foreignobject style="--ltx-fo-width:32.02em;--ltx-fo-height:2.68em;--ltx-fo-depth:9.78em;font-size:10pt;" height="172.43" overflow="visible" transform="matrix(1 0 0 -1 0 37.13)" width="443.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.02em;">
<span id="S4.p2.pic1.2.1" class="ltx_p"><span id="S4.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">This modeling approach is built upon two fundamental principles:</span></span>
<span id="S4.I1" class="ltx_enumerate">
<span id="S4.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="S4.I1.i1.p1" class="ltx_para">
<span id="S4.I1.i1.p1.1" class="ltx_p"><span id="S4.I1.i1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Transforming convergence analysis at the turn-level into convergence analysis at the agent-level</span><span id="S4.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">, which allows leveraging existing multi-agent reinforcement learning (MARL) theories to solve the problem.</span></span>
</span></span>
<span id="S4.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="S4.I1.i2.p1" class="ltx_para">
<span id="S4.I1.i2.p1.1" class="ltx_p"><span id="S4.I1.i2.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Transforming multi-timestep MDP problems into bandit problems</span><span id="S4.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">, which enables unbiased advantage estimation without requiring value function estimation.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>