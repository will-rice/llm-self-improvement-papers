<span id="A7.SS1.p5.pic1.p1" class="ltx_para ltx_indent">
<span id="A7.SS1.p5.pic1.p1.1" class="ltx_p"><span id="A7.SS1.p5.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Lemma 5: </span><span id="A7.SS1.p5.pic1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">GRAE-PPU Drift Function</span></span>
</span></span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:4.3em;--ltx-fo-depth:0.25em;font-size:10pt;" height="62.96" overflow="visible" transform="matrix(1 0 0 -1 0 59.5)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS1.p5.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A7.SS1.p5.pic1.2.1" class="ltx_p"><span id="A7.SS1.p5.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">GRAE-PPU induces a drift function of the form:</span></span>
<span id="A7.E95" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A7.E95.m1" class="ltx_Math" alttext="\mathfrak{D}_{\pi}^{\textup{GRAE-PPU}}(\bar{\pi}|s_{t})=\mathbb{E}_{a_{t}\sim\pi}\left[\operatorname{ReLU}\left((r(\bar{\pi})-\operatorname{clip}(r(\bar{\pi}),1\pm\epsilon))(A_{\textup{true}}(s_{t},a_{t})+\Delta(s_{t}))\right)\right]-\Delta(s_{t})," display="block" intent=":literal"><semantics><mrow><mrow><mrow><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔇</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">GRAE-PPU</mtext></msubsup><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">|</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔼</mi><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∼</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi></mrow></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">[</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ReLU</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">(</mo><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">clip</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">±</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ϵ</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">true</mtext></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">a</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Δ</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">]</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Δ</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo></mrow><annotation encoding="application/x-tex">\mathfrak{D}_{\pi}^{\textup{GRAE-PPU}}(\bar{\pi}|s_{t})=\mathbb{E}_{a_{t}\sim\pi}\left[\operatorname{ReLU}\left((r(\bar{\pi})-\operatorname{clip}(r(\bar{\pi}),1\pm\epsilon))(A_{\textup{true}}(s_{t},a_{t})+\Delta(s_{t}))\right)\right]-\Delta(s_{t}),</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(95)</span></span></span></span>
</span>
<span id="A7.SS1.p5.pic1.2.2" class="ltx_p"><span id="A7.SS1.p5.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">where <math id="A7.SS1.p5.pic1.m1" class="ltx_Math" alttext="\Delta(s_{t})=V(s_{t})-V(s_{0})" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Δ</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow></mrow><annotation encoding="application/x-tex">\Delta(s_{t})=V(s_{t})-V(s_{0})</annotation></semantics></math> is the structural bias from Lemma 4.</span></span>
</span></span></span></foreignobject></g></g></svg>