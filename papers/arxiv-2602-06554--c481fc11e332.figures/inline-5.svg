<svg id="A2.SS0.SSS0.Px1.p2.pic1" class="ltx_picture" height="164.88" overflow="visible" version="1.1" viewbox="0 0 477.38 164.88" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,164.88) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#3C2569;" fill="#3C2569" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 158.97 C 0 162.23 2.64 164.88 5.91 164.88 L 471.47 164.88 C 474.73 164.88 477.38 162.23 477.38 158.97 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FCF2F5;" fill="#FCF2F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 140.77 L 475.41 140.77 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 149.36)"><foreignobject style="--ltx-fo-width:27.28em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="377.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A2.SS0.SSS0.Px1.p2.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:27.28em;">
<span id="A2.SS0.SSS0.Px1.p2.pic1.p1" class="ltx_para ltx_indent">
<span id="A2.SS0.SSS0.Px1.p2.pic1.p1.1" class="ltx_p"><span id="A2.SS0.SSS0.Px1.p2.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Definition 1: </span><span id="A2.SS0.SSS0.Px1.p2.pic1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Optimal Continuation Value</span></span>
</span></span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.44)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:8.06em;--ltx-fo-depth:0.26em;font-size:10pt;" height="115.18" overflow="visible" transform="matrix(1 0 0 -1 0 111.51)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS0.SSS0.Px1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A2.SS0.SSS0.Px1.p2.pic1.2.1" class="ltx_p"><span id="A2.SS0.SSS0.Px1.p2.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">For reward function <math id="A2.SS0.SSS0.Px1.p2.pic1.m1" class="ltx_math_unparsed" alttext="r(\bm{s}_{0},\bm{a}^{1:T})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒂</mi><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" lspace="0.278em" mathcolor="#000000" rspace="0.278em">:</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi></mrow></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">r(\bm{s}_{0},\bm{a}^{1:T})</annotation></semantics></math>, define recursively:</span></span>
<span id="A2.EGx2" class="ltx_equationgroup ltx_eqn_align ltx_eqn_table">

<span id="A2.E20"><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_td ltx_align_right ltx_eqn_cell"><math id="A2.E20.m1" class="ltx_math_unparsed" alttext="\displaystyle V^{*}(\bm{s}_{0},\bm{a}^{1:T})" display="inline" intent=":literal"><semantics><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</mo></msup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒂</mi><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" lspace="0.278em" mathcolor="#000000" rspace="0.278em">:</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi></mrow></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\displaystyle V^{*}(\bm{s}_{0},\bm{a}^{1:T})</annotation></semantics></math></span>
<span class="ltx_td ltx_align_left ltx_eqn_cell"><math id="A2.E20.m2" class="ltx_math_unparsed" alttext="\displaystyle=r(\bm{s}_{0},\bm{a}^{1:T})," display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">r</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒂</mi><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" lspace="0.278em" mathcolor="#000000" rspace="0.278em">:</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi></mrow></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo></mrow><annotation encoding="application/x-tex">\displaystyle=r(\bm{s}_{0},\bm{a}^{1:T}),</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(20)</span></span></span></span>
<span id="A2.E21"><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_td ltx_align_right ltx_eqn_cell"><math id="A2.E21.m1" class="ltx_math_unparsed" alttext="\displaystyle V^{*}(\bm{s}_{0},\bm{a}^{1:t-1})" display="inline" intent=":literal"><semantics><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</mo></msup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒂</mi><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" lspace="0.278em" mathcolor="#000000" rspace="0.278em">:</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></mrow></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\displaystyle V^{*}(\bm{s}_{0},\bm{a}^{1:t-1})</annotation></semantics></math></span>
<span class="ltx_td ltx_align_left ltx_eqn_cell"><math id="A2.E21.m2" class="ltx_math_unparsed" alttext="\displaystyle=\max_{\bm{a}^{t}}V^{*}(\bm{s}_{0},\bm{a}^{1:t}),\quad t=T,\ldots,1." display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><munder><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">max</mi><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒂</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msup></munder><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</mo></msup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒂</mi><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" lspace="0.278em" mathcolor="#000000" rspace="0.278em">:</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></mrow></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="1.167em">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">\displaystyle=\max_{\bm{a}^{t}}V^{*}(\bm{s}_{0},\bm{a}^{1:t}),\quad t=T,\ldots,1.</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(21)</span></span></span></span>
</span>
<span id="A2.SS0.SSS0.Px1.p2.pic1.2.2" class="ltx_p"><span id="A2.SS0.SSS0.Px1.p2.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Here <math id="A2.SS0.SSS0.Px1.p2.pic1.m2" class="ltx_Math" alttext="V^{*}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</mo></msup><annotation encoding="application/x-tex">V^{*}</annotation></semantics></math> denotes the unique function defined by the terminal condition and the backward maximization recursion. The globally optimal policy satisfies, for all <math id="A2.SS0.SSS0.Px1.p2.pic1.m3" class="ltx_Math" alttext="t\in\{1,\ldots,T\}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">{</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">}</mo></mrow></mrow><annotation encoding="application/x-tex">t\in\{1,\ldots,T\}</annotation></semantics></math>, <math id="A2.SS0.SSS0.Px1.p2.pic1.m4" class="ltx_math_unparsed" alttext="\pi^{*,t}(\bm{s}_{0},\bm{a}^{1:t-1})=\argmax_{\bm{a}^{t}}V^{*}(\bm{s}_{0},\bm{a}^{1:t})" display="inline" intent=":literal"><semantics><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0em">∗</mo><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></mrow></msup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒂</mi><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" lspace="0.278em" mathcolor="#000000" rspace="0.278em">:</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></mrow></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msub><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">arg</mi><mo lspace="0.170em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">max</mi></mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝐚</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></msup></msub><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</mo></msup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝐬</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝐚</mi><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" lspace="0.278em" mathcolor="#000000" rspace="0.278em">:</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></mrow></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\pi^{*,t}(\bm{s}_{0},\bm{a}^{1:t-1})=\argmax_{\bm{a}^{t}}V^{*}(\bm{s}_{0},\bm{a}^{1:t})</annotation></semantics></math>.</span></span>
</span></span></span></foreignobject></g></g></svg>