<svg id="A1.SS2.SSS0.Px6.p3.pic1" class="ltx_picture" height="268.6" overflow="visible" version="1.1" viewbox="0 0 477.38 268.6" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,268.6) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#3C2569;" fill="#3C2569" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 262.69 C 0 265.95 2.64 268.6 5.91 268.6 L 471.47 268.6 C 474.73 268.6 477.38 265.95 477.38 262.69 L 477.38 5.91 C 477.38 2.64 474.73 0 471.47 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FCF2F5;" fill="#FCF2F5" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 244.49 L 475.41 244.49 L 475.41 5.91 C 475.41 3.73 473.65 1.97 471.47 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 253.08)"><foreignobject style="--ltx-fo-width:27.28em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="377.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A1.SS2.SSS0.Px6.p3.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:27.28em;">
<span id="A1.SS2.SSS0.Px6.p3.pic1.p1" class="ltx_para ltx_indent">
<span id="A1.SS2.SSS0.Px6.p3.pic1.p1.1" class="ltx_p"><span id="A1.SS2.SSS0.Px6.p3.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Theorem 1: </span><span id="A1.SS2.SSS0.Px6.p3.pic1.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Monotonic Improvement under HAML</span></span>
</span></span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:15.57em;--ltx-fo-depth:0.25em;font-size:10pt;" height="218.9" overflow="visible" transform="matrix(1 0 0 -1 0 215.44)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS2.SSS0.Px6.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A1.SS2.SSS0.Px6.p3.pic1.2.1" class="ltx_p"><span id="A1.SS2.SSS0.Px6.p3.pic1.2.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">(Adapted from the Fundamental Theorem of HAML <cite class="ltx_cite ltx_citemacro_citep">(<a href="#bib.bib18" title class="ltx_ref">Zhong et al., 2024</a>)</cite>)<span id="A1.SS2.SSS0.Px6.p3.pic1.2.1.1.1" class="ltx_text ltx_font_upright">
Let <math id="A1.SS2.SSS0.Px6.p3.pic1.m1" class="ltx_Math" alttext="\mathcal{N}=\{1,\ldots,n\}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒩</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">{</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">…</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">n</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">}</mo></mrow></mrow><annotation encoding="application/x-tex">\mathcal{N}=\{1,\ldots,n\}</annotation></semantics></math> be the set of agents. For each agent <math id="A1.SS2.SSS0.Px6.p3.pic1.m2" class="ltx_Math" alttext="i\in\mathcal{N}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒩</mi></mrow><annotation encoding="application/x-tex">i\in\mathcal{N}</annotation></semantics></math>, let <math id="A1.SS2.SSS0.Px6.p3.pic1.m3" class="ltx_Math" alttext="\mathfrak{D}^{i}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔇</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msup><annotation encoding="application/x-tex">\mathfrak{D}^{i}</annotation></semantics></math> be a heterogeneous-agent drift functional satisfying the nonnegativity and zero gradient properties, and let <math id="A1.SS2.SSS0.Px6.p3.pic1.m4" class="ltx_Math" alttext="\mathcal{U}^{i}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒰</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi></msup><annotation encoding="application/x-tex">\mathcal{U}^{i}</annotation></semantics></math> be a neighbourhood operator satisfying the closed ball property. Consider the policy sequence <math id="A1.SS2.SSS0.Px6.p3.pic1.m5" class="ltx_Math" alttext="\{\bm{\pi}_{k}\}_{k=0}^{\infty}" display="inline" intent=":literal"><semantics><msubsup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">{</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">}</mo></mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">∞</mi></msubsup><annotation encoding="application/x-tex">\{\bm{\pi}_{k}\}_{k=0}^{\infty}</annotation></semantics></math> generated by the HAML update rule: at each iteration <math id="A1.SS2.SSS0.Px6.p3.pic1.m6" class="ltx_Math" alttext="k" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><annotation encoding="application/x-tex">k</annotation></semantics></math>, agents update sequentially via:</span></span></span>
<span id="A1.E18" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A1.E18.m1" class="ltx_math_unparsed" alttext="\pi^{i_{m}}_{k+1}=\argmax_{\bar{\pi}^{i_{m}}\in\mathcal{U}^{i_{m}}_{\bm{\pi}_{k}}(\pi^{i_{m}}_{k})}\mathbb{E}_{s\sim\beta_{\bm{\pi}_{k}}}\left[\left[\mathcal{M}^{(\bar{\pi}^{i_{m}})}_{\mathfrak{D}^{i_{m}},\bm{\pi}^{i_{1:m-1}}_{k+1}}A_{\bm{\pi}_{k}}\right](s)\right]," display="block" intent=":literal"><semantics><mrow><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi></msub></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msub><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">arg</mi><mo lspace="0.170em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">max</mi></mrow><mrow><msup><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi></msub></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><mrow><msubsup><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒰</mi><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi></msub></msubsup><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi></msub></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow></msub><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔼</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∼</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">β</mi><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></msub></mrow></msub><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">[</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">[</mo><msubsup><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℳ</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔇</mi><msup><mrow></mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi></msub></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><msup><mrow></mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><msub><mrow></mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" lspace="0.278em" mathcolor="#000000" rspace="0.278em">:</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></mrow></msub></mrow></msup><msub><mrow></mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub></mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msup><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi></msub></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></msubsup><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">]</mo></mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">s</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">]</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo></mrow><annotation encoding="application/x-tex">\pi^{i_{m}}_{k+1}=\argmax_{\bar{\pi}^{i_{m}}\in\mathcal{U}^{i_{m}}_{\bm{\pi}_{k}}(\pi^{i_{m}}_{k})}\mathbb{E}_{s\sim\beta_{\bm{\pi}_{k}}}\left[\left[\mathcal{M}^{(\bar{\pi}^{i_{m}})}_{\mathfrak{D}^{i_{m}},\bm{\pi}^{i_{1:m-1}}_{k+1}}A_{\bm{\pi}_{k}}\right](s)\right],</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(18)</span></span></span></span>
</span>
<span id="A1.SS2.SSS0.Px6.p3.pic1.2.2" class="ltx_p"><span id="A1.SS2.SSS0.Px6.p3.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">where <math id="A1.SS2.SSS0.Px6.p3.pic1.m7" class="ltx_Math" alttext="\beta_{\bm{\pi}}\in\mathcal{P}(\mathcal{S})" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">β</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><mrow><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒫</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒮</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\beta_{\bm{\pi}}\in\mathcal{P}(\mathcal{S})</annotation></semantics></math> is a positive sampling distribution. Then, the expected return is monotonically non-decreasing:</span></span>
<span id="A1.E19" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A1.E19.m1" class="ltx_Math" alttext="J(\bm{\pi}_{k+1})\geq J(\bm{\pi}_{k}),\quad\forall k\in\mathbb{N}." display="block" intent=":literal"><semantics><mrow><mrow><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">J</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="1.167em">,</mo><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.167em">∀</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ℕ</mi></mrow></mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000">.</mo></mrow><annotation encoding="application/x-tex">J(\bm{\pi}_{k+1})\geq J(\bm{\pi}_{k}),\quad\forall k\in\mathbb{N}.</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span>
<span rowspan="1" class="ltx_eqn_cell ltx_eqn_eqno ltx_align_middle ltx_align_right"><span class="ltx_tag ltx_tag_equation ltx_align_right">(19)</span></span></span></span>
</span>
</span></span></span></foreignobject></g></g></svg>