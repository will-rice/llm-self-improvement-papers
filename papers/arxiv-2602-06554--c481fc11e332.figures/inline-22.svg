<span id="A8.SS3.SSS1.p23.pic1.2.1" class="ltx_p"><span id="A8.SS3.SSS1.p23.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If <math id="A8.SS3.SSS1.p23.pic1.m1" class="ltx_Math" alttext="\delta(\bm{s})=1" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">δ</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">\delta(\bm{s})=1</annotation></semantics></math>, then <math id="A8.SS3.SSS1.p23.pic1.m2" class="ltx_math_unparsed" alttext="\nabla_{\bar{\bm{\pi}}(\cdot|\bm{s})}\mathfrak{D}_{\bm{\pi}_{\text{old}}}^{\text{GSPO}}(\bar{\bm{\pi}}|\bm{s})\big|_{\bar{\bm{\pi}}=\bm{\pi}_{\text{old}}}=0" display="inline" intent=":literal"><semantics><mrow><msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∇</mo><mrow><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">⋅</mo><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" rspace="0.167em" stretchy="false">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></msub><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔇</mi><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">old</mtext></msub><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">GSPO</mtext></msubsup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" rspace="0.167em" stretchy="false">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝒔</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><msub><mo style="--ltx-fg-color:#000000;" fence="false" mathcolor="#000000" maxsize="1.200em" minsize="1.200em" stretchy="true">|</mo><mrow><mover accent="true"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">¯</mo></mover><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝝅</mi><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">old</mtext></msub></mrow></msub><mo style="--ltx-fg-color:#000000;" lspace="0.167em" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">\nabla_{\bar{\bm{\pi}}(\cdot|\bm{s})}\mathfrak{D}_{\bm{\pi}_{\text{old}}}^{\text{GSPO}}(\bar{\bm{\pi}}|\bm{s})\big|_{\bar{\bm{\pi}}=\bm{\pi}_{\text{old}}}=0</annotation></semantics></math>.</span></span>
