<svg id="S4.SS3.p5.pic1" class="ltx_picture" height="233.25" overflow="visible" version="1.1" viewbox="0 0 650 233.25" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,233.25) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#D9D9FF;" fill="#D9D9FF" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 227.34 C 0 230.6 2.64 233.25 5.91 233.25 L 644.09 233.25 C 647.36 233.25 650 230.6 650 227.34 L 650 5.91 C 650 2.64 647.36 0 644.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#FAFAFF;" fill="#FAFAFF" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 227.34 C 1.97 229.51 3.73 231.28 5.91 231.28 L 644.09 231.28 C 646.27 231.28 648.03 229.51 648.03 227.34 L 648.03 5.91 C 648.03 3.73 646.27 1.97 644.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:47.41em;--ltx-fo-height:14.62em;--ltx-fo-depth:0.25em;font-size:10pt;" height="205.69" overflow="visible" transform="matrix(1 0 0 -1 0 202.23)" width="656.02"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S4.SS3.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.41em;">
<span id="S4.SS3.p5.pic1.1.1" class="ltx_p"><span id="S4.SS3.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Example 1: Group Element Assignment (4/16 correct). Pairwise ✓, Pointwise ✗.<span id="S4.SS3.p5.pic1.1.1.1.1" class="ltx_text ltx_font_medium">
Assign elements to groups by divisibility (smallest index wins).
Pointwise assigns 12 of 16 candidates the maximum score 10/10, selecting an <math id="S4.SS3.p5.pic1.m1" class="ltx_Math" alttext="O(|\text{groups}|{\times}|\text{elements}|)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">O</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">groups</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.055em" stretchy="false">|</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.222em">×</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">elements</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">O(|\text{groups}|{\times}|\text{elements}|)</annotation></semantics></math> brute-force that passes examples but exceeds time limits on large inputs. Pairwise (<math id="S4.SS3.p5.pic1.m2" class="ltx_Math" alttext="\mu{=}0.917" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">μ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.917</mn></mrow><annotation encoding="application/x-tex">\mu{=}0.917</annotation></semantics></math>) selects a solution using divisor enumeration (<math id="S4.SS3.p5.pic1.m3" class="ltx_Math" alttext="O(\sqrt{g})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">O</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msqrt style="--ltx-fg-color:#000000;" mathcolor="#000000"><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">g</mi></msqrt><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">O(\sqrt{g})</annotation></semantics></math> per group) with a hash map. Head-to-head comparison surfaces the algorithmic difference that independent scoring misses.</span></span></span>
<span id="S4.SS3.p5.pic1.1.2" class="ltx_p"><span id="S4.SS3.p5.pic1.1.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Example 2: Binary String Trade (1/16 correct). Pairwise ✓, Pointwise ✗.<span id="S4.SS3.p5.pic1.1.2.1.1" class="ltx_text ltx_font_medium">
Maximize active sections after at most one trade on an augmented binary string.
Only 1 of 16 solutions is correct (idx=15). Pointwise gives it 8/10 but gives an incorrect solution (idx=4) the maximum 10/10. Pairwise assigns the correct solution the highest <math id="S4.SS3.p5.pic1.m4" class="ltx_Math" alttext="\mu" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">μ</mi><annotation encoding="application/x-tex">\mu</annotation></semantics></math> score of 1.000 through head-to-head wins, successfully finding the needle in a haystack of 16 candidates.</span></span></span>
<span id="S4.SS3.p5.pic1.1.3" class="ltx_p"><span id="S4.SS3.p5.pic1.1.3.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">See Appendix <a href="#A8" title="Appendix H Code Generation Verification Examples (LiveCodeBench-v6)" class="ltx_ref"><span class="ltx_text ltx_ref_tag">H</span></a> for full code and additional examples.<span id="S4.SS3.p5.pic1.1.3.1.1" class="ltx_text"></span></span></span>
</span></span></span></foreignobject></g></g></svg>