<span id="A8.SS3.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.41em;">
<span id="A8.SS3.p1.pic1.2.1" class="ltx_p"><span id="A8.SS3.p1.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Given an integer array <span id="A8.SS3.p1.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">groups</span> (group sizes) and an integer array <span id="A8.SS3.p1.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">elements</span>, assign one element to each group such that <span id="A8.SS3.p1.pic1.2.1.1.3" class="ltx_text ltx_font_typewriter">groups[i]</span> is divisible by <span id="A8.SS3.p1.pic1.2.1.1.4" class="ltx_text ltx_font_typewriter">elements[j]</span>. Among valid elements, choose the one with the smallest index <math id="A8.SS3.p1.pic1.m1" class="ltx_Math" alttext="j" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">j</mi><annotation encoding="application/x-tex">j</annotation></semantics></math>. If no element works, assign <math id="A8.SS3.p1.pic1.m2" class="ltx_Math" alttext="-1" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">-1</annotation></semantics></math>.</span></span>
</span></span></span></foreignobject></g></g></svg>