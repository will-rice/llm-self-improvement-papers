<span id="A6.SS2.SSS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.4em;">
<span id="A6.SS2.SSS1.p1.pic1.2.1" class="ltx_p"><span id="A6.SS2.SSS1.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">You are an expert code reviewer. Compare two solutions to a programming problem and rate their correctness.
<br class="ltx_break" style="--ltx-break-space:4.7pt;">
<span id="A6.SS2.SSS1.p1.pic1.2.1.1.1" class="ltx_text ltx_font_bold">**Evaluation Guidelines:**
<br class="ltx_break"></span>- Analyze the problem’s requirements and constraints.
<br class="ltx_break">- Mentally trace each solution with test cases (including edge cases) to verify correctness.
<br class="ltx_break">- If both solutions appear correct, prefer the more robust and fault-tolerant one.
<br class="ltx_break" style="--ltx-break-space:4.7pt;">
<span id="A6.SS2.SSS1.p1.pic1.2.1.1.2" class="ltx_text ltx_font_bold">**Problem**
<br class="ltx_break"></span>{problem}
<br class="ltx_break" style="--ltx-break-space:4.7pt;">
<span id="A6.SS2.SSS1.p1.pic1.2.1.1.3" class="ltx_text ltx_font_bold">**Solution A**
<br class="ltx_break"></span>{code_A}
<br class="ltx_break" style="--ltx-break-space:4.7pt;">
<span id="A6.SS2.SSS1.p1.pic1.2.1.1.4" class="ltx_text ltx_font_bold">**Solution B**
<br class="ltx_break"></span>{code_B}
<br class="ltx_break" style="--ltx-break-space:4.7pt;">
<span id="A6.SS2.SSS1.p1.pic1.2.1.1.5" class="ltx_text ltx_font_bold">**Output Format:**
<br class="ltx_break"></span>First, provide your step-by-step reasoning. Then, on separate new lines, provide your final ratings using the EXACT tags below. Add no other text after the tags.
<br class="ltx_break">&lt;rating_A&gt;INTEGER_1_TO_10&lt;/rating_A&gt;
<br class="ltx_break">&lt;rating_B&gt;INTEGER_1_TO_10&lt;/rating_B&gt;
<br class="ltx_break" style="--ltx-break-space:4.7pt;">
<span id="A6.SS2.SSS1.p1.pic1.2.1.1.6" class="ltx_text ltx_font_bold">**Rating Rules:**
<br class="ltx_break"></span>- Rate correctness on a 1-10 scale (10 = correct &amp; robust, 5 = borderline, 1 = incorrect).
<br class="ltx_break">- The higher rating wins. Equal ratings imply a tie.
<br class="ltx_break">Please provide your analysis now.
