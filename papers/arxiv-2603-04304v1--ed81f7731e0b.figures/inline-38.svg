</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 14.82)"><foreignobject style="--ltx-fo-width:46.4em;--ltx-fo-height:11.35em;--ltx-fo-depth:0.07em;font-size:10pt;" height="158.09" overflow="visible" transform="matrix(1 0 0 -1 0 157.05)" width="642.05"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A8.SS4.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.4em;">
<span id="A8.SS4.p4.pic1.2.1" class="ltx_p"><span id="A8.SS4.p4.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">class Solution:
<br class="ltx_break"> def largestInteger(self, nums, k):
<br class="ltx_break">  count = {}
<br class="ltx_break">  for i in range(len(nums) - k + 1):
<br class="ltx_break">   for num in nums[i:i + k]:
<br class="ltx_break">    count[num] = count.get(num, 0) + 1
<br class="ltx_break">  # Bug: counts total <em id="A8.SS4.p4.pic1.2.1.1.1" class="ltx_emph ltx_font_italic">occurrences</em> across subarrays,
<br class="ltx_break">  # not the number of <em id="A8.SS4.p4.pic1.2.1.1.2" class="ltx_emph ltx_font_italic">distinct subarrays</em> containing the element
<br class="ltx_break">  almost = [n for n, f in count.items() if f == 1]
<br class="ltx_break">  return max(almost) if almost else -1
</span></span>
</span></span></span></foreignobject></g></g></svg>