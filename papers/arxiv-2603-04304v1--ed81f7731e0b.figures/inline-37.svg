<span id="A8.SS4.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.4em;">
<span id="A8.SS4.p3.pic1.2.1" class="ltx_p"><span id="A8.SS4.p3.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">class Solution:
<br class="ltx_break"> def largestInteger(self, nums, k):
<br class="ltx_break">  max_val = max(nums)
<br class="ltx_break">  for val in range(max_val, -1, -1):
<br class="ltx_break">   count = 0
<br class="ltx_break">   for start in range(len(nums) - k + 1):
<br class="ltx_break">    if val in nums[start:start + k]:
<br class="ltx_break">     count += 1
<br class="ltx_break">   if count == 1: return val
<br class="ltx_break">  return -1
</span></span>
</span></span></span></foreignobject></g></g></svg>