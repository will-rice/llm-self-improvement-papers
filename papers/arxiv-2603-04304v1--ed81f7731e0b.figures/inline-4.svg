</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:43.85em;--ltx-fo-height:7.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="111.93" overflow="visible" transform="matrix(1 0 0 -1 0 109.24)" width="606.76"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S4.SS3.p6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:43.85em;">
<span id="S4.SS3.p6.pic1.2.1" class="ltx_p"><span id="S4.SS3.p6.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Pairwise self-verification (<math id="S4.SS3.p6.pic1.m2" class="ltx_Math" alttext="\textbf{V}_{1}" display="inline" intent=":literal"><semantics><msub><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_bold" mathcolor="#000000">V</mtext><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><annotation encoding="application/x-tex">\textbf{V}_{1}</annotation></semantics></math>-Infer) yields more accurate candidate ranking than pointwise scoring and enables improved performance by test-time scaling of verification compute, compared with self-aggregation based test-time scaling. Furthermore, pairwise self-verification is complementary to aggregation-based approaches: when combined with RSA, it improves convergence latency by providing a reliable fitness signal within the evolutionary loop.</span></span>
</span></span></span></foreignobject></g></g></svg>