<svg id="A7.SS1.p1.pic1" class="ltx_picture" height="208.98" overflow="visible" version="1.1" viewbox="0 0 650 208.98" width="650"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,208.98) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#4CAF93;" fill="#4CAF93" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 203.07 C 0 206.34 2.64 208.98 5.91 208.98 L 644.09 208.98 C 647.36 208.98 650 206.34 650 203.07 L 650 5.91 C 650 2.64 647.36 0 644.09 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F5F8FA;" fill="#F5F8FA" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 186.1 L 648.03 186.1 L 648.03 5.91 C 648.03 3.73 646.27 1.97 644.09 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 194.43)"><foreignobject style="--ltx-fo-width:41.17em;--ltx-fo-height:0.63em;--ltx-fo-depth:0.18em;font-size:10pt;" height="11.07" overflow="visible" transform="matrix(1 0 0 -1 0 8.65)" width="569.68"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS1.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.17em;">
<span id="A7.SS1.p1.pic1.1.1" class="ltx_p"><span id="A7.SS1.p1.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">Issue: Correct expected format in invalid DurationField error message</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.2)"><foreignobject style="--ltx-fo-width:47.41em;--ltx-fo-height:11.43em;--ltx-fo-depth:0.18em;font-size:10pt;" height="160.51" overflow="visible" transform="matrix(1 0 0 -1 0 158.09)" width="656.02"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A7.SS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.41em;">
<span id="A7.SS1.p1.pic1.2.1" class="ltx_p"><span id="A7.SS1.p1.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">If you enter a duration “14:00” into a duration field, it translates to “00:14:00” which is 14 minutes. The current error message for invalid DurationField says that this should be the format of durations: <span id="A7.SS1.p1.pic1.2.1.1.1" class="ltx_text ltx_font_typewriter">[DD] [HH:[MM:]]ss[.uuuuuu]</span>. But according to the actual behaviour, it should be: <span id="A7.SS1.p1.pic1.2.1.1.2" class="ltx_text ltx_font_typewriter">[DD] [[HH:]MM:]ss[.uuuuuu]</span>, because seconds are mandatory, minutes are optional, and hours are optional if minutes are provided. This seems to be a mistake in all Django versions that support the DurationField. Also the duration fields could have a default <span id="A7.SS1.p1.pic1.2.1.1.3" class="ltx_text ltx_font_typewriter">help_text</span> with the requested format, because the syntax is not self-explanatory.</span></span>
</span></span></span></foreignobject></g></g></svg>