<svg id="A6.F3.pic1" class="ltx_picture" height="493.6" overflow="visible" version="1.1" viewbox="0 0 653.15 493.6" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,493.6) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#466EAA;" fill="#466EAA" fill-opacity="1.0"><path style="stroke:none" d="M 0 3.46 L 0 474.33 C 0 476.25 1.55 477.79 3.46 477.79 L 649.69 477.79 C 651.6 477.79 653.15 476.25 653.15 474.33 L 653.15 3.46 C 653.15 1.55 651.6 0 649.69 0 L 3.46 0 C 1.55 0 0 1.55 0 3.46 Z" /></g><g style="--ltx-fill-color:#F5F8FD;" fill="#F5F8FD" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 3.46 L 0.69 474.33 C 0.69 475.86 1.93 477.1 3.46 477.1 L 649.69 477.1 C 651.22 477.1 652.46 475.86 652.46 474.33 L 652.46 3.46 C 652.46 1.93 651.22 0.69 649.69 0.69 L 3.46 0.69 C 1.93 0.69 0.69 1.93 0.69 3.46 Z" /></g><g transform="matrix(1.0 0.0 0.0 1.0 11.07 469.92)"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" class="ltx_nestedsvg" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="matrix(1 0 0 1 0 0)"><g style="--ltx-fill-color:#466EAA;" fill="#466EAA" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.77 L 0 20.91 C 0 22.44 1.24 23.68 2.77 23.68 L 166.97 23.68 C 168.5 23.68 169.74 22.44 169.74 20.91 L 169.74 2.77 C 169.74 1.24 168.5 0 166.97 0 L 2.77 0 C 1.24 0 0 1.24 0 2.77 Z" /></g><g style="--ltx-fill-color:#466EAA;" fill="#466EAA" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.77 L 0 20.91 C 0 22.44 1.24 23.68 2.77 23.68 L 166.97 23.68 C 168.5 23.68 169.74 22.44 169.74 20.91 L 169.74 2.77 C 169.74 1.24 168.5 0 166.97 0 L 2.77 0 C 1.24 0 0 1.24 0 2.77 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 11.81 8.38)"><foreignobject style="--ltx-fo-width:8.17em;--ltx-fo-height:0.68em;--ltx-fo-depth:0.23em;font-size:11pt;" height="13.84" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="124.35"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A6.F3.pic1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Reasoning Agent (<math id="A6.F3.pic1.m1" class="ltx_Math" alttext="\mathcal{M}_{R}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#FFFFFF;" class="ltx_font_mathcaligraphic" mathcolor="#FFFFFF">ℳ</mi><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">R</mi></msub><annotation encoding="application/x-tex">\mathcal{M}_{R}</annotation></semantics></math>)</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.7 16.39)"><foreignobject style="--ltx-fo-width:42.79em;--ltx-fo-height:32.41em;--ltx-fo-depth:0.25em;font-size:10pt;" height="451.94" overflow="visible" transform="matrix(1 0 0 -1 0 448.48)" width="592.09"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.79em;">
<span id="A6.F3.pic1.2.1" class="ltx_p"><span id="A6.F3.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Answer the given question. You must conduct reasoning inside <span id="A6.F3.pic1.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#466EAA;">&lt;think&gt;</span> and <span id="A6.F3.pic1.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#466EAA;">&lt;/think&gt;</span> first every time you get new information and give feedback indicating what is missing in the information or what needs to be improved in the query.
</span></span>
<span id="A6.F3.pic1.2.2" class="ltx_p"><span id="A6.F3.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">After reasoning, if you find you lack some knowledge, you can call a search engine by <span id="A6.F3.pic1.2.2.1.1" class="ltx_text" style="--ltx-fg-color:#466EAA;">&lt;search&gt;</span> </span><span id="A6.F3.pic1.2.2.2" class="ltx_text" style="--ltx-fg-color:#B4461E;">{<span id="A6.F3.pic1.2.2.2.1" class="ltx_text ltx_font_italic">query</span>}<span id="A6.F3.pic1.2.2.2.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> <span id="A6.F3.pic1.2.2.2.2.1" class="ltx_text" style="--ltx-fg-color:#466EAA;">&lt;/search&gt;</span> and it will return the top searched results between <span id="A6.F3.pic1.2.2.2.2.2" class="ltx_text" style="--ltx-fg-color:#466EAA;">&lt;information&gt;</span> and <span id="A6.F3.pic1.2.2.2.2.3" class="ltx_text" style="--ltx-fg-color:#466EAA;">&lt;/information&gt;</span>. You can search as many times as you want.
</span></span></span>
<span id="A6.F3.pic1.2.3" class="ltx_p"><span id="A6.F3.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">If you find no further external knowledge needed, you can directly provide the answer inside <span id="A6.F3.pic1.2.3.1.1" class="ltx_text" style="--ltx-fg-color:#466EAA;">&lt;answer&gt;</span> and <span id="A6.F3.pic1.2.3.1.2" class="ltx_text" style="--ltx-fg-color:#466EAA;">&lt;/answer&gt;</span>, without detailed illustrations. For example, <span id="A6.F3.pic1.2.3.1.3" class="ltx_text" style="--ltx-fg-color:#466EAA;">&lt;answer&gt;</span> Beijing <span id="A6.F3.pic1.2.3.1.4" class="ltx_text" style="--ltx-fg-color:#466EAA;">&lt;/answer&gt;</span>.
</span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A6.F3.pic1.2.4" class="ltx_p"><span id="A6.F3.pic1.2.4.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Question:<span id="A6.F3.pic1.2.4.1.1" class="ltx_text ltx_font_medium"> </span></span><span id="A6.F3.pic1.2.4.2" class="ltx_text" style="--ltx-fg-color:#B4461E;">{<span id="A6.F3.pic1.2.4.2.1" class="ltx_text ltx_font_italic">question</span>}<span id="A6.F3.pic1.2.4.2.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">
</span></span></span>
</span></span></span></foreignobject></g></g></svg>