an class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A6.F4.pic1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Satisfaction Judgment Prompt <math id="A6.F4.pic1.m1" class="ltx_Math" alttext="P_{\text{J}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#FFFFFF;" mathcolor="#FFFFFF">P</mi><mtext style="--ltx-fg-color:#FFFFFF;" class="ltx_mathvariant_bold-sans-serif" mathcolor="#FFFFFF">J</mtext></msub><annotation encoding="application/x-tex">P_{\text{J}}</annotation></semantics></math></span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.7 242.39)"><foreignobject style="--ltx-fo-width:42.79em;--ltx-fo-height:21.3em;--ltx-fo-depth:16.58em;font-size:10pt;" height="524.2" overflow="visible" transform="matrix(1 0 0 -1 0 294.73)" width="592.09"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.79em;">
<span id="A6.F4.pic1.2.1" class="ltx_p"><span id="A6.F4.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are an evaluator for a search problem. You will be given a global search query, a local sub-query, retrieved documents, and critique feedback from a reasoning model. Your ONLY task is to evaluate if the retrieved documents are satisfactory for answering the <span id="A6.F4.pic1.2.1.1.1" class="ltx_text ltx_font_bold">current sub-query</span>.
</span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A6.F4.pic1.2.2" class="ltx_p"><span id="A6.F4.pic1.2.2.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Global Query:<span id="A6.F4.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> </span></span><span id="A6.F4.pic1.2.2.2" class="ltx_text" style="--ltx-fg-color:#B4461E;">{<span id="A6.F4.pic1.2.2.2.1" class="ltx_text ltx_font_italic">og_query</span>}
<br class="ltx_break"><span id="A6.F4.pic1.2.2.2.2" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Local Sub-query:<span id="A6.F4.pic1.2.2.2.2.1" class="ltx_text ltx_font_medium"> </span></span>{<span id="A6.F4.pic1.2.2.2.3" class="ltx_text ltx_font_italic">sub_query</span>}
<br class="ltx_break"><span id="A6.F4.pic1.2.2.2.4" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Retrieved Documents:<span id="A6.F4.pic1.2.2.2.4.1" class="ltx_text ltx_font_medium"> </span></span>{<span id="A6.F4.pic1.2.2.2.5" class="ltx_text ltx_font_italic">documents</span>}
<br class="ltx_break"><span id="A6.F4.pic1.2.2.2.6" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Critique of Retrieved Documents:<span id="A6.F4.pic1.2.2.2.6.1" class="ltx_text ltx_font_medium"> </span></span>{<span id="A6.F4.pic1.2.2.2.7" class="ltx_text ltx_font_italic">feedback</span>}<span id="A6.F4.pic1.2.2.2.8" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">
</span></span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A6.F4.pic1.2.3" class="ltx_p"><span id="A6.F4.pic1.2.3.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Outputs:<span id="A6.F4.pic1.2.3.1.1" class="ltx_text ltx_font_medium">
</span></span></span>
<span id="A6.I1" class="ltx_itemize">
<span id="A6.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I1.i1.p1" class="ltx_para">
<span id="A6.I1.i1.p1.1" class="ltx_p"><span id="A6.I1.i1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">satisfactory:</span><span id="A6.I1.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> If documents are sufficient to answer the current sub-query, output </span><span id="A6.I1.i1.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#466EAA;">&lt;satisfactory&gt;</span><span id="A6.I1.i1.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> yes </span><span id="A6.I1.i1.p1.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#466EAA;">&lt;/satisfactory&gt;</span><span id="A6.I1.i1.p1.1.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">; otherwise </span><span id="A6.I1.i1.p1.1.7" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#466EAA;">&lt;satisfactory&gt;</span><span id="A6.I1.i1.p1.1.8" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> no </span><span id="A6.I1.i1.p1.1.9" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#466EAA;">&lt;/satisfactory&gt;</span><span id="A6.I1.i1.p1.1.10" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">.
</span></span>
</span></span>
<span id="A6.I1.i2" class="ltx_item" style="list-style-type:none;padding-top:2.0pt;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I1.i2.p1" class="ltx_para">
<span id="A6.I1.i2.p1.1" class="ltx_p"><span id="A6.I1.i2.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">reason:</span><span id="A6.I1.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> A concise reason for the decision. If ‘no’, state exactly what is missing. Format: </span><span id="A6.I1.i2.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#466EAA;">&lt;reason&gt;</span><span id="A6.I1.i2.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> </span><span id="A6.I1.i2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#B4461E;">{<span id="A6.I1.i2.p1.1.5.1" class="ltx_text ltx_font_italic">reason</span>}</span><span id="A6.I1.i2.p1.1.6" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"> </span><span id="A6.I1.i2.p1.1.7" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#466EAA;">&lt;/reason&gt;</span><span id="A6.I1.i2.p1.1.8" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">.
</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>