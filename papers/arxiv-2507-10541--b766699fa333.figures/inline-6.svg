<span id="S8.F12.pic1.p1" class="ltx_para ltx_indent">
<span id="S8.F12.pic1.p1.1" class="ltx_p"><span id="S8.F12.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">Prompt 4: </span><span id="S8.F12.pic1.p1.1.2" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#FFFFFF;">Answer Extraction Promopt</span></span>
</span></span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.91 10.33)"><foreignobject style="--ltx-fo-width:46.73em;--ltx-fo-height:28.23em;--ltx-fo-depth:0.18em;font-size:10pt;" height="392.98" overflow="visible" transform="matrix(1 0 0 -1 0 390.55)" width="646.61"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S8.F12.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:46.73em;">
<span id="S8.F12.pic1.2.1" class="ltx_p"><span id="S8.F12.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Extract the final answers from the given predictions. Here are some extraction criteria:</span></span>
<span id="S8.F12.pic1.2.2" class="ltx_p"><span id="S8.F12.pic1.2.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">1. Don’t try to answer the original question. Your task is to extract the final answer from the prediction as it is, even if it is incorrect.
<br class="ltx_break">2. Prediction sometimes involves lengthy thinking processes, you don’t need to consider these, just extract the final answer. 
<br class="ltx_break">3. If there is question that has not been answered, don’t answer it yourself. You should set the final answer to None (e.g., \boxed{None}).
<br class="ltx_break">4. Ensure the number of final answers you extract is exactly the same as the number of the given questions. 
<br class="ltx_break">5. Extract the final answer for each question one by one and enclose each final answer within an \boxed. For example, if there are three questions, the output should be 
<br class="ltx_break">Answer to Q1: \boxed{answer 1}
<br class="ltx_break">Answer to Q2: \boxed{answer 2}
<br class="ltx_break">Answer to Q3: \boxed{answer 3}.</span></span>
<span id="S8.F12.pic1.2.3" class="ltx_p"><span id="S8.F12.pic1.2.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Here is your task. Simply extract the final answers from the given predictions. Don’t apologize or correct yourself if there was a mistake in the predictions; we are just trying to extract the final answer.</span></span>
<span id="S8.F12.pic1.2.4" class="ltx_p"><span id="S8.F12.pic1.2.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">&lt;Questions Begin&gt;:</span></span>
<span id="S8.F12.pic1.2.5" class="ltx_p"><span id="S8.F12.pic1.2.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">{question}</span></span>
<span id="S8.F12.pic1.2.6" class="ltx_p"><span id="S8.F12.pic1.2.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">&lt;Questions End&gt;</span></span>
<span id="S8.F12.pic1.2.7" class="ltx_p"><span id="S8.F12.pic1.2.7.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">&lt;Predictions Begin&gt;:</span></span>
<span id="S8.F12.pic1.2.8" class="ltx_p"><span id="S8.F12.pic1.2.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">{prediction}</span></span>
<span id="S8.F12.pic1.2.9" class="ltx_p"><span id="S8.F12.pic1.2.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">&lt;Predictions End&gt;</span></span>
<span id="S8.F12.pic1.2.10" class="ltx_p"><span id="S8.F12.pic1.2.10.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Extract the final answers from the given predictions.</span></span>
</span></span></span></foreignobject></g></g></svg>