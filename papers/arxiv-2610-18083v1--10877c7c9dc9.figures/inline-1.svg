<span id="S5.SS2.p5.pic1.1.1" class="ltx_p"><span id="S5.SS2.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">RQ1 Key Takeaway.<span id="S5.SS2.p5.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Under the reported resource allocations, <span id="S5.SS2.p5.pic1.1.1.1.1.1" class="ltx_text ltx_font_smallcaps">AReaL-RSI</span> outperforms <span id="S5.SS2.p5.pic1.1.1.1.1.2" class="ltx_text ltx_font_smallcaps">Codex-Goal</span> on all six metrics with both backbones. The results support end-to-end effectiveness across tasks, without establishing equal-compute efficiency.</span></span></span>
