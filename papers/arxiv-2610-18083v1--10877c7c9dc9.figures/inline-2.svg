<span id="S5.SS3.p5.pic1.1.1" class="ltx_p"><span id="S5.SS3.p5.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">RQ2 Key Takeaway.<span id="S5.SS3.p5.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> Sharing with specialized researcher roles gives the best result in all seven comparable task-backbone pairs, whereas sharing alone has mixed outcomes. The evidence favors the combined configuration at the evaluated parallelism.</span></span></span>
