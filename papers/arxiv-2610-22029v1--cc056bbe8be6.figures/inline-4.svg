<span id="A8.SS1.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:36.1em;">
<span id="A8.SS1.p2.pic1.2.1" class="ltx_p ltx_align_left"><span id="A8.SS1.p2.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Construct an original, challenging competition-mathematics problem.
</span></span>
<span id="A8.SS1.p2.pic1.2.2" class="ltx_p ltx_align_left"><span id="A8.SS1.p2.pic1.2.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Work out the problem and its answer privately before writing your response.
You may draw on algebra, geometry, number theory, combinatorics, prealgebra,
probability, statistics, calculus, or another mathematical area. Choose a
challenge that fewer than 30% of advanced high-school students would solve.
Familiar textbook exercises and recognizable contest questions should not be
reused.
</span></span>
<span id="A8.SS1.p2.pic1.2.3" class="ltx_p ltx_align_left"><span id="A8.SS1.p2.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Your response must contain two parts in this order: the problem statement
enclosed by &lt;question&gt; and
&lt;/question&gt;, then its final answer enclosed by
<code id="A8.SS1.p2.pic1.2.3.1.1" class="ltx_verbatim">\boxed{}</code>. Do not include your planning, a worked solution, or any
other commentary. Follow this layout:
</span></span>
<span id="A8.SS1.p2.pic1.2.4" class="ltx_p ltx_align_left"><span id="A8.SS1.p2.pic1.2.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">&lt;question&gt;
<br class="ltx_break">{problem_statement}
<br class="ltx_break">&lt;/question&gt;</span></span>
