<span id="S3.F5.pic2.2.1" class="ltx_p"><span id="S3.F5.pic2.2.1.1" class="ltx_text ltx_font_bold" style="font-size:70%;--ltx-fg-color:#000000;">Document:<span id="S3.F5.pic2.2.1.1.1" class="ltx_text ltx_font_medium"> [Passage about solar system scale] ”The diameter of the Sun is 1,391,000 km. The diameter of the Moon is 3,475 km. The distance from Earth to the Sun is 149,600,000 km. For a solar eclipse to occur, the Moon must appear the same angular size as the Sun from Earth. In a scale model, a circle with diameter 2 cm represents Earth. When Earth is scaled to 0.3 mm (like a period), the entire solar system model changes dramatically…”
<br class="ltx_break"></span>Generated MCQ:<span id="S3.F5.pic2.2.1.1.2" class="ltx_text ltx_font_medium"> An alien civilization has a moon with diameter 3,475 km that creates perfect solar eclipses. Their star has the same diameter as our Sun. If their moon orbits at 374,000 km (maintaining the same angular size ratio as Earth’s eclipse geometry), approximately what would be the distance from their planet to their star in kilometers?
<br class="ltx_break">A) 374,000,000 km
<br class="ltx_break">B) 149,600,000 km
<br class="ltx_break">C) 1,391,000,000 km
<br class="ltx_break">D) 74,800,000 km
<br class="ltx_break"></span>Answer:<span id="S3.F5.pic2.2.1.1.3" class="ltx_text ltx_font_medium"> B</span></span></span>
</span></span></span></foreignobject></g></g></svg>