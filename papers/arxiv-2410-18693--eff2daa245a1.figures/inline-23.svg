<span id="A6.F15.pic1.1.1" class="ltx_p"><span id="A6.F15.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#FFFFFF;">Examples for Solvability Optimization</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 12.92)"><foreignobject style="--ltx-fo-width:42.1em;--ltx-fo-height:28.75em;--ltx-fo-depth:0em;font-size:10pt;" height="397.82" overflow="visible" transform="matrix(1 0 0 -1 0 397.82)" width="582.55"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F15.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.1em;">
<span id="A6.F15.pic1.2.1" class="ltx_p"><span id="A6.F15.pic1.2.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Problems 1 (Before Optimization):<span id="A6.F15.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">There are 10 survivors in an emergency room. Each survivor is either a child, a woman, or a man. If there are 4 men and <span id="A6.F15.pic1.2.1.1.1.1" class="ltx_text" style="--ltx-fg-color:#D32F2F;">3 times as many women as men</span>, how many children are there? 
<br class="ltx_break"></span>Problems 1 (After Optimization):<span id="A6.F15.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">There are 10 survivors in an emergency room. Each survivor is either a child, a woman, or a man. If there are 4 men and <span id="A6.F15.pic1.2.1.1.2.1" class="ltx_text" style="--ltx-fg-color:#4CAF50;">an equal number of women as men</span>, how many children are there?
</span></span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A6.F15.pic1.2.2" class="ltx_p"><span id="A6.F15.pic1.2.2.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Problems 2 (Before Optimization):<span id="A6.F15.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">How many sides does a polygon have <span id="A6.F15.pic1.2.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#D32F2F;">if it is a regular polygon?</span> 
<br class="ltx_break"></span>Problems 2 (After Optimization):<span id="A6.F15.pic1.2.2.1.2" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">How many sides does a regular polygon have <span id="A6.F15.pic1.2.2.1.2.1" class="ltx_text" style="--ltx-fg-color:#4CAF50;">if each interior angle is 120 degrees</span>? 
<br class="ltx_break"></span></span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A6.F15.pic1.2.3" class="ltx_p"><span id="A6.F15.pic1.2.3.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Problems 3 (Before Optimization):<span id="A6.F15.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Find the sum of the first three terms of <span id="A6.F15.pic1.2.3.1.1.1" class="ltx_text" style="--ltx-fg-color:#D32F2F;">this series</span>. 
<br class="ltx_break"></span>Problems 3 (After Optimization):<span id="A6.F15.pic1.2.3.1.2" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Calculate the sum of the first three terms of the <span id="A6.F15.pic1.2.3.1.2.1" class="ltx_text" style="--ltx-fg-color:#4CAF50;">arithmetic series where the first term is 5 and the common difference is 3</span>.
</span></span></span>
