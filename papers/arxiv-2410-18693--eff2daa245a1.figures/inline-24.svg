<span id="A6.F16.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.1em;">
<span id="A6.F16.pic1.1.1" class="ltx_p"><span id="A6.F16.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#FFFFFF;">Examples for Difficulty Optimization</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 12.92)"><foreignobject style="--ltx-fo-width:42.1em;--ltx-fo-height:27.95em;--ltx-fo-depth:0em;font-size:10pt;" height="386.75" overflow="visible" transform="matrix(1 0 0 -1 0 386.75)" width="582.55"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F16.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.1em;">
<span id="A6.F16.pic1.2.1" class="ltx_p"><span id="A6.F16.pic1.2.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Problems 1 (Before Optimization):<span id="A6.F16.pic1.2.1.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">How many 4-digit positive integers are there? 
<br class="ltx_break"></span>Problems 1 (After Optimization):<span id="A6.F16.pic1.2.1.1.2" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">How many 4-digit positive integers can be formed using non-repeating digits where the sum of these digits must be even, and the integers fall within the range of 1000 to 9999? 
<br class="ltx_break"></span></span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A6.F16.pic1.2.2" class="ltx_p"><span id="A6.F16.pic1.2.2.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Problems 2 (Before Optimization):<span id="A6.F16.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">The average of 15 numbers is 32. An additional number is then added to the list, and the new average of the 16 numbers is 34. What number was added to the list? 
<br class="ltx_break"></span>Problems 2 (After Optimization):<span id="A6.F16.pic1.2.2.1.2" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">The average of 15 positive integers is 32, but one integer fluctuates to 30 before adding a new number. After adding this new number, the average of the 16 integers becomes 34. Calculate the added number and find the standard deviation of all 16 integers, considering their ascending order. 
<br class="ltx_break"></span></span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A6.F16.pic1.2.3" class="ltx_p"><span id="A6.F16.pic1.2.3.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">Problems 3 (Before Optimization):<span id="A6.F16.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">A fair coin is tossed 50 times, what is the probability of getting heads at least 25 times? 
<br class="ltx_break"></span>Problems 3 (After Optimization):<span id="A6.F16.pic1.2.3.1.2" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">A fair coin is tossed 50 times; what is the probability of obtaining heads at least 25 times, and can you also calculate the expected number, variance, and standard deviation of heads while determining the likelihood that the total number of heads exceeds 30?
</span></span></span>
</span></span></span></foreignobject></g></g></svg>