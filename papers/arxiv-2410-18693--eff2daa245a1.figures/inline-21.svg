<span id="A6.F13.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.1em;">
<span id="A6.F13.pic1.1.1" class="ltx_p"><span id="A6.F13.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#FFFFFF;">Prompts for Difficulty Classification</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.79 16.38)"><foreignobject style="--ltx-fo-width:42.1em;--ltx-fo-height:25.81em;--ltx-fo-depth:0.25em;font-size:10pt;" height="360.61" overflow="visible" transform="matrix(1 0 0 -1 0 357.15)" width="582.55"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F13.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:42.1em;">
<span id="A6.F13.pic1.2.1" class="ltx_p"><span id="A6.F13.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;"># Instruction 
<br class="ltx_break">
<br class="ltx_break">You first need to identify the given user intent and then label the difficulty level of the user query based on the content of the user query. 
<br class="ltx_break">
<br class="ltx_break">## User Query 
<br class="ltx_break"></span></span>
<span id="A6.F13.pic1.2.2" class="ltx_p"><span id="A6.F13.pic1.2.2.1" class="ltx_text ltx_font_typewriter ltx_framed ltx_framed_rectangle" style="--ltx-fg-color:#000000;--ltx-bg-color:#D0DFE5;--ltx-border-color:#D0DFE5;">Input</span></span>
<span id="A6.F13.pic1.2.3" class="ltx_p"><span id="A6.F13.pic1.2.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">## Output Format 
<br class="ltx_break">Given the user query, in your output, you first need to identify the user intent and the knowledge needed to solve the task in the user query. 
<br class="ltx_break">Then, rate the difficulty level of the user query as very easy, easy, medium, hard, or very hard. 
<br class="ltx_break">
<br class="ltx_break">Now, please output the user intent and difficulty level below in a json format by filling in the placeholders in []: 
<br class="ltx_break">{{ 
<br class="ltx_break">‘‘intent’’: ‘‘The user wants to [....]’’, 
<br class="ltx_break">‘‘knowledge’’: ‘‘To solve this problem, the models need to know [....]’’, 
<br class="ltx_break">‘‘difficulty’’: ‘‘[very easy/easy/medium/hard/very hard]’’ 
<br class="ltx_break">}} 
<br class="ltx_break"></span></span>
</span></span></span></foreignobject></g></g></svg>