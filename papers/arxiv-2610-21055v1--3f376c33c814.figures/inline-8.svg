<span id="A5.SS2.p6.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.99em;">
<span id="A5.SS2.p6.pic1.3.1" class="ltx_p"><span id="A5.SS2.p6.pic1.3.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="font-size:79%;--ltx-fg-color:#000000;">Evidence.</span><span id="A5.SS2.p6.pic1.3.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> The team’s models fail the large logic puzzles. <span id="A5.SS2.p6.pic1.3.1.2.1" class="ltx_text" style="--ltx-fg-color:#4F72B8;">Agent 1</span>
considers training on short correct solutions and first checks whether any
exist among the model’s own samples. The quote gives, per puzzle size, how many solved puzzles have a correct answer under 8k and under 10k tokens.</span></span>
<span id="A5.SS2.p6.pic1.3.2" class="ltx_p"><span id="A5.SS2.p6.pic1.3.2.1" class="ltx_text ltx_font_smallcaps" style="font-size:90%;--ltx-fg-color:#2E5AA8;">Researcher<span id="A5.SS2.p6.pic1.3.2.1.1" class="ltx_text ltx_font_upright" style="--ltx-fg-color:#000000;"> <em id="A5.SS2.p6.pic1.3.2.1.1.1" class="ltx_emph ltx_font_italic">compact-solution RFT
idea checked and dropped …: shortest correct per prompt under 8k / 10k
tokens: 4x5 171/287 of 382 solved, 4x6 42/165 of 363, 5x4 106/208 of 347, 5x5
3/37 of 157, 6x4 3/31 of 121. Large puzzles need 10-16k tokens in the model’s
own style; no short correct traces to learn from.</em></span></span></span>
<span id="A5.SS2.p6.pic1.3.3" class="ltx_p"><span id="A5.SS2.p6.pic1.3.3.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="font-size:79%;--ltx-fg-color:#000000;">Action.</span><span id="A5.SS2.p6.pic1.3.3.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> The idea is dropped without a training run.</span></span>
