<span id="A5.SS2.p2.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.99em;">
<span id="A5.SS2.p2.pic1.3.1" class="ltx_p"><span id="A5.SS2.p2.pic1.3.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="font-size:79%;--ltx-fg-color:#000000;">Evidence.</span><span id="A5.SS2.p2.pic1.3.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> After the extrapolated merge, <span id="A5.SS2.p2.pic1.3.1.2.1" class="ltx_text" style="--ltx-fg-color:#B5622E;">Agent 3</span> reads which answers
of its best model still fail.</span></span>
<span id="A5.SS2.p2.pic1.3.2" class="ltx_p"><span id="A5.SS2.p2.pic1.3.2.1" class="ltx_text ltx_font_smallcaps" style="font-size:90%;--ltx-fg-color:#2E5AA8;">Researcher<span id="A5.SS2.p2.pic1.3.2.1.1" class="ltx_text ltx_font_upright" style="--ltx-fg-color:#000000;"> <em id="A5.SS2.p2.pic1.3.2.1.1.1" class="ltx_emph ltx_font_italic">ext12 eval: math cut at
16k = 240/732 (33%), none of them loops …: genuine long, wandering
reasoning. Zebra cut 87/500. Biggest gaps vs official: zebra -20, math -10.
Plan: expert iteration / RFT from the best soup (allowed: samples of the model
we train, kept by programs): sample soup on zebra + math (+code/mcq) prompts at
16k …, keep verified-correct, prefer shortest; SFT the soup 1 epoch low
lr; eval; iterate / soup with parent / rescale.</em></span></span></span>
<span id="A5.SS2.p2.pic1.3.3" class="ltx_p"><span id="A5.SS2.p2.pic1.3.3.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="font-size:79%;--ltx-fg-color:#000000;">Action.</span><span id="A5.SS2.p2.pic1.3.3.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> In the first round the agent keeps the shortest correct answer to each problem, 4,840 answers in all, and trains the model on them. The model’s development score rises from 63.97 (four seeds) to 64.99 (three seeds). <span id="A5.SS2.p2.pic1.3.3.2.1" class="ltx_text" style="--ltx-fg-color:#3A8F6E;">Agent 2</span> copies the
programs the same day and uses <span id="A5.SS2.p2.pic1.3.3.2.2" class="ltx_text" style="--ltx-fg-color:#B5622E;">Agent 3</span>’s samples to fine-tune <span id="A5.SS2.p2.pic1.3.3.2.3" class="ltx_text" style="--ltx-fg-color:#9A4E94;">Agent 4</span>’s merge.</span></span>
</span></span></span></foreignobject></g></g></svg>