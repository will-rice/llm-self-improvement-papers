<em id="A5.SS2.p4.pic1.3.2.1.1.2" class="ltx_emph ltx_font_italic">Lineage B stuck <math id="A5.SS2.p4.pic1.m1" class="ltx_Math" alttext="\sim" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∼</mo><annotation encoding="application/x-tex">\sim</annotation></semantics></math>55 … soup .67 r1-soupe + .33 B2s10:
