</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.47 10.52)"><foreignobject style="--ltx-fo-width:32.99em;--ltx-fo-height:8.93em;--ltx-fo-depth:0.18em;font-size:10pt;" height="125.92" overflow="visible" transform="matrix(1 0 0 -1 0 123.5)" width="456.49"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.SS2.p3.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.99em;">
<span id="A5.SS2.p3.pic1.3.1" class="ltx_p"><span id="A5.SS2.p3.pic1.3.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="font-size:79%;--ltx-fg-color:#000000;">Evidence.</span><span id="A5.SS2.p3.pic1.3.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> <span id="A5.SS2.p3.pic1.3.1.2.1" class="ltx_text" style="--ltx-fg-color:#4F72B8;">Agent 1</span> and <span id="A5.SS2.p3.pic1.3.1.2.2" class="ltx_text" style="--ltx-fg-color:#B5622E;">Agent 3</span> each have a reinforcement-learning model near 57,
and <span id="A5.SS2.p3.pic1.3.1.2.3" class="ltx_text" style="--ltx-fg-color:#9A4E94;">Agent 4</span> averages the two.</span></span>
<span id="A5.SS2.p3.pic1.3.2" class="ltx_p"><span id="A5.SS2.p3.pic1.3.2.1" class="ltx_text ltx_font_smallcaps" style="font-size:90%;--ltx-fg-color:#2E5AA8;">Researcher<span id="A5.SS2.p3.pic1.3.2.1.1" class="ltx_text ltx_font_upright" style="--ltx-fg-color:#000000;"> <em id="A5.SS2.p3.pic1.3.2.1.1.1" class="ltx_emph ltx_font_italic">soup of the two
<math id="A5.SS2.p3.pic1.m1" class="ltx_Math" alttext="\sim" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∼</mo><annotation encoding="application/x-tex">\sim</annotation></semantics></math>57 RL models = 59.95 full dev6 … every task but alfworld
above both parents. Lesson: averaging two EQUAL-strength RL models from
different lineages gives <math id="A5.SS2.p3.pic1.m2" class="ltx_Math" alttext="\sim" display="inline" intent=":literal"><semantics><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∼</mo><annotation encoding="application/x-tex">\sim</annotation></semantics></math>+2.7; averaging a strong one with
weaker ones is neutral (s4a). Suggestion: keep RL lineages DIFFERENT (own
SFT/data/settings) and soup the strong ones again; anyone can also RL from this
soup.</em></span></span></span>
<span id="A5.SS2.p3.pic1.3.3" class="ltx_p"><span id="A5.SS2.p3.pic1.3.3.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="font-size:79%;--ltx-fg-color:#000000;">Action.</span><span id="A5.SS2.p3.pic1.3.3.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> This merge, at hour 21, becomes the team’s best checkpoint. It is neither <span id="A5.SS2.p3.pic1.3.3.2.1" class="ltx_text" style="--ltx-fg-color:#9A4E94;">Agent 4</span>’s hour-15.9 merge in <a href="#A4.T12" title="In D.3 Exchanges Between Agents ‣ Appendix D Additional Results ‣ Athanor: An Agent-Native System for Autonomous Post-Training Research" class="ltx_ref"><span class="ltx_text ltx_ref_tag">Table</span> <span class="ltx_text ltx_ref_tag">12</span></a> nor <span id="A5.SS2.p3.pic1.3.3.2.2" class="ltx_text" style="--ltx-fg-color:#4F72B8;">Agent 1</span>’s average of <math id="A5.SS2.p3.pic1.m3" class="ltx_Math" alttext="R_{1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><annotation encoding="application/x-tex">R_{1}</annotation></semantics></math> and <math id="A5.SS2.p3.pic1.m4" class="ltx_Math" alttext="R_{3}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn></msub><annotation encoding="application/x-tex">R_{3}</annotation></semantics></math> in <a href="#A4.T11" title="In D.2 The Winning Lineage ‣ Appendix D Additional Results ‣ Athanor: An Agent-Native System for Autonomous Post-Training Research" class="ltx_ref"><span class="ltx_text ltx_ref_tag">Table</span> <span class="ltx_text ltx_ref_tag">11</span></a>, and it is not on the submission’s lineage.</span></span>
</span></span></span></foreignobject></g></g></svg>