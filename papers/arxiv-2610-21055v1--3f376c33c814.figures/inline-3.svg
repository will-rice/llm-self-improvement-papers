<span id="A5.SS2.p1.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:32.99em;">
<span id="A5.SS2.p1.pic1.3.1" class="ltx_p"><span id="A5.SS2.p1.pic1.3.1.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="font-size:79%;--ltx-fg-color:#000000;">Evidence.</span><span id="A5.SS2.p1.pic1.3.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> The team’s best model is <span id="A5.SS2.p1.pic1.3.1.2.1" class="ltx_text" style="--ltx-fg-color:#9A4E94;">Agent 4</span>’s weighted average of three
agents’ models (63.28). <span id="A5.SS2.p1.pic1.3.1.2.2" class="ltx_text" style="--ltx-fg-color:#B5622E;">Agent 3</span> measures how far each merge has moved from the
base and tries scaling that distance.</span></span>
<span id="A5.SS2.p1.pic1.3.2" class="ltx_p"><span id="A5.SS2.p1.pic1.3.2.1" class="ltx_text ltx_font_smallcaps" style="font-size:90%;--ltx-fg-color:#2E5AA8;">Researcher<span id="A5.SS2.p1.pic1.3.2.1.1" class="ltx_text ltx_font_upright" style="--ltx-fg-color:#000000;"> <em id="A5.SS2.p1.pic1.3.2.1.1.1" class="ltx_emph ltx_font_italic">ext11-s3Lm (base +
1.1*(s3Lm - base) …) FULL …: 63.97 … vs linear s3Lm 63.28. … ext12-s3Lm (x1.2 …): 64.58 … Zebra
rises with scale 56.4/59.6/63.0. … ext13-s3Lm (x1.3) partial: mmlu 63.8,
math 35.8, zebra 61.6 -&gt; past the peak … Cancelled x1.5 eval.</em></span></span></span>
<span id="A5.SS2.p1.pic1.3.3" class="ltx_p"><span id="A5.SS2.p1.pic1.3.3.1" class="ltx_text ltx_font_sansserif ltx_font_bold" style="font-size:79%;--ltx-fg-color:#000000;">Action.</span><span id="A5.SS2.p1.pic1.3.3.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> <span id="A5.SS2.p1.pic1.3.3.2.1" class="ltx_text" style="--ltx-fg-color:#B5622E;">Agent 3</span> keeps the factor 1.2 and evaluates it on three more seeds; its mean over the four is 63.97 (the same as factor 1.1’s single seed), below the 64.58 of its first seed. The full evaluation at
factor 1.3, finished later, gave 64.87. <span id="A5.SS2.p1.pic1.3.3.2.2" class="ltx_text" style="--ltx-fg-color:#9A4E94;">Agent 4</span> answers in its shared notes, <em id="A5.SS2.p1.pic1.3.3.2.3" class="ltx_emph ltx_font_italic">“great find, r3. Running
(not duplicating yours): ext13-s3Lo”</em>, and reaches 65.51 with later parents. The scores at factors 1.1 to 1.3 (63.97 to 64.87) differ by about as much as one seed’s noise (<a href="#S6.F8" title="In 6 Insights and Discussion ‣ Athanor: An Agent-Native System for Autonomous Post-Training Research" class="ltx_ref"><span class="ltx_text ltx_ref_tag">Figure</span> <span class="ltx_text ltx_ref_tag">8</span></a>a).</span></span>
</span></span></span></foreignobject></g></g></svg>