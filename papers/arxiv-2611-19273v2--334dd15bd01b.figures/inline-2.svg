<span id="A2.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.34em;">
<span id="A2.p3.pic1.1.1" class="ltx_p"><span id="A2.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Example 2</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.21 130.48)"><foreignobject style="--ltx-fo-width:35.23em;--ltx-fo-height:31.95em;--ltx-fo-depth:8.58em;font-size:10pt;" height="560.75" overflow="visible" transform="matrix(1 0 0 -1 0 442.1)" width="487.48"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A2.p3.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:35.23em;">
<span id="A2.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="A2.p3.pic1.p1.1" class="ltx_p"><span id="A2.p3.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Problem.</span><span id="A2.p3.pic1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> For what value of </span><math id="A2.p3.pic1.p1.m1" class="ltx_Math" alttext="m" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">m</mi><annotation encoding="application/x-tex">m</annotation></semantics></math><span id="A2.p3.pic1.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> does the equation </span><math id="A2.p3.pic1.p1.m2" class="ltx_Math" alttext="(x+4)(x+1)=m+2x" display="inline" intent=":literal"><semantics><mrow><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.900em" minsize="0.900em">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">4</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.900em" minsize="0.900em">)</mo></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.900em" minsize="0.900em">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.900em" minsize="0.900em">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">=</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">m</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">+</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">2</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">x</mi></mrow></mrow></mrow><annotation encoding="application/x-tex">(x+4)(x+1)=m+2x</annotation></semantics></math><span id="A2.p3.pic1.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> have exactly one real solution? Express your answer as a common fraction.</span></span>
</span>
<span id="A2.p3.pic1.p2" class="ltx_para ltx_noindent">
<span id="A2.p3.pic1.p2.1" class="ltx_p"><span id="A2.p3.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Generated brief.</span></span>
</span>
<span id="A2.p3.pic1.p3" class="ltx_para ltx_noindent">
<span id="A2.p3.pic1.p3.1" class="ltx_p"><span id="A2.p3.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Problem Brief:</span></span>
</span>
<span id="A2.p3.pic1.p4" class="ltx_para ltx_noindent">
<span id="A2.p3.pic1.p4.1" class="ltx_p"><span id="A2.p3.pic1.p4.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Target and structure:</span><span id="A2.p3.pic1.p4.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">
Determine the value of </span><math id="A2.p3.pic1.p4.m1" class="ltx_Math" alttext="m" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">m</mi><annotation encoding="application/x-tex">m</annotation></semantics></math><span id="A2.p3.pic1.p4.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> for which the equation </span><math id="A2.p3.pic1.p4.m2" class="ltx_Math" alttext="(x+4)(x+1)=m+2x" display="inline" intent=":literal"><semantics><mrow><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.900em" minsize="0.900em">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">4</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.900em" minsize="0.900em">)</mo></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.900em" minsize="0.900em">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" maxsize="0.900em" minsize="0.900em">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">=</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">m</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">+</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">2</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">x</mi></mrow></mrow></mrow><annotation encoding="application/x-tex">(x+4)(x+1)=m+2x</annotation></semantics></math><span id="A2.p3.pic1.p4.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> has exactly one real solution. The main challenge is to find the value of </span><math id="A2.p3.pic1.p4.m3" class="ltx_Math" alttext="m" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">m</mi><annotation encoding="application/x-tex">m</annotation></semantics></math><span id="A2.p3.pic1.p4.1.5" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> that makes the equation have a unique real root.</span></span>
</span>
<span id="A2.p3.pic1.p5" class="ltx_para ltx_noindent">
<span id="A2.p3.pic1.p5.1" class="ltx_p"><span id="A2.p3.pic1.p5.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Relevant principles:</span><span id="A2.p3.pic1.p5.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">
The equation is a quadratic in </span><math id="A2.p3.pic1.p5.m1" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math><span id="A2.p3.pic1.p5.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, and the number of real solutions depends on the discriminant of the quadratic. The discriminant </span><math id="A2.p3.pic1.p5.m2" class="ltx_Math" alttext="D" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">D</mi><annotation encoding="application/x-tex">D</annotation></semantics></math><span id="A2.p3.pic1.p5.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> of a quadratic equation </span><math id="A2.p3.pic1.p5.m3" class="ltx_Math" alttext="ax^{2}+bx+c=0" display="inline" intent=":literal"><semantics><mrow><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">a</mi><mo lspace="0em" rspace="0em">​</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">2</mn></msup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">+</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">b</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">x</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">+</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">c</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">0</mn></mrow><annotation encoding="application/x-tex">ax^{2}+bx+c=0</annotation></semantics></math><span id="A2.p3.pic1.p5.1.5" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> is given by </span><math id="A2.p3.pic1.p5.m4" class="ltx_Math" alttext="D=b^{2}-4ac" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">D</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">=</mo><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">b</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">2</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">−</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">4</mn><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">a</mi><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">c</mi></mrow></mrow></mrow><annotation encoding="application/x-tex">D=b^{2}-4ac</annotation></semantics></math><span id="A2.p3.pic1.p5.1.6" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">. If </span><math id="A2.p3.pic1.p5.m5" class="ltx_Math" alttext="D&gt;0" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">D</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">&gt;</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">0</mn></mrow><annotation encoding="application/x-tex">D&gt;0</annotation></semantics></math><span id="A2.p3.pic1.p5.1.7" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, there are two distinct real solutions; if </span><math id="A2.p3.pic1.p5.m6" class="ltx_Math" alttext="D=0" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">D</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">0</mn></mrow><annotation encoding="application/x-tex">D=0</annotation></semantics></math><span id="A2.p3.pic1.p5.1.8" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, there is exactly one real solution (a repeated root); and if </span><math id="A2.p3.pic1.p5.m7" class="ltx_Math" alttext="D&lt;0" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">D</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">&lt;</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">0</mn></mrow><annotation encoding="application/x-tex">D&lt;0</annotation></semantics></math><span id="A2.p3.pic1.p5.1.9" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, there are no real solutions.</span></span>
</span>
<span id="A2.p3.pic1.p6" class="ltx_para ltx_noindent">
<span id="A2.p3.pic1.p6.1" class="ltx_p"><span id="A2.p3.pic1.p6.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Suggested approach:</span></span>
<span id="A2.I4" class="ltx_itemize" style="--ltx-enum-leftmargin:1.25em;">
<span id="A2.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i1.p1" class="ltx_para ltx_noindent">
<span id="A2.I4.i1.p1.1" class="ltx_p"><span id="A2.I4.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Expand and rearrange the equation to standard quadratic form.</span></span>
</span></span>
<span id="A2.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i2.p1" class="ltx_para ltx_noindent">
<span id="A2.I4.i2.p1.1" class="ltx_p"><span id="A2.I4.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Identify the coefficients </span><math id="A2.I4.i2.p1.m1" class="ltx_Math" alttext="a" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">a</mi><annotation encoding="application/x-tex">a</annotation></semantics></math><span id="A2.I4.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, </span><math id="A2.I4.i2.p1.m2" class="ltx_Math" alttext="b" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">b</mi><annotation encoding="application/x-tex">b</annotation></semantics></math><span id="A2.I4.i2.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">, and </span><math id="A2.I4.i2.p1.m3" class="ltx_Math" alttext="c" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">c</mi><annotation encoding="application/x-tex">c</annotation></semantics></math><span id="A2.I4.i2.p1.1.4" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> of the quadratic.</span></span>
</span></span>
<span id="A2.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i3.p1" class="ltx_para ltx_noindent">
<span id="A2.I4.i3.p1.1" class="ltx_p"><span id="A2.I4.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Compute the discriminant </span><math id="A2.I4.i3.p1.m1" class="ltx_Math" alttext="D" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">D</mi><annotation encoding="application/x-tex">D</annotation></semantics></math><span id="A2.I4.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> and set it equal to zero to find the value of </span><math id="A2.I4.i3.p1.m2" class="ltx_Math" alttext="m" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">m</mi><annotation encoding="application/x-tex">m</annotation></semantics></math><span id="A2.I4.i3.p1.1.3" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> that results in exactly one real solution.</span></span>
</span></span>
<span id="A2.I4.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I4.i4.p1" class="ltx_para">
<span id="A2.I4.i4.p1.1" class="ltx_p"><span id="A2.I4.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Verify the result by substituting back into the original equation.</span></span>
</span></span>
</span>
</span>
<span id="A2.p3.pic1.p7" class="ltx_para ltx_noindent">
<span id="A2.p3.pic1.p7.1" class="ltx_p"><span id="A2.p3.pic1.p7.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Pitfalls and checks:</span></span>
<span id="A2.I5" class="ltx_itemize" style="--ltx-enum-leftmargin:1.25em;">
<span id="A2.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I5.i1.p1" class="ltx_para ltx_noindent">
<span id="A2.I5.i1.p1.1" class="ltx_p"><span id="A2.I5.i1.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Ensure the equation is correctly expanded and rearranged.</span></span>
</span></span>
<span id="A2.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I5.i2.p1" class="ltx_para ltx_noindent">
<span id="A2.I5.i2.p1.1" class="ltx_p"><span id="A2.I5.i2.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Confirm that the discriminant is correctly calculated.</span></span>
</span></span>
<span id="A2.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I5.i3.p1" class="ltx_para ltx_noindent">
<span id="A2.I5.i3.p1.1" class="ltx_p"><span id="A2.I5.i3.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Verify that the value of </span><math id="A2.I5.i3.p1.m1" class="ltx_Math" alttext="m" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathsize="0.900em">m</mi><annotation encoding="application/x-tex">m</annotation></semantics></math><span id="A2.I5.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"> leads to a repeated root by substituting back into the original equation.</span></span>
</span></span>
<span id="A2.I5.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A2.I5.i4.p1" class="ltx_para">
<span id="A2.I5.i4.p1.1" class="ltx_p"><span id="A2.I5.i4.p1.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Check that the discriminant condition is applied correctly to the quadratic form.</span></span>
</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>