<span id="A3.p3.pic1.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:38.75em;">
<span id="A3.p3.pic1.p2.pic1.1.1" class="ltx_p ltx_align_left"><span id="A3.p3.pic1.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#243B53;">Question.</span> A certain element emits 1 alpha particle, and its products then emit 2 beta particles in succession. The atomic number of the resulting element is changed by</span>
<span id="A3.p3.pic1.p2.pic1.1.2" class="ltx_p ltx_align_left">A. zero B. minus 1 C. minus 2 D. plus 1</span>
