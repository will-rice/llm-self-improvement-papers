<span id="A4.p2.pic1.p2.pic1.p1.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:28.48em;">
<span id="A4.p2.pic1.p2.pic1.p1.pic1.1.1" class="ltx_p ltx_align_left">## Context</span>
<span id="A4.p2.pic1.p2.pic1.p1.pic1.1.2" class="ltx_p ltx_align_left">Business background: Real estate and casino empire. Has used Chapter 11 reorganization strategically across three major deals — each time the press called it “failure” while the underlying assets kept compounding for the next decade. Treats restructuring as a strategic reset button, not a failure.</span>
<span id="A4.p2.pic1.p2.pic1.p1.pic1.1.3" class="ltx_p ltx_align_left">Philosophy: Pragmatic about capital structure. Believes owners who treat restructuring as taboo end up trapped by debt that a clean reset could clear in 12 months. […]</span>
