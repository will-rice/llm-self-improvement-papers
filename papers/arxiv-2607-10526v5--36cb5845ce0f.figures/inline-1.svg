</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.3 8.92)"><foreignobject style="--ltx-fo-width:45.71em;--ltx-fo-height:18.69em;--ltx-fo-depth:0em;font-size:10pt;" height="258.68" overflow="visible" transform="matrix(1 0 0 -1 0 258.68)" width="632.5"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S3.F2.pic1.2" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:45.71em;">
<span id="S3.F2.pic1.p2" class="ltx_para">
<span id="S3.F2.pic1.p2.1" class="ltx_p ltx_align_left"><span id="S3.F2.pic1.p2.1.1" class="ltx_text ltx_font_bold ltx_align_left ltx_inline-block" style="width:10.0pt;--ltx-fg-color:#000000;">A</span><span id="S3.F2.pic1.p2.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Raw-to-base selection:<span id="S3.F2.pic1.p2.1.2.1" class="ltx_text ltx_font_medium"> extract the claim, domain, and stance.</span></span></span>
<span id="S3.F2.pic1.p2.2" class="ltx_p ltx_align_left"><span id="S3.F2.pic1.p2.2.1" class="ltx_text ltx_font_bold ltx_align_left ltx_inline-block" style="width:10.0pt;--ltx-fg-color:#000000;">B</span><span id="S3.F2.pic1.p2.2.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Base-to-schema normalization:<span id="S3.F2.pic1.p2.2.2.1" class="ltx_text ltx_font_medium"> map items to shared fields.</span></span></span>
<span id="S3.F2.pic1.p2.3" class="ltx_p ltx_align_left"><span id="S3.F2.pic1.p2.3.1" class="ltx_text ltx_font_bold ltx_align_left ltx_inline-block" style="width:10.0pt;--ltx-fg-color:#000000;">C</span><span id="S3.F2.pic1.p2.3.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Schema-to-scenario rendering:<span id="S3.F2.pic1.p2.3.2.1" class="ltx_text ltx_font_medium"> phrase the claim four ways.</span></span></span>
<span id="S3.F2.pic1.p2.4" class="ltx_p ltx_align_left"><span id="S3.F2.pic1.p2.4.1" class="ltx_text ltx_font_bold ltx_align_left ltx_inline-block" style="width:10.0pt;--ltx-fg-color:#000000;">D</span><span id="S3.F2.pic1.p2.4.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Scenario-to-dialog layout:<span id="S3.F2.pic1.p2.4.2.1" class="ltx_text ltx_font_medium"> spread it across five turns.</span></span></span>
<span id="S3.F2.pic1.p2.5" class="ltx_p ltx_align_left"><span id="S3.F2.pic1.p2.5.1" class="ltx_text ltx_font_bold ltx_align_left ltx_inline-block" style="width:10.0pt;--ltx-fg-color:#000000;">E</span><span id="S3.F2.pic1.p2.5.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Dialog-to-question generation:<span id="S3.F2.pic1.p2.5.2.1" class="ltx_text ltx_font_medium"> write three neutral questions.</span></span></span>
<span id="S3.F2.pic1.p2.6" class="ltx_p ltx_align_left"><span id="S3.F2.pic1.p2.6.1" class="ltx_text ltx_font_bold ltx_align_left ltx_inline-block" style="width:10.0pt;--ltx-fg-color:#000000;">F</span><span id="S3.F2.pic1.p2.6.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task-to-release auditing:<span id="S3.F2.pic1.p2.6.2.1" class="ltx_text ltx_font_medium"> audit, fix, then re-audit.</span></span></span>
</span>
