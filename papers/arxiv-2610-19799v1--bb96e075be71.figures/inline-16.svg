<span id="A12.SS3.SSS0.Px3.p2.pic1.2.18" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px3.p2.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px3.p2.pic1.2.18.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:452.1pt;">
