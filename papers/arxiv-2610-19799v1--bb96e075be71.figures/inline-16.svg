</span></span></span></span>
<span id="A12.SS3.SSS0.Px3.p2.pic1.2.9" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px3.p2.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px3.p2.pic1.2.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:452.1pt;"></span></span></span>
<span id="A12.SS3.SSS0.Px3.p2.pic1.2.10" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px3.p2.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px3.p2.pic1.2.10.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px3.p2.pic1.2.10.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px3.p2.pic1.2.10.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A12.SS3.SSS0.Px3.p2.pic1.2.10.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:431.1pt;">
<span id="A12.SS3.SSS0.Px3.p2.pic1.p10" class="ltx_para ltx_noindent">
<span id="A12.SS3.SSS0.Px3.p2.pic1.p10.1" class="ltx_p">You have been promoted to Chairman for this task (competition). You keep your own role as {new_chairman}; {original_chairman} keeps its own role as well. The Chairman duties -- receiving the task, recruiting and dismissing teammates (`start_agent`/`stop_agent`), and submitting the team’s final answer (`finalize_task`) -- are now yours. Where the constitution or the instructions call {original_chairman} the Chairman, or give {original_chairman} those duties, they now mean you. Everything else stays as written: the steps the workflow assigns to {original_chairman} are still done by {original_chairman}, so recruit {original_chairman} and pass it the task where the workflow starts with it, recruit the teammates it asks for, and submit the final answer yourself.</span>
</span></span></span></span>
<span id="A12.SS3.SSS0.Px3.p2.pic1.2.11" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px3.p2.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px3.p2.pic1.2.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:452.1pt;"></span></span></span>
