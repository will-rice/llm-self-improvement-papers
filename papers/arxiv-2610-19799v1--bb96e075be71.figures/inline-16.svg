<span id="A12.SS3.SSS0.Px3.p2.pic1.2.15" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px3.p2.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px3.p2.pic1.2.15.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px3.p2.pic1.2.15.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px3.p2.pic1.2.15.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A12.SS3.SSS0.Px3.p2.pic1.2.15.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:431.1pt;">
<span id="A12.SS3.SSS0.Px3.p2.pic1.p15" class="ltx_para ltx_noindent">
<span id="A12.SS3.SSS0.Px3.p2.pic1.p15.1" class="ltx_p">The Chairman for this task is **{new_chairman}** (promoted in competition), not you. You keep your own role as {original_chairman}. The Chairman duties -- receiving the task, recruiting and dismissing teammates (`start_agent`/`stop_agent`), and submitting the team’s final answer (`finalize_task`) -- belong to {new_chairman}: ask {new_chairman} to recruit the teammates you need, and where your instructions say you submit the final answer, send it to {new_chairman} instead. Everything else in your instructions stays as written.</span>
</span></span></span></span>
