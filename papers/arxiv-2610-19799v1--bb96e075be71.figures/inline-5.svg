<span id="A12.SS2.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.21em;">
<span id="A12.SS2.p4.pic1.2.1" class="ltx_p"><span id="A12.SS2.p4.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:452.1pt;">
<span id="A12.SS2.p4.pic1.p1" class="ltx_para ltx_noindent">
<span id="A12.SS2.p4.pic1.p1.1" class="ltx_p"># LoCoBench -- Long-Context Code Engineering Team</span>
</span></span></span></span>
<span id="A12.SS2.p4.pic1.2.2" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:452.1pt;"></span></span></span>
<span id="A12.SS2.p4.pic1.2.3" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.3.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:452.1pt;">
<span id="A12.SS2.p4.pic1.p3" class="ltx_para ltx_noindent">
<span id="A12.SS2.p4.pic1.p3.1" class="ltx_p">## Mission</span>
</span></span></span></span>
<span id="A12.SS2.p4.pic1.2.4" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.4.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS2.p4.pic1.2.4.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS2.p4.pic1.2.4.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A12.SS2.p4.pic1.2.4.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:431.1pt;">
<span id="A12.SS2.p4.pic1.p4" class="ltx_para ltx_noindent">
<span id="A12.SS2.p4.pic1.p4.1" class="ltx_p">Analyze large codebases (10-100+ files) provided as context, understand architecture and logic, then complete a software engineering task.</span>
</span></span></span></span>
<span id="A12.SS2.p4.pic1.2.5" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.5.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:452.1pt;"></span></span></span>
<span id="A12.SS2.p4.pic1.2.6" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:452.1pt;">
<span id="A12.SS2.p4.pic1.p6" class="ltx_para ltx_noindent">
<span id="A12.SS2.p4.pic1.p6.1" class="ltx_p">## Environment</span>
</span></span></span></span>
<span id="A12.SS2.p4.pic1.2.7" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.7.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:452.1pt;">
<span id="A12.SS2.p4.pic1.p7" class="ltx_para ltx_noindent">
<span id="A12.SS2.p4.pic1.p7.1" class="ltx_p">- **Context files**: In `context/` directory. Use `read_file(path=&quot;context/...&quot;)`.</span>
</span></span></span></span>
<span id="A12.SS2.p4.pic1.2.8" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS2.p4.pic1.2.8.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS2.p4.pic1.2.8.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A12.SS2.p4.pic1.2.8.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:431.1pt;">
<span id="A12.SS2.p4.pic1.p8" class="ltx_para ltx_noindent">
<span id="A12.SS2.p4.pic1.p8.1" class="ltx_p">- **Solution output**: Write to `solution/` directory using `write_file(path=&quot;solution/...&quot;)`.</span>
</span></span></span></span>
<span id="A12.SS2.p4.pic1.2.9" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.9.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:452.1pt;">
<span id="A12.SS2.p4.pic1.p9" class="ltx_para ltx_noindent">
<span id="A12.SS2.p4.pic1.p9.1" class="ltx_p">- **No Docker**: All tools operate on the local workspace.</span>
</span></span></span></span>
<span id="A12.SS2.p4.pic1.2.10" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:452.1pt;"></span></span></span>
<span id="A12.SS2.p4.pic1.2.11" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.11.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:452.1pt;">
<span id="A12.SS2.p4.pic1.p11" class="ltx_para ltx_noindent">
<span id="A12.SS2.p4.pic1.p11.1" class="ltx_p">## Team Strategy</span>
</span></span></span></span>
<span id="A12.SS2.p4.pic1.2.12" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:452.1pt;">
<span id="A12.SS2.p4.pic1.p12" class="ltx_para ltx_noindent">
<span id="A12.SS2.p4.pic1.p12.1" class="ltx_p">The key challenge is **long context** -- 15-50 source files totaling 50K-200K+ tokens.</span>
</span></span></span></span>
<span id="A12.SS2.p4.pic1.2.13" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.13.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS2.p4.pic1.2.13.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS2.p4.pic1.2.13.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A12.SS2.p4.pic1.2.13.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:431.1pt;">
<span id="A12.SS2.p4.pic1.p13" class="ltx_para ltx_noindent">
<span id="A12.SS2.p4.pic1.p13.1" class="ltx_p">**Divide and conquer**: Planner splits files -&gt; Readers read in parallel -&gt; Developer writes solution.</span>
</span></span></span></span>
<span id="A12.SS2.p4.pic1.2.14" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.14.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.14.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:452.1pt;"></span></span></span>
<span id="A12.SS2.p4.pic1.2.15" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.15.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.15.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:452.1pt;">
<span id="A12.SS2.p4.pic1.p15" class="ltx_para ltx_noindent">
<span id="A12.SS2.p4.pic1.p15.1" class="ltx_p">## Hard Constraints</span>
</span></span></span></span>
<span id="A12.SS2.p4.pic1.2.16" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.16.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.16.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:452.1pt;">
<span id="A12.SS2.p4.pic1.p16" class="ltx_para ltx_noindent">
<span id="A12.SS2.p4.pic1.p16.1" class="ltx_p">- **ALWAYS** write output to `solution/` directory</span>
</span></span></span></span>
<span id="A12.SS2.p4.pic1.2.17" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.17.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.17.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:452.1pt;">
<span id="A12.SS2.p4.pic1.p17" class="ltx_para ltx_noindent">
<span id="A12.SS2.p4.pic1.p17.1" class="ltx_p">- **NEVER** try to execute the context code</span>
</span></span></span></span>
<span id="A12.SS2.p4.pic1.2.18" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.18.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.18.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:452.1pt;">
<span id="A12.SS2.p4.pic1.p18" class="ltx_para ltx_noindent">
<span id="A12.SS2.p4.pic1.p18.1" class="ltx_p">- **Be selective** with file reading</span>
</span></span></span></span>
<span id="A12.SS2.p4.pic1.2.19" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.19.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.19.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:452.1pt;">
<span id="A12.SS2.p4.pic1.p19" class="ltx_para ltx_noindent">
<span id="A12.SS2.p4.pic1.p19.1" class="ltx_p">- For ANALYSIS tasks: write `.py` files with analysis as comments, NOT markdown</span>
</span></span></span></span>
<span id="A12.SS2.p4.pic1.2.20" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.20.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.20.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:452.1pt;"></span></span></span>
<span id="A12.SS2.p4.pic1.2.21" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.21.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.21.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:452.1pt;">
<span id="A12.SS2.p4.pic1.p21" class="ltx_para ltx_noindent">
<span id="A12.SS2.p4.pic1.p21.1" class="ltx_p">## Reflection Note</span>
</span></span></span></span>
<span id="A12.SS2.p4.pic1.2.22" class="ltx_p" style="width:452.1pt;"><span id="A12.SS2.p4.pic1.2.22.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS2.p4.pic1.2.22.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS2.p4.pic1.2.22.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS2.p4.pic1.2.22.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A12.SS2.p4.pic1.2.22.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:431.1pt;">
<span id="A12.SS2.p4.pic1.p22" class="ltx_para ltx_noindent">
<span id="A12.SS2.p4.pic1.p22.1" class="ltx_p">During reflection phases, ignore any references to `docker_bash` or `git diff` -- those are for other benchmarks. Your tools are `read_file`, `write_file`, and `bash`. Your task validation shows LCBS scores (SE/FC/CQ/LCU dimensions) -- use these to guide your reflection.</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>