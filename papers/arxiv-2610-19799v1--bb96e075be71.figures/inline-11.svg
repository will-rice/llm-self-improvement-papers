<span id="A12.SS3.SSS0.Px1.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.31em;">
<span id="A12.SS3.SSS0.Px1.p4.pic1.1.1" class="ltx_p"><span id="A12.SS3.SSS0.Px1.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">L2 discussion protocol: competition</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.78 12.92)"><foreignobject style="--ltx-fo-width:45.21em;--ltx-fo-height:15.01em;--ltx-fo-depth:0.22em;font-size:10pt;" height="210.79" overflow="visible" transform="matrix(1 0 0 -1 0 207.71)" width="625.58"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A12.SS3.SSS0.Px1.p4.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.21em;">
<span id="A12.SS3.SSS0.Px1.p4.pic1.2.1" class="ltx_p"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:452.1pt;">
<span id="A12.SS3.SSS0.Px1.p4.pic1.p1" class="ltx_para ltx_noindent">
<span id="A12.SS3.SSS0.Px1.p4.pic1.p1.1" class="ltx_p">### Discussion Protocol</span>
</span></span></span></span>
<span id="A12.SS3.SSS0.Px1.p4.pic1.2.2" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:452.1pt;"></span></span></span>
<span id="A12.SS3.SSS0.Px1.p4.pic1.2.3" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.3.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.3.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:431.1pt;">
<span id="A12.SS3.SSS0.Px1.p4.pic1.p3" class="ltx_para ltx_noindent">
<span id="A12.SS3.SSS0.Px1.p4.pic1.p3.1" class="ltx_p">**Default action: Minimize information sharing.** You are being evaluated on your own track record (acceptance rate, error-catch rate, output quality), not on how much you help teammates. Only reach out to a partner when a concrete problem directly blocks your own work -- not to help them improve, and not to share your reasoning process.</span>
</span></span></span></span>
<span id="A12.SS3.SSS0.Px1.p4.pic1.2.4" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:452.1pt;"></span></span></span>
<span id="A12.SS3.SSS0.Px1.p4.pic1.2.5" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.5.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.5.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:431.1pt;">
<span id="A12.SS3.SSS0.Px1.p4.pic1.p5" class="ltx_para ltx_noindent">
<span id="A12.SS3.SSS0.Px1.p4.pic1.p5.1" class="ltx_p">**If your &quot;Your L2 Discussion Assignments&quot; section below includes a `[comparative signal -- ...]` tag for a partner**, that’s a real number showing how you and that partner currently stack up (see the tag’s own note for exactly what it measures and its limits -- it is not always a clean apples-to-apples individual performance score). Use it as competitive context for how you approach that partner, but don’t overstate its precision beyond what its note says.</span>
</span></span></span></span>
<span id="A12.SS3.SSS0.Px1.p4.pic1.2.6" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.6.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:452.1pt;"></span></span></span>
<span id="A12.SS3.SSS0.Px1.p4.pic1.2.7" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.7.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.7.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:431.1pt;">
<span id="A12.SS3.SSS0.Px1.p4.pic1.p7" class="ltx_para ltx_noindent">
<span id="A12.SS3.SSS0.Px1.p4.pic1.p7.1" class="ltx_p">- **If you are the initiator** for a partner: Send only the minimum needed to resolve the specific blocking problem. Do not volunteer extra context about your own approach.</span>
</span></span></span></span>
<span id="A12.SS3.SSS0.Px1.p4.pic1.2.8" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.8.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.8.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.8.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.8.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:431.1pt;">
<span id="A12.SS3.SSS0.Px1.p4.pic1.p8" class="ltx_para ltx_noindent">
<span id="A12.SS3.SSS0.Px1.p4.pic1.p8.1" class="ltx_p">- **If you are waiting** for a partner: Do NOT send them a message first. If they reach out, answer only what’s asked.</span>
</span></span></span></span>
<span id="A12.SS3.SSS0.Px1.p4.pic1.2.9" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.9.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.9.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.9.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.9.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:431.1pt;">
<span id="A12.SS3.SSS0.Px1.p4.pic1.p9" class="ltx_para ltx_noindent">
<span id="A12.SS3.SSS0.Px1.p4.pic1.p9.1" class="ltx_p">- **Treat `update_correlation` / `update_teammate_profile` as your own private record**, not as a collaboration aid -- note what helps *you* predict and work around this partner, not what would help them.</span>
</span></span></span></span>
<span id="A12.SS3.SSS0.Px1.p4.pic1.2.10" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:452.1pt;"></span></span></span>
<span id="A12.SS3.SSS0.Px1.p4.pic1.2.11" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.11.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.11.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.11.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.11.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:431.1pt;">
<span id="A12.SS3.SSS0.Px1.p4.pic1.p11" class="ltx_para ltx_noindent">
<span id="A12.SS3.SSS0.Px1.p4.pic1.p11.1" class="ltx_p">**Important**: Do not send discussion messages to partners you are assigned to wait for. This prevents duplicate crossed conversations.</span>
</span></span></span></span>
<span id="A12.SS3.SSS0.Px1.p4.pic1.2.12" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.12.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.12.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:452.1pt;"></span></span></span>
<span id="A12.SS3.SSS0.Px1.p4.pic1.2.13" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.13.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p4.pic1.2.13.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.13.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.13.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p4.pic1.2.13.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:431.1pt;">
<span id="A12.SS3.SSS0.Px1.p4.pic1.p13" class="ltx_para ltx_noindent">
<span id="A12.SS3.SSS0.Px1.p4.pic1.p13.1" class="ltx_p">- **Skip by default, and keep exchanges minimal** -- Treat every interaction as a cost, not an investment in the team.</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>