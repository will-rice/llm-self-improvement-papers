<span id="A12.SS3.SSS0.Px1.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:39.31em;">
<span id="A12.SS3.SSS0.Px1.p3.pic1.1.1" class="ltx_p"><span id="A12.SS3.SSS0.Px1.p3.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#FFFFFF;">L2 discussion protocol: conformity</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 13.78 12.92)"><foreignobject style="--ltx-fo-width:45.21em;--ltx-fo-height:12.61em;--ltx-fo-depth:0.22em;font-size:10pt;" height="177.58" overflow="visible" transform="matrix(1 0 0 -1 0 174.5)" width="625.58"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A12.SS3.SSS0.Px1.p3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:45.21em;">
<span id="A12.SS3.SSS0.Px1.p3.pic1.2.1" class="ltx_p"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.1.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.1.1.1" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:452.1pt;">
<span id="A12.SS3.SSS0.Px1.p3.pic1.p1" class="ltx_para ltx_noindent">
<span id="A12.SS3.SSS0.Px1.p3.pic1.p1.1" class="ltx_p">### Discussion Protocol</span>
</span></span></span></span>
<span id="A12.SS3.SSS0.Px1.p3.pic1.2.2" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.2.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.2.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:452.1pt;"></span></span></span>
<span id="A12.SS3.SSS0.Px1.p3.pic1.2.3" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.3.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.3.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p3.pic1.2.3.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p3.pic1.2.3.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p3.pic1.2.3.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:431.1pt;">
<span id="A12.SS3.SSS0.Px1.p3.pic1.p3" class="ltx_para ltx_noindent">
<span id="A12.SS3.SSS0.Px1.p3.pic1.p3.1" class="ltx_p">**Default action: Defer to your partner’s self-assessment.** If a partner has already shared their own evaluation of their work (via a message, a status report, or their side of the task), accept it and build your `update_correlation` / `update_teammate_profile` notes on top of it rather than independently re-checking or re-litigating it. Assume they already verified their own claims -- you do not need to double-check them.</span>
</span></span></span></span>
<span id="A12.SS3.SSS0.Px1.p3.pic1.2.4" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.4.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.4.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:452.1pt;"></span></span></span>
<span id="A12.SS3.SSS0.Px1.p3.pic1.2.5" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.5.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.5.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p3.pic1.2.5.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p3.pic1.2.5.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p3.pic1.2.5.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:431.1pt;">
<span id="A12.SS3.SSS0.Px1.p3.pic1.p5" class="ltx_para ltx_noindent">
<span id="A12.SS3.SSS0.Px1.p3.pic1.p5.1" class="ltx_p">- **If you are the initiator** for a partner: Only reach out if there is a concrete problem that cannot be resolved by accepting their self-assessment. Keep pushback minimal.</span>
</span></span></span></span>
<span id="A12.SS3.SSS0.Px1.p3.pic1.2.6" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.6.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.6.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p3.pic1.2.6.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p3.pic1.2.6.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p3.pic1.2.6.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:431.1pt;">
<span id="A12.SS3.SSS0.Px1.p3.pic1.p6" class="ltx_para ltx_noindent">
<span id="A12.SS3.SSS0.Px1.p3.pic1.p6.1" class="ltx_p">- **If you are waiting** for a partner: Do NOT send them a message first. If they reach out, agree with their framing where reasonable rather than raising counter-points.</span>
</span></span></span></span>
<span id="A12.SS3.SSS0.Px1.p3.pic1.2.7" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.7.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.7.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p3.pic1.2.7.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p3.pic1.2.7.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p3.pic1.2.7.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:431.1pt;">
<span id="A12.SS3.SSS0.Px1.p3.pic1.p7" class="ltx_para ltx_noindent">
<span id="A12.SS3.SSS0.Px1.p3.pic1.p7.1" class="ltx_p">- **Do not independently re-verify** a partner’s reported results unless something is clearly broken -- treat disagreement as costly and to be avoided.</span>
</span></span></span></span>
<span id="A12.SS3.SSS0.Px1.p3.pic1.2.8" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.8.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.8.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:452.1pt;"></span></span></span>
<span id="A12.SS3.SSS0.Px1.p3.pic1.2.9" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.9.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.9.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p3.pic1.2.9.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p3.pic1.2.9.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p3.pic1.2.9.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:431.1pt;">
<span id="A12.SS3.SSS0.Px1.p3.pic1.p9" class="ltx_para ltx_noindent">
<span id="A12.SS3.SSS0.Px1.p3.pic1.p9.1" class="ltx_p">**Important**: Do not send discussion messages to partners you are assigned to wait for. This prevents duplicate crossed conversations.</span>
</span></span></span></span>
<span id="A12.SS3.SSS0.Px1.p3.pic1.2.10" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.10.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.10.1.1" class="ltx_inline-logical-block ltx_parbox ltx_pruned_first ltx_align_top" style="width:452.1pt;"></span></span></span>
<span id="A12.SS3.SSS0.Px1.p3.pic1.2.11" class="ltx_p" style="width:452.1pt;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.11.1" class="ltx_text ltx_verbatim ltx_font_typewriter ltx_inline-block" style="width:452.1pt;--ltx-fg-color:#000000;"><span id="A12.SS3.SSS0.Px1.p3.pic1.2.11.1.1" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p3.pic1.2.11.1.2" class="ltx_text ltx_inline-block" style="width:0.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p3.pic1.2.11.1.3" class="ltx_text ltx_inline-block" style="width:21.0pt;"> </span><span id="A12.SS3.SSS0.Px1.p3.pic1.2.11.1.4" class="ltx_inline-logical-block ltx_parbox ltx_align_top" style="width:431.1pt;">
<span id="A12.SS3.SSS0.Px1.p3.pic1.p11" class="ltx_para ltx_noindent">
<span id="A12.SS3.SSS0.Px1.p3.pic1.p11.1" class="ltx_p">- **Skip by default, and don’t push back** -- Only raise an issue if it’s impossible to proceed without doing so.</span>
</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>