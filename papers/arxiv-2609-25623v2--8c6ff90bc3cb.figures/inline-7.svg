<span id="A2.SS1.p12.pic1.1.1" class="ltx_p"><span id="A2.SS1.p12.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">L4 (problem category; generated first)</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 12.93)"><foreignobject style="--ltx-fo-width:49.78em;--ltx-fo-height:11.43em;--ltx-fo-depth:0.2em;font-size:10pt;" height="160.86" overflow="visible" transform="matrix(1 0 0 -1 0 158.09)" width="688.82"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS1.p12.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:49.78em;">
<span id="A2.SS1.p12.pic1.2.1" class="ltx_p"><span id="A2.SS1.p12.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Required pattern: ‘‘&lt;Domain&gt;: &lt;noun phrase describing the object / concept
type&gt;.’’; the noun phrase describes WHAT is asked, not how to solve it.
<br class="ltx_break">Must not contain: any solution-action verb (solve, compute, prove, derive,
convert, use, apply, calculate, count, find, determine, …); any method,
technique, or theorem name; any thinking pattern or cognitive move; any
concrete numerical value or the final answer; any prepositional clause that
smuggles in a method (‘‘via X’’, ‘‘using X’’, ‘‘through X’’, ‘‘by X’’,
‘‘based on X’’, …).
<br class="ltx_break">Self-checks: verb test; ‘‘via X’’-removal test (delete the clause; if the
remaining sentence no longer classifies the problem, the classification was
by method and must be rewritten); method-name test.
<br class="ltx_break">Typical length 10--30 tokens; brevity is a feature of L4, not a flaw.
</span></span>
</span></span></span></foreignobject></g></g></svg>