</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.93 12.93)"><foreignobject style="--ltx-fo-width:49.78em;--ltx-fo-height:9.03em;--ltx-fo-depth:0.2em;font-size:10pt;" height="127.65" overflow="visible" transform="matrix(1 0 0 -1 0 124.88)" width="688.82"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A2.SS1.p13.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:49.78em;">
<span id="A2.SS1.p13.pic1.2.1" class="ltx_p"><span id="A2.SS1.p13.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Must be a single cognitive framing shift (e.g., shift to the complement,
unify into a common representation, seek an invariant), not an operation
sequence.
<br class="ltx_break">Must not contain: any named method, theorem, or algorithm; two or more
concrete action verbs (a verb-count test flags an operation sequence in
disguise); the words ‘‘then’’, ‘‘next’’, ‘‘after’’, ‘‘subsequently’’; any
concrete numerical value or the final answer.
<br class="ltx_break">Transferability self-check: the same sentence must apply unchanged to a
different problem in the same L4 category that requires a different concrete
method.
<br class="ltx_break">Typical length 20--60 tokens.
</span></span>
</span></span></span></foreignobject></g></g></svg>