<svg id="A6.F6.pic1" class="ltx_picture ltx_centering" height="577.35" overflow="visible" version="1.1" viewbox="0 0 653.15 577.35" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,577.35) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 571.45 C 0 574.71 2.64 577.35 5.91 577.35 L 647.24 577.35 C 650.51 577.35 653.15 574.71 653.15 571.45 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 553.4 L 651.18 553.4 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 561.99)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:0.68em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.15" overflow="visible" transform="matrix(1 0 0 -1 0 9.46)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F6.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A6.F6.pic1.1.1" class="ltx_p"><span id="A6.F6.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Critic Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:37.89em;--ltx-fo-depth:0.25em;font-size:10pt;" height="527.81" overflow="visible" transform="matrix(1 0 0 -1 0 524.35)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A6.F6.pic1.2.1" class="ltx_p"><span id="A6.F6.pic1.2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are a careful evaluator. Your task is to check whether a model’s response uses table information accurately.
<br class="ltx_break"></span></span>
<span id="A6.F6.pic1.2.2" class="ltx_p"><span id="A6.F6.pic1.2.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;instructions&gt; 
<br class="ltx_break">Please follow these steps:
<br class="ltx_break"></span></span>
<span id="A6.F6.pic1.2.3" class="ltx_p"><span id="A6.F6.pic1.2.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. Review the inputs: 
<br class="ltx_break">&lt;table&gt;{table}&lt;/table&gt; 
<br class="ltx_break">&lt;question&gt;{question}&lt;/question&gt; 
<br class="ltx_break">&lt;model_response&gt;{model_response}&lt;/model_response&gt;
<br class="ltx_break"></span></span>
<span id="A6.F6.pic1.2.4" class="ltx_p"><span id="A6.F6.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. Go through the &lt;model_response&gt; sentence by sentence. If the response uses any value from the table, do the following checks:
<br class="ltx_break"></span></span>
<span id="A6.F6.pic1.2.5" class="ltx_p"><span id="A6.F6.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;check_1&gt; 
<br class="ltx_break"><span id="A6.F6.pic1.2.5.1.1" class="ltx_text ltx_font_bold">Copied Values Consistency Check:</span> 
<br class="ltx_break">- Find any value that is explicitly copied or cited from the table. 
<br class="ltx_break">- For each value: 
<br class="ltx_break">  - Check if it exists in the table. 
<br class="ltx_break">  - Check if it is used in the correct context (e.g., correct entity, row, or column). 
<br class="ltx_break">- If a value is hallucinated, incorrect, or mismatched, it is an error. 
<br class="ltx_break">&lt;/check_1&gt;
<br class="ltx_break"></span></span>
<span id="A6.F6.pic1.2.6" class="ltx_p"><span id="A6.F6.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;check_2&gt; 
<br class="ltx_break"><span id="A6.F6.pic1.2.6.1.1" class="ltx_text ltx_font_bold">Omission Check:</span> 
<br class="ltx_break">- If the segment tries to list all rows from the table, or all items that meet a specific condition (e.g., “all teams with more than 5 wins”), 
<br class="ltx_break">- Then compare the listed items with the table. 
<br class="ltx_break">- If any expected value is missing, it is an error. 
<br class="ltx_break">&lt;/check_2&gt;
<br class="ltx_break"></span></span>
<span id="A6.F6.pic1.2.7" class="ltx_p"><span id="A6.F6.pic1.2.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. If any error is found, stop the evaluation immediately and respond with: 
<br class="ltx_break">&lt;judgment&gt;True&lt;/judgment&gt;
<br class="ltx_break"></span></span>
<span id="A6.F6.pic1.2.8" class="ltx_p"><span id="A6.F6.pic1.2.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. If no errors are found in the entire segment, respond with: 
<br class="ltx_break">&lt;judgment&gt;False&lt;/judgment&gt;
<br class="ltx_break"></span></span>
<span id="A6.F6.pic1.2.9" class="ltx_p"><span id="A6.F6.pic1.2.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Follow the instructions step by step and put your final judgment within &lt;judgment&gt; &lt;/judgment&gt; tags. 
<br class="ltx_break">&lt;/instructions&gt;</span></span>
</span></span></span></foreignobject></g></g></svg>