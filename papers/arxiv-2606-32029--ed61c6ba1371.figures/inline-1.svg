<svg id="A6.F3.pic1" class="ltx_picture ltx_centering" height="710.34" overflow="visible" version="1.1" viewbox="0 0 653.15 710.34" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,710.34) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 704.44 C 0 707.7 2.64 710.34 5.91 710.34 L 647.24 710.34 C 650.51 710.34 653.15 707.7 653.15 704.44 L 653.15 5.91 C 653.15 2.64 650.51 0 647.24 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 686.23 L 651.18 686.23 L 651.18 5.91 C 651.18 3.73 649.42 1.97 647.24 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 694.83)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:0.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="12.3" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A6.F3.pic1.1.1" class="ltx_p"><span id="A6.F3.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Critic Prompt for Sonnet-3.7+gt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:47.49em;--ltx-fo-depth:0.25em;font-size:10pt;" height="660.65" overflow="visible" transform="matrix(1 0 0 -1 0 657.19)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A6.F3.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A6.F3.pic1.2.1" class="ltx_p"><span id="A6.F3.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;"># Table Referencing Accuracy Evaluation
<br class="ltx_break"></span></span>
<span id="A6.F3.pic1.2.2" class="ltx_p"><span id="A6.F3.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">## Task<span id="A6.F3.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Your task is to evaluate whether a model-generated response accurately uses information from a given table. You will focus exclusively on table referencing accuracy, not other types of errors.
<br class="ltx_break"></span></span></span>
<span id="A6.F3.pic1.2.3" class="ltx_p"><span id="A6.F3.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">## Input Data<span id="A6.F3.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">&lt;table&gt;{table}&lt;/table&gt;
<br class="ltx_break"></span></span></span>
<span id="A6.F3.pic1.2.4" class="ltx_p"><span id="A6.F3.pic1.2.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;question&gt;{question}&lt;/question&gt;
<br class="ltx_break"></span></span>
<span id="A6.F3.pic1.2.5" class="ltx_p"><span id="A6.F3.pic1.2.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">&lt;model_response&gt;{model_response}&lt;/model_response&gt;
<br class="ltx_break"></span></span>
<span id="A6.F3.pic1.2.6" class="ltx_p"><span id="A6.F3.pic1.2.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">You are also provided with a reference answer, but this does not mean there is table referencing error: 
<br class="ltx_break">&lt;reference_answer&gt;{answer}&lt;/reference_answer&gt;
<br class="ltx_break"></span></span>
<span id="A6.F3.pic1.2.7" class="ltx_p"><span id="A6.F3.pic1.2.7.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">## Evaluation Instructions<span id="A6.F3.pic1.2.7.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">Analyze the model response sentence by sentence, focusing only on how accurately it references data from the table. If the response uses any value from the table, perform the following checks:
<br class="ltx_break"></span></span></span>
<span id="A6.F3.pic1.2.8" class="ltx_p"><span id="A6.F3.pic1.2.8.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">### Check 1: Copied Values Consistency<span id="A6.F3.pic1.2.8.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">- Identify any value that is explicitly copied or cited from the table. 
<br class="ltx_break">- For each value: 
<br class="ltx_break">  - Check if it exists in the table. 
<br class="ltx_break">  - Check if it is used in the correct context (e.g., correct entity, row, or column). 
<br class="ltx_break">- If a value is hallucinated, incorrect, or mismatched, it is a table referencing error.
<br class="ltx_break"></span></span></span>
<span id="A6.F3.pic1.2.9" class="ltx_p"><span id="A6.F3.pic1.2.9.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">### Check 2: Omission<span id="A6.F3.pic1.2.9.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">- When the model response tries to list all rows or items from the table, or items that meet a specific condition (e.g., “all teams with more than 5 wins”), 
<br class="ltx_break">- Then compare the listed items with the table. 
<br class="ltx_break">- If any expected value is missing, it is a table referencing error.
<br class="ltx_break"></span></span></span>
<span id="A6.F3.pic1.2.10" class="ltx_p"><span id="A6.F3.pic1.2.10.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">## Important Guidelines<span id="A6.F3.pic1.2.10.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">- Focus ONLY on table referencing accuracy 
<br class="ltx_break">- Ignore other types of errors (reasoning errors, calculation errors, question misunderstandings, etc.) 
<br class="ltx_break">- The reference answer is provided for context only—base your judgment solely on comparing the model response with the table data
<br class="ltx_break"></span></span></span>
<span id="A6.F3.pic1.2.11" class="ltx_p"><span id="A6.F3.pic1.2.11.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">## Output Format<span id="A6.F3.pic1.2.11.1.1" class="ltx_text ltx_font_medium"> 
<br class="ltx_break">After your analysis, provide your judgment using one of these formats:
<br class="ltx_break"></span></span></span>
<span id="A6.F3.pic1.2.12" class="ltx_p"><span id="A6.F3.pic1.2.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. If you find any table referencing error: 
<br class="ltx_break">&lt;judgment&gt;Failed [Error Type] Check.&lt;/judgment&gt; 
<br class="ltx_break">Where [Error Type] is either “Copied Values Consistency” or “Omission”
<br class="ltx_break"></span></span>
<span id="A6.F3.pic1.2.13" class="ltx_p"><span id="A6.F3.pic1.2.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. If no table referencing errors are found: 
<br class="ltx_break">&lt;judgment&gt;NA&lt;/judgment&gt;
<br class="ltx_break"></span></span>
<span id="A6.F3.pic1.2.14" class="ltx_p"><span id="A6.F3.pic1.2.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provide your judgment without additional explanation within the judgment tags.
<br class="ltx_break"></span></span>
<span id="A6.F3.pic1.2.15" class="ltx_p"><span id="A6.F3.pic1.2.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">Now follow the instructions step by step and put your final judgment within &lt;judgment&gt;&lt;/judgment&gt; tags.</span></span>
</span></span></span></foreignobject></g></g></svg>