<span id="A5.SS2.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:37.91em;">
<span id="A5.SS2.p4.pic1.1.1" class="ltx_p"><span id="A5.SS2.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Representative Failure Cases<span id="A5.SS2.p4.pic1.1.1.1.1" class="ltx_text"></span></span></span>
<span id="A5.I1" class="ltx_itemize" style="--ltx-enum-leftmargin:1.2em;">
<span id="A5.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i1.p1" class="ltx_para ltx_noindent">
<span id="A5.I1.i1.p1.1" class="ltx_p"><span id="A5.I1.i1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">env 3, grasp_pan</span><span id="A5.I1.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: grasp failed with the gripper still open.</span></span>
<span id="A5.Ex1" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A5.Ex1.m1" class="ltx_Math" alttext="\texttt{gripper\_open\_fraction}=1.0,\quad\texttt{pan\_z}=0.024,\quad\texttt{contact}=[\texttt{table\_top}]" display="block" intent=":literal"><semantics><mrow><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">gripper_open_fraction</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1.0</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="1.167em">,</mo><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">pan_z</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.024</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="1.167em">,</mo><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">contact</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">table_top</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\texttt{gripper\_open\_fraction}=1.0,\quad\texttt{pan\_z}=0.024,\quad\texttt{contact}=[\texttt{table\_top}]</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A5.I1.i1.p1.2" class="ltx_p"><span id="A5.I1.i1.p1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">The subgraph returned </span><span id="A5.I1.i1.p1.2.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">failed</span><span id="A5.I1.i1.p1.2.3" class="ltx_text" style="--ltx-fg-color:#000000;">; only </span><span id="A5.I1.i1.p1.2.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">ee_pose_at_grasp</span><span id="A5.I1.i1.p1.2.5" class="ltx_text" style="--ltx-fg-color:#000000;"> was bound.</span></span>
</span></span>
<span id="A5.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i2.p1" class="ltx_para ltx_noindent">
<span id="A5.I1.i2.p1.1" class="ltx_p"><span id="A5.I1.i2.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">env 9, grasp_pan</span><span id="A5.I1.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: grasp failed after gripper closure.</span></span>
<span id="A5.Ex2" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A5.Ex2.m1" class="ltx_Math" alttext="\texttt{gripper\_open\_fraction}:1.0\rightarrow 0.0,\quad\texttt{pan\_z}=0.024,\quad\texttt{contact}=[\texttt{table\_top}]" display="block" intent=":literal"><semantics><mrow><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">gripper_open_fraction</mtext><mo style="--ltx-fg-color:#000000;" lspace="0.278em" mathcolor="#000000" rspace="0.278em">:</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1.0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">→</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.0</mn></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="1.167em">,</mo><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">pan_z</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.024</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="1.167em">,</mo><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">contact</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">table_top</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\texttt{gripper\_open\_fraction}:1.0\rightarrow 0.0,\quad\texttt{pan\_z}=0.024,\quad\texttt{contact}=[\texttt{table\_top}]</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A5.I1.i2.p1.2" class="ltx_p"><span id="A5.I1.i2.p1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">The robot closed the gripper, but the pan remained on the table and the node returned </span><span id="A5.I1.i2.p1.2.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">failed</span><span id="A5.I1.i2.p1.2.3" class="ltx_text" style="--ltx-fg-color:#000000;">. The elapsed time was </span><span id="A5.I1.i2.p1.2.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">4.377 s</span><span id="A5.I1.i2.p1.2.5" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A5.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A5.I1.i3.p1" class="ltx_para ltx_noindent">
<span id="A5.I1.i3.p1.1" class="ltx_p"><span id="A5.I1.i3.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="--ltx-fg-color:#000000;">place_pan</span><span id="A5.I1.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: the evaluated placement failure trials has:</span></span>
<span id="A5.Ex3" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
<span class="ltx_eqn_cell ltx_eqn_center_padleft"></span>
<span class="ltx_eqn_cell ltx_align_center"><math id="A5.Ex3.m1" class="ltx_Math" alttext="\texttt{pan\_coverage\_of\_burner}\leq 0.7" display="block" intent=":literal"><semantics><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_mathvariant_monospace" mathcolor="#000000">pan_coverage_of_burner</mtext><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.7</mn></mrow><annotation encoding="application/x-tex">\texttt{pan\_coverage\_of\_burner}\leq 0.7</annotation></semantics></math></span>
<span class="ltx_eqn_cell ltx_eqn_center_padright"></span></span></span>
</span>
<span id="A5.I1.i3.p1.2" class="ltx_p"><span id="A5.I1.i3.p1.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Although the pan was released from the gripper, its projected bottom footprint did not sufficiently overlap with the burner footprint.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>