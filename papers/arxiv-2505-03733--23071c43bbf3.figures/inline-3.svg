<span id="A7.F9.pic1.1.3" class="ltx_p"><span id="A7.F9.pic1.1.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Expected Result: {expected result}</span></span>
<span id="A7.F9.pic1.1.4" class="ltx_p"><span id="A7.F9.pic1.1.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Instructions:</span></span>
<span id="A7.F9.pic1.1.5" class="ltx_p"><span id="A7.F9.pic1.1.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">- Attempt the task as a user would, using the UI elements available.</span></span>
<span id="A7.F9.pic1.1.6" class="ltx_p"><span id="A7.F9.pic1.1.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">- Make multiple attempts if needed to try and achieve the expected result.</span></span>
<span id="A7.F9.pic1.1.7" class="ltx_p"><span id="A7.F9.pic1.1.7.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">- Observe whether the expected result is fully, partially, or not at all achieved.</span></span>
<span id="A7.F9.pic1.1.8" class="ltx_p"><span id="A7.F9.pic1.1.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">- IMPORTANT: You can at most interact with the website 15 times. If the limit is reached, directly output your answer.</span></span>
<span id="A7.F9.pic1.1.9" class="ltx_p"><span id="A7.F9.pic1.1.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">At the end of your testing, answer only with one of the following:</span></span>
<span id="A7.F9.pic1.1.10" class="ltx_p"><span id="A7.F9.pic1.1.10.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">- YES: if the expected result was fully achieved.</span></span>
<span id="A7.F9.pic1.1.11" class="ltx_p"><span id="A7.F9.pic1.1.11.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">- NO: if the expected result could not be achieved at all.</span></span>
<span id="A7.F9.pic1.1.12" class="ltx_p"><span id="A7.F9.pic1.1.12.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">- PARTIAL: if only some aspects of the expected result were achieved.</span></span>
