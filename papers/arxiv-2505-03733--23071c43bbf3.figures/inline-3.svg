<span id="A7.F9.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.41em;">
<span id="A7.F9.pic1.1.1" class="ltx_p"><span id="A7.F9.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Start-Testing Prompt:<span id="A7.F9.pic1.1.1.1.1" class="ltx_text"></span></span></span>
