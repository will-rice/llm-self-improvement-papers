<span id="A3.F4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.41em;">
<span id="A3.F4.pic1.1.1" class="ltx_p"><span id="A3.F4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Prompt:<span id="A3.F4.pic1.1.1.1.1" class="ltx_text"></span></span></span>
<span id="A3.F4.pic1.1.2" class="ltx_p"><span id="A3.F4.pic1.1.2.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">&lt;task&gt;</span></span>
<span id="A3.F4.pic1.1.3" class="ltx_p"><span id="A3.F4.pic1.1.3.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">You will be given a piece of text containing the basic information of a web development project. The information involves a main objective and a list of functional and appearance requirements. You are requested to convert the information into instructions to build a web application. You should output a detailed multi-sentence instruction in English explaining in detail the different functions the applications should have.</span></span>
<span id="A3.F4.pic1.1.4" class="ltx_p"><span id="A3.F4.pic1.1.4.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">&lt;/task&gt;</span></span>
<span id="A3.F4.pic1.1.5" class="ltx_p"><span id="A3.F4.pic1.1.5.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">&lt;important&gt;</span></span>
<span id="A3.F4.pic1.1.6" class="ltx_p"><span id="A3.F4.pic1.1.6.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">1. Your output should align with the main objective of the website and expand upon the requirements.</span></span>
<span id="A3.F4.pic1.1.7" class="ltx_p"><span id="A3.F4.pic1.1.7.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">2. You should not specify any technical details in the instructions.</span></span>
<span id="A3.F4.pic1.1.8" class="ltx_p"><span id="A3.F4.pic1.1.8.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">3. You should not refer to any outside applications in your instructions.</span></span>
<span id="A3.F4.pic1.1.9" class="ltx_p"><span id="A3.F4.pic1.1.9.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">4. You should not output any additional comments.</span></span>
<span id="A3.F4.pic1.1.10" class="ltx_p"><span id="A3.F4.pic1.1.10.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">&lt;/important&gt;</span></span>
<span id="A3.F4.pic1.1.11" class="ltx_p"><span id="A3.F4.pic1.1.11.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">The following is an example:</span></span>
<span id="A3.F4.pic1.1.12" class="ltx_p"><span id="A3.F4.pic1.1.12.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">&lt;example&gt;</span></span>
<span id="A3.F4.pic1.1.13" class="ltx_p"><span id="A3.F4.pic1.1.13.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Objective:</span></span>
<span id="A3.F4.pic1.1.14" class="ltx_p"><span id="A3.F4.pic1.1.14.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">A hotel and travel ticket distribution website.</span></span>
<span id="A3.F4.pic1.1.15" class="ltx_p"><span id="A3.F4.pic1.1.15.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">Other requirements:</span></span>
<span id="A3.F4.pic1.1.16" class="ltx_p"><span id="A3.F4.pic1.1.16.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">1. User login</span></span>
<span id="A3.F4.pic1.1.17" class="ltx_p"><span id="A3.F4.pic1.1.17.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">2. Order tickets and hotels</span></span>
<span id="A3.F4.pic1.1.18" class="ltx_p"><span id="A3.F4.pic1.1.18.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">3. Cancel orders</span></span>
