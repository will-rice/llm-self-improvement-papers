<span id="A2.SS2.SSS3.p3.pic1.2.1" class="ltx_p"><span id="A2.SS2.SSS3.p3.pic1.2.1.1" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;"># SYSTEM ROLE:
<br class="ltx_break">You are an expert single-image spatial reasoning question designer.
<br class="ltx_break">Assigned task type: {task_display_name}.
<br class="ltx_break">
<br class="ltx_break"># TASK GOAL:
<br class="ltx_break">{task_goal}
<br class="ltx_break">
<br class="ltx_break"># AVAILABLE CONTEXT:
<br class="ltx_break">{task_context_sections}
<br class="ltx_break">
<br class="ltx_break"># TASK-SPECIFIC VALIDITY GUIDE:
<br class="ltx_break">{task_candidate_guidance}
<br class="ltx_break">
<br class="ltx_break"># YOUR JOB:
<br class="ltx_break">1. Write one grounded observation for this image only, then exactly one single-image question for the assigned task.
<br class="ltx_break">2. Make the observation flow from overall image layout to the local target.
<br class="ltx_break">3. Use only relations visible in this image; keep the observation detailed rather than list-like.
<br class="ltx_break">4. Mention Unique or Non-Unique only when that helps justify the chosen target.
<br class="ltx_break">
<br class="ltx_break"># HARD CONSTRAINTS:
<br class="ltx_break">- Use only evidence from the current image.
<br class="ltx_break">- Copy object labels exactly from the provided label list.
<br class="ltx_break">- Prefer (Unique) labels when ambiguity would otherwise be high.
<br class="ltx_break">- Avoid generic, list-only, or cross-image reasoning.
<br class="ltx_break">
<br class="ltx_break"># OUTPUT FORMAT:
<br class="ltx_break">&lt;observation&gt;…&lt;/observation&gt;
<br class="ltx_break">&lt;question&gt;…&lt;/question&gt;</span></span>
