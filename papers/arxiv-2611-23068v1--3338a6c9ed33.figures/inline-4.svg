<svg id="A9.SS1.SSS2.p1.pic1" class="ltx_picture" height="866.69" overflow="visible" version="1.1" viewbox="0 0 653.15 866.69" width="653.15"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,866.69) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#C6C6C6;" fill="#C6C6C6" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.28 L 0 861.42 C 0 864.33 2.36 866.69 5.28 866.69 L 647.87 866.69 C 650.79 866.69 653.15 864.33 653.15 861.42 L 653.15 5.28 C 653.15 2.36 650.79 0 647.87 0 L 5.28 0 C 2.36 0 0 2.36 0 5.28 Z" /></g><g style="--ltx-fill-color:#FAFAFA;" fill="#FAFAFA" fill-opacity="1.0"><path style="stroke:none" d="M 0.55 5.28 L 0.55 861.42 C 0.55 864.03 2.67 866.14 5.28 866.14 L 647.87 866.14 C 650.48 866.14 652.6 864.03 652.6 861.42 L 652.6 5.28 C 652.6 2.67 650.48 0.55 647.87 0.55 L 5.28 0.55 C 2.67 0.55 0.55 2.67 0.55 5.28 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.36 10.4)"><foreignobject style="--ltx-fo-width:53.44em;--ltx-fo-height:61.13em;--ltx-fo-depth:0em;font-size:10pt;" height="845.91" overflow="visible" transform="matrix(1 0 0 -1 0 845.91)" width="739.46"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A9.SS1.SSS2.p1.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:53.44em;">
<span id="A9.SS1.SSS2.p1.pic1.p3" class="ltx_para">
<span id="A9.SS1.SSS2.p1.pic1.p3.1" class="ltx_p"><span id="A9.SS1.SSS2.p1.pic1.p3.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Software Engineering Skill<span id="A9.SS1.SSS2.p1.pic1.p3.1.1.1" class="ltx_text"></span></span></span>
<span id="A9.I2" class="ltx_itemize" style="--ltx-enum-leftmargin:4mm;">
<span id="A9.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I2.i1.p1" class="ltx_para ltx_noindent">
<span id="A9.I2.i1.p1.1" class="ltx_p"><span id="A9.I2.i1.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Read the task and relevant source before changing code.</span></span>
</span></span>
<span id="A9.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I2.i2.p1" class="ltx_para ltx_noindent">
<span id="A9.I2.i2.p1.1" class="ltx_p"><span id="A9.I2.i2.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Preserve existing behavior while implementing the requested public API.</span></span>
</span></span>
<span id="A9.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I2.i3.p1" class="ltx_para ltx_noindent">
<span id="A9.I2.i3.p1.1" class="ltx_p"><span id="A9.I2.i3.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Make a coherent implementation across affected modules.</span></span>
</span></span>
<span id="A9.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I2.i4.p1" class="ltx_para ltx_noindent">
<span id="A9.I2.i4.p1.1" class="ltx_p"><span id="A9.I2.i4.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Verify normal behavior and edge cases with focused tests.</span></span>
</span></span>
<span id="A9.I2.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I2.i5.p1" class="ltx_para ltx_noindent">
<span id="A9.I2.i5.p1.1" class="ltx_p"><span id="A9.I2.i5.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Treat every precise validation, parsing, error, export, and format rule in the prompt as an explicit assertion.</span></span>
</span></span>
<span id="A9.I2.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A9.I2.i6.p1" class="ltx_para">
<span id="A9.I2.i6.p1.1" class="ltx_p"><span id="A9.I2.i6.p1.1.1" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;">Run relevant existing tests and address regressions.</span></span>
</span></span>
</span>
</span>
<span id="A9.SS1.SSS2.p1.pic1.p1" class="ltx_para ltx_noindent">
<span id="A9.SS1.SSS2.p1.pic1.p1.1" class="ltx_p"><span id="A9.SS1.SSS2.p1.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Agent pitfall:</span><span id="A9.SS1.SSS2.p1.pic1.p1.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> Assuming an exact, machine-checked numeric result produced by a third-party text pipeline (a tokenizer count, an embedding similarity rank, a retrieved document) is invariant to how the input text is assembled, so you join source fields with an arbitrary separator or encode both the query and the reference set with the same default prompt setting.</span></span>
</span>
<span id="A9.SS1.SSS2.p1.pic1.p4" class="ltx_para">
<span id="A9.SS1.SSS2.p1.pic1.p4.1" class="ltx_p"><span id="A9.SS1.SSS2.p1.pic1.p4.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Trigger:<span id="A9.SS1.SSS2.p1.pic1.p4.1.1.1" class="ltx_text ltx_font_medium"> A script must output one exact number derived from feeding text to an encoder, and it builds that text by concatenating several source fields, or it calls a single encode pass for both a probe query and a corpus of documents.</span></span></span>
<span id="A9.SS1.SSS2.p1.pic1.p4.2" class="ltx_p"><span id="A9.SS1.SSS2.p1.pic1.p4.2.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Concrete correction:<span id="A9.SS1.SSS2.p1.pic1.p4.2.1.1" class="ltx_text ltx_font_medium"> Replicate the source data-shape exactly: join fields with the same boundary character used in the corpus (a newline, not a space, can change the token count by one or more), and when the encoder wrapper is instruction-aware, call it once with the query prompt type for the probe and once with the passage prompt type for the documents so each side receives its real instruction prefix.</span></span></span>
<span id="A9.SS1.SSS2.p1.pic1.p4.3" class="ltx_p"><span id="A9.SS1.SSS2.p1.pic1.p4.3.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Tiny verification:<span id="A9.SS1.SSS2.p1.pic1.p4.3.1.1" class="ltx_text ltx_font_medium"> <span id="A9.SS1.SSS2.p1.pic1.p4.3.1.1.1" class="ltx_text ltx_font_typewriter">len(encode(&quot;a\nb&quot;))</span> is not required to equal <span id="A9.SS1.SSS2.p1.pic1.p4.3.1.1.2" class="ltx_text ltx_font_typewriter">len(encode(&quot;a b&quot;))</span>, and the same text embedded under a query prompt differs from a passage prompt, so picking the wrong role can move a different document into 5th place.</span></span></span>
</span>
<span id="A9.SS1.SSS2.p1.pic1.p2" class="ltx_para ltx_noindent">
<span id="A9.SS1.SSS2.p1.pic1.p2.1" class="ltx_p"><span id="A9.SS1.SSS2.p1.pic1.p2.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Agent pitfall:</span><span id="A9.SS1.SSS2.p1.pic1.p2.1.2" class="ltx_text" style="font-size:80%;--ltx-fg-color:#000000;"> Renaming or re-wrapping the exact public symbol (class, function, or variable) that the prompt explicitly names, substituting a more idiomatically descriptive name, on the assumption that the checker will call whatever the agent chose to define.</span></span>
</span>
<span id="A9.SS1.SSS2.p1.pic1.p5" class="ltx_para">
<span id="A9.SS1.SSS2.p1.pic1.p5.1" class="ltx_p"><span id="A9.SS1.SSS2.p1.pic1.p5.1.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Trigger:<span id="A9.SS1.SSS2.p1.pic1.p5.1.1.1" class="ltx_text ltx_font_medium"> The task text names an importable entrypoint in fixed wording, for example “in a class called X”, “expose <span id="A9.SS1.SSS2.p1.pic1.p5.1.1.1.1" class="ltx_text ltx_font_typewriter">BeginRepl(args, version)</span>”, or a named API variable, and the agent instead ships a differently-named implementation.</span></span></span>
<span id="A9.SS1.SSS2.p1.pic1.p5.2" class="ltx_p"><span id="A9.SS1.SSS2.p1.pic1.p5.2.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Concrete correction:<span id="A9.SS1.SSS2.p1.pic1.p5.2.1.1" class="ltx_text ltx_font_medium"> Declare the prompt-named symbol verbatim (exact name and signature) as a thin exported shim and delegate the real work to internal helpers; treat any renaming as a broken contract because the graded harness imports and calls the literal name, not a paraphrase.</span></span></span>
<span id="A9.SS1.SSS2.p1.pic1.p5.3" class="ltx_p"><span id="A9.SS1.SSS2.p1.pic1.p5.3.1" class="ltx_text ltx_font_bold" style="font-size:80%;--ltx-fg-color:#000000;">Tiny verification:<span id="A9.SS1.SSS2.p1.pic1.p5.3.1.1" class="ltx_text ltx_font_medium"> If a spec requires <span id="A9.SS1.SSS2.p1.pic1.p5.3.1.1.1" class="ltx_text ltx_font_typewriter">class Server</span>, the harness does <span id="A9.SS1.SSS2.p1.pic1.p5.3.1.1.2" class="ltx_text ltx_font_typewriter">from module import Server</span>; a class shipped under a name like <span id="A9.SS1.SSS2.p1.pic1.p5.3.1.1.3" class="ltx_text ltx_font_typewriter">Servicer</span> is untouched by that import and fails even though it runs correctly by hand.</span></span></span>
</span></span></span></span></foreignobject></g></g></svg>