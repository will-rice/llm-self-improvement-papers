<svg id="S3.p2.pic1" class="ltx_picture" height="303.06" overflow="visible" version="1.1" viewbox="0 0 467.83 303.06" width="467.83"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,303.06) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.3 L 0 294.76 C 0 299.35 3.72 303.06 8.3 303.06 L 459.52 303.06 C 464.11 303.06 467.83 299.35 467.83 294.76 L 467.83 8.3 C 467.83 3.72 464.11 0 459.52 0 L 8.3 0 C 3.72 0 0 3.72 0 8.3 Z" /></g><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 4.15 8.3 L 4.15 294.76 C 4.15 299.35 7.87 303.06 12.45 303.06 L 459.52 303.06 C 464.11 303.06 467.83 299.35 467.83 294.76 L 467.83 8.3 C 467.83 3.72 464.11 0 459.52 0 L 12.45 0 C 7.87 0 4.15 3.72 4.15 8.3 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 17.77 281.37)"><foreignobject style="--ltx-fo-width:31.54em;--ltx-fo-height:0.68em;--ltx-fo-depth:19.45em;font-size:10pt;" height="278.59" overflow="visible" transform="matrix(1 0 0 -1 0 9.46)" width="436.42"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S3.p2.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S3.Thmdefinition2" class="ltx_theorem ltx_theorem_definition">
<h6 class="ltx_title ltx_runin ltx_title_theorem" style="--ltx-fg-color:#000000;"><span id="S3.Thmdefinition2.2" class="ltx_text ltx_font_bold">Definition 3.2 (<span id="S3.Thmdefinition2.2.1" class="ltx_text ltx_font_italic">Research tasks and candidate ideas</span></span>).</h6>
<span id="S3.Thmdefinition2.p1" class="ltx_para">
<span id="S3.Thmdefinition2.p1.1" class="ltx_p"><span id="S3.Thmdefinition2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">A </span><span id="S3.Thmdefinition2.p1.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">research task</span><span id="S3.Thmdefinition2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">, the input to </span><span id="S3.Thmdefinition2.p1.1.4" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">Inventa</span><span id="S3.Thmdefinition2.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">, is a tuple </span><math id="S3.Thmdefinition2.p1.m1" class="ltx_Math" alttext="\tau:=\langle q,\mathcal{W},\mathcal{C},\mathcal{V}\rangle" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">:=</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⟨</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒲</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒞</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒱</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⟩</mo></mrow></mrow><annotation encoding="application/x-tex">\tau:=\langle q,\mathcal{W},\mathcal{C},\mathcal{V}\rangle</annotation></semantics></math><span id="S3.Thmdefinition2.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">, where </span><math id="S3.Thmdefinition2.p1.m2" class="ltx_Math" alttext="q" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><annotation encoding="application/x-tex">q</annotation></semantics></math><span id="S3.Thmdefinition2.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> is a research question; </span><math id="S3.Thmdefinition2.p1.m3" class="ltx_Math" alttext="\mathcal{W}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒲</mi><annotation encoding="application/x-tex">\mathcal{W}</annotation></semantics></math><span id="S3.Thmdefinition2.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> is a workspace of literature, tools, and data </span><math id="S3.Thmdefinition2.p1.m4" class="ltx_Math" alttext="\mathcal{D}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒟</mi><annotation encoding="application/x-tex">\mathcal{D}</annotation></semantics></math><span id="S3.Thmdefinition2.p1.1.9" class="ltx_text" style="--ltx-fg-color:#000000;">; </span><math id="S3.Thmdefinition2.p1.m5" class="ltx_Math" alttext="\mathcal{C}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒞</mi><annotation encoding="application/x-tex">\mathcal{C}</annotation></semantics></math><span id="S3.Thmdefinition2.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;"> is a set of task-specific constraints; and </span><math id="S3.Thmdefinition2.p1.m6" class="ltx_Math" alttext="\mathcal{V}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒱</mi><annotation encoding="application/x-tex">\mathcal{V}</annotation></semantics></math><span id="S3.Thmdefinition2.p1.1.11" class="ltx_text" style="--ltx-fg-color:#000000;"> is a set of verifiers that run a full experiment on each candidate, executing it on held-out data or in task simulators, testing task constraints, and using LLM judges where programmatic tests are unavailable. Given </span><math id="S3.Thmdefinition2.p1.m7" class="ltx_Math" alttext="\tau" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi><annotation encoding="application/x-tex">\tau</annotation></semantics></math><span id="S3.Thmdefinition2.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="S3.Thmdefinition2.p1.1.13" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">Inventa</span><span id="S3.Thmdefinition2.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;"> outputs a </span><span id="S3.Thmdefinition2.p1.1.15" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">candidate idea</span><span id="S3.Thmdefinition2.p1.1.16" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="S3.Thmdefinition2.p1.m8" class="ltx_Math" alttext="x" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><annotation encoding="application/x-tex">x</annotation></semantics></math><span id="S3.Thmdefinition2.p1.1.17" class="ltx_text" style="--ltx-fg-color:#000000;"> that answers </span><math id="S3.Thmdefinition2.p1.m9" class="ltx_Math" alttext="q" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><annotation encoding="application/x-tex">q</annotation></semantics></math><span id="S3.Thmdefinition2.p1.1.18" class="ltx_text" style="--ltx-fg-color:#000000;"> in the task’s format, such as code with an explanation; </span><math id="S3.Thmdefinition2.p1.m10" class="ltx_Math" alttext="T(x)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">T(x)</annotation></semantics></math><span id="S3.Thmdefinition2.p1.1.19" class="ltx_text" style="--ltx-fg-color:#000000;"> denotes its components, such as the terms of a law, which verifiers ablate (§</span><span class="ltx_ref ltx_missing_label ltx_ref_self" style="--ltx-fg-color:#000000;"></span><span id="S3.Thmdefinition2.p1.1.20" class="ltx_text" style="--ltx-fg-color:#000000;">). We show an example task in Fig. </span><span class="ltx_ref ltx_missing_label ltx_ref_self" style="--ltx-fg-color:#000000;"></span><span id="S3.Thmdefinition2.p1.1.21" class="ltx_text" style="--ltx-fg-color:#000000;"> (left) and examples of all task classes in Appendix </span><span class="ltx_ref ltx_missing_label ltx_ref_self" style="--ltx-fg-color:#000000;"></span><span id="S3.Thmdefinition2.p1.1.22" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>