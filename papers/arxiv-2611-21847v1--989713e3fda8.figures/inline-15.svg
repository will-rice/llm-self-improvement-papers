<svg id="S3.p3.pic1" class="ltx_picture" height="186.99" overflow="visible" version="1.1" viewbox="0 0 467.83 186.99" width="467.83"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,186.99) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.3 L 0 178.68 C 0 183.27 3.72 186.99 8.3 186.99 L 459.52 186.99 C 464.11 186.99 467.83 183.27 467.83 178.68 L 467.83 8.3 C 467.83 3.72 464.11 0 459.52 0 L 8.3 0 C 3.72 0 0 3.72 0 8.3 Z" /></g><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 4.15 8.3 L 4.15 178.68 C 4.15 183.27 7.87 186.99 12.45 186.99 L 459.52 186.99 C 464.11 186.99 467.83 183.27 467.83 178.68 L 467.83 8.3 C 467.83 3.72 464.11 0 459.52 0 L 12.45 0 C 7.87 0 4.15 3.72 4.15 8.3 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 17.77 165.14)"><foreignobject style="--ltx-fo-width:31.54em;--ltx-fo-height:0.69em;--ltx-fo-depth:11.05em;font-size:10pt;" height="162.51" overflow="visible" transform="matrix(1 0 0 -1 0 9.61)" width="436.42"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S3.p3.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S3.Thmdefinition3" class="ltx_theorem ltx_theorem_definition">
<h6 class="ltx_title ltx_runin ltx_title_theorem" style="--ltx-fg-color:#000000;"><span id="S3.Thmdefinition3.2" class="ltx_text ltx_font_bold">Definition 3.3 (<span id="S3.Thmdefinition3.2.1" class="ltx_text ltx_font_italic">Data splits and candidate evaluation</span></span>).</h6>
<span id="S3.Thmdefinition3.p1" class="ltx_para">
<span id="S3.Thmdefinition3.p1.1" class="ltx_p"><span id="S3.Thmdefinition3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Research tasks distinguish </span><span id="S3.Thmdefinition3.p1.1.2" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">data regimes</span><span id="S3.Thmdefinition3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><math id="S3.Thmdefinition3.p1.m1" class="ltx_Math" alttext="\mathcal{D}_{\rho}\subseteq\mathcal{D}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒟</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ρ</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⊆</mo><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒟</mi></mrow><annotation encoding="application/x-tex">\mathcal{D}_{\rho}\subseteq\mathcal{D}</annotation></semantics></math><span id="S3.Thmdefinition3.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">. For out-of-distribution evaluation, one regime is held out as </span><math id="S3.Thmdefinition3.p1.m2" class="ltx_Math" alttext="\mathcal{D}_{\mathrm{ood}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒟</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ood</mi></msub><annotation encoding="application/x-tex">\mathcal{D}_{\mathrm{ood}}</annotation></semantics></math><span id="S3.Thmdefinition3.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">, and the rest form </span><math id="S3.Thmdefinition3.p1.m3" class="ltx_Math" alttext="\mathcal{D}_{\mathrm{id}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒟</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">id</mi></msub><annotation encoding="application/x-tex">\mathcal{D}_{\mathrm{id}}</annotation></semantics></math><span id="S3.Thmdefinition3.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">. Agents fit candidates on the training set </span><math id="S3.Thmdefinition3.p1.m4" class="ltx_Math" alttext="\mathcal{D}_{\mathrm{train}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒟</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">train</mi></msub><annotation encoding="application/x-tex">\mathcal{D}_{\mathrm{train}}</annotation></semantics></math><span id="S3.Thmdefinition3.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> from </span><math id="S3.Thmdefinition3.p1.m5" class="ltx_Math" alttext="\mathcal{D}_{\mathrm{id}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒟</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">id</mi></msub><annotation encoding="application/x-tex">\mathcal{D}_{\mathrm{id}}</annotation></semantics></math><span id="S3.Thmdefinition3.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;">; only verifiers access the validation set </span><math id="S3.Thmdefinition3.p1.m6" class="ltx_Math" alttext="\mathcal{D}_{\mathrm{val}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒟</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">val</mi></msub><annotation encoding="application/x-tex">\mathcal{D}_{\mathrm{val}}</annotation></semantics></math><span id="S3.Thmdefinition3.p1.1.9" class="ltx_text" style="--ltx-fg-color:#000000;">, which includes </span><math id="S3.Thmdefinition3.p1.m7" class="ltx_Math" alttext="\mathcal{D}_{\mathrm{ood}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒟</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ood</mi></msub><annotation encoding="application/x-tex">\mathcal{D}_{\mathrm{ood}}</annotation></semantics></math><span id="S3.Thmdefinition3.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">. A sealed test set </span><math id="S3.Thmdefinition3.p1.m8" class="ltx_Math" alttext="\mathcal{D}_{\mathrm{test}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒟</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">test</mi></msub><annotation encoding="application/x-tex">\mathcal{D}_{\mathrm{test}}</annotation></semantics></math><span id="S3.Thmdefinition3.p1.1.11" class="ltx_text" style="--ltx-fg-color:#000000;"> scores only the final candidate and never guides search. During search, verifiers compute the task-specific metric </span><math id="S3.Thmdefinition3.p1.m9" class="ltx_Math" alttext="\textsc{Score}(x):=\textsc{Score}(x;\mathcal{D}_{\mathrm{val}})" display="inline" intent=":literal"><semantics><mrow><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_font_smallcaps" mathcolor="#000000">Score</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">:=</mo><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_font_smallcaps" mathcolor="#000000">Score</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒟</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">val</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\textsc{Score}(x):=\textsc{Score}(x;\mathcal{D}_{\mathrm{val}})</annotation></semantics></math><span id="S3.Thmdefinition3.p1.1.12" class="ltx_text" style="--ltx-fg-color:#000000;">, the improvement </span><math id="S3.Thmdefinition3.p1.m10" class="ltx_Math" alttext="\textsc{Gain}(x):=\textsc{Score}(x)-\textsc{Score}(x_{0})" display="inline" intent=":literal"><semantics><mrow><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_font_smallcaps" mathcolor="#000000">Gain</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">:=</mo><mrow><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_font_smallcaps" mathcolor="#000000">Score</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_font_smallcaps" mathcolor="#000000">Score</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow></mrow><annotation encoding="application/x-tex">\textsc{Gain}(x):=\textsc{Score}(x)-\textsc{Score}(x_{0})</annotation></semantics></math><span id="S3.Thmdefinition3.p1.1.13" class="ltx_text" style="--ltx-fg-color:#000000;"> over a baseline </span><math id="S3.Thmdefinition3.p1.m11" class="ltx_Math" alttext="x_{0}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub><annotation encoding="application/x-tex">x_{0}</annotation></semantics></math><span id="S3.Thmdefinition3.p1.1.14" class="ltx_text" style="--ltx-fg-color:#000000;">, and the fraction </span><math id="S3.Thmdefinition3.p1.m12" class="ltx_Math" alttext="\textsc{Valid}(x)\in[0,1]" display="inline" intent=":literal"><semantics><mrow><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_font_smallcaps" mathcolor="#000000">Valid</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow></mrow><annotation encoding="application/x-tex">\textsc{Valid}(x)\in[0,1]</annotation></semantics></math><span id="S3.Thmdefinition3.p1.1.15" class="ltx_text" style="--ltx-fg-color:#000000;"> of constraints without a confirmed violation.</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>