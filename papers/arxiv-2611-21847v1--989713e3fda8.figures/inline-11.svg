<svg id="S1.p6.pic1" class="ltx_picture" height="369.63" overflow="visible" version="1.1" viewbox="0 0 467.83 369.63" width="467.83"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,369.63) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.3 L 0 361.33 C 0 365.92 3.72 369.63 8.3 369.63 L 459.52 369.63 C 464.11 369.63 467.83 365.92 467.83 361.33 L 467.83 8.3 C 467.83 3.72 464.11 0 459.52 0 L 8.3 0 C 3.72 0 0 3.72 0 8.3 Z" /></g><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 4.15 8.3 L 4.15 361.33 C 4.15 365.92 7.87 369.63 12.45 369.63 L 459.52 369.63 C 464.11 369.63 467.83 365.92 467.83 361.33 L 467.83 8.3 C 467.83 3.72 464.11 0 459.52 0 L 12.45 0 C 7.87 0 4.15 3.72 4.15 8.3 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 17.77 15.7)"><foreignobject style="--ltx-fo-width:31.54em;--ltx-fo-height:24.69em;--ltx-fo-depth:0.25em;font-size:10pt;" height="345.16" overflow="visible" transform="matrix(1 0 0 -1 0 341.7)" width="436.42"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S1.p6.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S1.p6.pic1.p1" class="ltx_para ltx_noindent"><span id="S1.p6.pic1.p1.1" class="ltx_ERROR undefined">\papersans</span>
<span id="S1.p6.pic1.p1.2" class="ltx_p"><span id="S1.p6.pic1.p1.2.1" class="ltx_text">Contributions.</span><span id="S1.p6.pic1.p1.2.2" class="ltx_text" style="--ltx-fg-color:#000000;"> Our main contributions are:</span></span>
</span>
<span id="S1.p6.pic1.p2" class="ltx_para ltx_noindent">
<span id="S1.p6.pic1.p2.1" class="ltx_p"><span id="S1.p6.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">
<span id="S1.p6.pic1.p2.1.1.1" class="ltx_inline-block ltx_transformed_outer" style="width:9.0pt;height:10.8pt;vertical-align:-2.4pt;"><span class="ltx_transformed_inner" style="transform:translate(0.8pt,-0.9pt) scale(1.2,1.2) ;">
<span id="S1.p6.pic1.p2.1.1.1.1" class="ltx_p">❶</span>
</span></span> <span id="S1.p6.pic1.p2.1.1.2" class="ltx_text ltx_font_bold">Self-improving</span></span><span id="S1.p6.pic1.p2.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;"> idea generation.</span><span id="S1.p6.pic1.p2.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> We propose </span><span id="S1.p6.pic1.p2.1.4" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">Inventa</span><span id="S1.p6.pic1.p2.1.5" class="ltx_text" style="--ltx-fg-color:#000000;">, an agentic framework for scaling scientific discovery and research ideation. The framework refines ideas while continually evolving the agents that generate them, expanding the space of ideas it can reach as the search proceeds.</span></span>
</span>
<span id="S1.p6.pic1.p3" class="ltx_para ltx_noindent">
<span id="S1.p6.pic1.p3.1" class="ltx_p"><span id="S1.p6.pic1.p3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">
<span id="S1.p6.pic1.p3.1.1.1" class="ltx_inline-block ltx_transformed_outer" style="width:9.0pt;height:10.8pt;vertical-align:-2.4pt;"><span class="ltx_transformed_inner" style="transform:translate(0.8pt,-0.9pt) scale(1.2,1.2) ;">
<span id="S1.p6.pic1.p3.1.1.1.1" class="ltx_p">❷</span>
</span></span> <span id="S1.p6.pic1.p3.1.1.2" class="ltx_text ltx_font_bold">Diverse</span></span><span id="S1.p6.pic1.p3.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;"> exploration with verified knowledge sharing.</span><span id="S1.p6.pic1.p3.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> We introduce autonomous research units that explore different approaches, each with its own history of ideas and experiments. Units communicate only through shared knowledge written by verifiers: positive findings point to promising directions, while refuted ones, such as constraint violations, prune the search space.</span></span>
</span>
<span id="S1.p6.pic1.p4" class="ltx_para ltx_noindent">
<span id="S1.p6.pic1.p4.1" class="ltx_p"><span id="S1.p6.pic1.p4.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">
<span id="S1.p6.pic1.p4.1.1.1" class="ltx_inline-block ltx_transformed_outer" style="width:9.0pt;height:10.8pt;vertical-align:-2.4pt;"><span class="ltx_transformed_inner" style="transform:translate(0.8pt,-0.9pt) scale(1.2,1.2) ;">
<span id="S1.p6.pic1.p4.1.1.1.1" class="ltx_p">❸</span>
</span></span> <span id="S1.p6.pic1.p4.1.1.2" class="ltx_text ltx_font_bold">Extensive</span></span><span id="S1.p6.pic1.p4.1.2" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;"> <span id="S1.p6.pic1.p4.1.2.1" class="ltx_text">experiments.</span></span><span id="S1.p6.pic1.p4.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> On five benchmarks from retrieving prior work to scientific law discovery, </span><span id="S1.p6.pic1.p4.1.4" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">Inventa</span><span id="S1.p6.pic1.p4.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> leads every primary metric by 6–40% and alone passes every EurekaBench constraint test (Fig. </span><span class="ltx_ref ltx_missing_label ltx_ref_self" style="--ltx-fg-color:#000000;"></span><span id="S1.p6.pic1.p4.1.6" class="ltx_text" style="--ltx-fg-color:#000000;">).</span></span>
</span></span></span></span></foreignobject></g></g></svg>