<svg id="S3.p1.pic1" class="ltx_picture" height="120.57" overflow="visible" version="1.1" viewbox="0 0 467.83 120.57" width="467.83"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,120.57) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.3 L 0 112.27 C 0 116.85 3.72 120.57 8.3 120.57 L 459.52 120.57 C 464.11 120.57 467.83 116.85 467.83 112.27 L 467.83 8.3 C 467.83 3.72 464.11 0 459.52 0 L 8.3 0 C 3.72 0 0 3.72 0 8.3 Z" /></g><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 4.15 8.3 L 4.15 112.27 C 4.15 116.85 7.87 120.57 12.45 120.57 L 459.52 120.57 C 464.11 120.57 467.83 116.85 467.83 112.27 L 467.83 8.3 C 467.83 3.72 464.11 0 459.52 0 L 12.45 0 C 7.87 0 4.15 3.72 4.15 8.3 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 17.77 97.95)"><foreignobject style="--ltx-fo-width:31.54em;--ltx-fo-height:0.75em;--ltx-fo-depth:6.19em;font-size:10pt;" height="96.09" overflow="visible" transform="matrix(1 0 0 -1 0 10.38)" width="436.42"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S3.p1.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S3.Thmdefinition1" class="ltx_theorem ltx_theorem_definition">
<h6 class="ltx_title ltx_runin ltx_title_theorem" style="--ltx-fg-color:#000000;"><span id="S3.Thmdefinition1.2" class="ltx_text ltx_font_bold">Definition 3.1 (<span id="S3.Thmdefinition1.2.1" class="ltx_text ltx_font_italic">Agents and harnesses</span></span>).</h6>
<span id="S3.Thmdefinition1.p1" class="ltx_para">
<span id="S3.Thmdefinition1.p1.1" class="ltx_p"><span id="S3.Thmdefinition1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">An AI agent </span><math id="S3.Thmdefinition1.p1.m1" class="ltx_Math" alttext="A:=\langle m,h\rangle" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">:=</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⟨</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">h</mi></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⟩</mo></mrow></mrow><annotation encoding="application/x-tex">A:=\langle m,h\rangle</annotation></semantics></math><span id="S3.Thmdefinition1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> consists of an LLM </span><math id="S3.Thmdefinition1.p1.m2" class="ltx_Math" alttext="m" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><annotation encoding="application/x-tex">m</annotation></semantics></math><span id="S3.Thmdefinition1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> and a harness </span><math id="S3.Thmdefinition1.p1.m3" class="ltx_Math" alttext="h" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">h</mi><annotation encoding="application/x-tex">h</annotation></semantics></math><span id="S3.Thmdefinition1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">. The harness specifies the agent’s prompts, tools, context management, and control flow. In our setting, we keep the model weights frozen and allow the harness to change during evolution. Let </span><math id="S3.Thmdefinition1.p1.m4" class="ltx_Math" alttext="\mathcal{M}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℳ</mi><annotation encoding="application/x-tex">\mathcal{M}</annotation></semantics></math><span id="S3.Thmdefinition1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> denote the set of available models and </span><math id="S3.Thmdefinition1.p1.m5" class="ltx_Math" alttext="\mathcal{H}" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℋ</mi><annotation encoding="application/x-tex">\mathcal{H}</annotation></semantics></math><span id="S3.Thmdefinition1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> the initial set of harnesses. The pool </span><math id="S3.Thmdefinition1.p1.m6" class="ltx_Math" alttext="\mathcal{G}\subseteq\mathcal{M}\times\mathcal{H}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒢</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⊆</mo><mrow><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℳ</mi><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">×</mo><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℋ</mi></mrow></mrow><annotation encoding="application/x-tex">\mathcal{G}\subseteq\mathcal{M}\times\mathcal{H}</annotation></semantics></math><span id="S3.Thmdefinition1.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> contains their compatible model–harness pairs.</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>