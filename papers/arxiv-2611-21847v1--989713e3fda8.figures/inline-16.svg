<svg id="S3.p4.pic1" class="ltx_picture" height="119.8" overflow="visible" version="1.1" viewbox="0 0 467.83 119.8" width="467.83"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,119.8) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 0 8.3 L 0 111.5 C 0 116.08 3.72 119.8 8.3 119.8 L 459.52 119.8 C 464.11 119.8 467.83 116.08 467.83 111.5 L 467.83 8.3 C 467.83 3.72 464.11 0 459.52 0 L 8.3 0 C 3.72 0 0 3.72 0 8.3 Z" /></g><g style="--ltx-fill-color:#000000;" fill="#000000" fill-opacity="1.0"><path style="stroke:none" d="M 4.15 8.3 L 4.15 111.5 C 4.15 116.08 7.87 119.8 12.45 119.8 L 459.52 119.8 C 464.11 119.8 467.83 116.08 467.83 111.5 L 467.83 8.3 C 467.83 3.72 464.11 0 459.52 0 L 12.45 0 C 7.87 0 4.15 3.72 4.15 8.3 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 17.77 14.93)"><foreignobject style="--ltx-fo-width:31.54em;--ltx-fo-height:6.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="95.32" overflow="visible" transform="matrix(1 0 0 -1 0 92.63)" width="436.42"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S3.p4.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:31.54em;">
<span id="S3.p4.pic1.p1" class="ltx_para ltx_noindent">
<span id="S3.p4.pic1.p1.1" class="ltx_p"><span id="S3.p4.pic1.p1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Problem statement.</span><span id="S3.p4.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">
Given a task </span><math id="S3.p4.pic1.p1.m1" class="ltx_Math" alttext="\tau" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi><annotation encoding="application/x-tex">\tau</annotation></semantics></math><span id="S3.p4.pic1.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> and a search budget, </span><span id="S3.p4.pic1.p1.1.4" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">Inventa</span><span id="S3.p4.pic1.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> seeks a candidate </span><math id="S3.p4.pic1.p1.m2" class="ltx_Math" alttext="x^{\star}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⋆</mo></msup><annotation encoding="application/x-tex">x^{\star}</annotation></semantics></math><span id="S3.p4.pic1.p1.1.6" class="ltx_text" style="--ltx-fg-color:#000000;"> that maximizes the validation score </span><math id="S3.p4.pic1.p1.m3" class="ltx_Math" alttext="\textsc{Score}(x^{\star})" display="inline" intent=":literal"><semantics><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_font_smallcaps" mathcolor="#000000">Score</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⋆</mo></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\textsc{Score}(x^{\star})</annotation></semantics></math><span id="S3.p4.pic1.p1.1.7" class="ltx_text" style="--ltx-fg-color:#000000;"> subject to </span><math id="S3.p4.pic1.p1.m4" class="ltx_Math" alttext="\textsc{Valid}(x^{\star})=1" display="inline" intent=":literal"><semantics><mrow><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_font_smallcaps" mathcolor="#000000">Valid</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⋆</mo></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">\textsc{Valid}(x^{\star})=1</annotation></semantics></math><span id="S3.p4.pic1.p1.1.8" class="ltx_text" style="--ltx-fg-color:#000000;"> and </span><math id="S3.p4.pic1.p1.m5" class="ltx_Math" alttext="\textsc{Gain}(x^{\star})&gt;\delta" display="inline" intent=":literal"><semantics><mrow><mrow><mtext style="--ltx-fg-color:#000000;" class="ltx_font_smallcaps" mathcolor="#000000">Gain</mtext><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⋆</mo></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">δ</mi></mrow><annotation encoding="application/x-tex">\textsc{Gain}(x^{\star})&gt;\delta</annotation></semantics></math><span id="S3.p4.pic1.p1.1.9" class="ltx_text" style="--ltx-fg-color:#000000;"> for a noise margin </span><math id="S3.p4.pic1.p1.m6" class="ltx_Math" alttext="\delta" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">δ</mi><annotation encoding="application/x-tex">\delta</annotation></semantics></math><span id="S3.p4.pic1.p1.1.10" class="ltx_text" style="--ltx-fg-color:#000000;">, aiming to score high on the unseen </span><math id="S3.p4.pic1.p1.m7" class="ltx_Math" alttext="\mathcal{D}_{\mathrm{test}}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">𝒟</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">test</mi></msub><annotation encoding="application/x-tex">\mathcal{D}_{\mathrm{test}}</annotation></semantics></math><span id="S3.p4.pic1.p1.1.11" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span></span></span></foreignobject></g></g></svg>