<span id="S1.p10.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:49.42em;">
<span id="S1.p10.pic1.1.1" class="ltx_p"><span id="S1.p10.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#1E5F58;">Takeaway 1.2. Attack and Recovery Have Different Proof Burdens.<span id="S1.p10.pic1.1.1.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> 

One successful path can establish an attack, whereas recovery must address the relevant future activation sites. Connected carrier-to-exposure traces and local runtime controls provide parts of this evidence <cite class="ltx_cite ltx_citemacro_cite">[<span class="ltx_ref ltx_missing_citation ltx_ref_self">zhang2026harnesssafeevaluatingsafetypersistent</span>, <span class="ltx_ref ltx_missing_citation ltx_ref_self">liu_2026_safeagent_a_runtime_protecti</span>, <span class="ltx_ref ltx_missing_citation ltx_ref_self">shi2025progent</span>]</cite>. Their results do not by themselves establish that the same influence has been withdrawn from descendants across sessions.</span></span></span>
</span></span></span></foreignobject></g></g></svg>