<span id="S3.SS6.p4.pic1.1.1" class="ltx_p"><span id="S3.SS6.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#1E5F58;">Takeaway 3.2. Skill Trust Depends on Derivation.<span id="S3.SS6.p4.pic1.1.1.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> 

A skill’s current name or author does not establish the legitimacy of its behavior. Extraction and imitation can hide an untrusted source while retaining its influence <cite class="ltx_cite ltx_citemacro_cite">[<span class="ltx_ref ltx_missing_citation ltx_ref_self">ying2026skilljackpersistentskillbackdoors</span>, <span class="ltx_ref ltx_missing_citation ltx_ref_self">wu2026evomalselfpoisoningselfevolvingcoding</span>]</cite>. Skill governance therefore needs source-to-version lineage and execution preconditions, including dependencies on other installed procedures.</span></span></span>
