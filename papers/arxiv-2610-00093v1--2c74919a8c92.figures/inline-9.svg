<span id="S2.SS5.p14.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:49.42em;">
<span id="S2.SS5.p14.pic1.1.1" class="ltx_p"><span id="S2.SS5.p14.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#1E5F58;">Takeaway 2.4. Capability Evidence Is Not Safety Evidence.<span id="S2.SS5.p14.pic1.1.1.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> 

A system that demonstrates memory, skill, or model-update reuse identifies a carrier and an operation worth testing. It establishes transition safety only if the evaluation also observes the relevant safety attributes, activation authority, or response. Capability, attack, and defense studies can inform the same comparison without supporting interchangeable claims.</span></span></span>
