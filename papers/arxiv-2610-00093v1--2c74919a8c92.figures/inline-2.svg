<span id="S1.p9.pic1.1.1" class="ltx_p"><span id="S1.p9.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#1E5F58;">Takeaway 1.1. Legitimate State Can Become Unsafe Through Reuse.<span id="S1.p9.pic1.1.1.1.1" class="ltx_text ltx_font_medium" style="--ltx-fg-color:#000000;"> 

Unsafe influence need not begin as harmful content. Adaptation can broaden the persistence, authority, or scope of otherwise legitimate state beyond the conditions under which it was valid. Safety analysis must therefore examine the change in permitted use, not only the source content or final behavior.</span></span></span>
