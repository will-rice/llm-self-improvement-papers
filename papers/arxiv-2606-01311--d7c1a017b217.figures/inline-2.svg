<span id="A4.F6.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A4.F6.pic1.2.1" class="ltx_p"><span id="A4.F6.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task.<span id="A4.F6.pic1.2.1.1.1" class="ltx_text ltx_font_medium">
Analyze a failed trajectory, extract a candidate fault chain, and return one
primary fault step for this round.</span></span></span>
<span id="A4.F6.pic1.2.2" class="ltx_p"><span id="A4.F6.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input fields.<span id="A4.F6.pic1.2.2.1.1" class="ltx_text ltx_font_medium">
Task description, trajectory summary, recent critical steps, and fault-type
definitions.</span></span></span>
<span id="A4.F6.pic1.2.3" class="ltx_p"><span id="A4.F6.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Instructions.<span id="A4.F6.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A4.I2" class="ltx_itemize ltx_leftmargin_flush">
<span id="A4.I2.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i1.p1" class="ltx_para">
<span id="A4.I2.i1.p1.1" class="ltx_p"><span id="A4.I2.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Extract 2–4 candidate fault steps that are most likely to explain the
failure, ranked by evidence strength.</span></span>
</span></span>
<span id="A4.I2.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i2.p1" class="ltx_para">
<span id="A4.I2.i2.p1.1" class="ltx_p"><span id="A4.I2.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Select one primary step </span><math id="A4.I2.i2.p1.m1" class="ltx_Math" alttext="t^{\ast}" display="inline" intent=":literal"><semantics><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∗</mo></msup><annotation encoding="application/x-tex">t^{\ast}</annotation></semantics></math><span id="A4.I2.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> from the candidate chain for the
current revision attempt.</span></span>
</span></span>
<span id="A4.I2.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i3.p1" class="ltx_para">
<span id="A4.I2.i3.p1.1" class="ltx_p"><span id="A4.I2.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Distinguish </span><span id="A4.I2.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">skill_wrong</span><span id="A4.I2.i3.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;"> (an existing skill misguided the
agent) and </span><span id="A4.I2.i3.p1.1.4" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">skill_missing</span><span id="A4.I2.i3.p1.1.5" class="ltx_text" style="--ltx-fg-color:#000000;"> (no existing skill covered the situation).</span></span>
</span></span>
<span id="A4.I2.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I2.i4.p1" class="ltx_para">
<span id="A4.I2.i4.p1.1" class="ltx_p"><span id="A4.I2.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If repetitive ineffective actions appear, include loop-prevention
guidance in the improvement principle.</span></span>
</span></span>
</span>
<span id="A4.F6.pic1.2.4" class="ltx_p"><span id="A4.F6.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output format (strict).<span id="A4.F6.pic1.2.4.1.1" class="ltx_text"></span></span></span>
<span id="A4.I3" class="ltx_itemize ltx_leftmargin_flush">
<span id="A4.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i1.p1" class="ltx_para">
<span id="A4.I3.i1.p1.1" class="ltx_p"><span id="A4.I3.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">fault_chain</span><span id="A4.I3.i1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: ranked step ids (1-based), e.g., [5,7,9]</span></span>
</span></span>
<span id="A4.I3.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i2.p1" class="ltx_para">
<span id="A4.I3.i2.p1.1" class="ltx_p"><span id="A4.I3.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">t_star</span><span id="A4.I3.i2.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: primary step selected from </span><span id="A4.I3.i2.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">fault_chain</span></span>
</span></span>
<span id="A4.I3.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i3.p1" class="ltx_para">
<span id="A4.I3.i3.p1.1" class="ltx_p"><span id="A4.I3.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">improvement_principle</span><span id="A4.I3.i3.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: one concise correction statement</span></span>
</span></span>
<span id="A4.I3.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i4.p1" class="ltx_para">
<span id="A4.I3.i4.p1.1" class="ltx_p"><span id="A4.I3.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">fault_type</span><span id="A4.I3.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: one of predefined classes</span></span>
</span></span>
<span id="A4.I3.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I3.i5.p1" class="ltx_para">
<span id="A4.I3.i5.p1.1" class="ltx_p"><span id="A4.I3.i5.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">reason</span><span id="A4.I3.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: brief evidence-grounded explanation</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>