<span id="A4.F8.pic1.1.1" class="ltx_p"><span id="A4.F8.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#FFFFFF;">Skill Reviser Prompt</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 264.92)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:13.48em;--ltx-fo-depth:18.15em;font-size:10pt;" height="437.64" overflow="visible" transform="matrix(1 0 0 -1 0 186.49)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F8.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A4.F8.pic1.2.1" class="ltx_p"><span id="A4.F8.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task.<span id="A4.F8.pic1.2.1.1.1" class="ltx_text ltx_font_medium">
Perform minimal, targeted edits to an existing skill after a linked failure.</span></span></span>
<span id="A4.F8.pic1.2.2" class="ltx_p"><span id="A4.F8.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Revision policy.<span id="A4.F8.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A4.I5" class="ltx_itemize ltx_leftmargin_flush">
<span id="A4.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I5.i1.p1" class="ltx_para">
<span id="A4.I5.i1.p1.1" class="ltx_p"><span id="A4.I5.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Preserve working parts and prefer additive edits.</span></span>
</span></span>
<span id="A4.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I5.i2.p1" class="ltx_para">
<span id="A4.I5.i2.p1.1" class="ltx_p"><span id="A4.I5.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Add preconditions, disambiguation, negative examples, and qualification
checks only where evidence supports the change.</span></span>
</span></span>
<span id="A4.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I5.i3.p1" class="ltx_para">
<span id="A4.I5.i3.p1.1" class="ltx_p"><span id="A4.I5.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Include explicit anti-loop and safety guards when failure traces show
repetitive behavior or risky shell actions.</span></span>
</span></span>
</span>
<span id="A4.F8.pic1.2.3" class="ltx_p"><span id="A4.F8.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output format (JSON).<span id="A4.F8.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A4.I6" class="ltx_itemize ltx_leftmargin_flush">
<span id="A4.I6.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I6.i1.p1" class="ltx_para">
<span id="A4.I6.i1.p1.1" class="ltx_p"><span id="A4.I6.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use the same skill schema as the generator and wrap it with mode metadata.</span></span>
</span></span>
<span id="A4.I6.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I6.i2.p1" class="ltx_para">
<span id="A4.I6.i2.p1.1" class="ltx_p"><span id="A4.I6.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">update_mode = revise_existing</span></span>
</span></span>
<span id="A4.I6.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I6.i3.p1" class="ltx_para">
<span id="A4.I6.i3.p1.1" class="ltx_p"><span id="A4.I6.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">target_skill_id = &lt;existing skill id&gt;</span></span>
</span></span>
<span id="A4.I6.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I6.i4.p1" class="ltx_para">
<span id="A4.I6.i4.p1.1" class="ltx_p"><span id="A4.I6.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">skill_profile</span><span id="A4.I6.i4.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> with strict fields:</span></span>
</span></span>
<span id="A4.I6.i5" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I6.i5.p1" class="ltx_para">
<span id="A4.I6.i5.p1.1" class="ltx_p"><span id="A4.I6.i5.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">title</span><span id="A4.I6.i5.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A4.I6.i5.p1.1.3" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">principle</span><span id="A4.I6.i5.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;">, </span><span id="A4.I6.i5.p1.1.5" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">when_to_apply</span></span>
</span></span>
<span id="A4.I6.i6" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I6.i6.p1" class="ltx_para">
<span id="A4.I6.i6.p1.1" class="ltx_p"><span id="A4.I6.i6.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">procedure</span><span id="A4.I6.i6.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> (3–6 deterministic steps)</span></span>
</span></span>
<span id="A4.I6.i7" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I6.i7.p1" class="ltx_para">
<span id="A4.I6.i7.p1.1" class="ltx_p"><span id="A4.I6.i7.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">qualification_criteria</span></span>
</span></span>
<span id="A4.I6.i8" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I6.i8.p1" class="ltx_para">
<span id="A4.I6.i8.p1.1" class="ltx_p"><span id="A4.I6.i8.p1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">negative_example{what_not_to_do, why_it_fails}</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>