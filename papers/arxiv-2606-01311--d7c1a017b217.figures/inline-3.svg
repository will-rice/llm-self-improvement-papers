</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 17.24)"><foreignobject style="--ltx-fo-width:44.07em;--ltx-fo-height:16.64em;--ltx-fo-depth:0.25em;font-size:10pt;" height="233.69" overflow="visible" transform="matrix(1 0 0 -1 0 230.24)" width="609.8"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.F7.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.07em;">
<span id="A4.F7.pic1.2.1" class="ltx_p"><span id="A4.F7.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Task.<span id="A4.F7.pic1.2.1.1.1" class="ltx_text ltx_font_medium">
Assign responsibility weights from a localized failure to active skill
candidates.</span></span></span>
<span id="A4.F7.pic1.2.2" class="ltx_p"><span id="A4.F7.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Input fields.<span id="A4.F7.pic1.2.2.1.1" class="ltx_text ltx_font_medium">
Fault context, wrong action, improvement principle, and candidate skills
(title/description/trigger snippets).</span></span></span>
<span id="A4.F7.pic1.2.3" class="ltx_p"><span id="A4.F7.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Attribution rules.<span id="A4.F7.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A4.I4" class="ltx_itemize ltx_leftmargin_flush">
<span id="A4.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I4.i1.p1" class="ltx_para">
<span id="A4.I4.i1.p1.1" class="ltx_p"><span id="A4.I4.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use weighted evidence from direct instruction match, context mismatch,
omission, and misleading wording.</span></span>
</span></span>
<span id="A4.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I4.i2.p1" class="ltx_para">
<span id="A4.I4.i2.p1.1" class="ltx_p"><span id="A4.I4.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Typical ranges: 0.8–1.0 (fully responsible), 0.5–0.7 (partially
responsible), 0.2–0.4 (weakly related), 0.0–0.1 (irrelevant).</span></span>
</span></span>
<span id="A4.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I4.i3.p1" class="ltx_para">
<span id="A4.I4.i3.p1.1" class="ltx_p"><span id="A4.I4.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">If no skill is meaningfully responsible, return an empty attribution
list.</span></span>
</span></span>
</span>
<span id="A4.F7.pic1.2.4" class="ltx_p"><span id="A4.F7.pic1.2.4.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output format (JSON).<span id="A4.F7.pic1.2.4.1.1" class="ltx_text ltx_font_medium">
<span id="A4.F7.pic1.2.4.1.1.1" class="ltx_text ltx_font_typewriter">{&quot;attributions&quot;:[{&quot;skill_id&quot;:&quot;...&quot;, &quot;weight&quot;:0.75,
&quot;reason&quot;:&quot;...&quot;}]}</span></span></span></span>
</span></span></span></foreignobject></g></g></svg>