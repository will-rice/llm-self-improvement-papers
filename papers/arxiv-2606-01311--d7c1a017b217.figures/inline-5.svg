<span id="A4.I8.i1.p1.1" class="ltx_p"><span id="A4.I8.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use the same skill schema as the reviser and wrap it with mode metadata.</span></span>
</span></span>
<span id="A4.I8.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
