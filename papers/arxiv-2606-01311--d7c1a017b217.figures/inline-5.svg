Convert failure evidence into a reusable new skill when no existing skill can
be safely revised.</span></span></span>
<span id="A4.F9.pic1.2.2" class="ltx_p"><span id="A4.F9.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Generation policy.<span id="A4.F9.pic1.2.2.1.1" class="ltx_text"></span></span></span>
<span id="A4.I7" class="ltx_itemize ltx_leftmargin_flush">
<span id="A4.I7.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I7.i1.p1" class="ltx_para">
<span id="A4.I7.i1.p1.1" class="ltx_p"><span id="A4.I7.i1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Extract reusable principles, not one-off task hacks.</span></span>
</span></span>
<span id="A4.I7.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I7.i2.p1" class="ltx_para">
<span id="A4.I7.i2.p1.1" class="ltx_p"><span id="A4.I7.i2.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Define precise triggers as </span><em id="A4.I7.i2.p1.1.2" class="ltx_emph ltx_font_italic" style="--ltx-fg-color:#000000;">observation pattern + state
condition</em><span id="A4.I7.i2.p1.1.3" class="ltx_text" style="--ltx-fg-color:#000000;">.</span></span>
</span></span>
<span id="A4.I7.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I7.i3.p1" class="ltx_para">
<span id="A4.I7.i3.p1.1" class="ltx_p"><span id="A4.I7.i3.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Provide executable procedures with verification checkpoints.</span></span>
</span></span>
<span id="A4.I7.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A4.I7.i4.p1" class="ltx_para">
<span id="A4.I7.i4.p1.1" class="ltx_p"><span id="A4.I7.i4.p1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Include explicit negative examples and stop conditions.</span></span>
</span></span>
</span>
<span id="A4.F9.pic1.2.3" class="ltx_p"><span id="A4.F9.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Output format (JSON).<span id="A4.F9.pic1.2.3.1.1" class="ltx_text"></span></span></span>
<span id="A4.I8" class="ltx_itemize ltx_leftmargin_flush">
