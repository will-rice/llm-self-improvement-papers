<span id="A6.SS4.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.2em;">
<span id="A6.SS4.p1.pic1.2.1" class="ltx_p"><span id="A6.SS4.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">You are generating test cases for a code entity. Each test case includes inputs, expected outputs, and a description of what is being tested.
</span></span>
<span id="A6.SS4.p1.pic1.2.2" class="ltx_p"><span id="A6.SS4.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Entity Information:
<br class="ltx_break"><span id="A6.SS4.p1.pic1.2.2.1.1" class="ltx_text ltx_font_medium">- Name: {entity_name}
<br class="ltx_break">- Type: {entity_type} (function/class/method)
<br class="ltx_break">- Signature: {signature}
<br class="ltx_break">- Source Code:
<br class="ltx_break">{source_code}
</span></span></span>
<span id="A6.SS4.p1.pic1.2.3" class="ltx_p"><span id="A6.SS4.p1.pic1.2.3.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Dependencies:
<br class="ltx_break"><span id="A6.SS4.p1.pic1.2.3.1.1" class="ltx_text ltx_font_medium">The following entities are called by this entity:
<br class="ltx_break">{dependency_signatures}
</span></span></span>
<span id="A6.SS4.p1.pic1.2.4" class="ltx_p"><span id="A6.SS4.p1.pic1.2.4.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Task:
<br class="ltx_break"><span id="A6.SS4.p1.pic1.2.4.1.1" class="ltx_text ltx_font_medium">Generate diverse test cases that cover:
</span></span></span>
<span id="A6.I4" class="ltx_enumerate">
<span id="A6.I4.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A6.I4.i1.p1" class="ltx_para">
<span id="A6.I4.i1.p1.1" class="ltx_p"><span id="A6.I4.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Normal cases: typical usage scenarios
</span></span>
</span></span>
<span id="A6.I4.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A6.I4.i2.p1" class="ltx_para">
<span id="A6.I4.i2.p1.1" class="ltx_p"><span id="A6.I4.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Edge cases: boundary conditions, empty inputs, single elements
</span></span>
</span></span>
<span id="A6.I4.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A6.I4.i3.p1" class="ltx_para">
<span id="A6.I4.i3.p1.1" class="ltx_p"><span id="A6.I4.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Corner cases: special values, type boundaries
</span></span>
</span></span>
</span>
<span id="A6.SS4.p1.pic1.2.5" class="ltx_p"><span id="A6.SS4.p1.pic1.2.5.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Requirements:<span id="A6.SS4.p1.pic1.2.5.1.1" class="ltx_text ltx_font_medium">
</span></span></span>
<span id="A6.I5" class="ltx_itemize">
<span id="A6.I5.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I5.i1.p1" class="ltx_para">
<span id="A6.I5.i1.p1.1" class="ltx_p"><span id="A6.I5.i1.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Each test case must include input, expected output, and description
</span></span>
</span></span>
<span id="A6.I5.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I5.i2.p1" class="ltx_para">
<span id="A6.I5.i2.p1.1" class="ltx_p"><span id="A6.I5.i2.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">The description should explain what aspect of the entity is being tested
</span></span>
</span></span>
<span id="A6.I5.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I5.i3.p1" class="ltx_para">
<span id="A6.I5.i3.p1.1" class="ltx_p"><span id="A6.I5.i3.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Cover different code paths and branches
</span></span>
</span></span>
<span id="A6.I5.i4" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">•</span> 
<span id="A6.I5.i4.p1" class="ltx_para">
<span id="A6.I5.i4.p1.1" class="ltx_p"><span id="A6.I5.i4.p1.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Include cases that test error handling if applicable
</span></span>
</span></span>
</span>
<span id="A6.SS4.p1.pic1.2.6" class="ltx_p"><span id="A6.SS4.p1.pic1.2.6.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Output Format:
<br class="ltx_break"><span id="A6.SS4.p1.pic1.2.6.1.1" class="ltx_text ltx_font_medium">Provide test cases as a JSON list:
<br class="ltx_break">[
<br class="ltx_break">  {
<br class="ltx_break">    &quot;input&quot;: {&quot;args&quot;: [...], &quot;kwargs&quot;: {...}},
<br class="ltx_break">    &quot;expected_output&quot;: ...,
<br class="ltx_break">    &quot;description&quot;: &quot;Tests that ...&quot;
<br class="ltx_break">  },
<br class="ltx_break">  ...
<br class="ltx_break">]
</span></span></span>
<span id="A6.SS4.p1.pic1.2.7" class="ltx_p"><span id="A6.SS4.p1.pic1.2.7.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">Provide only the JSON list, without any explanation.
</span></span>
</span></span></span></foreignobject></g></g></svg>