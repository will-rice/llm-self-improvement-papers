<span id="A6.SS1.p1.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:33.2em;">
<span id="A6.SS1.p1.pic1.2.1" class="ltx_p"><span id="A6.SS1.p1.pic1.2.1.1" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;">You are analyzing test failures to diagnose why an LLM failed to generate correct code.
</span></span>
<span id="A6.SS1.p1.pic1.2.2" class="ltx_p"><span id="A6.SS1.p1.pic1.2.2.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Entity Information:
<br class="ltx_break"><span id="A6.SS1.p1.pic1.2.2.1.1" class="ltx_text ltx_font_medium">- Name: {entity_name}
<br class="ltx_break">- Type: {entity_type} (function/class/method)
<br class="ltx_break">- Current Documentation:
<br class="ltx_break">{current_doc}
</span></span></span>
<span id="A6.SS1.p1.pic1.2.3" class="ltx_p"><span id="A6.SS1.p1.pic1.2.3.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Test Failures:
<br class="ltx_break"><span id="A6.SS1.p1.pic1.2.3.1.1" class="ltx_text ltx_font_medium">The generated code failed the following tests:
<br class="ltx_break">{error_messages}
</span></span></span>
<span id="A6.SS1.p1.pic1.2.4" class="ltx_p"><span id="A6.SS1.p1.pic1.2.4.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Task:
<br class="ltx_break"><span id="A6.SS1.p1.pic1.2.4.1.1" class="ltx_text ltx_font_medium">Analyze the test failures and diagnose:
</span></span></span>
<span id="A6.I1" class="ltx_enumerate">
<span id="A6.I1.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A6.I1.i1.p1" class="ltx_para">
<span id="A6.I1.i1.p1.1" class="ltx_p"><span id="A6.I1.i1.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">What went wrong?</span><span id="A6.I1.i1.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> Identify the specific errors (type mismatches, incorrect outputs, missing logic, etc.)
</span></span>
</span></span>
<span id="A6.I1.i2" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A6.I1.i2.p1" class="ltx_para">
<span id="A6.I1.i2.p1.1" class="ltx_p"><span id="A6.I1.i2.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Why did the LLM fail?</span><span id="A6.I1.i2.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> What information is missing or ambiguous in the documentation that caused the LLM to misunderstand the requirements?
</span></span>
</span></span>
<span id="A6.I1.i3" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A6.I1.i3.p1" class="ltx_para">
<span id="A6.I1.i3.p1.1" class="ltx_p"><span id="A6.I1.i3.p1.1.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">What knowledge gap exists?</span><span id="A6.I1.i3.p1.1.2" class="ltx_text ltx_font_typewriter" style="font-size:90%;--ltx-fg-color:#000000;"> What does the LLM need to know to generate correct code?
</span></span>
</span></span>
</span>
<span id="A6.SS1.p1.pic1.2.5" class="ltx_p"><span id="A6.SS1.p1.pic1.2.5.1" class="ltx_text ltx_font_typewriter ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Output:
<br class="ltx_break"><span id="A6.SS1.p1.pic1.2.5.1.1" class="ltx_text ltx_font_medium">Provide a concise diagnosis in the following format:
<br class="ltx_break">- Error Type: [brief description]
<br class="ltx_break">- Root Cause: [what the LLM misunderstood]
<br class="ltx_break">- Missing Information: [what needs to be clarified]
</span></span></span>
</span></span></span></foreignobject></g></g></svg>