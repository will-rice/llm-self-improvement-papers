<span id="A5.SS3.pic1.2.1" class="ltx_p"><span id="A5.SS3.pic1.2.1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">Nate’s dog can dig six holes a day. Each hole takes 15 minutes. He digs for 14 days while Nate is on vacation. When Nate gets home, he starts filling in 9 holes a day, but the dog keeps digging 6 new holes every night. How many weeks does it take him to fill in all the holes?</span><span id="A5.SS3.pic1.2.1.2" class="ltx_text"></span></span>
