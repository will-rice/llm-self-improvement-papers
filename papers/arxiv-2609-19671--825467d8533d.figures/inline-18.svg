<span id="A5.F16.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A5.F16.pic1.2.1" class="ltx_p"><span id="A5.F16.pic1.2.1.1" class="ltx_text ltx_font_smallcaps" style="--ltx-fg-color:#000000;">&lt;think&gt;<span id="A5.F16.pic1.2.1.1.1" class="ltx_text ltx_font_upright">
</span>&lt;/think&gt;<span id="A5.F16.pic1.2.1.1.2" class="ltx_text"></span></span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 13.78)"><foreignobject style="--ltx-fo-width:31.37em;--ltx-fo-height:43.89em;--ltx-fo-depth:0em;font-size:10pt;" height="607.37" overflow="visible" transform="matrix(1 0 0 -1 0 607.37)" width="434.07"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A5.F16.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A5.F16.pic1.3.1" class="ltx_p"><span id="A5.F16.pic1.3.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Let’s break down the problem step by step.</span></span>
<span id="A5.F16.pic1.3.2" class="ltx_p"><span id="A5.F16.pic1.3.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Given:</span></span>
<span id="A5.F16.pic1.3.3" class="ltx_p"><span id="A5.F16.pic1.3.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. **Nate’s dog digs** 6 holes **a day**.</span></span>
<span id="A5.F16.pic1.3.4" class="ltx_p"><span id="A5.F16.pic1.3.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. **Each hole takes** 15 minutes to dig.</span></span>
<span id="A5.F16.pic1.3.5" class="ltx_p"><span id="A5.F16.pic1.3.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. **Nate digs for 14 days** while he is on vacation.</span></span>
<span id="A5.F16.pic1.3.6" class="ltx_p"><span id="A5.F16.pic1.3.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. **When he gets home, he starts filling holes** at a rate of 9 holes per day.</span></span>
<span id="A5.F16.pic1.3.7" class="ltx_p"><span id="A5.F16.pic1.3.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">5. **The dog continues digging** 6 new holes every night.</span></span>
<span id="A5.F16.pic1.3.8" class="ltx_p"><span id="A5.F16.pic1.3.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Objective:</span></span>
<span id="A5.F16.pic1.3.9" class="ltx_p"><span id="A5.F16.pic1.3.9.1" class="ltx_text" style="--ltx-fg-color:#000000;">Determine how many **weeks** it takes for Nate to fill all the holes.</span></span>
<span id="A5.F16.pic1.3.10" class="ltx_p"><span id="A5.F16.pic1.3.10.1" class="ltx_text" style="--ltx-fg-color:#000000;">Step-by-Step Solution:</span></span>
<span id="A5.F16.pic1.3.11" class="ltx_p"><span id="A5.F16.pic1.3.11.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. **Calculate the total number of holes the dog digs while Natie is on vacation:**</span></span>
<span id="A5.F16.pic1.3.12" class="ltx_p"><span id="A5.F16.pic1.3.12.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Dogs digging time per day:** 6 holes</span></span>
<span id="A5.F16.pic1.3.13" class="ltx_p"><span id="A5.F16.pic1.3.13.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Days Natie digs:** 14 days</span></span>
<span id="A5.F16.pic1.3.14" class="ltx_p"><span id="A5.F16.pic1.3.14.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Total holes dug by the dog:** <math id="A5.F16.pic1.m2" class="ltx_Math" alttext="6\text{ holes/day}\times 14\text{ days}=84\text{ holes}" display="inline" intent=":literal"><semantics><mrow><mrow><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">6</mn><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> holes/day</mtext></mrow><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">×</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">14</mn></mrow><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> days</mtext></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">84</mn><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> holes</mtext></mrow></mrow><annotation encoding="application/x-tex">6\text{ holes/day}\times 14\text{ days}=84\text{ holes}</annotation></semantics></math></span></span>
<span id="A5.F16.pic1.3.15" class="ltx_p"><span id="A5.F16.pic1.3.15.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. **Calculate the total time Natie spends digging:**</span></span>
<span id="A5.F16.pic1.3.16" class="ltx_p"><span id="A5.F16.pic1.3.16.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Each hole takes:** 15 minutes</span></span>
<span id="A5.F16.pic1.3.17" class="ltx_p"><span id="A5.F16.pic1.3.17.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Total time Natie digs:** <math id="A5.F16.pic1.m3" class="ltx_Math" alttext="84\text{ holes}\times 15\text{ minutes/hole}=1260\text{ minutes}" display="inline" intent=":literal"><semantics><mrow><mrow><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">84</mn><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> holes</mtext></mrow><mo style="--ltx-fg-color:#000000;" lspace="0.222em" mathcolor="#000000" rspace="0.222em">×</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">15</mn></mrow><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> minutes/hole</mtext></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1260</mn><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> minutes</mtext></mrow></mrow><annotation encoding="application/x-tex">84\text{ holes}\times 15\text{ minutes/hole}=1260\text{ minutes}</annotation></semantics></math></span></span>
<span id="A5.F16.pic1.3.18" class="ltx_p"><span id="A5.F16.pic1.3.18.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Convert minutes to days:** <math id="A5.F16.pic1.m4" class="ltx_Math" alttext="\frac{1260\text{ minutes}}{1440\text{ minutes/day}}=0.875\text{ days}" display="inline" intent=":literal"><semantics><mrow><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1260</mn><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> minutes</mtext></mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1440</mn><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> minutes/day</mtext></mrow></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0.875</mn><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> days</mtext></mrow></mrow><annotation encoding="application/x-tex">\frac{1260\text{ minutes}}{1440\text{ minutes/day}}=0.875\text{ days}</annotation></semantics></math></span></span>
<span id="A5.F16.pic1.3.19" class="ltx_p"><span id="A5.F16.pic1.3.19.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. **Calculate the number of holes Natie starts filling:**</span></span>
<span id="A5.F16.pic1.3.20" class="ltx_p"><span id="A5.F16.pic1.3.20.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Nate starts filling holes at:** 9 holes/day</span></span>
<span id="A5.F16.pic1.3.21" class="ltx_p"><span id="A5.F16.pic1.3.21.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Total holes dug by the dog during Natie’s vacation:** 84 holes</span></span>
<span id="A5.F16.pic1.3.22" class="ltx_p"><span id="A5.F16.pic1.3.22.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Total holes Natie needs to fill:** <math id="A5.F16.pic1.m5" class="ltx_Math" alttext="84\text{ holes}" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">84</mn><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> holes</mtext></mrow><annotation encoding="application/x-tex">84\text{ holes}</annotation></semantics></math></span></span>
<span id="A5.F16.pic1.3.23" class="ltx_p"><span id="A5.F16.pic1.3.23.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. **Determine the net rate at which holes are being filled:**</span></span>
<span id="A5.F16.pic1.3.24" class="ltx_p"><span id="A5.F16.pic1.3.24.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Dog digs:** 6 holes/night</span></span>
<span id="A5.F16.pic1.3.25" class="ltx_p"><span id="A5.F16.pic1.3.25.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Nate fills:** 9 holes/day</span></span>
<span id="A5.F16.pic1.3.26" class="ltx_p"><span id="A5.F16.pic1.3.26.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Net rate per day:** <math id="A5.F16.pic1.m6" class="ltx_Math" alttext="9\text{ holes/day}-6\text{ holes/day}=3\text{ holes/day}" display="inline" intent=":literal"><semantics><mrow><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">9</mn><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> holes/day</mtext></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">6</mn><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> holes/day</mtext></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> holes/day</mtext></mrow></mrow><annotation encoding="application/x-tex">9\text{ holes/day}-6\text{ holes/day}=3\text{ holes/day}</annotation></semantics></math></span></span>
<span id="A5.F16.pic1.3.27" class="ltx_p"><span id="A5.F16.pic1.3.27.1" class="ltx_text" style="--ltx-fg-color:#000000;">5. **Calculate the number of days needed to fill all holes:**</span></span>
<span id="A5.F16.pic1.3.28" class="ltx_p"><span id="A5.F16.pic1.3.28.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Total holes to fill:** 84 holes</span></span>
<span id="A5.F16.pic1.3.29" class="ltx_p"><span id="A5.F16.pic1.3.29.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Net rate:** 3 holes/day</span></span>
<span id="A5.F16.pic1.3.30" class="ltx_p"><span id="A5.F16.pic1.3.30.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Days needed:** <math id="A5.F16.pic1.m7" class="ltx_Math" alttext="\frac{84\text{ holes}}{3\text{ holes/day}}=28\text{ days}" display="inline" intent=":literal"><semantics><mrow><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">84</mn><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> holes</mtext></mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">3</mn><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> holes/day</mtext></mrow></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">28</mn><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> days</mtext></mrow></mrow><annotation encoding="application/x-tex">\frac{84\text{ holes}}{3\text{ holes/day}}=28\text{ days}</annotation></semantics></math></span></span>
<span id="A5.F16.pic1.3.31" class="ltx_p"><span id="A5.F16.pic1.3.31.1" class="ltx_text" style="--ltx-fg-color:#000000;">6. **Convert days into weeks:**</span></span>
<span id="A5.F16.pic1.3.32" class="ltx_p"><span id="A5.F16.pic1.3.32.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Days needed:** 28 days</span></span>
<span id="A5.F16.pic1.3.33" class="ltx_p"><span id="A5.F16.pic1.3.33.1" class="ltx_text" style="--ltx-fg-color:#000000;">- **Number of weeks:** <math id="A5.F16.pic1.m8" class="ltx_Math" alttext="\frac{28\text{ days}}{7\text{ days/week}}=4\text{ weeks}" display="inline" intent=":literal"><semantics><mrow><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">28</mn><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> days</mtext></mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">7</mn><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> days/week</mtext></mrow></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn><mo lspace="0em" rspace="0em">​</mo><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000"> weeks</mtext></mrow></mrow><annotation encoding="application/x-tex">\frac{28\text{ days}}{7\text{ days/week}}=4\text{ weeks}</annotation></semantics></math></span></span>
<span id="A5.F16.pic1.3.34" class="ltx_p"><span id="A5.F16.pic1.3.34.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Final Answer<span id="A5.F16.pic1.3.34.1.1" class="ltx_text"></span></span></span>
<span id="A5.Ex4" class="ltx_equation ltx_eqn_table">

<span><span class="ltx_equation ltx_eqn_row ltx_align_baseline">
