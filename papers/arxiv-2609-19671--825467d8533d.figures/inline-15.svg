<span id="A5.F14.pic1.3" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:31.37em;">
<span id="A5.F14.pic1.3.1" class="ltx_p"><span id="A5.F14.pic1.3.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Final Answer<span id="A5.F14.pic1.3.1.1.1" class="ltx_text"></span></span></span>
<span id="A5.F14.pic1.3.2" class="ltx_p"><span id="A5.F14.pic1.3.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">The first appearance was on a 75-year interval at <math id="A5.F14.pic1.m5" class="ltx_Math ltx_framed ltx_framed_rectangle" display="block" intent=":literal"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">15</mn></math>.</span></span>
<span id="A5.F14.pic1.3.3" class="ltx_p"><span id="A5.F14.pic1.3.3.1" class="ltx_text" style="--ltx-fg-color:#000000;">The problem involves determining the first appearance of a bird on a 75-year interval. The key steps to solve this are as follows:</span></span>
<span id="A5.F14.pic1.3.4" class="ltx_p"><span id="A5.F14.pic1.3.4.1" class="ltx_text" style="--ltx-fg-color:#000000;">1. **Understanding the problem**: The first appearance of the bird on a 75-year interval is the starting point. The second appearance is noted as being 15 years after the first appearance.</span></span>
<span id="A5.F14.pic1.3.5" class="ltx_p"><span id="A5.F14.pic1.3.5.1" class="ltx_text" style="--ltx-fg-color:#000000;">2. **Setting up the equations**:
- Let <math id="A5.F14.pic1.m6" class="ltx_Math" alttext="T_{1}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><annotation encoding="application/x-tex">T_{1}</annotation></semantics></math> be the first appearance.
- The second appearance is given as <math id="A5.F14.pic1.m7" class="ltx_Math" alttext="T_{2}=T_{1}+15" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">15</mn></mrow></mrow><annotation encoding="application/x-tex">T_{2}=T_{1}+15</annotation></semantics></math>.
- The second appearance is noted as 90 years after the first appearance, so <math id="A5.F14.pic1.m8" class="ltx_Math" alttext="T_{2}=90" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">90</mn></mrow><annotation encoding="application/x-tex">T_{2}=90</annotation></semantics></math>.</span></span>
<span id="A5.F14.pic1.3.6" class="ltx_p"><span id="A5.F14.pic1.3.6.1" class="ltx_text" style="--ltx-fg-color:#000000;">3. **Solving the equations**:
- From the second appearance, we have <math id="A5.F14.pic1.m9" class="ltx_Math" alttext="90=T_{1}+15" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">90</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">15</mn></mrow></mrow><annotation encoding="application/x-tex">90=T_{1}+15</annotation></semantics></math>.
- Solving this gives <math id="A5.F14.pic1.m10" class="ltx_Math" alttext="T_{1}=90-15=75" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">90</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">15</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">75</mn></mrow><annotation encoding="application/x-tex">T_{1}=90-15=75</annotation></semantics></math>.</span></span>
<span id="A5.F14.pic1.3.7" class="ltx_p"><span id="A5.F14.pic1.3.7.1" class="ltx_text" style="--ltx-fg-color:#000000;">4. **Conclusion**:
- The first appearance is at <math id="A5.F14.pic1.m11" class="ltx_Math" alttext="T_{1}=75" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">75</mn></mrow><annotation encoding="application/x-tex">T_{1}=75</annotation></semantics></math>, which is 75 years after the start.
- The second appearance is at <math id="A5.F14.pic1.m12" class="ltx_Math" alttext="T_{2}=90" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">90</mn></mrow><annotation encoding="application/x-tex">T_{2}=90</annotation></semantics></math>, which is 15 years after the first appearance.</span></span>
<span id="A5.F14.pic1.3.8" class="ltx_p"><span id="A5.F14.pic1.3.8.1" class="ltx_text" style="--ltx-fg-color:#000000;">Thus, the first appearance of the bird was on a 75-year interval at <math id="A5.F14.pic1.m13" class="ltx_Math ltx_framed ltx_framed_rectangle" display="block" intent=":literal"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">15</mn></math>.</span></span>
