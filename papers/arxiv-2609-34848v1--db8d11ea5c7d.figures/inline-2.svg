<svg id="S3.SS1.SSS0.Px1.p2.pic1" class="ltx_picture" height="84.55" overflow="visible" version="1.1" viewbox="0 0 662.99 84.55" width="662.99"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,84.55) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#D2D2D2;" fill="#D2D2D2" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.08 L 0 82.47 C 0 83.62 0.93 84.55 2.08 84.55 L 660.92 84.55 C 662.06 84.55 662.99 83.62 662.99 82.47 L 662.99 2.08 C 662.99 0.93 662.06 0 660.92 0 L 2.08 0 C 0.93 0 0 0.93 0 2.08 Z" /></g><g style="--ltx-fill-color:#FBFBFB;" fill="#FBFBFB" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 2.08 L 0.69 82.47 C 0.69 83.24 1.31 83.86 2.08 83.86 L 660.92 83.86 C 661.68 83.86 662.3 83.24 662.3 82.47 L 662.3 2.08 C 662.3 1.31 661.68 0.69 660.92 0.69 L 2.08 0.69 C 1.31 0.69 0.69 1.31 0.69 2.08 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.4 67.47)"><foreignobject style="--ltx-fo-width:46.85em;--ltx-fo-height:0.7em;--ltx-fo-depth:4.34em;font-size:10pt;" height="69.76" overflow="visible" transform="matrix(1 0 0 -1 0 9.69)" width="648.27"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S3.SS1.SSS0.Px1.p2.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:46.85em;">
<span id="Thmtheorem1" class="ltx_theorem ltx_theorem_theorem">
<h6 class="ltx_title ltx_runin ltx_title_theorem" style="--ltx-fg-color:#000000;"><span class="ltx_tag ltx_tag_theorem"><span id="Thmtheorem1.2" class="ltx_text ltx_font_bold">Theorem 1</span></span><span id="Thmtheorem1.3" class="ltx_text ltx_font_bold"> </span>(Sequential Information Attribution)<span id="Thmtheorem1.4" class="ltx_text ltx_font_bold">.</span></h6>
<span id="Thmtheorem1.p1" class="ltx_para">
<span id="Thmtheorem1.p1.1" class="ltx_p"><span id="Thmtheorem1.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Define <math id="Thmtheorem1.p1.m1" class="ltx_math_unparsed" alttext="\mathcal{I}_{k}^{\Upsilon}=I(\Upsilon;\Phi_{k}\mid X,\Phi_{&lt;k})" display="inline" intent=":literal"><semantics><mrow><msubsup><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℐ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Υ</mi></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">I</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Υ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">;</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Φ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">X</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Φ</mi><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\mathcal{I}_{k}^{\Upsilon}=I(\Upsilon;\Phi_{k}\mid X,\Phi_{&lt;k})</annotation></semantics></math>. Then <math id="Thmtheorem1.p1.m2" class="ltx_Math" alttext="\mathcal{I}_{k}^{\Upsilon}=I(\Upsilon;\Phi_{\leq k}\mid X)-I(\Upsilon;\Phi_{&lt;k}\mid X)\geq 0" display="inline" intent=":literal"><semantics><mrow><msubsup><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℐ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Υ</mi></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">I</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Υ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">;</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Φ</mi><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow></msub></mrow><mo style="--ltx-fg-color:#000000;" fence="true" lspace="0em" mathcolor="#000000" rspace="0em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">X</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">I</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Υ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">;</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Φ</mi><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow></msub></mrow><mo style="--ltx-fg-color:#000000;" fence="true" lspace="0em" mathcolor="#000000" rspace="0em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">X</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">\mathcal{I}_{k}^{\Upsilon}=I(\Upsilon;\Phi_{\leq k}\mid X)-I(\Upsilon;\Phi_{&lt;k}\mid X)\geq 0</annotation></semantics></math> and <math id="Thmtheorem1.p1.m3" class="ltx_math_unparsed" alttext="\sum_{k=0}^{K-1}\mathcal{I}_{k}^{\Upsilon}=I(\Upsilon;\Phi_{0:K-1}\mid X)" display="inline" intent=":literal"><semantics><mrow><msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∑</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">K</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msubsup><msubsup><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℐ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Υ</mi></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">I</mi><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Υ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">;</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Φ</mi><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" lspace="0.278em" mathcolor="#000000" rspace="0.278em">:</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">K</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></mrow></msub><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">∣</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">X</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\sum_{k=0}^{K-1}\mathcal{I}_{k}^{\Upsilon}=I(\Upsilon;\Phi_{0:K-1}\mid X)</annotation></semantics></math>. For <math id="Thmtheorem1.p1.m4" class="ltx_Math" alttext="\Upsilon=Y" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Υ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Y</mi></mrow><annotation encoding="application/x-tex">\Upsilon=Y</annotation></semantics></math> and <math id="Thmtheorem1.p1.m5" class="ltx_Math" alttext="\Phi_{k}=\mathcal{H}_{k}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Φ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℋ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></mrow><annotation encoding="application/x-tex">\Phi_{k}=\mathcal{H}_{k}</annotation></semantics></math>, <math id="Thmtheorem1.p1.m6" class="ltx_Math" alttext="\mathcal{I}_{k}=\mathcal{I}_{k}^{Y}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℐ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msubsup><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℐ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Y</mi></msubsup></mrow><annotation encoding="application/x-tex">\mathcal{I}_{k}=\mathcal{I}_{k}^{Y}</annotation></semantics></math> attributes response information sequentially to steps without assigning correctness labels.</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>