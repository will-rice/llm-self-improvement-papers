<svg id="S3.SS3.SSS0.Px2.p2.pic1" class="ltx_picture" height="93.59" overflow="visible" version="1.1" viewbox="0 0 662.99 93.59" width="662.99"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,93.59) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#D2D2D2;" fill="#D2D2D2" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.08 L 0 91.51 C 0 92.66 0.93 93.59 2.08 93.59 L 660.92 93.59 C 662.06 93.59 662.99 92.66 662.99 91.51 L 662.99 2.08 C 662.99 0.93 662.06 0 660.92 0 L 2.08 0 C 0.93 0 0 0.93 0 2.08 Z" /></g><g style="--ltx-fill-color:#FBFBFB;" fill="#FBFBFB" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 2.08 L 0.69 91.51 C 0.69 92.28 1.31 92.89 2.08 92.89 L 660.92 92.89 C 661.68 92.89 662.3 92.28 662.3 91.51 L 662.3 2.08 C 662.3 1.31 661.68 0.69 660.92 0.69 L 2.08 0.69 C 1.31 0.69 0.69 1.31 0.69 2.08 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.4 76.5)"><foreignobject style="--ltx-fo-width:46.85em;--ltx-fo-height:0.7em;--ltx-fo-depth:4.99em;font-size:10pt;" height="78.79" overflow="visible" transform="matrix(1 0 0 -1 0 9.69)" width="648.27"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S3.SS3.SSS0.Px2.p2.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:46.85em;">
<span id="Thmtheorem3" class="ltx_theorem ltx_theorem_theorem">
<h6 class="ltx_title ltx_runin ltx_title_theorem" style="--ltx-fg-color:#000000;"><span class="ltx_tag ltx_tag_theorem"><span id="Thmtheorem3.2" class="ltx_text ltx_font_bold">Theorem 3</span></span><span id="Thmtheorem3.3" class="ltx_text ltx_font_bold"> </span>(Information Gain Bounds Credit Magnitude)<span id="Thmtheorem3.4" class="ltx_text ltx_font_bold">.</span></h6>
<span id="Thmtheorem3.p1" class="ltx_para">
<span id="Thmtheorem3.p1.1" class="ltx_p"><span id="Thmtheorem3.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Under (E1)–(E3) in Appendix <a href="#A4.SS3" title="D.3 Proof of Theorem : Information Gain Bounds Credit Magnitude ‣ Appendix D Proofs of Theoretical Results in DCSD ‣ Can We Trust the Teacher? Decoupled Credit Direction-Magnitude for Self-Distillation" class="ltx_ref"><span class="ltx_text ltx_ref_tag">D.3</span></a>, <math id="Thmtheorem3.p1.m1" class="ltx_Math" alttext="\Delta F_{k}=I(\Theta;O_{\mathcal{H}_{k}}\mid O_{\mathcal{H}_{&lt;k}})=\sup_{f}I(f(\Theta);O_{\mathcal{H}_{k}}\mid O_{\mathcal{H}_{&lt;k}})" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Δ</mi><mo lspace="0em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">F</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">I</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Θ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">;</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">O</mi><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℋ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></msub></mrow><mo style="--ltx-fg-color:#000000;" fence="true" lspace="0em" mathcolor="#000000" rspace="0em">∣</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">O</mi><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℋ</mi><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow></msub></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.1389em">=</mo><mrow><msub><mo style="--ltx-fg-color:#000000;" lspace="0.1389em" mathcolor="#000000" rspace="0.167em">sup</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi></msub><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">I</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Θ</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">;</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">O</mi><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℋ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></msub></mrow><mo style="--ltx-fg-color:#000000;" fence="true" lspace="0em" mathcolor="#000000" rspace="0em">∣</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">O</mi><msub><mi style="--ltx-fg-color:#000000;" class="ltx_font_mathcaligraphic" mathcolor="#000000">ℋ</mi><mrow><mphantom></mphantom><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></mrow></msub></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow></mrow><annotation encoding="application/x-tex">\Delta F_{k}=I(\Theta;O_{\mathcal{H}_{k}}\mid O_{\mathcal{H}_{&lt;k}})=\sup_{f}I(f(\Theta);O_{\mathcal{H}_{k}}\mid O_{\mathcal{H}_{&lt;k}})</annotation></semantics></math>, over finite-valued measurable answer maps <math id="Thmtheorem3.p1.m2" class="ltx_Math" alttext="f" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><annotation encoding="application/x-tex">f</annotation></semantics></math>. For <math id="Thmtheorem3.p1.m3" class="ltx_Math" alttext="0&lt;V^{\pi}(S_{k})&lt;1" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi></msup><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><annotation encoding="application/x-tex">0&lt;V^{\pi}(S_{k})&lt;1</annotation></semantics></math>, expectation over step evidence gives <math id="Thmtheorem3.p1.m4" class="ltx_Math" alttext="\mathbb{E}[A_{k}^{\star}]=0" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔼</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⋆</mo></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">\mathbb{E}[A_{k}^{\star}]=0</annotation></semantics></math>, <math id="Thmtheorem3.p1.m5" class="ltx_Math" alttext="\mathbb{E}[(A_{k}^{\star})^{2}]\leq\min\{\frac{1}{2}\Delta F_{k},\frac{1}{4}\}" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔼</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><msup><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⋆</mo></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></msup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">min</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">{</mo><mrow><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mfrac><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Δ</mi><mo lspace="0em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">F</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">4</mn></mfrac><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">}</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\mathbb{E}[(A_{k}^{\star})^{2}]\leq\min\{\frac{1}{2}\Delta F_{k},\frac{1}{4}\}</annotation></semantics></math>, and <math id="Thmtheorem3.p1.m6" class="ltx_Math" alttext="\mathbb{E}[Z_{k}^{\star}\mid R=1]\leq\Delta F_{k}/V^{\pi}(S_{k})" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝔼</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><mrow><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Z</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⋆</mo></msubsup><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0.167em">∣</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">R</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><mrow><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Δ</mi><mo lspace="0em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">F</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi></msup></mrow><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\mathbb{E}[Z_{k}^{\star}\mid R=1]\leq\Delta F_{k}/V^{\pi}(S_{k})</annotation></semantics></math>. Moreover, <math id="Thmtheorem3.p1.m7" class="ltx_Math" alttext="\Delta F_{k}=0" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Δ</mi><mo lspace="0em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">F</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">\Delta F_{k}=0</annotation></semantics></math> iff <math id="Thmtheorem3.p1.m8" class="ltx_Math" alttext="A_{k}^{\star}=0" display="inline" intent=":literal"><semantics><mrow><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⋆</mo></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">A_{k}^{\star}=0</annotation></semantics></math> for every <math id="Thmtheorem3.p1.m9" class="ltx_Math" alttext="f" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">f</mi><annotation encoding="application/x-tex">f</annotation></semantics></math>. Thus <math id="Thmtheorem3.p1.m10" class="ltx_Math" alttext="\Delta F_{k}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Δ</mi><mo lspace="0em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">F</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></mrow><annotation encoding="application/x-tex">\Delta F_{k}</annotation></semantics></math> is the sharp verifier-independent answer-information envelope.</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>