<svg id="S3.SS2.SSS0.Px2.p2.pic1" class="ltx_picture" height="77.75" overflow="visible" version="1.1" viewbox="0 0 662.99 77.75" width="662.99"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,77.75) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#D2D2D2;" fill="#D2D2D2" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.08 L 0 75.68 C 0 76.82 0.93 77.75 2.08 77.75 L 660.92 77.75 C 662.06 77.75 662.99 76.82 662.99 75.68 L 662.99 2.08 C 662.99 0.93 662.06 0 660.92 0 L 2.08 0 C 0.93 0 0 0.93 0 2.08 Z" /></g><g style="--ltx-fill-color:#FBFBFB;" fill="#FBFBFB" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 2.08 L 0.69 75.68 C 0.69 76.44 1.31 77.06 2.08 77.06 L 660.92 77.06 C 661.68 77.06 662.3 76.44 662.3 75.68 L 662.3 2.08 C 662.3 1.31 661.68 0.69 660.92 0.69 L 2.08 0.69 C 1.31 0.69 0.69 1.31 0.69 2.08 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.4 60.67)"><foreignobject style="--ltx-fo-width:46.85em;--ltx-fo-height:0.7em;--ltx-fo-depth:3.85em;font-size:10pt;" height="62.96" overflow="visible" transform="matrix(1 0 0 -1 0 9.69)" width="648.27"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S3.SS2.SSS0.Px2.p2.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:46.85em;">
<span id="Thmtheorem2" class="ltx_theorem ltx_theorem_theorem">
<h6 class="ltx_title ltx_runin ltx_title_theorem" style="--ltx-fg-color:#000000;"><span class="ltx_tag ltx_tag_theorem"><span id="Thmtheorem2.2" class="ltx_text ltx_font_bold">Theorem 2</span></span><span id="Thmtheorem2.3" class="ltx_text ltx_font_bold"> </span>(Oracle-Consistent Credit Direction)<span id="Thmtheorem2.4" class="ltx_text ltx_font_bold">.</span></h6>
<span id="Thmtheorem2.p1" class="ltx_para">
<span id="Thmtheorem2.p1.1" class="ltx_p"><span id="Thmtheorem2.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Let <math id="Thmtheorem2.p1.m1" class="ltx_Math" alttext="D_{k}^{\star}" display="inline" intent=":literal"><semantics><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⋆</mo></msubsup><annotation encoding="application/x-tex">D_{k}^{\star}</annotation></semantics></math> be the oracle log-odds change over <math id="Thmtheorem2.p1.m2" class="ltx_Math" alttext="C_{k}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">C</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><annotation encoding="application/x-tex">C_{k}</annotation></semantics></math> and <math id="Thmtheorem2.p1.m3" class="ltx_Math" alttext="\Xi_{k}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Ξ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><annotation encoding="application/x-tex">\Xi_{k}</annotation></semantics></math> the probe’s readout-and-coverage error. For <math id="Thmtheorem2.p1.m4" class="ltx_Math" alttext="(S_{k},S_{k+1})" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">(S_{k},S_{k+1})</annotation></semantics></math> with <math id="Thmtheorem2.p1.m5" class="ltx_Math" alttext="0&lt;V^{\pi}(S_{k}),V^{\pi}(S_{k+1})&lt;1" display="inline" intent=":literal"><semantics><mrow><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi></msup><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mrow><msup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi></msup><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">S</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></mrow><annotation encoding="application/x-tex">0&lt;V^{\pi}(S_{k}),V^{\pi}(S_{k+1})&lt;1</annotation></semantics></math> and finite <math id="Thmtheorem2.p1.m6" class="ltx_Math" alttext="\Xi_{k}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Ξ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><annotation encoding="application/x-tex">\Xi_{k}</annotation></semantics></math>, <math id="Thmtheorem2.p1.m7" class="ltx_Math" alttext="|\Delta M_{k}-D_{k}^{\star}|\leq\Xi_{k}" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Δ</mi><mo lspace="0em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">D</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⋆</mo></msubsup></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≤</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Ξ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></mrow><annotation encoding="application/x-tex">|\Delta M_{k}-D_{k}^{\star}|\leq\Xi_{k}</annotation></semantics></math>. Hence, if <math id="Thmtheorem2.p1.m8" class="ltx_Math" alttext="\Xi_{k}&lt;\min\{\tau_{M}^{+},-\tau_{M}^{-}\}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Ξ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">min</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">{</mo><mrow><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo></msubsup></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">}</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\Xi_{k}&lt;\min\{\tau_{M}^{+},-\tau_{M}^{-}\}</annotation></semantics></math>, then <math id="Thmtheorem2.p1.m9" class="ltx_Math" alttext="\Delta M_{k}\notin(\tau_{M}^{-},\tau_{M}^{+})" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Δ</mi><mo lspace="0em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∉</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\Delta M_{k}\notin(\tau_{M}^{-},\tau_{M}^{+})</annotation></semantics></math> implies <math id="Thmtheorem2.p1.m10" class="ltx_Math" alttext="\sigma_{k}=\operatorname{sign}(\Delta M_{k})=\operatorname{sign}(A_{k}^{\star})=\operatorname{sign}(Z_{k}^{\star})" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">σ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">sign</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Δ</mi><mo lspace="0em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">M</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">sign</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⋆</mo></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">sign</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Z</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⋆</mo></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow><annotation encoding="application/x-tex">\sigma_{k}=\operatorname{sign}(\Delta M_{k})=\operatorname{sign}(A_{k}^{\star})=\operatorname{sign}(Z_{k}^{\star})</annotation></semantics></math>.</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>