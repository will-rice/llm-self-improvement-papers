<svg id="S3.SS4.SSS0.Px2.p2.pic1" class="ltx_picture" height="103.35" overflow="visible" version="1.1" viewbox="0 0 662.99 103.35" width="662.99"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,103.35) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#D2D2D2;" fill="#D2D2D2" fill-opacity="1.0"><path style="stroke:none" d="M 0 2.08 L 0 101.27 C 0 102.42 0.93 103.35 2.08 103.35 L 660.92 103.35 C 662.06 103.35 662.99 102.42 662.99 101.27 L 662.99 2.08 C 662.99 0.93 662.06 0 660.92 0 L 2.08 0 C 0.93 0 0 0.93 0 2.08 Z" /></g><g style="--ltx-fill-color:#FBFBFB;" fill="#FBFBFB" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 2.08 L 0.69 101.27 C 0.69 102.04 1.31 102.66 2.08 102.66 L 660.92 102.66 C 661.68 102.66 662.3 102.04 662.3 101.27 L 662.3 2.08 C 662.3 1.31 661.68 0.69 660.92 0.69 L 2.08 0.69 C 1.31 0.69 0.69 1.31 0.69 2.08 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 7.4 86.27)"><foreignobject style="--ltx-fo-width:46.85em;--ltx-fo-height:0.7em;--ltx-fo-depth:5.7em;font-size:10pt;" height="88.56" overflow="visible" transform="matrix(1 0 0 -1 0 9.69)" width="648.27"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S3.SS4.SSS0.Px2.p2.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:46.85em;">
<span id="Thmtheorem4" class="ltx_theorem ltx_theorem_theorem">
<h6 class="ltx_title ltx_runin ltx_title_theorem" style="--ltx-fg-color:#000000;"><span class="ltx_tag ltx_tag_theorem"><span id="Thmtheorem4.2" class="ltx_text ltx_font_bold">Theorem 4</span></span><span id="Thmtheorem4.3" class="ltx_text ltx_font_bold"> </span>(Calibrated Teacher Supervision Preserves Step Credit)<span id="Thmtheorem4.4" class="ltx_text ltx_font_bold">.</span></h6>
<span id="Thmtheorem4.p1" class="ltx_para">
<span id="Thmtheorem4.p1.1" class="ltx_p"><span id="Thmtheorem4.p1.1.1" class="ltx_text ltx_font_italic" style="--ltx-fg-color:#000000;">Fix the student policy, response, partition, <math id="Thmtheorem4.p1.m1" class="ltx_Math" alttext="\sigma_{k}\in\{-1,+1\}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">σ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">{</mo><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">}</mo></mrow></mrow><annotation encoding="application/x-tex">\sigma_{k}\in\{-1,+1\}</annotation></semantics></math>, <math id="Thmtheorem4.p1.m2" class="ltx_Math" alttext="\alpha_{k}\geq 0" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">α</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≥</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">\alpha_{k}\geq 0</annotation></semantics></math>, <math id="Thmtheorem4.p1.m3" class="ltx_Math" alttext="\kappa_{\tau}&gt;0" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">κ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">\kappa_{\tau}&gt;0</annotation></semantics></math>, and <math id="Thmtheorem4.p1.m4" class="ltx_Math" alttext="A_{\tau}\neq 0" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">≠</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">A_{\tau}\neq 0</annotation></semantics></math>. For every teacher realization, <math id="Thmtheorem4.p1.m5" class="ltx_Math" alttext="\sum_{t\in C_{k}}|A_{t}^{\mathrm{tok}}|=\kappa_{\tau}|A_{\tau}|\alpha_{k}" display="inline" intent=":literal"><semantics><mrow><mrow><msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∑</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">C</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></mrow></msub><mrow><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" stretchy="false">|</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">tok</mi></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">κ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow><mo lspace="0em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">α</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></mrow></mrow><annotation encoding="application/x-tex">\sum_{t\in C_{k}}|A_{t}^{\mathrm{tok}}|=\kappa_{\tau}|A_{\tau}|\alpha_{k}</annotation></semantics></math> and <math id="Thmtheorem4.p1.m6" class="ltx_Math" alttext="\operatorname{sign}(A_{t}^{\mathrm{tok}})=\sigma_{k}" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">sign</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">tok</mi></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">σ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></mrow><annotation encoding="application/x-tex">\operatorname{sign}(A_{t}^{\mathrm{tok}})=\sigma_{k}</annotation></semantics></math> for <math id="Thmtheorem4.p1.m7" class="ltx_Math" alttext="t\in C_{k}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">∈</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">C</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></mrow><annotation encoding="application/x-tex">t\in C_{k}</annotation></semantics></math> with <math id="Thmtheorem4.p1.m8" class="ltx_Math" alttext="\alpha_{k}&gt;0" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">α</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&gt;</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></mrow><annotation encoding="application/x-tex">\alpha_{k}&gt;0</annotation></semantics></math>. Hence, on steps certified by Theorem <a href="#Thmtheorem2" title="Theorem 2 (Oracle-Consistent Credit Direction). ‣ Belief-guided credit direction. ‣ 3.2 Belief-Margin Probe Design for Decoupled Credit Direction ‣ 3 Method: Decoupled Credit for Calibrating Teacher Signals ‣ Can We Trust the Teacher? Decoupled Credit Direction-Magnitude for Self-Distillation" class="ltx_ref"><span class="ltx_text ltx_ref_tag">2</span></a>, nonzero token credits carry <math id="Thmtheorem4.p1.m9" class="ltx_Math" alttext="\operatorname{sign}(A_{k}^{\star})" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">sign</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⋆</mo></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\operatorname{sign}(A_{k}^{\star})</annotation></semantics></math>, and step credit is proportional, within a response, to <math id="Thmtheorem4.p1.m10" class="ltx_Math" alttext="\Delta F_{k}" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000" mathvariant="normal">Δ</mi><mo lspace="0em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">F</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub></mrow><annotation encoding="application/x-tex">\Delta F_{k}</annotation></semantics></math> (Theorem <a href="#Thmtheorem3" title="Theorem 3 (Information Gain Bounds Credit Magnitude). ‣ Information gain quantifies credit magnitude. ‣ 3.3 Information-Gain Principle for Decoupled Credit Magnitude ‣ 3 Method: Decoupled Credit for Calibrating Teacher Signals ‣ Can We Trust the Teacher? Decoupled Credit Direction-Magnitude for Self-Distillation" class="ltx_ref"><span class="ltx_text ltx_ref_tag">3</span></a>).</span></span>
</span>
</span></span></span></span></foreignobject></g></g></svg>