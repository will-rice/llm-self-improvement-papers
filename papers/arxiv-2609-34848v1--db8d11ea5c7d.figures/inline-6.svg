<svg id="S3.SS4.SSS0.Px2.p5.p1.pic1" class="ltx_picture" height="32.13" overflow="visible" version="1.1" viewbox="0 0 445.32 32.13" width="445.32"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,32.13) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#F6F6F6;" fill="#F6F6F6" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 32.13 L 445.32 32.13 L 445.32 0 Z" /></g><g style="--ltx-fill-color:#F6F6F6;" fill="#F6F6F6" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 32.13 L 445.32 32.13 L 445.32 0 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 5.53 16.91)"><foreignobject style="--ltx-fo-width:31.38em;--ltx-fo-height:0.7em;--ltx-fo-depth:0.82em;font-size:10pt;" height="21.06" overflow="visible" transform="matrix(1 0 0 -1 0 9.69)" width="434.25"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S3.SS4.SSS0.Px2.p5.p1.pic1.1" class="ltx_text ltx_align_center ltx_inline-block" style="width:310.5pt;--ltx-fg-color:#000000;"><math id="S3.SS4.SSS0.Px2.p5.p1.pic1.m1" class="ltx_Math" alttext="\displaystyle\mathbf{OPSD:}\;\underbrace{[\operatorname{sign}(Z_{k}^{T}),\,|Z_{k}^{T}|]}_{\text{Coupled Credit}}\Rightarrow\underbrace{Z_{k}^{T}=Z_{k}^{\star}+\varepsilon_{k}^{T}}_{\text{Direct Signal}}\qquad\mathbf{DCSD:}\;\underbrace{[\sigma_{k},\,\alpha_{k}]}_{\text{Decoupled Credit}}\Rightarrow\underbrace{A_{t}^{\mathrm{tok}}=\sigma_{k}\kappa_{\tau}|A_{\tau}|\alpha_{k}q_{k,t}}_{\text{Calibrated Credit}}" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝐎𝐏𝐒𝐃</mi><mo style="--ltx-fg-color:#000000;" lspace="0.278em" mathcolor="#000000" rspace="0.558em">:</mo><mrow><munder><munder accentunder="true"><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">sign</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Z</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.337em">,</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Z</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="true">⏟</mo></munder><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Coupled Credit</mtext></munder><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⇒</mo><munder><munder accentunder="true"><mrow><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Z</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">Z</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">⋆</mo></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">ε</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">T</mi></msubsup></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="true">⏟</mo></munder><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Direct Signal</mtext></munder></mrow></mrow><mspace style="width:2em;" width="2em"></mspace><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">𝐃𝐂𝐒𝐃</mi><mo style="--ltx-fg-color:#000000;" lspace="0.278em" mathcolor="#000000" rspace="0.558em">:</mo><mrow><munder><munder accentunder="true"><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">[</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">σ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" rspace="0.337em">,</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">α</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">]</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="true">⏟</mo></munder><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Decoupled Credit</mtext></munder><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">⇒</mo><munder><munder accentunder="true"><mrow><msubsup><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">tok</mi></msubsup><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">σ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo lspace="0em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">κ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi></msub><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">τ</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow><mo lspace="0em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">α</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo lspace="0em" rspace="0em">​</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">q</mi><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">,</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">t</mi></mrow></msub></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="true">⏟</mo></munder><mtext style="--ltx-fg-color:#000000;" mathcolor="#000000">Calibrated Credit</mtext></munder></mrow></mrow></mrow><annotation encoding="application/x-tex">\displaystyle\mathbf{OPSD:}\;\underbrace{[\operatorname{sign}(Z_{k}^{T}),\,|Z_{k}^{T}|]}_{\text{Coupled Credit}}\Rightarrow\underbrace{Z_{k}^{T}=Z_{k}^{\star}+\varepsilon_{k}^{T}}_{\text{Direct Signal}}\qquad\mathbf{DCSD:}\;\underbrace{[\sigma_{k},\,\alpha_{k}]}_{\text{Decoupled Credit}}\Rightarrow\underbrace{A_{t}^{\mathrm{tok}}=\sigma_{k}\kappa_{\tau}|A_{\tau}|\alpha_{k}q_{k,t}}_{\text{Calibrated Credit}}</annotation></semantics></math>
