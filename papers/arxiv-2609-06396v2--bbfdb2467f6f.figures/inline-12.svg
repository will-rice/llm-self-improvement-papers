<span id="S6.SS4.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="S6.SS4.p2.pic1.p1.1" class="ltx_p"><span id="S6.SS4.p2.pic1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#559AD1;">♣</span><span id="S6.SS4.p2.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="S6.SS4.p2.pic1.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#559AD1;">A task family</span><span id="S6.SS4.p2.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> : whose instances can be executed and observed: not necessarily scored perfectly, only observed.</span></span>
</span>
<span id="S6.SS4.p2.pic1.p2" class="ltx_para ltx_noindent">
<span id="S6.SS4.p2.pic1.p2.1" class="ltx_p"><span id="S6.SS4.p2.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#619563;">♠</span><span id="S6.SS4.p2.pic1.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="S6.SS4.p2.pic1.p2.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#619563;">A verifier of whatever fidelity exists</span><span id="S6.SS4.p2.pic1.p2.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> : compilation, simulation, numerical convergence, protocol execution, replication of a reported result, or in the weakest case a rubric applied by a held-out evaluator.</span></span>
</span>
<span id="S6.SS4.p2.pic1.p3" class="ltx_para ltx_noindent">
<span id="S6.SS4.p2.pic1.p3.1" class="ltx_p"><span id="S6.SS4.p2.pic1.p3.1.1" class="ltx_text" style="--ltx-fg-color:#CC933D;">♥</span><span id="S6.SS4.p2.pic1.p3.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="S6.SS4.p2.pic1.p3.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#CC933D;">A seed scaffold</span><span id="S6.SS4.p2.pic1.p3.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> : an initial assignment to the five genome slots, which may be close to empty.</span></span>
</span></span></span></span></foreignobject></g></g></svg>