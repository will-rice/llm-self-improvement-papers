<svg id="S6.SS7.p3.pic1" class="ltx_picture" height="149.07" overflow="visible" version="1.1" viewbox="0 0 694 149.07" width="694"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,149.07) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#F4F1FB;" fill="#F4F1FB" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 1.97 L 1.97 147.1 L 692.03 147.1 L 692.03 1.97 Z" /></g><g style="--ltx-stroke-color:#3D207D;--ltx-fill-color:#3D207D;--ltx-fg-color:#3D207D;" color="#3D207D" fill="#3D207D" stroke="#3D207D" stroke-width="2.6pt"><path style="fill:none" d="M 1.8 149.07 L 1.8 0" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.81 12.96)"><foreignobject style="--ltx-fo-width:47.97em;--ltx-fo-height:9.09em;--ltx-fo-depth:0.19em;font-size:10pt;" height="128.53" overflow="visible" transform="matrix(1 0 0 -1 0 125.84)" width="663.77"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S6.SS7.p3.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.97em;">
<span id="S6.SS7.p3.pic1.1.1" class="ltx_p"><span id="S6.SS7.p3.pic1.1.1.1" class="ltx_text" style="--ltx-fg-color:#000000;">Read together, the five partition what any self-improving loop must answer: where a loop can exist is set by verification (<a href="#S6.SS7" title="6.7. Five Laws of Recursive Self-Improvement ‣ 6. Discussion" class="ltx_ref"><span class="ltx_text ltx_ref_tag">Section</span> <span class="ltx_text ltx_ref_tag">6.7</span></a>); how fast it turns is set by the cost of re-describing a system that keeps changing (<a href="#S6.SS7" title="6.7. Five Laws of Recursive Self-Improvement ‣ 6. Discussion" class="ltx_ref"><span class="ltx_text ltx_ref_tag">Section</span> <span class="ltx_text ltx_ref_tag">6.7</span></a>); what a gain costs is set by which substrate holds the competence (<a href="#S6.SS7" title="6.7. Five Laws of Recursive Self-Improvement ‣ 6. Discussion" class="ltx_ref"><span class="ltx_text ltx_ref_tag">Section</span> <span class="ltx_text ltx_ref_tag">6.7</span></a>); whether the number means anything is set by what stays unwritable (<a href="#S6.SS7" title="6.7. Five Laws of Recursive Self-Improvement ‣ 6. Discussion" class="ltx_ref"><span class="ltx_text ltx_ref_tag">Section</span> <span class="ltx_text ltx_ref_tag">6.7</span></a>); and what must be bought from outside is set by a boundary that can be measured (<a href="#S6.SS7" title="6.7. Five Laws of Recursive Self-Improvement ‣ 6. Discussion" class="ltx_ref"><span class="ltx_text ltx_ref_tag">Section</span> <span class="ltx_text ltx_ref_tag">6.7</span></a>). No law names a model, a benchmark, or a parameter count; they govern loops, not systems, and they are the ground on which <a href="#S6.SS8" title="6.8. Position: The Unit of Progress Is the Loop, Not the Model ‣ 6. Discussion" class="ltx_ref"><span class="ltx_text ltx_ref_tag">Section</span> <span class="ltx_text ltx_ref_tag">6.8</span></a> states its position in loops rather than models.</span></span>
</span></span></span></foreignobject></g></g></svg>