<svg id="S6.SS4.SSS3.p4.pic1" class="ltx_picture" height="162.99" overflow="visible" version="1.1" viewbox="0 0 694 162.99" width="694"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,162.99) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#F4F1FB;" fill="#F4F1FB" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 1.97 L 1.97 161.02 L 692.03 161.02 L 692.03 1.97 Z" /></g><g style="--ltx-stroke-color:#3D207D;--ltx-fill-color:#3D207D;--ltx-fg-color:#3D207D;" color="#3D207D" fill="#3D207D" stroke="#3D207D" stroke-width="2.6pt"><path style="fill:none" d="M 1.8 162.99 L 1.8 0" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.81 10.27)"><foreignobject style="--ltx-fo-width:47.97em;--ltx-fo-height:10.29em;--ltx-fo-depth:0em;font-size:10pt;" height="142.45" overflow="visible" transform="matrix(1 0 0 -1 0 142.45)" width="663.77"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S6.SS4.SSS3.p4.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.97em;">
<span id="S6.SS4.SSS3.p4.pic1.1.1" class="ltx_p"><span id="S6.SS4.SSS3.p4.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">The macro claim, stated precisely.<span id="S6.SS4.SSS3.p4.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> For settings whose situations are enumerable, we claim four things, with the extension to open worlds left to the projection of <a href="#S6.SS5" title="6.5. Toward Loops That Touch the Physical World ‣ 6. Discussion" class="ltx_ref"><span class="ltx_text ltx_ref_tag">Section</span> <span class="ltx_text ltx_ref_tag">6.5</span></a>: that the labour of building a model is decomposable into three operators whose composition is analyzable; that the resulting loop can be trusted under a weak verifier because what defines success is outside every write surface; that instantiating the loop at a new pipeline stage costs three declared inputs rather than a new design; and that the artifacts it leaves behind are typed, auditable and reusable by the next loop. If those four hold, the region of <a href="#S2.F5" title="In 2.2. Recursive Self-Improvement ‣ 2. Related Work" class="ltx_ref"><span class="ltx_text ltx_ref_tag">Figure</span> <span class="ltx_text ltx_ref_tag">5</span></a> where capability already exists and no loop has been closed is addressable work rather than a research frontier.</span></span></span>
</span></span></span></foreignobject></g></g></svg>