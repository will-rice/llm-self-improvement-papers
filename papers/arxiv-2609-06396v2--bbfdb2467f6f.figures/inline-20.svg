<svg id="S6.SS8.p2.pic1" class="ltx_picture" height="99.26" overflow="visible" version="1.1" viewbox="0 0 694 99.26" width="694"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,99.26) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#F4F1FB;" fill="#F4F1FB" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 1.97 L 1.97 97.29 L 692.03 97.29 L 692.03 1.97 Z" /></g><g style="--ltx-stroke-color:#3D207D;--ltx-fill-color:#3D207D;--ltx-fg-color:#3D207D;" color="#3D207D" fill="#3D207D" stroke="#3D207D" stroke-width="2.6pt"><path style="fill:none" d="M 1.8 99.26 L 1.8 0" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.81 12.96)"><foreignobject style="--ltx-fo-width:47.97em;--ltx-fo-height:5.49em;--ltx-fo-depth:0.19em;font-size:10pt;" height="78.72" overflow="visible" transform="matrix(1 0 0 -1 0 76.03)" width="663.77"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S6.SS8.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:47.97em;">
<span id="S6.SS8.p2.pic1.1.1" class="ltx_p"><span id="S6.SS8.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">The proposition.<span id="S6.SS8.p2.pic1.1.1.1.1" class="ltx_text ltx_font_medium"> For the next stage of progress the binding constraint is not how capable models are but <em id="S6.SS8.p2.pic1.1.1.1.1.1" class="ltx_emph ltx_font_italic">how many loops exist and where they can be closed</em>. On that reading the unit of progress is the loop, not the model, and the productive question is not “how much better can this model get” but “how cheaply can a new loop be closed somewhere it has never been closed.”</span></span></span>
</span></span></span></foreignobject></g></g></svg>