<svg id="S4.SS2.p2.pic1" class="ltx_picture" height="220.81" overflow="visible" version="1.1" viewbox="0 0 694 220.81" width="694"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,220.81) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#737373;" fill="#737373" fill-opacity="1.0"><path style="stroke:none" d="M 0 6.23 L 0 214.58 C 0 218.02 2.79 220.81 6.23 220.81 L 687.77 220.81 C 691.21 220.81 694 218.02 694 214.58 L 694 6.23 C 694 2.79 691.21 0 687.77 0 L 6.23 0 C 2.79 0 0 2.79 0 6.23 Z" /></g><g style="--ltx-fill-color:#F9F7FD;" fill="#F9F7FD" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 6.23 L 0.69 214.58 C 0.69 217.64 3.17 220.12 6.23 220.12 L 687.77 220.12 C 690.83 220.12 693.31 217.64 693.31 214.58 L 693.31 6.23 C 693.31 3.17 690.83 0.69 687.77 0.69 L 6.23 0.69 C 3.17 0.69 0.69 3.17 0.69 6.23 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 15.7 15.62)"><foreignobject style="--ltx-fo-width:47.89em;--ltx-fo-height:13.89em;--ltx-fo-depth:0.19em;font-size:10pt;" height="194.95" overflow="visible" transform="matrix(1 0 0 -1 0 192.26)" width="662.66"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="S4.SS2.p2.pic1.1" class="ltx_inline-logical-block ltx_minipage ltx_align_bottom" style="width:47.89em;">
<span id="S4.SS2.p2.pic1.p1" class="ltx_para ltx_noindent">
<span id="S4.SS2.p2.pic1.p1.1" class="ltx_p"><span id="S4.SS2.p2.pic1.p1.1.1" class="ltx_text" style="--ltx-fg-color:#559AD1;">♣</span><span id="S4.SS2.p2.pic1.p1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="S4.SS2.p2.pic1.p1.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#559AD1;">Data-RSI – amplifier</span><span id="S4.SS2.p2.pic1.p1.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> : Synthesizes verified records from the system’s own execution and marks where that experience ends, so supervision is spent only past the boundary; its products feed both of the others.</span></span>
</span>
<span id="S4.SS2.p2.pic1.p2" class="ltx_para ltx_noindent">
<span id="S4.SS2.p2.pic1.p2.1" class="ltx_p"><span id="S4.SS2.p2.pic1.p2.1.1" class="ltx_text" style="--ltx-fg-color:#619563;">♠</span><span id="S4.SS2.p2.pic1.p2.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="S4.SS2.p2.pic1.p2.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#619563;">Harness-RSI – scaffold</span><span id="S4.SS2.p2.pic1.p2.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> : Edits the five-slot execution scaffold under a typed patch, adding capability without touching the weights. Cheapest per unit of gain; every addition is re-paid as context at inference.</span></span>
</span>
<span id="S4.SS2.p2.pic1.p3" class="ltx_para ltx_noindent">
<span id="S4.SS2.p2.pic1.p3.1" class="ltx_p"><span id="S4.SS2.p2.pic1.p3.1.1" class="ltx_text" style="--ltx-fg-color:#CC933D;">♥</span><span id="S4.SS2.p2.pic1.p3.1.2" class="ltx_text" style="--ltx-fg-color:#000000;"> </span><span id="S4.SS2.p2.pic1.p3.1.3" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#CC933D;">Model-RSI – internalization</span><span id="S4.SS2.p2.pic1.p3.1.4" class="ltx_text" style="--ltx-fg-color:#000000;"> : Converts a recurring context cost into a one-time training cost under a bounded recipe. Most durable, most expensive; needs a dataset postdating the last capability change.</span></span>
</span></span></span></span></foreignobject></g></g></svg>