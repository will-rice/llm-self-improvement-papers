" width="582.74"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content"><span id="A4.SS5.p10.pic1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Three Questions From One CE-only Cluster (Planner to Refiner Transfer, seed 42)</span></span></span></foreignobject></g></g></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 12.36 11.89)"><foreignobject style="--ltx-fo-width:41.58em;--ltx-fo-height:15.78em;--ltx-fo-depth:0.25em;font-size:10pt;" height="221.8" overflow="visible" transform="matrix(1 0 0 -1 0 218.34)" width="575.35"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A4.SS5.p10.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:41.58em;">
<span id="A4.SS5.p10.pic1.2.1" class="ltx_p"><span id="A4.SS5.p10.pic1.2.1.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Sample 1832, trigonometric series.
<br class="ltx_break"><span id="A4.SS5.p10.pic1.2.1.1.1" class="ltx_text ltx_font_medium">Given that <math id="A4.SS5.p10.pic1.m1" class="ltx_Math" alttext="A_{k}=\frac{k(k-1)}{2}\cos\frac{k(k-1)\pi}{2}" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mfrac><mo lspace="0.167em" rspace="0em">​</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">cos</mi><mo lspace="0.167em">⁡</mo><mfrac style="--ltx-fg-color:#000000;" mathcolor="#000000"><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">k</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo lspace="0em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">π</mi></mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mfrac></mrow></mrow></mrow><annotation encoding="application/x-tex">A_{k}=\frac{k(k-1)}{2}\cos\frac{k(k-1)\pi}{2}</annotation></semantics></math>, find <math id="A4.SS5.p10.pic1.m2" class="ltx_Math" alttext="|A_{19}+A_{20}+\cdots+A_{98}|" display="inline" intent=":literal"><semantics><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">19</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">20</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><mo style="--ltx-fg-color:#000000;" lspace="0em" mathcolor="#000000" rspace="0em">⋯</mo><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">+</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">98</mn></msub></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow><annotation encoding="application/x-tex">|A_{19}+A_{20}+\cdots+A_{98}|</annotation></semantics></math>.</span></span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A4.SS5.p10.pic1.2.2" class="ltx_p"><span id="A4.SS5.p10.pic1.2.2.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Sample 967, refraction through a prism.
<br class="ltx_break"><span id="A4.SS5.p10.pic1.2.2.1.1" class="ltx_text ltx_font_medium">For an isosceles prism of angle <math id="A4.SS5.p10.pic1.m3" class="ltx_Math" alttext="A" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi><annotation encoding="application/x-tex">A</annotation></semantics></math> and refractive index <math id="A4.SS5.p10.pic1.m4" class="ltx_Math" alttext="\mu" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">μ</mi><annotation encoding="application/x-tex">\mu</annotation></semantics></math>, the angle of minimum deviation is
<math id="A4.SS5.p10.pic1.m5" class="ltx_Math" alttext="\delta_{m}=A" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">δ</mi><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi></mrow><annotation encoding="application/x-tex">\delta_{m}=A</annotation></semantics></math>. Which of the following options is or are correct? [A] For the angle of incidence
<math id="A4.SS5.p10.pic1.m6" class="ltx_Math" alttext="i_{1}=A" display="inline" intent=":literal"><semantics><mrow><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">i</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn></msub><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">A</mi></mrow><annotation encoding="application/x-tex">i_{1}=A</annotation></semantics></math>, the ray inside the prism is parallel to the base of the prism. (Three further options
omitted.)</span></span></span><span class="ltx_rule" style="width:100%;height:1px;--ltx-fg-color:#000000;--ltx-bg-color:#000000;display:inline-block;"> </span>
<span id="A4.SS5.p10.pic1.2.3" class="ltx_p"><span id="A4.SS5.p10.pic1.2.3.1" class="ltx_text ltx_font_bold" style="--ltx-fg-color:#000000;">Sample 1553, bound state in quantum mechanics.
<br class="ltx_break"><span id="A4.SS5.p10.pic1.2.3.1.1" class="ltx_text ltx_font_medium">A particle of mass <math id="A4.SS5.p10.pic1.m7" class="ltx_Math" alttext="m" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">m</mi><annotation encoding="application/x-tex">m</annotation></semantics></math> moves in a one-dimensional potential <math id="A4.SS5.p10.pic1.m8" class="ltx_Math" alttext="V(x)=-\alpha\,\delta(x)" display="inline" intent=":literal"><semantics><mrow><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">V</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">=</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">−</mo><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">α</mi><mo lspace="0.170em" rspace="0em">​</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">δ</mi><mo lspace="0em" rspace="0em">​</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow></mrow></mrow><annotation encoding="application/x-tex">V(x)=-\alpha\,\delta(x)</annotation></semantics></math>, where
<math id="A4.SS5.p10.pic1.m9" class="ltx_Math" alttext="\delta(x)" display="inline" intent=":literal"><semantics><mrow><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">δ</mi><mo>⁡</mo><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">(</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">)</mo></mrow></mrow><annotation encoding="application/x-tex">\delta(x)</annotation></semantics></math> is the Dirac delta function and <math id="A4.SS5.p10.pic1.m10" class="ltx_Math" alttext="\alpha" display="inline" intent=":literal"><semantics><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">α</mi><annotation encoding="application/x-tex">\alpha</annotation></semantics></math> is a positive constant. The particle is bound.
Find the value of <math id="A4.SS5.p10.pic1.m11" class="ltx_Math" alttext="x_{0}" display="inline" intent=":literal"><semantics><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub><annotation encoding="application/x-tex">x_{0}</annotation></semantics></math> such that the probability of finding the particle with <math id="A4.SS5.p10.pic1.m12" class="ltx_Math" alttext="|x|&lt;x_{0}" display="inline" intent=":literal"><semantics><mrow><mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mo style="--ltx-fg-color:#000000;" mathcolor="#000000" stretchy="false">|</mo></mrow><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">&lt;</mo><msub><mi style="--ltx-fg-color:#000000;" mathcolor="#000000">x</mi><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">0</mn></msub></mrow><annotation encoding="application/x-tex">|x|&lt;x_{0}</annotation></semantics></math> is
exactly <math id="A4.SS5.p10.pic1.m13" class="ltx_Math" alttext="1/2" display="inline" intent=":literal"><semantics><mrow><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">1</mn><mo style="--ltx-fg-color:#000000;" mathcolor="#000000">/</mo><mn style="--ltx-fg-color:#000000;" mathcolor="#000000">2</mn></mrow><annotation encoding="application/x-tex">1/2</annotation></semantics></math>.</span></span></span>
</span></span></span></foreignobject></g></g></svg>