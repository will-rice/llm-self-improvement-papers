<span id="A1.SS3.SSS0.Px4.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:44.46em;">
<span id="A1.SS3.SSS0.Px4.p2.pic1.1.1" class="ltx_p"><span id="A1.SS3.SSS0.Px4.p2.pic1.1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#FFFFFF;">KernelBench Integrity Rules</span></span>
</span></span></span></foreignobject></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 10.81 268.63)"><foreignobject style="--ltx-fo-width:51.19em;--ltx-fo-height:1.63em;--ltx-fo-depth:18.78em;font-size:10pt;" height="282.28" overflow="visible" transform="matrix(1 0 0 -1 0 22.49)" width="708.33"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A1.SS3.SSS0.Px4.p2.pic1.2" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:51.19em;">
<span id="A1.I3" class="ltx_enumerate">
<span id="A1.I3.i1" class="ltx_item" style="list-style-type:none;"><span class="ltx_tag ltx_tag_item">1.</span> 
<span id="A1.I3.i1.p1" class="ltx_para">
<span id="A1.I3.i1.p1.1" class="ltx_p"><span id="A1.I3.i1.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Compute the intended operation.</span><span id="A1.I3.i1.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">
At least one custom CUDA kernel must implement a complete operation or
fused group from the reference model. Dummy kernels, identity operations,
and staging copies do not qualify.</span></span>
</span></span>
<span id="A1.I3.i2" class="ltx_item" style="list-style-type:none;padding-top:2.0pt;"><span class="ltx_tag ltx_tag_item">2.</span> 
<span id="A1.I3.i2.p1" class="ltx_para">
<span id="A1.I3.i2.p1.1" class="ltx_p"><span id="A1.I3.i2.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Preserve correctness beyond observed inputs.</span><span id="A1.I3.i2.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">
Implementations may specialize to the declared shapes, dtypes, constructor
arguments, and target GPU, but not to particular input values, weights,
memory addresses, call counts, or random seeds.</span></span>
</span></span>
<span id="A1.I3.i3" class="ltx_item" style="list-style-type:none;padding-top:2.0pt;"><span class="ltx_tag ltx_tag_item">3.</span> 
<span id="A1.I3.i3.p1" class="ltx_para">
<span id="A1.I3.i3.p1.1" class="ltx_p"><span id="A1.I3.i3.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Use only exact simplifications.</span><span id="A1.I3.i3.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">
Algebraic rewrites are allowed when they preserve the reference computation
for every valid input and weight. Approximations and shortcuts that hold
only for observed test inputs are not allowed.</span></span>
</span></span>
<span id="A1.I3.i4" class="ltx_item" style="list-style-type:none;padding-top:2.0pt;"><span class="ltx_tag ltx_tag_item">4.</span> 
<span id="A1.I3.i4.p1" class="ltx_para">
<span id="A1.I3.i4.p1.1" class="ltx_p"><span id="A1.I3.i4.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Preserve the required numerical precision.</span><span id="A1.I3.i4.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">
Implementations may not introduce lower-precision arithmetic, approximate
mathematical operations, or prohibited changes to process-wide precision
settings.</span></span>
</span></span>
<span id="A1.I3.i5" class="ltx_item" style="list-style-type:none;padding-top:2.0pt;"><span class="ltx_tag ltx_tag_item">5.</span> 
<span id="A1.I3.i5.p1" class="ltx_para">
<span id="A1.I3.i5.p1.1" class="ltx_p"><span id="A1.I3.i5.p1.1.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Do not manipulate evaluation.</span><span id="A1.I3.i5.p1.1.2" class="ltx_text" style="font-size:90%;--ltx-fg-color:#000000;">
Implementations may not modify inputs, reference buffers, timers, backend
settings, execution streams, threads, or processes to influence correctness
or latency measurements.</span></span>
</span></span>
</span>
</span></span></span></foreignobject></g></g></svg>