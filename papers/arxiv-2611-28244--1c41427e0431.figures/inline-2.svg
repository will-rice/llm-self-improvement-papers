<span id="A5.SS3.SSS1.p1.pic1.3.2" class="ltx_p"><span id="A5.SS3.SSS1.p1.pic1.3.2.1" class="ltx_text" style="--ltx-fg-color:#000000;">Use a tensor-core implementation that meets the required <span id="A5.SS3.SSS1.p1.pic1.3.2.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#B42318;">PRECISION</span> contract. Use lower precision only when the contract permits it. Retain masks unless divisibility is guaranteed.</span></span>
