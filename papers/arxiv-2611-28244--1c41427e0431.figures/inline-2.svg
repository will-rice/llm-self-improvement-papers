<span id="A5.SS3.SSS1.p1.pic1.2.2" class="ltx_p"><span id="A5.SS3.SSS1.p1.pic1.2.2.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Skill 9.<span id="A5.SS3.SSS1.p1.pic1.2.2.1.1" class="ltx_text ltx_font_medium"> Consider a tensor-core implementation only if it preserves <span id="A5.SS3.SSS1.p1.pic1.2.2.1.1.1" class="ltx_text" style="--ltx-fg-color:#B42318;">the required FP32 semantics</span>. <span id="A5.SS3.SSS1.p1.pic1.2.2.1.1.2" class="ltx_text" style="--ltx-fg-color:#B42318;">Do not substitute TF32, FP16, or BF16 when FP32 is required. No tensor-core implementation was tested.</span></span></span></span>
<span id="A5.SS3.SSS1.p1.pic1.2.3" class="ltx_p"><span id="A5.SS3.SSS1.p1.pic1.2.3.1" class="ltx_text ltx_font_bold" style="font-size:90%;--ltx-fg-color:#000000;">Skill 10.<span id="A5.SS3.SSS1.p1.pic1.2.3.1.1" class="ltx_text ltx_font_medium"> Address the scalar-FMA bottleneck while <span id="A5.SS3.SSS1.p1.pic1.2.3.1.1.1" class="ltx_text" style="--ltx-fg-color:#B42318;">preserving FP32 semantics</span>. Retain boundary masks unless divisibility is guaranteed.</span></span></span>
